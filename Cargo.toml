[workspace]
resolver = "2"
# `bins/ptr-*` needs the hyphen, so `ptrctl` and `ptrd` are named outright rather
# than left to a glob that silently omits them. `check_repo.py` asserts that every
# binary here is a member or an exclusion, so the next one cannot fall through.
members = ["crates/ptr-*", "bins/ptr-*", "bins/ptrctl", "bins/ptrd"]
exclude = ["fuzz", "model/burn-a0", "vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
authors = ["PTR contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/xrey167/PTR"

[workspace.dependencies]
ptr-types = { path = "crates/ptr-types" }
ptr-config = { path = "crates/ptr-config" }
ptr-protocol = { path = "crates/ptr-protocol" }
ptr-ingress = { path = "crates/ptr-ingress" }
ptr-semdb = { path = "crates/ptr-semdb" }
ptr-core = { path = "crates/ptr-core" }
ptr-model-api = { path = "crates/ptr-model-api" }
ptr-exec = { path = "crates/ptr-exec" }
ptr-pods = { path = "crates/ptr-pods" }
ptr-router = { path = "crates/ptr-router" }
ptr-verifier = { path = "crates/ptr-verifier" }
ptr-feedback = { path = "crates/ptr-feedback" }
ptr-ledger = { path = "crates/ptr-ledger" }
ptr-state = { path = "crates/ptr-state" }
ptr-memory = { path = "crates/ptr-memory" }
ptr-search = { path = "crates/ptr-search" }
ptr-storage = { path = "crates/ptr-storage" }
ptr-net = { path = "crates/ptr-net" }
ptr-cluster = { path = "crates/ptr-cluster" }
ptr-execwire = { path = "crates/ptr-execwire" }
ptr-podwire = { path = "crates/ptr-podwire" }
ptr-events = { path = "crates/ptr-events" }
ptr-observe = { path = "crates/ptr-observe" }
ptr-inspect = { path = "crates/ptr-inspect" }
ptr-security = { path = "crates/ptr-security" }
ptr-server = { path = "crates/ptr-server" }
ptr-runtime = { path = "crates/ptr-runtime" }
ptr-fastmem = { path = "crates/ptr-fastmem" }
ptr-branch = { path = "crates/ptr-branch" }
ptr-lineage = { path = "crates/ptr-lineage" }
ptr-labeling = { path = "crates/ptr-labeling" }
ptr-analytics = { path = "crates/ptr-analytics" }
ptr-pg = { path = "crates/ptr-pg" }

serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
prost = "0.13"
prost-build = "0.14"
protoc-bin-vendored = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }
serde_json = "1.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
base64 = "0.22.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
candle-core = { version = "=0.11.0", default-features = false }
sha2 = "=0.11.0"
ed25519-dalek = "=3.0.0"
aes-gcm-siv = "0.11"
zeroize = "1"
opendal = { version = "=0.59.3", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

# Compatibility patches: original archives and changes are recorded in vendor/.
[patch.crates-io]
raft = { path = "vendor/raft" }
raft-proto = { path = "vendor/raft-proto" }
raft-engine = { path = "vendor/raft-engine" }

netlink_packet_core_pastey_0_8_2 = { package = "netlink-packet-core", path = "vendor/netlink-packet-core-0.8.2" }
gemm_pastey_0_19_0 = { package = "gemm", path = "vendor/gemm-0.19.0" }
gemm_c32_pastey_0_19_0 = { package = "gemm-c32", path = "vendor/gemm-c32-0.19.0" }
gemm_c64_pastey_0_19_0 = { package = "gemm-c64", path = "vendor/gemm-c64-0.19.0" }
gemm_common_pastey_0_19_0 = { package = "gemm-common", path = "vendor/gemm-common-0.19.0" }
gemm_f16_pastey_0_19_0 = { package = "gemm-f16", path = "vendor/gemm-f16-0.19.0" }
gemm_f32_pastey_0_19_0 = { package = "gemm-f32", path = "vendor/gemm-f32-0.19.0" }
gemm_f64_pastey_0_19_0 = { package = "gemm-f64", path = "vendor/gemm-f64-0.19.0" }
