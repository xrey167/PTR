[graph]
all-features = true

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
private = { ignore = true }
# Reviewed permissive families; redistribution notices remain required.
# MPL is NOT globally accepted: only the enumerated packages below are reviewed.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0",
         "ISC", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unlicense", "NCSA",
         "CDLA-Permissive-2.0", "CC0-1.0", "BSL-1.0"]
exceptions = [
    { name = "colored", version = "=3.1.1", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
