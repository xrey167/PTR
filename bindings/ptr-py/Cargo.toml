# PyO3 extension module `ptr_py`: PTR governance checks from ptr-lineage for Python
# training code. Its own workspace (like model/burn-a0), excluded from the root one,
# so `cargo ... --workspace` at the root never builds it and the root lockfile does
# not gain pyo3. ptr-lineage depends only on ptr-types (sha2 only, no vendored crates),
# so none of the root's [patch] vendored crates are needed here.
[package]
name = "ptr-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
description = "Python bindings for PTR adapter-lineage governance checks"

[lib]
name = "ptr_py"
crate-type = ["cdylib"]

[dependencies]
ptr-lineage = { path = "../../crates/ptr-lineage" }
pyo3 = { version = "=0.29.3", features = ["extension-module", "abi3-py311"] }

[workspace]
