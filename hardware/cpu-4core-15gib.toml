# Measured on 2026-10-09 with `ptr-evalkit hardware` (evaluations/bench/kit),
# /proc/cpuinfo, /proc/meminfo, lscpu, `stat -f`, sysfs and two short probes
# (fdatasync latency, sequential write). Nothing below is declared.
#
# THIS IS A SHARED, HEAVILY LOADED SANDBOX VM, not a benchmark machine:
#   - load average was 24-29 on 4 vCPUs while measuring, because other agents
#     and training runs share the host (and this VM); every timing taken here is
#     inflated and noisy and is a diagnostic, not a decision input;
#   - the root filesystem is ext4 on a virtio block device whose host cache and
#     neighbours are unknown. A 4 KiB write plus fdatasync measured p50 about
#     4 ms and p99 about 14-16 ms (3 x 3000 samples), far from any local NVMe;
#   - the cpufreq governor is not exposed to the guest.
# Therefore durable-write benchmarks (ledger, consensus, event-streaming fsync
# modes, anything that claims a latency percentile through fsync) run on this
# profile are "not decision-grade". A `preferred` verdict for such a component
# needs a re-run on a profile with decision_grade = true (a real block device,
# an otherwise idle machine). In-process CPU and memory microbenchmarks can be
# compared between candidates only in one interleaved run on this profile, and
# are still recorded as noisy.
id = "cpu-4core-15gib"
os = "Ubuntu 24.04.4 LTS, Linux 6.18.44-fc-v80 x86_64"
cpu = "Intel(R) Xeon(R) Processor @ 2.10GHz, 4 vCPU (4 cores, 1 thread per core, 1 socket); AVX2, AVX-512F/BW/VNNI, AMX-tile, AES, SHA-NI; L2 8 MiB (4 instances), L3 260 MiB (virtualised, shared)"
cpu_threads = 4
ram_gib = 15.7
gpu = "none"
gpu_memory_gib = 0
precision = ["fp32"]
filesystem = "ext4 (stat -f reports ext2/ext3) on /dev/vda, virtio, rotational flag 1, write cache 'write back'"
cpu_governor = "not readable"
shared = true
load_average_at_measurement = [25.7, 24.7, 23.9]
decision_grade = false
durable_writes_decision_grade = false
decision_grade_reason = "shared, heavily loaded VM (load average about 25 on 4 vCPUs); virtual block device with unknown host cache; fdatasync p50 about 4 ms, p99 about 14-16 ms"
fdatasync_4kib_p50_us = 4000
fdatasync_4kib_p99_us = 15000
sequential_write_mib_s = 160
notes = "Not the A0 host: hardware/a0-cpu-4core.toml was a 2.80 GHz machine of the same class. Floating-point kernels dispatch on AVX-512 here as there, so a binary built with one dispatch is reproducible bit for bit only on this feature set."
