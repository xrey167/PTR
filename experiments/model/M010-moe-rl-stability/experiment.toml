version = 1
id = "M010"
status = "planned"
hypothesis = "on OLMoE-based pod-MoE, sequence-level (GSPO) and soft-gated (SAPO) policy optimisation are more stable than token-level GRPO without routing replay at 4 mini-steps, and GRPO, GSPO and SAPO coincide at 1 mini-step; all arms train for the same pinned budget of max_rl_steps (optimizer steps) with shared hyperparameters (learning rate and batch size, tuned once on mean validation pass@1 over all arms on a disjoint split, identical at 1 and 4 mini-steps) and algorithm-specific parameters pinned to the paper values; policy_ratio_variance_per_token is the variance over all tokens of a rollout batch averaged over steps; rewards come from the verifier (VerificationReport) and lie in [0, 1] (reward_out_of_range_count and unverified_reward_count must be 0), and collapse means the reward smoothed over a 20-step window is at most 0.5 times its smoothed running maximum while that maximum is above 0 (while it is 0 only a non-finite loss counts), or a non-finite loss; the importance-sampling level is pinned per arm (GSPO sequence, GRPO token, SAPO token, TRL 1.14.1 semantics) and recorded in run.json; the base model is allenai/OLMoE-1B-7B-0125 at revision 9b0c1aa87e34a20052389dce1f0cf01da783f654 (the same checkpoint as M014, M015 and E006), recorded in run.json; an arm whose mean verifiable reward is exactly 0 over any window of zero_reward_window_steps = 50 consecutive RL steps is classified as collapsed at the first step of that window (collapse_step), including when the reward is 0 from step 1; the arms are pinned in an explicit arm matrix (algorithm, routing_replay on or off, mini_steps, rollout engine) with both the GRPO no-replay control and the GRPO routing-replay baseline required; the rollout protocol is pinned and recorded per arm and is the same for every arm: 8 generations per prompt, prompts per step equal to batch_size / 8 (batch size from the pinned tuning spec), temperature 1.0, top_p 1.0, maximum completion length 512 and KL coefficient beta 0.0 (no reference-model KL for GRPO, GSPO and SAPO). Hyperparameters are selected once, on the tuning seed (tuning_seed = 1001, a pilot seed that is never one of the confirmatory seeds) with shortened trials of tuning_steps = 500 (floor(0.25 * max_rl_steps = 2000), minimum 1), then frozen for every seed's full-budget run; tuning_seed, tuning_steps and the selected hyperparameters are recorded with the procedure parameters."
metrics = "pass_at_1, crash_step, expert_churn_per_layer, routing_entropy, load_cv, train_inference_kl, clip_fraction, grad_norm, policy_ratio_variance_per_token, policy_ratio_variance_per_sequence, rl_steps_completed, max_rl_steps, collapse_smoothing_window_steps, reward_out_of_range_count, unverified_reward_count, importance_sampling_level_mismatches, selection_digest_mismatches, procedure_mismatches, rl_steps_mismatches, validation_overlap_count, validation_set_digest, collapse_step, arm_identity_set_digest, pinned_arm_set_digest, routing_replay, model_pin_mismatches, tuning_trials_used, tuning_trial_set_digest"
baseline = "GRPO with clip-higher and no routing replay; GRPO with routing replay; REINFORCE++"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: any arm trained with a max_rl_steps budget or shared hyperparameters different from the others, or the 1 and 4 mini-step settings not sharing hyperparameters; results missing for GSPO or for SAPO in any seed; reward_out_of_range_count > 0 or unverified_reward_count > 0 (every reward must come from the verifier, as a VerificationReport, and lie in reward_range [0, 1]; any violation makes the run invalid); importance_sampling_level_mismatches > 0 (the importance_sampling_level recorded in run.json for an arm differs from the pinned level); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); rl_steps_mismatches > 0 (max_rl_steps recorded per arm differs from the pinned 2000, also when all arms agree with each other); the base model identity or revision is missing from run.json or differs from the pinned allenai/OLMoE-1B-7B-0125 at 9b0c1aa87e34a20052389dce1f0cf01da783f654; validation_overlap_count > 0 for any corpus (validation overlapping training, gate or held-out evaluation, counted per corpus), or validation_set_digest is not recorded; arm_identity_set_digest != pinned_arm_set_digest (the arm identity set must equal the pinned arm set in config.toml arm_matrix; the GRPO no-replay control and the GRPO routing-replay baseline must both be present); model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); tuning_search_spec recorded in run.json differs from the pinned search space, trial budget, sampler, selection seed, objective or tie-break (procedure_mismatches); tuning_trials_used != trial_budget (8) for any tuned arm, or tuning_trial_set_digest is not recorded in run.json (procedure_mismatches). Falsified if any of: at 4 mini-steps, for GSPO and for SAPO separately, policy_ratio_variance_per_token not lower than GRPO without routing replay; in a seed where the GRPO control crashes, the crash_step of GSPO or SAPO (runs without collapse right-censored at the final step) not later than GRPO's (if GRPO crashes in no seed this criterion is not evaluated and the decision rests on the other criteria); GSPO or SAPO collapses in a seed in which the matched GRPO control survives the max_rl_steps budget; at 1 mini-step, the pass_at_1 of GSPO or of SAPO differs from GRPO's by more than 2 points absolute (broken null control; REINFORCE++ is excluded because its advantage estimator differs); an arm whose mean verifiable reward is exactly 0 over any 50 consecutive steps collapses at that window's first step (collapse_step) and is counted as a collapse in the crash comparisons; any one of the 5 listed seeds misses any criterion above (every seed must pass)."
hardware_profile = "hardware/rtx3090.toml"
