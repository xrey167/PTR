version = 1
kind = "workspace-area"
name = "M010-moe-rl-stability"
path = "experiments/model/M010-moe-rl-stability"
tests_dir = "tests"

[pinned_thresholds]
collapse_reward_drop_fraction = 0.5
collapse_on_non_finite_loss = true
null_control_pass_at_1_tolerance_points = 2.0
crash_comparison_only_if_control_crashes = true
crash_step_censoring = "final_step"
# Preregistered choices for this experiment (no code default exists).
max_rl_steps = 2000
same_step_budget_all_arms = true
gspo_sapo_crash_while_grpo_survives_falsifies = true
# Preregistered choices for this experiment (no code default exists).
collapse_smoothing_window_steps = 20
max_rl_steps_unit = "optimizer_steps"
policy_ratio_variance_per_token_definition = "variance over all tokens of a rollout batch, averaged over steps"
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
# Preregistered choices for this experiment (no code default exists).
min_seeds = 5
reward_range = [0.0, 1.0]
collapse_condition = "smoothed reward <= 0.5 * smoothed running max while running max > 0, or non-finite loss"
shared_hyperparameters = ["learning_rate", "batch_size"]
shared_hyperparameters_tuned_once_on = "mean validation pass_at_1 over all arms, disjoint validation split"
same_hyperparameters_at_1_and_4_mini_steps = true
hyperparameters_frozen_before_seeds = true
# Preregistered choices for this experiment (no code default exists).
# Sources (checked against the installed TRL 1.14.1 docs, trl/trainer/grpo_config.py): sapo_temperature_pos defaults to 1.0 and sapo_temperature_neg to 1.05 (SAPO paper 2511.20347);
# epsilon defaults to 0.2 and epsilon_high is documented as "Paper DAPO (2503.14476) recommends 0.28"; importance_sampling_level="sequence" is the GSPO (2507.18071) option.
# The GSPO clip range 3e-4 / 4e-4 is from the GSPO paper 2507.18071 section 5.1 (p.4: 'In GSPO, we set the left and right clipping ranges in Equation (5) to 3e-4 and 4e-4'); TRL has no default for it.
gspo_clip_epsilon_low = 3e-4
gspo_clip_epsilon_high = 4e-4
sapo_tau_pos = 1.0
sapo_tau_neg = 1.05
grpo_epsilon_low = 0.2
grpo_epsilon_high = 0.28
trl_version_checked = "1.14.1"
algorithm_specific_values_tuned = false
# Preregistered choices for this experiment (no code default exists).
# TRL 1.14.1 (grpo_trainer.py): importance_sampling_level defaults to token; loss_type sapo applies a per-token soft gate on the token-level ratio (soft_coef_1 = sigmoid(tau * (coef_1 - 1)) * 4 / tau) and does not force sequence level; GSPO is importance_sampling_level sequence.
importance_sampling_level_gspo = "sequence"
importance_sampling_level_grpo = "token"
importance_sampling_level_sapo = "token"
importance_sampling_level_recorded_in_run_json = true
max_importance_sampling_level_mismatches = 0
importance_sampling_level_field = "importance_sampling_level"
# Preregistered choices for this experiment (no code default exists).
corpus_train_dataset = "openai/gsm8k"
corpus_revision = "740312add88f781978c0658806c59bc2815b9866"
corpus_train_split = "train"
corpus_validation_rule = "validation partition: train-split items whose index mod 10 == 9 (excluded from the RL training problems); used only for hyperparameter tuning"
corpus_eval_split = "test"
corpus_eval_rule = "all 1319 problems of the test split for pass_at_1, in index order"
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "max_rl_steps", "mini_steps", "learning_rate", "batch_size", "collapse_smoothing_window_steps", "algorithm_specific_values", "collapse_reward_drop_fraction", "reward_range", "shared_hyperparameters", "gspo_clip_epsilon_low", "gspo_clip_epsilon_high", "sapo_tau_pos", "sapo_tau_neg", "grpo_epsilon_low", "grpo_epsilon_high", "base_model_revision", "validation_position_modulus", "validation_position_residue", "zero_reward_window_steps", "arm_matrix", "routing_replay_values", "pinned_arm_set", "required_arms", "model_checkpoint_revision", "tokenizer_revision", "moe_topology", "tuning_search_spec", "arm_comparisons", "rollout_protocol"]
# Preregistered choices for this experiment (no code default exists).
max_rl_steps_recorded_per_arm = true
max_rl_steps_mismatches = 0
# Preregistered choices for this experiment (no code default exists).
base_model = "allenai/OLMoE-1B-7B-0125"
base_model_revision = "9b0c1aa87e34a20052389dce1f0cf01da783f654"
base_model_recorded_in_run_json = true
# Preregistered choices for this experiment (no code default exists).
validation_rule = "validation partition for tuning: items whose position within the training partition has index mod 10 == 9, excluded from training; tuning selects on validation only"
validation_corpora = ["gsm8k"]
validation_position_modulus = 10
validation_position_residue = 9
validation_excluded_from_training = true
tuning_selects_on_validation_only = true
max_validation_overlap_count = 0
validation_overlap_counted_per_corpus = true
validation_set_digest_recorded_in_run_json = true
# Preregistered choices for this experiment (no code default exists).
zero_reward_window_steps = 50
zero_reward_window_collapse = "mean verifiable reward exactly 0 over any 50 consecutive RL steps: collapsed at the first step of the window, also from step 1"
# Preregistered choices for this experiment (no code default exists).
arm_matrix = [{ arm = "grpo_no_replay_ms4_same", algorithm = "grpo", routing_replay = "off", mini_steps = 4, rollout_engine = "same" }, { arm = "grpo_replay_ms4_same", algorithm = "grpo", routing_replay = "on", mini_steps = 4, rollout_engine = "same" }, { arm = "gspo_ms4_same", algorithm = "gspo", routing_replay = "off", mini_steps = 4, rollout_engine = "same" }, { arm = "sapo_ms4_same", algorithm = "sapo", routing_replay = "off", mini_steps = 4, rollout_engine = "same" }, { arm = "reinforce_pp_ms4_same", algorithm = "reinforce_pp", routing_replay = "off", mini_steps = 4, rollout_engine = "same" }, { arm = "grpo_no_replay_ms1_same", algorithm = "grpo", routing_replay = "off", mini_steps = 1, rollout_engine = "same" }, { arm = "gspo_ms1_same", algorithm = "gspo", routing_replay = "off", mini_steps = 1, rollout_engine = "same" }, { arm = "sapo_ms1_same", algorithm = "sapo", routing_replay = "off", mini_steps = 1, rollout_engine = "same" }, { arm = "grpo_no_replay_ms4_separate", algorithm = "grpo", routing_replay = "off", mini_steps = 4, rollout_engine = "separate" }, { arm = "grpo_replay_ms4_separate", algorithm = "grpo", routing_replay = "on", mini_steps = 4, rollout_engine = "separate" }]
pinned_arm_set = ["grpo_no_replay_ms4_same", "grpo_replay_ms4_same", "gspo_ms4_same", "sapo_ms4_same", "reinforce_pp_ms4_same", "grpo_no_replay_ms1_same", "gspo_ms1_same", "sapo_ms1_same", "grpo_no_replay_ms4_separate", "grpo_replay_ms4_separate"]
