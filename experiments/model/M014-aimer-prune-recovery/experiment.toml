version = 1
id = "M014"
status = "planned"
hypothesis = "AIMER weights-only expert ranking with pruning at 25%/50% followed by short SFT and GSPO/SAPO recovers most quality (quality_retention >= 0.95 of the unpruned model with the identical recovery budget (control arm) at 25% pruning and >= 0.90 at 50% pruning) at lower VRAM, and passes the ForgettingGate on the public suite under one identical pinned recovery budget (2000 SFT steps, 1000 RL steps) for every pruning arm; AIMER ranking is not worse than random or usage-frequency pruning by more than 0.01 quality_retention at each fraction after the same recovery, recovery runs SFT then GSPO and, as a second arm, SFT then SAPO (both must meet every criterion), pruned experts are physically removed, and quality is the pinned macro-average task accuracy on the pinned suite; per recovery sequence, pruning fraction and matched unpruned control, peak VRAM falls by at least 0.5 times the pruned expert-parameter fraction, and AIMER is non-inferior to every named baseline pruning method (random expert pruning and usage-frequency pruning) within 0.01 quality_retention in every cell; the pruned model is allenai/OLMoE-1B-7B-0125 at revision 9b0c1aa87e34a20052389dce1f0cf01da783f654 (the same checkpoint as E006 and M015), recorded in run.json; the ForgettingGate suite (questions 0 to 1999) and the quality evaluation (questions 2000 to 3999) are disjoint deterministic slices of cais/mmlu all/test at the pinned revision, with both selection digests recorded; the recovery SFT corpus is openai/gsm8k at revision 740312add88f781978c0658806c59bc2815b9866 (main/train, all 7473 items) and the recovery RL prompts are the same train prompts with a verifiable final-answer reward, both disjoint from the MMLU gate slice (0 to 1999) and evaluation slice (2000 to 3999), with digests recorded in run.json; the dedicated recovery-training corpus is openai/gsm8k main train (all 7473 items, selection digest recorded), disjoint from both MMLU evaluation slices, with zero overlap checked by question id and by normalized-text hash against each slice; the recovery protocol is pinned and recorded per arm (optimizer AdamW, learning rate 1e-5, batch size 64, cosine scheduler, 100 warmup steps, generation temperature 1.0, top_p 1.0, generation_max_new_tokens 512 with 8 samples per prompt, GSPO clip range 3e-4 and 4e-4, SAPO temperatures 1.0 and 1.05), and the baselines are pinned: random pruning with seed 20240607 over a uniform expert draw per layer, and usage-frequency measured on GSM8K train items 0 to 511 (512 tokens maximum, batch 16, ties broken by lowest expert index), with the selections and the input digest recorded; the AIMER selection is exact: per expert the weight vector w is the concatenation of its gate_up_proj [2I, H] and down_proj [H, I] weights flattened row-major, the score is ptr_lineage::aimer_score(w), per layer experts are ranked with ptr_lineage::rank_experts_for_pruning (highest score first, stable on ties with the lower expert index first) and the first round(f * 64) experts are pruned for f in {0.25, 0.5} (16 and 32), and the recorded selection must equal the selection recomputed from the checkpoint."
metrics = "quality_retention, vram_bytes, ranking_time_s, gate_pass, public_regression, task_forgetting, backward_transfer, quality_unpruned_control, average_forgetting, unpruned_controls_missing, peak_vram_reduction_fraction, pruned_expert_parameter_fraction, aimer_minus_best_baseline_retention, selection_digest_mismatches, procedure_mismatches, suite_overlap_count, gate_suite_digest, quality_eval_suite_digest, recovery_corpus_digest, recovery_selection_digest, recovery_training_eval_overlap, model_pin_mismatches, recovery_protocol_mismatches, pruning_selection_digest, usage_frequency_input_digest, aimer_selection_mismatches"
baseline = "unpruned model; random expert pruning; usage-frequency pruning"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: unpruned_controls_missing > 0 (an unpruned control with the identical recovery budget is required for every recovery sequence, SFT then GSPO and SFT then SAPO, and every seed; each pruned row is compared only with its matching control); any cell of the full matrix of method (AIMER, random, usage-frequency) x fraction (25%, 50%) x optimizer (SFT then GSPO, SFT then SAPO) x seed is missing; any arm ran with a recovery budget different from the pinned 2000 SFT steps and 1000 RL steps, or the ForgettingGate was evaluated with anything other than the four pinned thresholds; selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); the pruned model checkpoint identity and revision are not recorded in run.json or differ from the pinned allenai/OLMoE-1B-7B-0125 at 9b0c1aa87e34a20052389dce1f0cf01da783f654; gate_suite_digest or quality_eval_suite_digest is not recorded in run.json, or the two slices overlap (suite_overlap_count > 0); recovery_corpus_digest or recovery_selection_digest is not recorded in run.json, or recovery_training_eval_overlap > 0 against either MMLU evaluation slice (the gate slice, questions 0 to 1999, or the quality-retention slice, questions 2000 to 3999), checked per slice by question id and by normalized-text hash, so any overlap makes the run invalid; model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); recovery_protocol_mismatches > 0 (the recorded optimizer, learning rate, batch size, scheduler, warmup, generation parameters or GSPO/SAPO parameters differ from the pin), or pruning_selection_digest or usage_frequency_input_digest is not recorded; aimer_selection_mismatches > 0 (the recorded pruned-expert selection differs from the selection recomputed from the checkpoint). Falsified if any of: quality_retention against the unpruned control is below 0.95 at 25% pruning or below 0.90 at 50% pruning, for either optimizer; the pruned and recovered model fails the ForgettingGate on the public suite (gate_pass false: average_forgetting > gate_max_average_forgetting, any task's forgetting > gate_max_task_forgetting, backward_transfer < gate_min_backward_transfer, or public_regression > gate_max_public_regression; equality passes each threshold); vram_bytes of the pruned and recovered model (measured after physical expert removal at the pinned vram_batch_size and vram_sequence_length) not lower than the unpruned model's; peak_vram_reduction_fraction < 0.5 x pruned_expert_parameter_fraction in any cell (per recovery sequence and pruning fraction), or AIMER quality_retention < baseline quality_retention - aimer_noninferiority_margin (0.01) for random pruning or for usage-frequency pruning in any cell (the only comparative falsifier; aimer_minus_best_baseline_retention is reported per cell as information); any one of the 5 listed seeds misses any criterion above (every seed must pass). quality_retention = quality of the pruned and recovered model divided by quality of the unpruned model recovered with the identical budget (higher is better), as the pinned macro-average task accuracy on the pinned suite."
