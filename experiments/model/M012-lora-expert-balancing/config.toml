version = 1
kind = "workspace-area"
name = "M012-lora-expert-balancing"
path = "experiments/model/M012-lora-expert-balancing"
tests_dir = "tests"

[pinned_thresholds]
task_accuracy_margin_points = 1.0
load_cv_margin = 0.05
each_regression_falsifies_independently = true
# Preregistered choices for this experiment (no code default exists).
training_steps_per_arm = 2000
load_cv_definition = "population_std(per_expert_token_load) / mean(per_expert_token_load), per layer"
comparison_arms = ["auxiliary_balance_loss", "phi_balancing"]
margins_apply_to_each_comparison_arm = true
# Preregistered choices for this experiment (no code default exists).
hyperparameter_tuning_budget_trials_per_arm = 8
hyperparameters_frozen_before_seeds = true
max_dead_experts = 0
max_violation_role = "reported_only"
load_cv_aggregation = "per layer (population std / mean), mean over layers, at the final step"
search_space = ["learning_rate", "batch_size", "aux_coefficient", "bias_update_rate", "lora_rank", "lora_alpha"]
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
# Preregistered choices for this experiment (no code default exists).
min_seeds = 5
dead_expert_eval_set = "pinned held-out evaluation split of the task suite, 8192 tokens"
load_cv_computed_on_eval_set = true
# Preregistered choices for this experiment (no code default exists).
max_final_load_cv_per_layer = 0.5
max_expert_token_fraction_times_experts = 2.0
max_dead_experts_per_arm = 0
# Preregistered choices for this experiment (no code default exists).
absolute_balance_criteria_reported_for_each_arm = true
baseline_arm_balance_failure_role = "reported_result"
# Preregistered choices for this experiment (no code default exists).
tuning_trials_used_recorded_per_arm = true
max_tuning_budget_mismatches = 0
# Preregistered choices for this experiment (no code default exists).
load_cv_per_layer_hard_bound = 0.5
mean_load_cv_role = "between-arm ranking comparison only (0.05 margin)"
# Preregistered choices for this experiment (no code default exists).
corpus_task_dataset = "openai/gsm8k"
corpus_revision = "740312add88f781978c0658806c59bc2815b9866"
corpus_train_split = "train"
corpus_eval_split = "test"
corpus_eval_token_selection = "first 8192 tokens of the test split, problems in index order, tokenized with the pinned tokenizer; the token-selection digest is recorded in run.json"
load_cv_and_dead_experts_eval_tokens = 8192
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "training_steps_per_arm", "tuning_trials_used", "lora_rank", "lora_alpha"]
