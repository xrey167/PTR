version = 1
id = "M012"
status = "planned"
hypothesis = "auxiliary-loss-free bias balancing of the LoRA-expert router gives equal or better task quality than an auxiliary balance loss at comparable load balance; the margins are applied against each baseline arm separately; the auxiliary-loss-free arm must meet the pinned balance criteria (final load_cv_per_layer <= 0.5 in every layer, maximum expert token fraction <= 2/E per layer for E experts in that layer, dead_experts == 0; each arm's pass or fail is reported), may rank worse than a baseline by at most 0.05 mean_load_cv, and mean_load_cv (used only for the between-arm ranking comparison) is the mean over layers of load_cv_per_layer, the per-layer population-std coefficient of variation at the final step, and every arm gets the same preregistered tuning budget; dead_experts means zero routed tokens on the pinned evaluation set at the final step, and load_cv_per_layer is computed on that set."
metrics = "task_accuracy, max_violation, dead_experts, max_violation_reported_only, max_expert_token_fraction_per_layer, balance_criteria_failed_arms, balance_criteria_failed_baseline_arms, tuning_trials_used, tuning_budget_mismatches, load_cv_per_layer, mean_load_cv, selection_digest_mismatches, procedure_mismatches"
baseline = "auxiliary balance loss; phi-balancing"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: arms trained for different numbers of steps; results missing for the auxiliary-loss arm or the phi-balancing arm in any seed; tuning_budget_mismatches > 0 (tuning_trials_used per arm differs from the pinned 8); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value). Falsified if any of: task_accuracy of the auxiliary-loss-free bias arm lower than the auxiliary-loss arm's by more than 1 point absolute, or lower than the phi-balancing arm's by more than 1 point (each regression falsifies independently of mean_load_cv); mean_load_cv of the auxiliary-loss-free bias arm worse than the auxiliary-loss arm's by more than 0.05, or worse than the phi-balancing arm's by more than 0.05 (each regression falsifies independently of quality); dead_experts > 0 for the auxiliary-loss-free arm (zero routed tokens on the pinned evaluation set at the final step); the auxiliary-loss-free arm fails any absolute balance criterion on any layer (load_cv_per_layer > 0.5 in any layer, maximum expert token fraction > 2/E, or dead_experts > 0), recorded as balance_criteria_failed_arms > 0; any one of the 5 listed seeds misses any criterion above (every seed must pass). load_cv_per_layer (the per-layer vector) is the population std divided by the mean of per-expert token load, per layer on the pinned evaluation set, then averaged over layers at the final step; max_violation is reported only and is not a criterion. Each arm's balance pass or fail is reported (balance_criteria_failed_arms lists the failing arms); a baseline arm failing the balance criteria is a reported result, not a prerequisite failure, and does not invalidate the comparison (balance_criteria_failed_baseline_arms is reported as information only). mean_load_cv (the mean over layers) is the named aggregate used only for the between-arm ranking comparison with the 0.05 margin; the hard bound of 0.5 applies to each element of load_cv_per_layer."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
