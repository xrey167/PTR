version = 1
id = "M012"
status = "planned"
hypothesis = "auxiliary-loss-free bias balancing of the LoRA-expert router gives equal or better task quality than an auxiliary balance loss at comparable load balance; the margins are applied against each baseline arm separately; the auxiliary-loss-free arm has no dead experts, load_cv is the mean over layers of the per-layer population-std coefficient of variation at the final step, and every arm gets the same preregistered tuning budget; dead_experts means zero routed tokens on the pinned evaluation set at the final step, and load_cv is computed on that set."
metrics = "task_accuracy, max_violation, load_cv, dead_experts, max_violation_reported_only"
baseline = "auxiliary balance loss; phi-balancing"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: arms trained for different numbers of steps; results missing for the auxiliary-loss arm or the phi-balancing arm in any seed. Falsified if any of: task_accuracy of the auxiliary-loss-free bias arm lower than the auxiliary-loss arm's by more than 1 point absolute, or lower than the phi-balancing arm's by more than 1 point (each regression falsifies independently of load_cv); load_cv of the auxiliary-loss-free bias arm worse than the auxiliary-loss arm's by more than 0.05, or worse than the phi-balancing arm's by more than 0.05 (each regression falsifies independently of quality); dead_experts > 0 for the auxiliary-loss-free arm (zero routed tokens on the pinned evaluation set at the final step); any one of the 5 listed seeds misses any criterion above (every seed must pass). load_cv is the population std divided by the mean of per-expert token load, per layer on the pinned evaluation set, then averaged over layers at the final step; max_violation is reported only and is not a criterion."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
