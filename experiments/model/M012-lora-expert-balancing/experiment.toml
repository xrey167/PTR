version = 1
id = "M012"
status = "planned"
hypothesis = "auxiliary-loss-free bias balancing of the LoRA-expert router gives equal or better task quality than an auxiliary balance loss at comparable load balance; the margins are applied against each baseline arm separately; the auxiliary-loss-free arm must meet the pinned balance criteria (final load_cv_per_layer <= 0.5 in every layer, maximum expert token fraction <= 2/E per layer for E experts in that layer, dead_experts == 0; each arm's pass or fail is reported), may rank worse than a baseline by at most 0.05 mean_load_cv, and mean_load_cv (used only for the between-arm ranking comparison) is the mean over layers of load_cv_per_layer, the per-layer population-std coefficient of variation at the final step, and every arm gets the same preregistered tuning budget; dead_experts means zero routed tokens on the pinned evaluation set at the final step, and load_cv_per_layer is computed on that set; the auxiliary-loss-free arm is non-inferior to the auxiliary-loss arm and to phi-balancing on mean_load_cv with margin 0.05 (lower is better), per seed and on the seed mean, and no other between-arm ordering is claimed; the update rules are exact: aux-free bias (DeepSeek 2408.15664) adds a per-expert bias b_i to the router scores for top-k selection only (gating weights from the unbiased scores) and after every optimizer step sets b_i to b_i + u * sign(mean_load - load_i) with u = bias_update_rate (tuned) and b initialised to 0; the auxiliary loss (Switch) is L_aux = alpha * N * sum_i f_i * P_i per layer per step with alpha = aux_coefficient (tuned); phi balancing (2605.15403 Algorithm 1) uses the negative Shannon entropy potential, m <- (1 - eta) m + eta * p_t with eta = 0.65 and m initialised uniform, q = log(m) + 1 with stop-gradient and L_phi = coefficient * <p_t, q> with coefficient = aux_coefficient (same tuning range). Hyperparameters are selected once, on the tuning seed (tuning_seed = 1001, a pilot seed that is never one of the confirmatory seeds) with shortened trials of tuning_steps = 500 (floor(0.25 * training_steps_per_arm = 2000), minimum 1), then frozen for every seed's full-budget run; tuning_seed, tuning_steps and the selected hyperparameters are recorded with the procedure parameters."
metrics = "task_accuracy, max_violation, dead_experts, max_violation_reported_only, max_expert_token_fraction_per_layer, balance_criteria_failed_arms, balance_criteria_failed_baseline_arms, tuning_trials_used, tuning_budget_mismatches, load_cv_per_layer, mean_load_cv, selection_digest_mismatches, procedure_mismatches, validation_overlap_count, validation_set_digest, model_pin_mismatches, tuning_trial_set_digest"
baseline = "auxiliary balance loss; phi-balancing"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: arms trained for different numbers of steps; results missing for the auxiliary-loss arm or the phi-balancing arm in any seed; tuning_budget_mismatches > 0 (tuning_trials_used per arm differs from the pinned 8); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); validation_overlap_count > 0 for any corpus (validation overlapping training, gate or held-out evaluation, counted per corpus), or validation_set_digest is not recorded; model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); tuning_search_spec recorded in run.json differs from the pinned search space, trial budget, sampler, selection seed, objective or tie-break (procedure_mismatches); tuning_trials_used != trial_budget (8) for any tuned arm, or tuning_trial_set_digest is not recorded in run.json (procedure_mismatches). Falsified if any of: task_accuracy of the auxiliary-loss-free bias arm lower than the auxiliary-loss arm's by more than 1 point absolute, or lower than the phi-balancing arm's by more than 1 point (each regression falsifies independently of mean_load_cv); mean_load_cv(auxiliary-loss-free) > mean_load_cv(auxiliary-loss) + 0.05 or mean_load_cv(auxiliary-loss-free) > mean_load_cv(phi-balancing) + 0.05, where lower mean_load_cv is better, checked per seed and on the seed mean (each regression falsifies independently of quality; the non-inferiority of the auxiliary-loss-free arm to each baseline is the only between-arm ordering claimed); dead_experts > 0 for the auxiliary-loss-free arm (zero routed tokens on the pinned evaluation set at the final step); the auxiliary-loss-free arm fails any absolute balance criterion on any layer (load_cv_per_layer > 0.5 in any layer, maximum expert token fraction (an expert's routed assignments divided by the total routed assignments in the layer, so the fractions sum to 1 over the experts) > 2/E, or dead_experts > 0), evaluated on the auxiliary-loss-free arm's own balance metrics against the pinned bounds (the other arms' failures, listed in balance_criteria_failed_arms, are reported results and not falsifiers); any one of the 5 listed seeds misses any criterion above (every seed must pass). load_cv_per_layer (the per-layer vector) is the population std divided by the mean of per-expert token load, per layer on the pinned evaluation set, then averaged over layers at the final step; max_violation is reported only and is not a criterion. Each arm's balance pass or fail is reported (balance_criteria_failed_arms lists the failing arms); a baseline arm failing the balance criteria is a reported result, not a prerequisite failure, and does not invalidate the comparison (balance_criteria_failed_baseline_arms is reported as information only). mean_load_cv (the mean over layers) is the named aggregate used only for the between-arm ranking comparison with the 0.05 margin; the hard bound of 0.5 applies to each element of load_cv_per_layer."
hardware_profile = "hardware/rtx3090.toml"
