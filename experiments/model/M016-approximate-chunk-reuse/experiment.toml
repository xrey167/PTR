version = 1
id = "M016"
status = "planned"
hypothesis = "on an N-layer decoder, position-independent chunk reuse at nonzero position shifts (pinned shifts 16, 64 and 256 tokens) with selective recompute (candidate recomputation sets k pinned as fractions [0.05, 0.10, 0.15, 0.20] of chunk tokens, each rounded up to whole tokens) keeps top-1 next-token agreement >=99% while saving >=2x prefill; the 2x saving is measured only on the live-lineage edit path (upstream segments edited, inserted or shifted, nothing in the page's lineage revoked), where approximate upper-layer reuse with selective recompute is allowed and the result is tagged Approximate; upstream-revocation cases are safety checks only and are excluded from the speed metric."
metrics = "top1_agreement, kl_vs_full, prefill_speedup, recompute_fraction, secondary_index_lookups, nonaligned_insertion_cases, upstream_revocation_cases, revoked_upstream_page_reachable_count, layers_ge1_freshly_prefilled, live_lineage_edit_cases"
baseline = "full prefill"
falsification = "falsified if no single candidate k from the pinned set {ceil(f * chunk_tokens) : f in [0.05, 0.10, 0.15, 0.20]} jointly meets BOTH top-1 agreement >= 99% AND prefill saving >= 2x at EVERY pinned nonzero position shift (16, 64, 256 per config.toml [pinned_thresholds]); k is chosen once and may not vary per shift or be selected after seeing results. The agreement and saving criteria are evaluated only on live-lineage edit cases (live_lineage_edit_cases >= 1; upstream segments edited, inserted or shifted, no segment in the page's lineage revoked), whose results are tagged Approximate; upstream-revocation cases are safety checks (revoked_upstream_page_reachable_count == 0, layers >= 1 freshly prefilled) and are excluded from the speed metric, and a run with live_lineage_edit_cases < 1 is vacuous and falsified. Same-position (zero-shift) reuse does not count toward the hypothesis; reuse must be exercised through the catalog and its position-independent secondary index (secondary_index_lookups >= 1), not pages handed to the backend, and must include non-page-aligned insertions of 1 token and 7 tokens (nonaligned_insertion_cases >= 1 for each) and a case where an upstream segment is revoked after the page was cached (upstream_revocation_cases >= 1): the page must be unreachable (revoked_upstream_page_reachable_count == 0) and layers >= 1 freshly prefilled (layers_ge1_freshly_prefilled >= 1, no layer >= 1 reused); any zero attempt counter makes the run vacuous and falsified."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
