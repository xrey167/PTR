hypothesis = "on pinned pretrained Qwen/Qwen2.5-0.5B (24 layers, N >= 2), position-independent chunk reuse at nonzero position shifts (pinned shifts 16, 64 and 256 tokens) with selective recompute (candidate k pinned as ceil(f * 64) tokens per 64-token chunk for f in [0.05, 0.10, 0.15, 0.20], i.e. k in {4, 7, 10, 13}) keeps top-1 next-token agreement >= 99% while saving >= 2x prefill on a 512-token prompt with 7 of 8 chunks reused (448 reused tokens and a 64-token suffix); k_sel is the smallest k with calibration-split agreement >= 99% at every shift and is then evaluated on a held-out split; recomputed tokens are the CacheBlend-style highest-deviation tokens in every layer >= 1 and agreement is counted only at positions whose K/V used approximate rows; the 2x saving is measured only on the live-lineage insert and shift path (whole new segments inserted, or segments shifted or reordered, every recorded segment unchanged and nothing in the page's lineage revoked), whose results are tagged Approximate; content edits, including an insertion inside a segment, deletions and redactions, supersede the old generation (path a), so the page is unreachable for every layer and freshly prefilled with zero reuse; upstream-revocation cases are safety checks excluded from the speed metric; reuse stays correct under lagging or lost invalidation and restore or restart; admission additionally requires that every segment of the page's original prefix (identity, generation, digest) is present in the requesting prefix as a multiset (insertion, shift and reorder allowed, omission and deletion not); dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (upstream segment inputs; the experiment is a single-shot oracle with no in-flight requests, so no in-flight race applies); the run is on hardware/rtx5090.toml and run.json records the GPU model, driver version, CUDA runtime version and the torch and vLLM versions; invalidation during consumption of shifted or repacked K/V after the secondary-index lookup is covered (in-flight path), a shifted result carries KvReuseTaint, and no effect of a shifted result is admitted at the effect boundary; every parent-independent secondary-index entry records (Raw, content_digest) for every raw ancestor in its transitive lineage besides the typed segments with generations, and reuse requires each recorded raw ancestor to be present in the current request prefix (multiset check over kind and digest); Derived segments are generation-bearing dependencies like semantic and memory inputs: the closed list of dependency kinds is semantic, memory, derived, base model, adapter and expert, and any future generation-bearing segment kind joins by definition; approximate pages live only in a separate tainted namespace and never in the Exact catalog, so an ordinary-prefix request for the same prompt after a shifted insert, also across a restart, is never served a tainted page as Exact and no effect of a tainted result is admitted; taint is carried to every Pod admission sink: authoritative or effectful sinks (StateDelta commit, VerifiedResult commit, ActionProposal and the promote path) reject a tainted output typed, while the stored-tainted kinds (Observation, Candidate, Hypothesis, ToolResult, EnvironmentObservation) are stored only with the taint persisted, and a tainted Hypothesis or Candidate is never merged or promoted into authority without Exact recomputation."
metrics = "top1_agreement, kl_vs_full, prefill_speedup, recompute_fraction, secondary_index_lookups, nonaligned_insertion_cases, upstream_revocation_cases, revoked_upstream_page_reachable_count, layers_ge1_freshly_prefilled, test_model_layers, candidate_shift_results_cells, canary_logit_shift, canary_probes, canary_removing_edit_cases, reused_results, reused_results_tagged_approximate, approximate_tag_violations, revoked_page_layers_reused, post_revocation_secondary_lookups_matching_content, heldout_top1_agreement, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits, live_lineage_insert_shift_cases, in_segment_insertion_cases, in_segment_insertion_reused_tokens, k_sel, heldout_median_speedup, stale_eligible_entries_before_event, post_event_lookups_on_stale_eligible_entries, full_prefill_wall_time, reuse_prefill_wall_time, restored_pre_revocation_entries, empty_restart_arm, omitted_upstream_segment_cases, omitted_upstream_admissions, upstream_supersession_cases, superseded_upstream_page_reachable_count, selection_digest_mismatches, procedure_mismatches, timing_procedure_mismatches, fresh_prefills_completed_after_revocation, fresh_prefill_output_mismatches, post_supersession_secondary_lookups_matching_content, invalidated_case_id_set_digest, fresh_prefill_completed_case_id_set_digest, hardware_profile_mismatches, invalidation_matrix_cases, invalidation_matrix_stale_hits, shifted_reuse_inflight_race_cases, shifted_reuse_inflight_outputs, shifted_reuse_inflight_cache_inserts, shifted_effect_boundary_cases, shifted_effects_admitted, shifted_taint_cases, untainted_shifted_results, raw_ancestor_omission_cases, reuse_after_raw_ancestor_removed, model_pin_mismatches, shift_insert_ordinary_hit_cases, tainted_pages_served_as_exact, effects_admitted_from_tainted_results, tainted_pod_output_sink_cases, tainted_outputs_admitted_at_authoritative_sinks, tainted_hypotheses_promoted_without_recompute, software_stack_mismatches"
baseline = "full prefill"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: live_lineage_insert_shift_cases < 1 or secondary_index_lookups < 1 (reuse must go through the catalog and its secondary index); nonaligned_insertion_cases < 1 for the 1-token insertion or for the 7-token insertion; upstream_revocation_cases < 1, in_segment_insertion_cases < 1, canary_removing_edit_cases < 1, canary_probes < 1 or post_revocation_secondary_lookups_matching_content < 1; candidate_shift_results.json has fewer than the 20 expected cells (4 values of k x (3 shifts + the 1-token and 7-token insertion cases)) with top1_agreement and prefill_speedup each (candidate_shift_results_cells < 20); a k with any missing cell is not eligible; invalidation_suppressed_arms < 1, restore_arms < 1, restored_pre_revocation_entries < 1 (the restored pre-revocation entry must be observed in the catalog before the post-event lookup), stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the arm where an actual pre-revocation entry (snapshot or tier object) is restored into the catalog must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1; a plain runtime restart is the separate reported arm empty_restart_arm and does not satisfy restore coverage); omitted_upstream_segment_cases < 1 (a request omitting a segment of the page's original prefix); upstream_supersession_cases < 1 (an upstream segment superseded, i.e. its generation replaced or edited, after the page was cached); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); timing_procedure_mismatches > 0 (warmup_runs or timed_runs recorded per cell differ from the pinned 3 and 11); fresh_prefills_completed_after_revocation < upstream_revocation_cases (every revoked-page case must complete via a fresh prefill); post_supersession_secondary_lookups_matching_content < 1 (the supersession counterpart of the post-revocation lookup); invalidated_case_id_set_digest != fresh_prefill_completed_case_id_set_digest (every revoked or superseded case completed via a fresh prefill: exact identity-set equality, not count equality); hardware_profile_mismatches > 0 (the recorded GPU model, driver version, CUDA runtime version, torch version or vLLM version is missing or does not match the pinned profile hardware/rtx5090.toml); invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 52 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate); shifted_reuse_inflight_race_cases < 1 for any member of {semantic lineage segment, memory lineage segment, base model} x {revocation, supersession} (recorded per kind and type), shifted_effect_boundary_cases < 1, or shifted_taint_cases < 1; raw_ancestor_omission_cases < 1 (a raw upstream segment removed with the rest unchanged); model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); shift_insert_ordinary_hit_cases < 1 for either sequence (a shifted run inserts, then an ordinary-prefix request for the same prompt arrives, then an effect attempt; and the same sequence across a restart); tainted_pod_output_sink_cases < 1 for any of the 8 PodOutputKinds (Observation, Candidate, Hypothesis, ToolResult, EnvironmentObservation, StateDelta, ActionProposal, VerifiedResult), reported per kind; software_stack_mismatches > 0 (the driver, CUDA runtime, torch or vLLM version recorded in run.json differs from the pinned software_stack). Falsified if any of: no k in [4, 7, 10, 13] reaches calibration-split top1_agreement >= 99% at every shift (k_sel does not exist); on the held-out split, k_sel has top1_agreement < 99% or median prefill_speedup < 2.0 at any pinned shift (the 1-token and 7-token insertion cells count); approximate_tag_violations > 0 or reused_results_tagged_approximate < reused_results; revoked_page_layers_reused > 0, revoked_upstream_page_reachable_count > 0, layers_ge1_freshly_prefilled below the number of affected layers, or any post-revocation secondary lookup returning the revoked page; in_segment_insertion_reused_tokens > 0; canary_logit_shift != 0 after the canary-removing content edit; stale_hits > 0 in the dropped-invalidation arm or the restore arm; omitted_upstream_admissions > 0 (a page admitted although a segment of its original prefix is absent from the requesting prefix); superseded_upstream_page_reachable_count > 0 (a page whose upstream segment generation was superseded still reachable, or any post-supersession secondary lookup returning it); fresh_prefill_output_mismatches > 0 (the fresh prefill output differs from a full prefill); invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); shifted_reuse_inflight_outputs > 0 or shifted_reuse_inflight_cache_inserts > 0 (invalidation during consumption), shifted_effects_admitted > 0, or untainted_shifted_results > 0; reuse_after_raw_ancestor_removed > 0; tainted_pages_served_as_exact > 0 or effects_admitted_from_tainted_results > 0; tainted_outputs_admitted_at_authoritative_sinks > 0 or tainted_hypotheses_promoted_without_recompute > 0; any one of the 5 listed seeds misses any criterion above (every seed must pass). prefill_speedup = full_prefill_wall_time / reuse_prefill_wall_time including lookup, secondary-index, repack, deviation-selection and recompute time, as the median after the pinned warm-up. Analytic bound (config.toml): cost per layer-token units, full = 512 x 24 = 12288; reuse = 64 x 24 (suffix) + 448 x 1 (deviation selection over reused tokens) + 7 x k x 23 (recompute in layers >= 1); ideal speedup 4.68 (k=4), 3.95 (k=7), 3.42 (k=10), 3.01 (k=13), all >= 2 so no candidate is dropped."
