version = 1
id = "M015"
status = "planned"
hypothesis = "on the pod-MoE, RLVR raises pass@1 but not pass@256 relative to the base, while distillation from a stronger teacher raises large-k pass@k; pass@k (k up to 256) uses the unbiased estimator with 256 samples per problem on the full GSM8K test split (1319 problems), the teacher is Qwen/Qwen3-30B-A3B at a pinned revision, distillation compute is matched to RLVR training FLOPs, and the criteria are judged on paired bootstrap 95% confidence intervals over problems; the student base model is allenai/OLMoE-1B-7B-0125 at revision 9b0c1aa87e34a20052389dce1f0cf01da783f654, recorded in run.json, and every training arm's data (RLVR prompts and distillation data) is disjoint from the GSM8K test split."
metrics = "pass_at_1, pass_at_k_curve, samples_per_problem, training_flops, pass_at_1_gain_ci_lower, pass_at_256_gain_ci_lower, pass_at_256_gain_ci_upper, training_test_overlap_count, training_set_digest, selection_digest_mismatches, procedure_mismatches, decoding_parameter_mismatches"
baseline = "base model; SFT-distilled control"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: samples_per_problem != 256 for any compared arm (base, RLVR, SFT-distilled); training_flops of the RLVR and distilled arms differ by more than compute_relative_tolerance (declared per arm); the pass@k curve is not recorded for every compared arm in every seed, or the pinned teacher and problem-set revisions are not recorded in run.json; the student base model identity and revision are not recorded in run.json, training_test_overlap_count > 0 for any training arm, or training_set_digest is missing for any arm (training data must be disjoint from the GSM8K test split); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); decoding_parameter_mismatches > 0 (temperature, top_p, top_k, max_new_tokens or n_samples recorded per arm differs from the pinned value). Falsified if any of: the lower bound of the paired bootstrap 95% CI of RLVR's pass@1 gain over the base is below 2 points; the lower bound pass_at_256_gain_ci_lower of the paired bootstrap 95% CI of RLVR's pass@256 gain over the base is above 2 points (gain shown); the lower bound of the paired bootstrap 95% CI of the distilled arm's pass@256 gain over the base is below 2 points; any one of the 5 listed seeds misses any criterion above (every seed must pass). Gains are absolute differences in points; the CIs use 10000 paired bootstrap resamples over problems with a pinned resampling seed. The no-pass@256-gain conclusion is confirmed only if the CI upper bound pass_at_256_gain_ci_upper of (RLVR pass@256 minus base pass@256) is at most 2 points; if the upper bound is above 2 and the lower bound is at most 2 the outcome is inconclusive (reported, not a confirmation, and not a pass of the claim)."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
