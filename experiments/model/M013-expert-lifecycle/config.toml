version = 1
kind = "workspace-area"
name = "M013-expert-lifecycle"
path = "experiments/model/M013-expert-lifecycle"
tests_dir = "tests"

[pinned_thresholds]
min_gate_pass_rate_margin_absolute = 0.05
# Preregistered choices for this experiment (ForgettingGate has no default; all four thresholds are caller-supplied).
# Names follow crates/ptr-lineage/src/forgetting.rs ForgettingGate; values are accuracy fractions.
gate_max_average_forgetting = 0.02
gate_max_task_forgetting = 0.05
gate_min_backward_transfer = -0.02
gate_max_public_regression = 0.01
public_suite_margin_points = 1.0
recovery_target_fraction_of_pre_retirement_score = 0.95
equal_compute_basis = "training FLOPs and active parameters"
min_mean_net_quality_change_per_accepted_proposal = 0.0
net_quality_change_must_be_at_least_both_baselines = true
gate_must_pass_and_average_forgetting_strictly_below_static = true
# Preregistered choices for this experiment (no code default exists).
max_recovery_steps = 5000
min_proposals_generated_per_arm = 20
min_proposals_accepted_per_arm = 10
# Preregistered choice: margin by which full-context net quality change must be at least both baselines.
net_quality_vs_baseline_margin = 0.0
# Preregistered choices for this experiment (no code default exists).
flops_relative_tolerance = 0.01
backward_transfer_definition = "ForgettingGate AccuracyMatrix definition"
# Preregistered choices for this experiment (no code default exists).
lifecycle_operations = ["birth", "merge", "split", "freeze", "prune", "reactivate"]
min_operation_count_per_type = 1
# Preregistered choices for this experiment (no code default exists).
net_quality_metric = "held-out domain-suite accuracy delta, disjoint from the gate suite"
domain_sequence = ["code", "math", "tool", "code"]
training_flops_includes = ["discarded_candidates", "l3_policy", "gate_evaluation"]
hyperparameter_tuning_budget_trials_per_arm = 8
hyperparameters_frozen_before_seeds = true
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
# Preregistered choices for this experiment (no code default exists).
min_seeds = 5
domain_accuracy_noninferiority_margin_points = 1.0
# Preregistered choices for this experiment (no code default exists).
proposal_generating_arms = ["full_context", "context_ablated", "heuristic"]
gate_pass_margin_applies_to_each_comparison_independently = true
# Preregistered choices for this experiment (no code default exists).
static_arm_requires_matched_observation = true
max_static_arm_schedule_mismatches = 0
max_static_arm_eval_stage_mismatches = 0
# Preregistered choices for this experiment (no code default exists).
lifecycle_operators_claim_11 = ["Birth", "Merge", "Split", "Freeze", "Prune"]
min_accepted_gate_processed_proposals_per_operator = 2
vacuous_if_operator_below_minimum = true
# Preregistered choices for this experiment (no code default exists).
tuning_trials_used_recorded_per_arm = ["lifecycle", "static", "context_ablated", "heuristic"]
max_tuning_budget_mismatches = 0
# Preregistered choices for this experiment (no code default exists).
active_params_relative_tolerance = 0.01
active_params_compared = "final active parameters, per seed, lifecycle arm versus static arm"
max_active_param_mismatch_seeds = 0
min_paired_reactivation_trials_per_seed = 1
paired_trial = "reactivate a retired expert vs train a fresh new expert on the same returning domain"
# Preregistered choices for this experiment (no code default exists).
corpus_math = "openai/gsm8k"
corpus_math_revision = "740312add88f781978c0658806c59bc2815b9866"
corpus_code = "openai/openai_humaneval"
corpus_code_revision = "7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544"
corpus_tool = "gorilla-llm/Berkeley-Function-Calling-Leaderboard"
corpus_tool_revision = "61fc0608cfd831fcfbbaa676ebdfef0ed963eeda"
corpus_tool_file = "BFCL_v3_simple.json"
corpus_split_rule = "per domain the items are split by index parity: even indices form the gate suite, odd indices form the held-out domain suite (disjoint); math uses GSM8K test for these suites and train for training"
public_suite_dataset = "cais/mmlu"
public_suite_revision = "c30699e8356da336a370243923dbaf21066bb9fe"
public_suite_config = "all"
public_suite_split = "test"
public_suite_selection_rule = "the first 2000 questions in index order"
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "tuning_trials_used", "domain_sequence", "max_recovery_steps", "min_proposals_generated_per_arm"]
