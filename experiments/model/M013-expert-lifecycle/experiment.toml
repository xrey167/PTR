status = "planned"
hypothesis = "a gated expert lifecycle (birth, merge, split, freeze, prune, reactivate) under domain shift forgets less and matches a static expert set at equal training compute (FLOPs) and equal active parameters (within 5% at every training and evaluation stage), with average forgetting strictly below the static arm's and within the complete ForgettingGate configuration and public-suite quality and final per-domain and mean accuracy each within 1.0 point of static; reactivating a retired expert recovers a returning domain faster than a new expert, measured as steps_to_recovery to 95% of the expert's pre-retirement domain score. In a context-ablation arm, L3 structural proposals generated with full self-observation context (routing traces, load, churn, interference, AIMER scores) have a higher gate pass rate, by a pinned absolute margin, than both the same policy with that context removed and a fixed threshold-rule heuristic on load/overlap, and a mean net quality change per accepted proposal that is above a pinned minimum (> 0) and at least that of both baselines; training_flops includes discarded candidates, the L3 policy and gate evaluation, and the net quality metric is measured on a held-out domain suite disjoint from the gate suite over a pinned domain sequence; claim 11 is evaluated only if each lifecycle operator (Birth, Merge, Split, Freeze, Prune) has at least 2 accepted and gate-processed proposals in each lifecycle arm, otherwise the run is vacuous for claim 11; the GSM8K test split is partitioned by index mod 2 (0 gate suite, 1 held-out evaluation) with separate selection digests, and the two partitions do not overlap; the naive adapter chain baseline has per-seed result coverage and a stated comparison: the lifecycle arm's average_forgetting is strictly below the naive chain's; context ablation is scored over a pinned common set of proposal opportunities (same opportunity ids in the same order, digest recorded), abstentions and gate rejections are counted per arm, and the primary metric adds cumulative net quality change per opportunity (abstention counts as 0), on which the full-context arm must beat both baselines by the pinned margin in every seed, in addition to the conditional metrics. Hyperparameters are selected once, on the tuning seed (tuning_seed = 1001, a pilot seed that is never one of the confirmatory seeds) with shortened trials of tuning_steps = 1250 (floor(0.25 * max_recovery_steps = 5000), minimum 1), then frozen for every seed's full-budget run; tuning_seed, tuning_steps and the selected hyperparameters are recorded with the procedure parameters."
metrics = "average_forgetting, backward_transfer, accuracy_matrix, expert_count, steps_to_recovery, proposal_gate_pass_rate, net_quality_change_per_accepted_proposal, task_forgetting, public_suite_score, public_regression, gate_pass, proposals_generated, proposals_accepted, training_flops, active_parameters, lifecycle_operation_counts, final_domain_accuracy, final_mean_accuracy, static_arm_schedule_mismatches, static_arm_eval_stage_mismatches, accepted_proposals_by_operator, tuning_trials_used, tuning_budget_mismatches, paired_reactivation_trials, selection_digest_mismatches, procedure_mismatches, training_data_outside_training_partition_count, training_gate_overlap_count, training_heldout_overlap_count, validation_overlap_count, validation_set_digest, gate_heldout_overlap_count, gate_suite_digest, heldout_suite_digest, active_params, active_param_mismatch_stages, training_flops_mismatch_cells, model_pin_mismatches, tuning_trial_set_digest, naive_adapter_chain_results_per_seed, opportunity_set_digest, abstentions_by_arm, gate_rejections_by_arm, cumulative_net_quality_per_opportunity"
baseline = "static expert set at equal training compute and equal active parameters; naive adapter chain; context-ablated L3 policy (self-observation context removed); fixed heuristic baseline (threshold rules on load/overlap)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: any lifecycle operation (birth, merge, split, freeze, prune, reactivate) has fewer than 1 exercise in lifecycle_operation_counts, or paired_reactivation_trials < 1 in any seed (claim 12 needs, per seed, at least one paired trial of reactivating a retired expert versus training a fresh new expert on the same returning domain; otherwise claim 12 is vacuous); proposals_generated below the pinned minimum (20) or proposals_accepted below the pinned minimum (10) in any of the proposal-generating arms (the full-context arm, the context-ablated arm and the heuristic arm; the static arm and the naive adapter chain do not generate proposals); training_flops_mismatch_cells > 0 (training_flops differ between the lifecycle and static arms by more than flops_relative_tolerance = 0.05 in any seed or at any stage, evaluated per seed and per stage), or active_param_mismatch_stages > 0 (active_params is recorded per stage per arm, and at any training or evaluation stage checkpoint of the code, math, tool, code sequence, including those used for average forgetting, the lifecycle arm's active parameters differ from the static arm's by more than active_param_tolerance = 0.05 relative); static_arm_schedule_mismatches > 0 or static_arm_eval_stage_mismatches > 0 (the static arm must be observed matched to the lifecycle arm: the same domain-shift schedule and the same evaluation stages, with training_flops within flops_relative_tolerance, instead of a proposal minimum); accepted_proposals_by_operator < 2 for any of Birth, Merge, Split, Freeze or Prune in any lifecycle arm (the full-context, context-ablated and heuristic arms; vacuous for claim 11); tuning_budget_mismatches > 0 (tuning_trials_used per arm, for the lifecycle, static, context-ablated and heuristic arms, differs from the pinned 8); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); training_data_outside_training_partition_count > 0 (training data must come only from the training partition); training_gate_overlap_count > 0 or training_heldout_overlap_count > 0 for any corpus (code: HumanEval index mod 3 == 0 training, == 1 gate, == 2 held-out; tool: BFCL_v3_simple index mod 3 likewise; math: GSM8K train, test), counted and required to be 0 per corpus; validation_overlap_count > 0 for any corpus (validation overlapping training, gate or held-out evaluation, counted per corpus), or validation_set_digest is not recorded; gate_heldout_overlap_count > 0 for the GSM8K test partition, or gate_suite_digest or heldout_suite_digest is not recorded in run.json; model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); tuning_search_spec recorded in run.json differs from the pinned search space, trial budget, sampler, selection seed, objective or tie-break (procedure_mismatches); tuning_trials_used != trial_budget (8) for any tuned arm, or tuning_trial_set_digest is not recorded in run.json (procedure_mismatches); naive_adapter_chain_results_per_seed missing for any seed; opportunity_set_digest is not recorded or differs between the full-context, context-ablated and heuristic arms (same opportunity ids, same order), or abstentions_by_arm or gate_rejections_by_arm is not recorded per arm. Falsified if any of: claim 11: average_forgetting of the lifecycle arm not strictly below the matched static arm's; claim 11: the ForgettingGate (gate_pass, GateReport) fails on any of average_forgetting > gate_max_average_forgetting, any task's forgetting > gate_max_task_forgetting, backward_transfer < gate_min_backward_transfer, or public_regression (serving public score minus candidate public score) > gate_max_public_regression (equality passes each threshold); claim 11: public-suite quality, or final per-domain accuracy, or final mean accuracy (final_domain_accuracy, final_mean_accuracy) of the lifecycle arm more than 1.0 point below the static arm's; claim 12: reactivation of a retired expert does not reach 95% of the expert's pre-retirement domain score in fewer steps than birth of a new expert (steps_to_recovery capped at max_recovery_steps; a new expert that does not reach the target is right-censored at the cap, a reactivated expert that does not reach it within the cap falsifies); claim 13: the full-context arm beats the context-ablated arm on proposal_gate_pass_rate by less than 0.05 absolute, or (independently) beats the heuristic arm by less than 0.05 absolute; claim 13: mean net_quality_change_per_accepted_proposal of the full-context policy not > 0.0, or less than baseline + net_quality_vs_baseline_margin (0.0) for either baseline; claim 11 comparison: average_forgetting of the lifecycle arm not strictly below the naive adapter chain's, in any seed; claim 13: cumulative_net_quality_per_opportunity of the full-context arm does not exceed that of the context-ablated arm and that of the heuristic arm by at least the pinned cumulative_net_quality_per_opportunity_margin (0.0), in any seed; any one of the 5 listed seeds misses any criterion above (every seed must pass). training_flops includes discarded candidates, the L3 policy and gate evaluation; the net quality metric is the held-out domain-suite accuracy delta over the pinned domain sequence, disjoint from the gate suite."
