version = 1
id = "M013"
status = "planned"
hypothesis = "a gated expert lifecycle (birth, merge, split, freeze, prune, reactivate) under domain shift forgets less and matches a static expert set at equal training compute (FLOPs) and equal active parameters, with average forgetting strictly below the static arm's and within the complete ForgettingGate configuration and public-suite quality within 1.0 point of static; reactivating a retired expert recovers a returning domain faster than a new expert, measured as steps_to_recovery to 95% of the expert's pre-retirement domain score. In a context-ablation arm, L3 structural proposals generated with full self-observation context (routing traces, load, churn, interference, AIMER scores) have a higher gate pass rate, by a pinned absolute margin, than both the same policy with that context removed and a fixed threshold-rule heuristic on load/overlap, and a mean net quality change per accepted proposal that is above a pinned minimum (> 0) and at least that of both baselines."
metrics = "average_forgetting, backward_transfer, accuracy_matrix, expert_count, steps_to_recovery, proposal_gate_pass_rate, net_quality_change_per_accepted_proposal, task_forgetting, public_suite_score, public_regression, gate_pass, proposals_generated, proposals_accepted, training_flops, active_parameters"
baseline = "static expert set at equal training compute and equal active parameters; naive adapter chain; context-ablated L3 policy (self-observation context removed); fixed heuristic baseline (threshold rules on load/overlap)"
falsification = "claim 11 (gated lifecycle vs static expert set at equal training compute in FLOPs and equal active parameters): falsified if, in >=3 seeds, average_forgetting (ForgettingGate definition) is not strictly below the matched static arm's average_forgetting (independent strict comparison), or the ForgettingGate (GateReport, recorded as gate_pass) fails on any of: average_forgetting > gate_max_average_forgetting, any task's forgetting > gate_max_task_forgetting, backward_transfer < gate_min_backward_transfer, or public_regression (serving public score minus candidate public score) > gate_max_public_regression (equality passes each threshold; any single violation fails the gate), or public-suite quality is more than 1.0 point below the static set; claim 12 (reactivation vs a new expert on the returning domain): falsified if, in >=3 seeds, reactivation of a retired expert does not reach 95% of the expert's pre-retirement domain score in fewer steps than birth of a new expert (steps_to_recovery; steps are capped at the pinned max_recovery_steps and a new expert that does not reach the target is right-censored at the cap, while a reactivated expert that does not reach it within the cap falsifies); claim 13 (context-ablation arm): falsified if, in at least 3 seeds, the full-context policy fails to beat BOTH the context-ablated policy and the heuristic baseline on proposal_gate_pass_rate by at least 0.05 absolute, OR its mean net_quality_change_per_accepted_proposal is not > 0.0 or is lower than that of either baseline by the pinned margin net_quality_vs_baseline_margin (0.0, i.e. it must be at least both baselines) (joint criterion; either failure falsifies); arms with fewer than the pinned minimum proposals_generated or proposals_accepted are vacuous and falsify; the run is invalid and falsified if the lifecycle and static arms differ in training_flops by more than flops_relative_tolerance or in active_parameters by more than active_params_relative_tolerance (both pinned in config.toml, declared per arm)."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
