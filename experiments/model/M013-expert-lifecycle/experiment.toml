version = 1
id = "M013"
status = "planned"
hypothesis = "a gated expert lifecycle (birth, merge, split, freeze, prune, reactivate) under domain shift forgets less and matches a static expert set at equal training compute (FLOPs) and equal active parameters, with average forgetting strictly below the static arm's and within the complete ForgettingGate configuration and public-suite quality and final per-domain and mean accuracy each within 1.0 point of static; reactivating a retired expert recovers a returning domain faster than a new expert, measured as steps_to_recovery to 95% of the expert's pre-retirement domain score. In a context-ablation arm, L3 structural proposals generated with full self-observation context (routing traces, load, churn, interference, AIMER scores) have a higher gate pass rate, by a pinned absolute margin, than both the same policy with that context removed and a fixed threshold-rule heuristic on load/overlap, and a mean net quality change per accepted proposal that is above a pinned minimum (> 0) and at least that of both baselines; training_flops includes discarded candidates, the L3 policy and gate evaluation, and the net quality metric is measured on a held-out domain suite disjoint from the gate suite over a pinned domain sequence."
metrics = "average_forgetting, backward_transfer, accuracy_matrix, expert_count, steps_to_recovery, proposal_gate_pass_rate, net_quality_change_per_accepted_proposal, task_forgetting, public_suite_score, public_regression, gate_pass, proposals_generated, proposals_accepted, training_flops, active_parameters, lifecycle_operation_counts, final_domain_accuracy, final_mean_accuracy"
baseline = "static expert set at equal training compute and equal active parameters; naive adapter chain; context-ablated L3 policy (self-observation context removed); fixed heuristic baseline (threshold rules on load/overlap)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: any lifecycle operation (birth, merge, split, freeze, prune, reactivate) has fewer than 1 exercise in lifecycle_operation_counts; proposals_generated below the pinned minimum (20) or proposals_accepted below the pinned minimum (10) in any arm; the lifecycle and static arms differ in training_flops by more than flops_relative_tolerance or in active_parameters by more than active_params_relative_tolerance (both declared per arm). Falsified if any of: claim 11: average_forgetting of the lifecycle arm not strictly below the matched static arm's; claim 11: the ForgettingGate (gate_pass, GateReport) fails on any of average_forgetting > gate_max_average_forgetting, any task's forgetting > gate_max_task_forgetting, backward_transfer < gate_min_backward_transfer, or public_regression (serving public score minus candidate public score) > gate_max_public_regression (equality passes each threshold); claim 11: public-suite quality, or final per-domain accuracy, or final mean accuracy (final_domain_accuracy, final_mean_accuracy) of the lifecycle arm more than 1.0 point below the static arm's; claim 12: reactivation of a retired expert does not reach 95% of the expert's pre-retirement domain score in fewer steps than birth of a new expert (steps_to_recovery capped at max_recovery_steps; a new expert that does not reach the target is right-censored at the cap, a reactivated expert that does not reach it within the cap falsifies); claim 13: the full-context L3 policy beats BOTH the context-ablated policy and the heuristic baseline on proposal_gate_pass_rate by less than 0.05 absolute; claim 13: mean net_quality_change_per_accepted_proposal of the full-context policy not > 0.0, or less than baseline + net_quality_vs_baseline_margin (0.0) for either baseline; any one of the 5 listed seeds misses any criterion above (every seed must pass). training_flops includes discarded candidates, the L3 policy and gate evaluation; the net quality metric is the held-out domain-suite accuracy delta over the pinned domain sequence, disjoint from the gate suite."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
