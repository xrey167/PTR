version = 1
id = "M013"
status = "planned"
hypothesis = "a gated expert lifecycle (birth, merge, split, freeze, prune, reactivate) under domain shift forgets less and matches a static expert set at equal training compute (FLOPs) and equal active parameters, with average forgetting strictly below the static arm's and within the complete ForgettingGate configuration and public-suite quality within 1.0 point of static; reactivating a retired expert recovers a returning domain faster than a new expert, measured as steps_to_recovery to 95% of the expert's pre-retirement domain score. In a context-ablation arm, L3 structural proposals generated with full self-observation context (routing traces, load, churn, interference, AIMER scores) have a higher gate pass rate, by a pinned absolute margin, than both the same policy with that context removed and a fixed threshold-rule heuristic on load/overlap, and a mean net quality change per accepted proposal that is above a pinned minimum (> 0) and at least that of both baselines."
metrics = "average_forgetting, backward_transfer, accuracy_matrix, expert_count, steps_to_recovery, proposal_gate_pass_rate, net_quality_change_per_accepted_proposal"
baseline = "static expert set at equal training compute and equal active parameters; naive adapter chain; context-ablated L3 policy (self-observation context removed); fixed heuristic baseline (threshold rules on load/overlap)"
falsification = "claim 11 (gated lifecycle vs static expert set at equal training compute in FLOPs and equal active parameters): falsified if, in >=3 seeds, average_forgetting (ForgettingGate definition) is not strictly below the matched static arm's average_forgetting (independent strict comparison), or exceeds any of the four ForgettingGate thresholds pinned in config (max_average_forgetting, max_task_forgetting, min_backward_transfer, max_public_regression), or public-suite quality is more than 1.0 point below the static set; claim 12 (reactivation vs a new expert on the returning domain): falsified if, in >=3 seeds, reactivation of a retired expert does not reach 95% of the expert's pre-retirement domain score in fewer steps than birth of a new expert (steps_to_recovery); context-ablation arm: falsified if the full-context L3 policy in at least 3 seeds the full-context policy fails to beat BOTH the context-ablated policy and the heuristic baseline on proposal_gate_pass_rate by at least 0.05 absolute, OR its mean net_quality_change_per_accepted_proposal is not > 0.0 or is lower than that of either baseline (joint criterion; either failure falsifies)."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
