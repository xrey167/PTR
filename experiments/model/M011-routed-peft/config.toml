arm_lora_computation = "OLMoE shapes: hidden H = 2048, expert intermediate I = 1024, 16 layers, 64 base experts; base fused mlp.experts.gate_up_proj is [64, 2I, H] and mlp.experts.down_proj is [64, H, I]; attention q/k/v/o are [H, H]. PERFT-R (both arms): parallel bottleneck PEFT experts beside the MoE block, N = 8 experts of W_down [H, r] and W_up [r, H] with r = 8 plus a router [H, N]; the base expert projections are not adapted: per layer 8 x (2048 x 8 + 8 x 2048) + 2048 x 8 = 262144 + 16384 = 278528; x 16 layers = 4456448. MixLoRA: LoRA experts as deltas on the fused expert projections with a top-2 router, N = 9 experts, r = 4: per expert gate_up delta A [H, r] + B [r, 2I] = 4 x (2048 + 2048) = 16384 and down delta A [I, r] + B [r, H] = 4 x (1024 + 2048) = 12288, so 28672; x 9 = 258048 plus router 2048 x 9 = 18432 gives 276480 per layer; x 16 = 4423680 (0.74% below the target). Plain LoRA on attention q, k, v, o with r = 17: per layer 4 x 17 x (2048 + 2048) = 278528; x 16 = 4456448. Common target 4456448; every arm within 1% (the checker recomputes the counts from the pinned tensors). The earlier 4456448 claim for the routed arms was wrong in its derivation (it assumed one H x H projection per adapter)."
