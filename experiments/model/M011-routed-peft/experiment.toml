version = 1
id = "M011"
status = "planned"
hypothesis = "routed LoRA experts (PERFT-R) on OLMoE beat a single LoRA and MixLoRA-style experts at equal trainable parameters, and emergent specialisation is at least as good as prescribed code/math/tool specialisation; emergent specialisation must be non-inferior to prescribed specialisation within 1 point, mean task accuracy being the macro average over domains, and every arm gets the same preregistered tuning budget; the PERFT-R arm used for the 1-point criteria is the emergent one, and LoRA rank is pinned per arm to match trainable parameters within 1%, not tuned."
metrics = "task_accuracy_per_domain, expert_specialisation_index, trainable_params, latency_per_token, selection_digest_mismatches, procedure_mismatches, tuning_trials_used, tuning_budget_mismatches, perft_vs_lora_gain_points, perft_vs_mixlora_gain_points, training_data_outside_training_partition_count, training_flops, training_flops_mismatch_seeds, validation_overlap_count, validation_set_digest, model_pin_mismatches"
baseline = "plain (single) LoRA at equal trainable parameters, equal training steps and total training FLOPs including routing within 5%; MixLoRA-style top-k LoRA experts at equal trainable parameters, equal training steps and total training FLOPs including routing within 5% (there is no frozen-base arm)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: trainable_params differ by more than the pinned relative tolerance (1%) between arms, or arms trained with different budgets; task_accuracy_per_domain missing for any pinned domain (code, math, tool) in any arm or seed; selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); tuning_budget_mismatches > 0 (tuning_trials_used per arm differs from the pinned 8); training_data_outside_training_partition_count > 0 (training data must come only from the training partition); training_flops_mismatch_seeds > 0 (total training FLOPs including routing, measured per arm and seed, differ between arms by more than flops_relative_tolerance = 0.05 in any seed); validation_overlap_count > 0 for any corpus (validation overlapping training, gate or held-out evaluation, counted per corpus), or validation_set_digest is not recorded; model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs). Falsified if any of: the emergent PERFT-R arm's macro-average task accuracy is not better than the plain (single) LoRA's by at least 1 point (perft_vs_lora_margin_points = 1.0); the emergent PERFT-R arm's macro-average task accuracy is not better than MixLoRA-style experts' by at least 1 point (perft_vs_mixlora_margin_points = 1.0); prescribed specialisation beats emergent by more than 1 point (emergent specialisation must be non-inferior within 1 point); any one of the 5 listed seeds misses any criterion above (every seed must pass). Mean task accuracy is the macro average over the pinned domains; LoRA rank is fixed per arm from the trainable-parameter count before any run and is not tuned."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
