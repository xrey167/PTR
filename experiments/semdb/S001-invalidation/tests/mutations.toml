# Defects the S001 harness must detect; run with `python scripts/mutation_check.py S001`
# (`--check` verifies the anchors only). Each `find` must occur exactly once in its file (checked
# by `--check`), so the list cannot drift from the code silently. `expect` names the hard counters
# that show the defect: a run that fails only on others does not count as detecting it.
#
# The first nine mutations plant defects in `ptr-semdb` (`SemanticHost::prepare_delta` and the
# dependency graph); the last three plant defects in the harness itself, to show that its oracle,
# its revision model and its arm A are not vacuous: each makes the harness's own cross-check fire.
# Every hard counter is expected by at least one mutation, so that `killed == total` also shows
# each of the nine can fire (a test in bins/ptr-bench checks this list against the harness).
#
# Not listed, on purpose: skipping the closure over the OLD graph in `prepare_delta`
# (`self.state.dependencies.affected_by(changed...)`). It is an equivalent mutant: every edge the
# delta removes ends at a key whose dependency set changed, that key is itself in `changed`, and
# so the closure over the new graph from `changed` already contains everything the old graph
# reached. No stream can tell the two apart; the oracle takes the closure over both graphs only
# because the manifest defines it so.
#
# The mutation run is invoked as `ptr-bench invalidation <cases> 17`: `cases` is the number of
# operations per graph (the pinned graph sizes, so the run is no evidence, and its scale is
# printed as "custom").

package = "ptr-bench"
features = ""
subcommand = "invalidation"
cases = 60
seed = 17
hard_counters = [
    "missed_invalidations",
    "closure_mismatches",
    "semantic_divergences",
    "noop_revision_bumps",
    "revision_mismatches",
    "unexpected_refusals",
    "cycle_unrefused",
    "missing_dependency_unrefused",
    "locality_violation",
]

[[mutation]]
name = "affected-direct-children-only"
description = "affected_by stops at the direct dependents: a change reaches its children, never its grandchildren."
expect = ["missed_invalidations", "closure_mismatches", "semantic_divergences"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
                    stack.extend(children.iter().map(|key| (*key).to_owned()));
'''
replace = '''
                    out.extend(children.iter().map(|key| (*key).to_owned()));
'''

[[mutation]]
name = "affected-values-not-evicted"
description = "prepare_delta marks the closure affected but keeps the affected derived values, so stale values survive the first phase."
expect = ["missed_invalidations"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
                next.ground.remove(key);
'''
replace = '''
                let _ = key;
'''

[[mutation]]
name = "rewired-key-not-changed"
description = "A replaced dependency set does not count as a change of the rewired key: it is neither marked affected nor evicted."
expect = ["missed_invalidations", "closure_mismatches", "semantic_divergences"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
                    next.dependencies.inputs.insert(key.clone(), inputs.clone());
                }
                changed.insert(key.clone());
'''
replace = '''
                    next.dependencies.inputs.insert(key.clone(), inputs.clone());
                }
'''

[[mutation]]
name = "cycles-accepted"
description = "The acyclicity check accepts every graph."
expect = ["cycle_unrefused"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
        visited == degree.len()
'''
replace = '''
        visited == degree.len() || true
'''

[[mutation]]
name = "revision-bumped-on-no-op"
description = "prepare_delta advances the revision even when nothing changed."
expect = ["noop_revision_bumps", "revision_mismatches"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
        if next != self.state {
'''
replace = '''
        if true {
'''

[[mutation]]
name = "value-change-invalidates-everything"
description = "A delta that declares no dependencies (a value change) marks every derived key affected: over-invalidation. Declared structure changes keep the exact closure (the setup deltas declare it, so the graph still loads)."
expect = ["locality_violation", "closure_mismatches"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
        let mut affected = self.state.dependencies.affected_by(changed.iter().cloned());
'''
replace = '''
        let mut affected: BTreeSet<String> = if delta.dependencies.is_empty() {
            self.state.dependencies.inputs.keys().cloned().collect()
        } else {
            self.state.dependencies.affected_by(changed.iter().cloned())
        };
'''

[[mutation]]
name = "missing-input-accepted"
description = "An explicit upsert of a derived key is accepted although one of its inputs holds nothing."
expect = ["missing_dependency_unrefused"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
                    if !next.ground.contains_key(input) {
'''
replace = '''
                    if false && !next.ground.contains_key(input) {
'''

[[mutation]]
name = "input-check-over-eager"
description = "The input check covers every derived key, not only the upserted ones, so a delta that evicts a derived value with a dependent is refused."
expect = ["unexpected_refusals"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
        for key in delta.upserts.keys() {
'''
replace = '''
        for key in next.dependencies.inputs.keys() {
'''

[[mutation]]
name = "equal-upsert-counts-as-change"
description = "An upsert of the value a key already holds counts as a change: it invalidates the key's dependents and advances the revision."
expect = ["noop_revision_bumps", "closure_mismatches"]
file = "crates/ptr-semdb/src/lib.rs"
find = '''
            if next.ground.get(key) != Some(value) {
'''
replace = '''
            if true {
'''

[[mutation]]
name = "harness-oracle-closure-truncated"
description = "Harness self-defect: the oracle's walk stops expanding after four keys, so its closure is too small."
expect = ["closure_mismatches"]
file = "bins/ptr-bench/src/experiments/s001/oracle.rs"
find = '''
            queue.extend(reverse[id].iter().copied());
'''
replace = '''
            if seen.len() < 4 {
                queue.extend(reverse[id].iter().copied());
            }
'''

[[mutation]]
name = "harness-oracle-expects-bump-on-no-op"
description = "Harness self-defect: the oracle expects every valid delta to advance the revision."
expect = ["revision_mismatches"]
file = "bins/ptr-bench/src/experiments/s001/oracle.rs"
find = '''
            bumps_revision: verdict == Verdict::Valid && !changed.is_empty(),
'''
replace = '''
            bumps_revision: verdict == Verdict::Valid,
'''

[[mutation]]
name = "harness-arm-skips-lossy-kinds"
description = "Harness self-defect: arm A does not recompute the lossy (min and parity) derivations."
expect = ["semantic_divergences"]
file = "bins/ptr-bench/src/experiments/s001/runner.rs"
find = '''
            let value = derive::eval(kind, &values);
'''
replace = '''
            if kind.is_lossy() {
                continue;
            }
            let value = derive::eval(kind, &values);
'''
