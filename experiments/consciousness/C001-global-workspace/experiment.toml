version = 1
id = "C001"
status = "planned"
hypothesis = "[CPU] As an inductive bias (not an expressivity claim), does a learned-attention global workspace (3 slots, competitive top-3 write, gated slot update, broadcast read by every module; GWT-1..4 as a mechanism) generalise better than parameter-matched alternatives when training data is finite and the test has more modules than training? Eight sensory modules with shared weights see one noisy observation each; a cue module carries a query type; the answer is the sum of the values of the two modules of that type, so the cue's content must reach the others before the relevant modules can be selected. Training: a finite set of 4096 eight-module instances. Primary evaluation: sixteen modules (more distractors); secondary: twenty-four and eight. Arms: workspace; all-to-all pairwise attention; bandwidth-matched all-to-all; no-broadcast (only the reporter reads the workspace); competition off (soft write); capacity off (8 slots); no communication (floor); a crippled all-to-all (one round) as the sensitivity control. It tests a learned analogue, not the deterministic ptr-pods::workspace contract. Functional mechanism test only: it says nothing about consciousness."
metrics = "accuracy on 16 modules (primary); accuracy on 24 and on 8 modules; area under the learning curve (sample efficiency); module-dropout accuracy; ignition curve and sharpness (descriptive); communication-cost proxies per module count; paired per-seed differences with one-sided 95% t bounds (lower and upper) over ten seeds; validity guards; sensitivity control"
baseline = "parameter-matched all-to-all pairwise attention; bandwidth-matched all-to-all (value width reduced to the workspace's slot content); parameter-matched no-broadcast workspace; ablations competition_off and capacity_off and the no-communication floor (descriptive); a crippled all-to-all as sensitivity control"
falsification = "Three outcomes plus invalid, decided in advance. SUPPORTED if the guards hold and every lower one-sided 95% t bound over the ten paired seed differences of 16-module accuracy (workspace minus all_to_all, bw_all_to_all, no_broadcast) is at least 50 per mille. REFUTED (falsified for this setting) only if the guards hold, the sensitivity control resolves, and some UPPER bound is below 50 per mille. NOT SHOWN if the bounds straddle the margin (nothing is concluded, no requirement is downgraded). INVALID (never falsified) if the strongest comparator is below 300 or above 900 per mille on any seed (floored or saturated), the sensitivity control cannot be told from the intact all-to-all by 50 per mille, the workspace arm fails to train on more than 2 of 10 seeds, or the seeds or mutation evidence are missing. Structurally FALSIFIED, on any seed, if a hard counter is above 0 (parameter mismatch, communication leak in an isolated arm, bottleneck violation, dropped-module leak, an out-of-distribution module count in a training batch, evaluation instance identical to a training instance, nondeterminism, non-finite loss, no-communication above the majority class) or a coverage rule fails. In-distribution and 24-module accuracy, sample efficiency, dropout and ignition are reported and never judged."
hardware_profile = "hardware/a0-cpu-4core.toml"
entrypoint = "env UV_PROJECT_ENVIRONMENT=../../../c001-venv PYTHONDONTWRITEBYTECODE=1 uv run --locked --offline --no-python-downloads --project research/consciousness python -B research/consciousness/gw/harness.py --benchmark c001 --seed <seed>"
seeds = [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json", "mutations.json"]
