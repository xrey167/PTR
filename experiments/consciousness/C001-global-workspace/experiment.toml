id = "C001"
status = "prepared"
hypothesis = "[CPU] As an inductive bias (not an expressivity claim), does a learned-attention global workspace (3 slots, competitive top-3 write, gated slot update, broadcast read by every module; GWT-1..4 as a mechanism) generalise better than parameter-matched alternatives when training data is finite and the test has more modules than training? Eight sensory modules with shared weights see one noisy observation each; a cue module carries a query type; the answer is the sum of the values of the two modules of that type, so the cue's content must reach the others before the relevant modules can be selected. Training: a finite set of 2048 eight-module instances, every arm trained to a validation plateau with the same protocol and tuned on the same learning-rate x width grid. Primary evaluation: sixteen modules (more distractors); secondary: twenty-four and eight. Arms: workspace; the pairwise comparators all-to-all, bandwidth-matched all-to-all and sparse top-k all-to-all; the attribution ablations no-broadcast (only the reporter reads the workspace), capacity off (8 slots) and competition off (soft write); no communication (floor); a crippled (one round) and a weak (Adam weight decay 0.001) all-to-all as gross and graded sensitivity controls. Every arm runs at d = 48 with its update width matched to the workspace's parameter count. It tests a learned analogue, not the deterministic ptr-pods::workspace contract. Functional mechanism test only: it says nothing about consciousness."
metrics = "accuracy on 16 modules (primary); accuracy on 24 and on 8 modules; area under the learning curve (sample efficiency); module-dropout accuracy; ignition curve and sharpness (descriptive); communication-cost proxies per module count; paired per-seed differences with one-sided 95% t bounds (lower and upper) over twenty seeds; validity guards; gross and graded sensitivity controls; three-valued attribution contrasts (attributed / not attributed / unresolved by noise) vs no_broadcast, capacity_off and competition_off"
baseline = "parameter-matched all-to-all pairwise attention; sparse top-k all-to-all; bandwidth-matched all-to-all (value width reduced to the workspace's slot content); parameter-matched no-broadcast workspace, competition_off and capacity_off as reported attribution contrasts (GWT-3, competition, GWT-2); the no-communication floor (descriptive); crippled and weak all-to-all as sensitivity controls"
falsification = "Three outcomes plus invalid, decided in advance. SUPPORTED if the guards hold and every lower one-sided 95% t bound over the twenty paired seed differences of 16-module accuracy (workspace minus all_to_all, bw_all_to_all, sparse_all_to_all) is at least 30 per mille (a margin justified by cost, fixed before the freeze and after the pilots, disclosed: about three points of accuracy is the smallest gain worth a new architectural block); the no_broadcast, capacity_off and competition_off contrasts are reported as attributed / not attributed / unresolved by noise and never change the verdict. REFUTED (falsified for this setting) only if the guards hold, both sensitivity controls resolve, and the UPPER bound (Bonferroni, alpha 0.05/3) against some pairwise comparator is below 30 per mille, i.e. the advantage is below the margin (not 'no advantage'). NOT SHOWN if the bounds straddle the margin (nothing is concluded, no requirement is downgraded). INVALID (never falsified) if the strongest pairwise comparator is below 300 or above 900 per mille on any seed (floored or saturated), the workspace or a pairwise comparator hit the step cap on more than 2 seeds, the gross (crippled, 50 per mille) or graded (weak, above 15 per mille) sensitivity control fails to resolve, the workspace arm fails to train on more than 4 of 20 seeds (such seeds stay in the paired differences), a harness-integrity counter is above 0 on any seed (module counts in training, parameter mismatch, non-finite loss, overlap of training, validation and evaluation data, checkpoint or convergence bookkeeping), or the seeds or mutation evidence are missing. Structurally FALSIFIED (a defect of an arm, not a result about the hypothesis), on any seed, if a structural counter is above 0 (communication leak in an isolated arm, bottleneck violation, dropped-module leak, nondeterminism, no-communication above the majority class) or a coverage rule fails. In-distribution and 24-module accuracy, sample efficiency, dropout and ignition are reported and never judged."
