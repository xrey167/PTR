# Defects the C004 harness must detect. `python scripts/mutation_check.py C004 --check` verifies the anchors (every `find` occurs
# exactly once in its file, so the plan cannot drift from the code silently). The mutations are RUN by
# `research/cseries/lib/run_mutations.py C004` (planted in a throwaway copy, never in the working tree), not by
# scripts/mutation_check.py, which builds a Cargo package and cannot plant a defect in a Python entrypoint. The keys `package`,
# `features`, `subcommand`, `cases` and `seed` exist only because the checker's plan loader requires them; `subcommand` is the benchmark
# name the aggregator checks in results/mutations.json. `seed` is a pilot seed, never a declared one.
#
# A mutation is killed in one of three ways.
#  1. STRUCTURAL counters and coverage rules (exit 1): the harness, run at the reduced scale of `runner_args` with the defect planted,
#     exits 1 and an expected structural counter or coverage counter fails. A defect of the recurrent or feed-forward arm or of an isolated
#     ablation must reach a counter and exit 1; where it also trips an integrity counter (the reset arm that carries state is also above
#     chance) the entry names both and either kills it.
#  2. INTEGRITY counters and negative controls (exit 2): the harness exits 2 and its stderr lists an expected INTEGRITY counter or an
#     expected negative control (`expect` entries "control:<name>").
#  3. UNIT tests (entries with `unit_tests`, expect "unit:<name>"): defects in the pure derivations of the guard scalars, in the model
#     formulas and in the plateau protocol. The named tests (research/cseries/tests) pass in the unmutated copy and must fail in the
#     planted one; the runner checks both.
# Every structural and integrity counter, every coverage counter and each negative control is expected by at least one mutation
# (test_c004.py::PlanCoversTheRules).
#
# What kills each judged rule:
#   comparator saturation guard (ceiling 980) ... comparator-scalar-reads-the-recurrent-arm (the harness scalar), the ceiling itself and every guard branch: aggregator mutations
#                                  (tests/aggregator_mutations.toml); trained-arm guards, unconverged guard ... trained-ignores-the-floor, unconverged-guard-ignores-the-comparator
#                                  (unit); the counts across seeds, the bounds, the quantiles, the controls and the null worlds:
#                                  scripts/tests/test_c004_aggregate.py (hand-computed values)
#   plateau protocol (patience, min-delta, best checkpoint, validation never test) .. train-patience-off-by-one, train-min-delta-ignored,
#                                  best-checkpoint-not-restored, converged-flag-always-true, evaluation-ignores-the-validation-set,
#                                  plateau-audit-min-delta-ignored, plateau-audit-patience-off-by-one
#   parameter and FLOP matching (the tolerance guard) .. ff-target-parameters-doubled, recurrent-flops-counted-at-double-length,
#                                  the two detectors (blind), and the formulas (unit)
#   sensitivity controls (label permutation, corrupted inputs) .. permutation-is-identity, corruption-changes-nothing
# aggregator wiring (Bonferroni refutation quantile, allowance counts, environment mismatch, one finished record per seed) are mutations
# of the aggregator, which this plan cannot plant (it plants into the harness copy): scripts/tests/test_c004_aggregate.py.

package = "c004-recurrent"
features = ""
subcommand = "c004"
cases = 100
seed = 1002
runner_args = ["--set", "max_steps=300", "--set", "max_steps_control=150", "--set", "eval_every=50", "--set", "patience=4", "--set", "pool_per_length=128"]
hard_counters = [
    # Structural counters (exit 1), then integrity counters (exit 2): the order of research/cseries/c004/c004_rules.py::HARD_COUNTERS.
    "reset_carry_leaks",
    "ff_causal_leaks",
    "nondeterminism",
    "param_mismatch_arms",
    "flop_mismatch_arms",
    "length_leaks",
    "inlength_control_errors",
    "train_eval_overlap",
    "val_eval_overlap",
    "nonfinite_arms",
    "checkpoint_mismatch_arms",
    "convergence_mismatch_arms",
    "label_mismatches",
    "reset_above_chance",
    "perm_label_leaks",
    "corruption_rate_errors",
    # Not hard counters of the harness: coverage counters, negative controls and unit-test kills, listed because
    # scripts/mutation_check.py requires every expected name to be in this list.
    "arms_trained",
    "id_eval_instances",
    "primary_eval_instances",
    "secondary_eval_instances",
    "recurrent_carry_hits",
    "control:length_leak",
    "control:inlength_probe",
    "control:overlap",
    "control:param_mismatch",
    "control:flop_mismatch",
    "control:label_check",
    "control:isolation_probe",
    "control:causal_probe",
    "unit:trained_floor",
    "unit:comparator_scalar",
    "unit:unconverged_arms",
    "unit:above_chance_slack",
    "unit:rate_error",
    "unit:label_leak",
    "unit:plateau_min_delta",
    "unit:plateau_patience",
    "unit:train_patience",
    "unit:train_min_delta",
    "unit:flop_formulas",
    "unit:param_formulas",
    "unit:alibi_sign",
    "unit:reset_state",
]

[[mutation]]
name = "reset-state-not-applied"
file = "research/cseries/c004/c004_model.py"
find = '''        if self.reset:
            out, _ = self.cell(x.reshape(b * t, 1, e))'''
replace = '''        if False:
            out, _ = self.cell(x.reshape(b * t, 1, e))'''
expect = ["reset_carry_leaks", "reset_above_chance"]

[[mutation]]
name = "ff-attention-not-causal"
file = "research/cseries/c004/c004_model.py"
find = "        if self.causal:\n            bias = bias.masked_fill"
replace = "        if False:\n            bias = bias.masked_fill"
expect = ["ff_causal_leaks"]

[[mutation]]
name = "determinism-seed-dropped"
file = "research/cseries/c004/harness.py"
