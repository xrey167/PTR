hypothesis = "[CPU stage A of C003, on a toy router; the GPU stage B on OLMoE L1 routing is C003 itself and needs a GPU] Indicator AST-1 as a functional property: does a predictive model of the router's own routing (an attention schema: it reads the router's own recent load history and predicts which experts the router will send tokens to next and how loaded they will be) that is also used to control routing improve routing quality over the same router without it? Toy world: bursty cyclic demand over eight experts of limited capacity (eight demand regimes of three batches each; the first-come tokens an expert can take are capped; a deterministic verifier rewards a token routed to a competent expert with room), every arm trained online by policy gradient. Control use is the point: a schema that only describes but does not control is a judged ablation. Arms: the control arm (router reads the schema's prediction); the same router without a schema, FLOP-matched and parameter-matched; a heuristic auxiliary-loss-free balancer; a describe-only schema (trained identically, router given zeros); a router that reads the same load history directly with no schema (parameter-matched); sensitivity controls (a uniform router, epsilon routing), a stationary null world, the shuffled-history attribution (judged) and a hand-set regime-blind reference (reported). The world was built, after failed designs, so that a schema can help: the experiment is a construction-validity check and leaves AST-L2 unchanged whatever its outcome. The schema has no authority over expert capacity or competence (a structural counter). Functional mechanism test only: it says nothing about consciousness or about OLMoE routing."
metrics = "fraction of tokens verified on a fresh evaluation stream of 240 batches (primary); expert load coefficient of variation; routing entropy; schema prediction accuracy of the router's most-requested next expert; routing churn between evaluations (descriptive); paired per-seed differences with one-sided 95% t bounds (lower and upper) over twenty seeds; validity guards; sensitivity controls; a stationary null world; the shuffled-history attribution. Recovery after an expert is revoked is not measured at stage A (it needs an online adaptation protocol; stage B)."
baseline = "same router without a schema, FLOP-matched to the control (judged) and parameter-matched (judged); a heuristic auxiliary-loss-free balancer (judged); a describe-only schema, trained but not used for control (judged); a router that reads the router's own load history directly, no schema, parameter-matched (judged); a uniform router and an epsilon-routed schema-free router as gross and graded sensitivity controls; a stationary null world; the control with a shuffled history (attribution, judged for COMPLETED); a hand-set regime-blind reference (reported)"
falsification = "Four outcomes, decided in advance (PREREGISTRATION.md, criteria.toml). COMPLETED if the guards and controls hold and the lower one-sided 95% t bounds over the twenty paired seed differences of the verified-token rate (control minus each of the schema-free router, the parameter-matched schema-free router, the heuristic balancer, the describe-only schema and the history router) are all at least 25 per mille and the shuffled-history control is attributed (control minus it at least 25 per mille); a COMPLETED is a construction check on a world built so that a schema can help and does not change AST-L2. FALSIFIED (refuted) only if the guards and controls hold and some Bonferroni upper bound is below 25 per mille (against the describe-only schema alone this is the finding that the schema's control role is not shown; against the history router, that access to the load history, not a separate predictor with a control law, accounts for the gain); and structurally FALSIFIED if a structural counter is above 0 on a valid seed (the describe-only schema reaches the router, the schema changes what the verifier reads, nondeterminism) or a coverage rule fails. NOT_SHOWN if the bounds straddle the margin or the gain is not attributed to the router's own history. INVALID, never falsified (and before any structural FALSIFIED), if seeds or mutation evidence are missing or partial, if parameter or FLOP matching is off beyond tolerance or another integrity counter is above 0, there is no headroom below the oracle, the comparators did not train, the schema did not learn on more than one seed, a judged arm hit the step cap on more than one seed, a control or the null world is not resolved as required, or the seeds or mutation evidence are missing. The schema has no authority over expert promotion or revocation."
