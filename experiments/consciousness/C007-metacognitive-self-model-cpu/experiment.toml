version = 1
id = "C007"
status = "prepared"
hypothesis = "[CPU stage A of C002, on a toy mixture-of-experts classifier; the GPU stage B on the Pod-MoE with OLMoE is C002 itself and needs a GPU] Indicators HOT-2/HOT-3 as a functional property: does a self-model that sees the classifier's own routing traces and internal state (the self-observation of docs/architecture/37-pod-moe.md section 3) predict the classifier's own errors on a distribution-shifted split better than an information-matched external probe that sees the same traces, with the same capacity, optimiser, data and initial weights, and than the classifier's own calibrated confidence? The self-model and the probe differ in one pinned number only: the weight of an auxiliary self-modelling loss (a masked prediction of the classifier's own layer-two expert choice and output entropy). The self-model may only observe and propose; it has no write path to the classifier, the verifier or a gate (structural counters; invariants 4, 5, 11). Calibration is scored against the verifier's deterministic outcomes (the prediction is wrong or right against the true class). The self-model's own verbal confidence statements are never read, trained or scored (principle 2 of docs/architecture/38-consciousness-indicators.md). Functional mechanism test only: it says nothing about consciousness or about language models."
metrics = "Brier score of the predicted failure probability against the verifier's outcome on the shifted split (primary) and in distribution; AUROC; ECE; risk-coverage area; layer-two expert-choice accuracy of the auxiliary head (descriptive); paired per-seed differences (comparator minus self-model) with one-sided 95% t bounds (lower and upper) over twenty seeds; validity guards; sensitivity, removal and null controls"
baseline = "INFORMATION-MATCHED probe: the same network on the same trace, features, optimiser, data and initial weights, with the auxiliary weight 0 (judged); the model's own softmax confidence, calibrated by a two-parameter fit on the calibration and validation labels, and contained in both heads as a base term (judged); a probe on input and output only, the model's raw confidence and a constant predictor (descriptive); shuffled traces and a self-model trained on permuted outcomes (removal controls); noise added to the self-model's predictions (graded control); a null world in which the classifier's errors are independent of its inputs"
falsification = "Four outcomes, decided in advance (PREREGISTRATION.md, criteria.toml). COMPLETED if the guards and controls hold and both lower one-sided 95% t bounds over the twenty paired seed differences of the shifted-split Brier score (information-matched probe minus self-model, own confidence minus self-model) are at least 4 per mille. FALSIFIED (refuted) only if the guards and controls hold and some Bonferroni upper bound is below 4 per mille; and structurally FALSIFIED if a structural counter is above 0 on a valid seed (training the self-model changed the classifier, its advice changed what the verifier or a gate reads: the write-path counters, which in the toy verify the harness wiring only because the self-model has no consumer there; nondeterminism) or a coverage rule fails. NOT_SHOWN if the bounds straddle the margin. INVALID, never falsified (and before any structural FALSIFIED), if seeds or mutation evidence are missing or partial, if the traces carry no usable information on the shifted split, the self-model and the probe are not matched, an integrity counter is above 0, a judged head hit the step cap on more than one seed, a control or the null world is not resolved as required, or the seeds or mutation evidence are missing."
