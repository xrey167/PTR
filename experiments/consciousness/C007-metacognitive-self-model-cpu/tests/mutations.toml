replace = "            loss = torch.nn.functional.binary_cross_entropy_with_logits(net(fx[idx]), fy[idx])\n            classifiers[\"task\"].head.bias.data.add_(1e-3)\n            if aux_weight > 0 and view == \"trace\":"
expect = ["model_write_paths"]

