# Defects the C007 harness must detect. `python scripts/mutation_check.py C007 --check` verifies the anchors (every `find` occurs exactly once in
# its file, so the plan cannot drift from the code silently). The mutations are RUN by `research/cseries/lib/run_mutations.py C007` (planted in a
# throwaway copy, never in the working tree), not by scripts/mutation_check.py, which builds a Cargo package and cannot plant a defect in a Python
# entrypoint. The keys `package`, `features`, `subcommand`, `cases` and `seed` exist only because the checker's plan loader requires them;
# `subcommand` is the benchmark name the aggregator checks in results/mutations.json. `seed` is a pilot seed, never a declared one.
#
# A mutation is killed in one of three ways.
#  1. STRUCTURAL counters and coverage rules (exit 1): the harness, run at the reduced scale of `runner_args` with the defect planted, exits 1 and
#     an expected structural counter or coverage counter fails.
#  2. INTEGRITY counters and negative controls (exit 2): the harness exits 2 and its stderr lists an expected INTEGRITY counter or an expected
#     negative control (`expect` entries "control:<name>").
#  3. UNIT tests (entries with `unit_tests`, expect "unit:<name>"): defects in the pure derivations, the metrics and the calibration; the named
#     tests (research/cseries/tests) pass in the unmutated copy and must fail in the planted one.
# Every structural and integrity counter, every coverage counter and each negative control is expected by at least one mutation
# (test_c007.py::PlanCoversTheRules).
#
# What kills each judged rule:
#   signal and error-band guards, unconverged guard ... signal-sign-flipped, error-band-is-exclusive, unconverged-guard-ignores-the-probe (unit); the
#                                  counts across seeds, the bounds, the quantiles, the controls, the removal controls and the null world:
#                                  scripts/tests/test_c007_aggregate.py (hand-computed values)
#   plateau protocol ........... best-checkpoint-not-restored, converged-flag-always-true (the unit mutations of the protocol itself are in
#                                  test_c004.TrainingProtocolTests, which the C004 plan names; the library is shared)
#   information matching of the self-model and the probe ... probe-has-a-different-width, probe-trained-on-other-features, probe-has-an-auxiliary-loss
#   the self-model's lack of authority (the hard write-path counter) ... head-training-writes-the-classifier, advice-writes-the-gate-threshold
#   metrics (Brier, AUROC, ECE, risk-coverage, Platt) ... the unit mutations below and brier-accumulates-in-single-precision
# aggregator wiring (Bonferroni refutation quantile, allowance counts, environment mismatch, one finished record per seed) are mutations of the
# aggregator, which this plan cannot plant (it plants into the harness copy): scripts/tests/test_c007_aggregate.py.

package = "c007-selfmodel"
features = ""
subcommand = "c007"
cases = 100
seed = 1002
runner_args = ["--set", "model_steps=300", "--set", "max_steps=400", "--set", "max_steps_control=100", "--set", "eval_every=25", "--set", "patience=100"]
hard_counters = [
    # Structural counters (exit 1), then integrity counters (exit 2): the order of research/cseries/c002a/c007_rules.py::HARD_COUNTERS.
    "model_write_paths",
    "advice_leaks",
    "nondeterminism",
    "capacity_mismatch_arms",
    "input_mismatches",
    "aux_weight_errors",
    "inert_treatment_arms",
    "fit_split_errors",
    "split_overlap",
    "error_rate_errors",
    "outcome_audit_mismatches",
    "metric_audit_mismatches",
    "permutation_leaks",
    "shuffle_errors",
    "noise_errors",
    "nonfinite_arms",
    "checkpoint_mismatch_arms",
    "convergence_mismatch_arms",
    # Not hard counters of the harness: coverage counters, negative controls and unit-test kills, listed because
    # scripts/mutation_check.py requires every expected name to be in this list.
    "arms_trained",
    "id_eval_instances",
    "shifted_eval_instances",
    "null_eval_instances",
    "advice_probe_hits",
    "control:split_overlap",
    "control:capacity",
    "control:input_hash",
    "control:outcome_audit",
    "control:metric_audit",
    "control:write_probe",
    "control:advice_probe",
    "control:shuffle_probe",
    "control:treatment_probe",
    "control:fit_probe",
    "unit:head_gap",
    "unit:base",
    "unit:signal",
    "unit:unconverged_arms",
    "unit:band",
    "unit:agreement",
    "unit:unchanged",
    "unit:confidence_score",
    "unit:auroc",
    "unit:ece",
    "unit:risk_coverage",
    "unit:platt",
    "unit:brier",
    "unit:feature_widths",
    "unit:aux_mask",
]

[[mutation]]
