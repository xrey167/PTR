'''

[[mutation]]
name = "snapshot-payload-shares-one-file-name"
description = "The snapshot payload is written under one fixed name instead of the name of its own digest: a stop between the payload and the state that names it leaves the old state over the new bytes."
expect = ["unjustified_refusals"]
file = "crates/ptr-ledger/src/raft_storage.rs"
find = '''
fn payload_name(digest: &[u8; 32]) -> String {
    let mut name = String::from("snapshot-");
    for byte in digest {
        name.push_str(&format!("{byte:02x}"));
    }
    name
}
'''
replace = '''
fn payload_name(_digest: &[u8; 32]) -> String {
    String::from("snapshot-fixed")
}
'''

[[mutation]]
name = "install-resets-the-log-in-place"
description = "The log is emptied in place before its replacement is renamed over it: a stop in between leaves a log that is not a log under a state that is waiting to be finished."
expect = ["unjustified_refusals"]
file = "crates/ptr-ledger/src/raft_storage.rs"
find = '''
        let scratch = write_scratch_log(&self.log_path, &[])?;
'''
replace = '''
        let scratch = write_scratch_log(&self.log_path, &[])?;
        self.log.set_len(0)?;
'''

[[mutation]]
name = "open-applies-what-lies-above-a-pending-snapshot"
description = "A snapshot that is waiting to be accounted for no longer holds back the committed entries above it, neither at open nor in apply_committed (either alone is covered by the other, which is why both are planted): they are numbered from an applied count the snapshot has not yet established, so the history a member presents is not a prefix of the workload."
expect = ["recovered_not_prefix", "convergence_bound_exceeded"]
file = "crates/ptr-ledger/src/raft_node.rs"
find = '''
        if member.installed.is_some() {
            // Entries above a snapshot that is waiting to be accounted for were committed and
            // are kept; they are applied, in order, once the host has accounted for it.
            member.deferred = recovered;
        } else {
            member.apply_committed(recovered)?;
        }
'''
replace = '''
        member.apply_committed(recovered)?;
'''

