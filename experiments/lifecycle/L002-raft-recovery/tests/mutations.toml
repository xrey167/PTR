[[mutation]]
name = "member-swallows-a-failed-append"
description = "A failed write of the entries is dropped and the call goes on to release the acknowledgement. The injected error never reaches the caller, which the plan sees as an injection that did not happen (reference_mismatches); promise_not_durable fires when the dropped write is a follower's."
expect = ["promise_not_durable", "reference_mismatches"]
file = "crates/ptr-ledger/src/raft_node.rs"
find = '''
                store
                    .wl()
                    .append(ready.entries())
                    .map_err(|error| error.to_string())?;
'''
replace = '''
                let _ = store.wl().append(ready.entries());
'''

[[mutation]]
name = "member-does-not-persist-its-vote"
description = "The hard state (term, vote, commit) is never written: a vote is granted that a restart forgets."
expect = ["promise_not_durable", "member_regressed"]
file = "crates/ptr-ledger/src/raft_storage.rs"
find = '''
    pub fn set_hard_state(&mut self, hard_state: &HardState) -> io::Result<()> {
        let previous = std::mem::replace(&mut self.hard_state, hard_state.clone());
        self.persist_state()
            .inspect_err(|_| self.hard_state = previous)
    }
'''
replace = '''
    pub fn set_hard_state(&mut self, hard_state: &HardState) -> io::Result<()> {
        self.hard_state = hard_state.clone();
        Ok(())
    }
'''

