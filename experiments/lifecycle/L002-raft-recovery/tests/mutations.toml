[[mutation]]
name = "member-drops-revocations-on-apply"
description = "A committed revocation is not applied by the member that decoded it: the member never holds the workload, which the group arm sees as a history that is not the reference (it judges no authority, the cutover arm does)."
expect = ["reference_divergence"]
file = "crates/ptr-ledger/src/raft_node.rs"
find = '''
            let event = decode_event(entry.data.as_ref()).map_err(|error| error.to_string())?;
'''
replace = '''
            let event = decode_event(entry.data.as_ref()).map_err(|error| error.to_string())?;
            if matches!(event, LedgerEvent::Revoked { .. }) {
                continue;
            }
'''

[[mutation]]
name = "member-numbers-events-from-zero"
