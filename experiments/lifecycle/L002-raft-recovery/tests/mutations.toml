file = "crates/ptr-ledger/src/file.rs"
find = '''
        if anchor.base != self.base {
            return Split::BaseMismatch;
        }
'''
replace = '''
        if self.prefix.incomplete {
            panic!("injected product panic");
        }
        if anchor.base != self.base {
