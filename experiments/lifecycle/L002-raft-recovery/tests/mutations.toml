# Defects the L002 harness must detect; run with `python scripts/mutation_check.py L002`
# (`--check` verifies the anchors only). Each `find` must occur exactly once in its file (checked
# by `--check`), so the list cannot drift from the code silently. `expect` names the hard counters
# that show the defect: a run that fails only on others does not count as detecting it.
#
# The first 27 mutations plant defects in `ptr-ledger` and `ptr-runtime`: the compaction cutover (the
# new log's fsync and its directory, a record dropped from the new log, an anchor that keeps the old
# floor, an open that reads the wrong log, an open without the epoch witness, a reclaim that takes the
# live log), the runtime's restore from a compacted snapshot and its reading of a revoked generation,
# a panic and a hang on the recovery path, and the Raft member (a failed write swallowed, the vote not
# persisted, the covered events of a snapshot not persisted, an installed snapshot not marked pending
# or not offered again, an anchor match that ignores the digest, a torn tail refused, the log not
# synced at open, a lost snapshot never reported, entries of a light ready never applied, revocations
# dropped on apply, events numbered from zero). Three more plant defects in the harness itself, to
# show that its oracle and its bookkeeping are not vacuous. Two were added in fix round 3 and are listed last:
# an anchored open that accepts a log shorter than its anchor (the second lie control, the live log cut
# before an acknowledged revocation, had no mutant of its own) and a heal schedule that never changes the
# leader (seen as a failed baseline, the one form in which the coverage rule leader_changes has a mutant). Every hard counter is expected by at least
# one mutation, so that `killed == total` also shows each of the eighteen can fire (a test in
# bins/ptr-bench checks this list against the harness). The mutations that restore the behavior the
# first pilot found defective in the product (member-swallows..., snapshot-record-forgets-the-covered-events,
# install-is-not-marked-pending, pending-snapshot-forgotten-by-open, torn-tail-refuses-to-open,
# open-does-not-sync-the-log-it-read, lost-snapshot-is-never-reported) are the evidence that the fixes
# are what the harness sees.
#
# Not listed, on purpose: a coverage rule is not a hard counter, so a mutant that only silences a coverage counter
# is not a kill here (the rules are held by the harness test that sets each counter to a violation and by the
# aggregator tests), and a control that stops tripping ends the run with status 2, which this checker records as
# a crash. Not listed either, because the harness cannot see them (limits, stated in the preregistration):
# - removing only the `sync_all` call inside `sync_parent`: the durability probe sees file data pages;
# - sending the Raft `persisted_messages` before the persistence: the members return all their
#   messages from one call, so no schedule of the router can tell the order inside it; what the
#   harness checks is that nothing a call returns promises what is not in the files, and a write that
#   fails returns no message (member-swallows-a-failed-append);
# - a torn tail trimmed below the commit index: no schedule damages committed bytes, so it is a unit
#   test of ptr-ledger (damage_below_the_committed_index_is_refused_not_trimmed) and not an entry here;
# - a tail cut that drops valid records after a damaged one, and a committed-prefix check skipped while
#   a snapshot is pending: the fsync-honest images never damage a record below the synced length and
#   never lose committed bytes, so both are unit tests of ptr-ledger
#   (a_damaged_record_with_valid_records_after_it_is_refused_above_the_commit_too,
#   a_log_cut_below_the_commit_of_a_pending_snapshot_is_refused);
# - the in-memory state running ahead of a state file that could not be written, and a served snapshot
#   whose payload the state does not name: a unit test of ptr-ledger each
#   (a_failed_snapshot_write_leaves_the_memory_as_the_disk_is,
#   a_snapshot_payload_that_is_not_the_one_the_state_names_is_refused);
# - a log cut at a record boundary below the commit index, a storage that goes on writing after an I/O error
#   past a point of no return (the harness restarts a member after any failed call, so poisoning is invisible
#   to it) and a resume that changes the node before its write succeeded: unit tests of ptr-ledger
#   (a_log_cut_at_a_record_boundary_below_the_commit_is_refused_and_does_not_panic,
#   an_error_past_the_point_of_no_return_poisons_the_storage_and_no_append_is_acknowledged,
#   a_write_that_fails_part_way_poisons_and_loses_nothing_acknowledged,
#   a_failed_resume_leaves_the_snapshot_offered_and_the_count_as_it_was).
#
# The mutation run is invoked as `ptr-bench raft-recovery <cases> 1001`: `cases` is the number of
# cutover workloads (one scenario per failpoint in the group arms, so the run is no evidence, and
# its scale is printed as "custom"). The seed is not one of the experiment's.

package = "ptr-bench"
features = "ledger-experiments"
subcommand = "raft-recovery"
cases = 2
seed = 1001
hard_counters = [
    "stale_accepts",
    "acked_revocation_missing",
    "recovered_not_prefix",
    "reorder_or_duplicate_index",
    "unclassified_cutover",
    "unjustified_refusals",
    "orphan_hazard",
    "promise_not_durable",
    "member_regressed",
    "reference_divergence",
    "convergence_bound_exceeded",
    "tampered_snapshot_accepted",
    "unsynced_acks",
    "product_panics",
    "product_hangs",
    "authority_mismatches",
    "reference_mismatches",
    "anchored_lie_accepted",
]

[[mutation]]
name = "cutover-log-created-without-fsync"
description = "create_from_log_above returns without synchronizing the new log: the cutover may name a file whose pages are still dirty."
expect = ["unsynced_acks"]
file = "crates/ptr-ledger/src/file.rs"
find = '''
        file.sync_all()?;
        #[cfg(feature = "failpoints")]
        fail::fail_point!("ledger.create_after_sync_before_dir_sync");
'''
replace = '''
        #[cfg(feature = "failpoints")]
        fail::fail_point!("ledger.create_after_sync_before_dir_sync");
'''

[[mutation]]
name = "cutover-new-log-directory-not-synchronized"
description = "The new log's directory is not synchronized: the cutover enters the directory synchronization once, not twice."
expect = ["unsynced_acks"]
file = "crates/ptr-ledger/src/file.rs"
find = '''
        sync_parent(path)?;
        Self::from_verified_above(path, file, verified, bytes.len(), base)
'''
replace = '''
        Self::from_verified_above(path, file, verified, bytes.len(), base)
'''

[[mutation]]
name = "cutover-drops-a-retained-record"
description = "compact builds the new log without the first record above the floor: the cutover is refused on a valid plan."
expect = ["reference_mismatches"]
file = "crates/ptr-ledger/src/acknowledged.rs"
find = '''
let retained = self.log.events()[offset..].to_vec();
'''
replace = '''
let retained = self.log.events()[offset + 1..].to_vec();
'''

