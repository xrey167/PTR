# L002 decision criteria. Frozen with the preregistration (config.toml names this file and its SHA-256);
# no rule changes after a run. They are what the harness itself judges (bins/ptr-bench,
# l002/metrics.rs coverage() and falsifiers()); a harness test pins this file to those lists, in order, and every counter named resolves in the harness's JSON.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .
# A token is an integer literal iff it matches -?[0-9]+ (a decimal point makes it a reference and so a
# parse error: no decimal literal exists).
# Any other token is a reference: a path of object keys from the root of the harness's single JSON result
# object, separated by '.' (no key holds a '.', no array is indexed): "stale_accepts" is a top-level key and
# "failpoint_hits.raft_install_after_payload" the member of an object.
# A reference that is missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule).
# A reference compared with an integer literal or another reference must be a JSON integer (not a
# boolean, not a float). Exact comparisons.
# The manifest's "< N" prerequisites are written ">= N" and its "> 0" violations "<= 0".
#
# Every coverage counter is read from an event the run observed (a failpoint that fired, an image that really is
# shorter or holed, a snapshot a member really installed, a message the router really dropped, a leader the members
# really elected); none is read from configuration. Rules that hold by construction of the plan and not by
# measurement, named so a reader does not mistake them for evidence: cuts (the plan runs 12 cutovers per seed and
# every one is counted when it ran), scenarios_group, scenarios_checked, tamper_controls, rename_image_pairs,
# the nine cutover failpoint hits (once per cutover), injected_io_errors and unwind_panics_observed (each counts a
# fault the plan asks for and the run saw happen), events_min, subjects_min and revoke_then_recommit_histories
# (properties of the generated workloads, checked against the oracle's own reading of each history), and
# probe_calibrated and probe_dirty_seen (one calibration of the durability probe on the scratch directory). The
# measured ones are the recoveries, the images that lost bytes, the member failpoint hits (counted over a schedule
# whose number of writes the product decides), the snapshots recorded and installed, the restarts between an
# installation and its accounting, the messages dropped, the promises checked and probe_clean_checked.
# The controls are not rules: a lie that does not fool the naive recovery, and a forged snapshot that its unanchored
# take does not make dangerous, end the run with status 2, and aggregate.py reads the controls' records from the
# result and calls a seed INVALID when they did not trip. The baselines' numbers, the refusals, the recovery rounds
# and every wall-clock time are descriptive and are in no rule.
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies L002 on that seed.
# Decision, in the order validity, falsifiers, controls: INVALID if a seed is missing, unresolvable, or its record does
# not describe the frozen run (a control that did not trip, a counter missing or mistyped, an exit status that disagrees
# with the rules), or the mutation evidence is absent or short, even when a falsifier fired in a record that can be read;
# FALSIFIED if every seed can be judged and some seed misses a coverage rule or trips a falsifier; COMPLETED iff every seed
# holds every coverage rule and every falsifier rule (and the mutation evidence counts every mutation of the plan killed).
version = 1
experiment = "L002"
seed_aggregation = "every_seed_must_pass"

