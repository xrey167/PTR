version = 1
id = "L002"
status = "planned"
hypothesis = "Clustered ledger state recovers: after crashes at every step of the durable-state transitions that L001-v2 left uncrashed, after partitions, restarts and message faults, no acknowledged revocation is lost, no member forgets what it acknowledged, and a group converges, within a pinned number of heartbeat rounds, to the history of a single-node durable reference. Scope chosen a priori (preregistration section 1): L001-v2 crashed appends of an uncompacted log, the engine and clean restarts of in-process members, and stated as limits that compaction, snapshots and retention were not crashed, that the order of persisting and sending inside a Raft member was taken on trust, and that RaftEngineLedger has no anchor (an owner decision, not repeated here). Arms: K, the compaction cutover of AcknowledgedLedger (a seeded workload acknowledged up to k events, the runtime's compacted snapshot exported at k, a floor planned under a retention count, compact() crashed at each of its nine failpoints by an in-process panic and by fsync-honest power-loss images of the new log and of the anchor's publication, and appends above the new floor crashed at the eight log and anchor failpoints); after each crash the harness recovers as a host does, checks the live floor against its own table, restores a PtrRuntime from the snapshot and the retained records and compares it with the oracle, reclaims the orphans, retries the cutover and acknowledges the rest of the workload. S and G, three Raft members over FileRaftStorage on a deterministic router (isolation of a member, a snapshot recorded by two members and sent to the third, a deposed leader, message drops, duplicates and reorders), each schedule run once without a fault (baseline B0, the failpoint counts) and once with a panic at the n-th hit of one of ten storage failpoints or an I/O error returned in place of a write at one of two; three properties are checked at every call or at the end: persist before send (every vote granted and every append acknowledged in a message a call returns is already in the member's files, read separately, and a call whose write failed returns an error and no message), no forgetting (a member opened again holds at least the term, commit index and applied events it had, and a history that is a prefix of the workload), and convergence (the leader's heartbeats bring every member to the workload within 6 rounds, the transport reporting the snapshots it lost); and a power-loss image of a member's log at the sync of an append (torn tail, zeroed tail, holes) must open. Controls: an anchor of an older epoch restored over the live one, and the live log cut before an acknowledged revocation, must fool the naive recovery with a stale revocation and be refused by the anchored product; a snapshot recorded by the leader whose payload omits the revocations must be refused by the anchor match, stay refused across a restart, and would have made a revoked generation authorizable through the unanchored take. Independent oracle: L001-v2's (about sixty lines, no code shared with the product). Stated limits: power loss is the fsync-honest crash-image model, with images for the new log and the anchor of the cutover and for the log of a member, not for its state or snapshot file; the directory fsync is taken on trust; the order inside RaftNode::drain is not observable from its return value, so the checked contract is the one above; the process-abort class is an in-process panic; no real wire, no election timer, no membership change; RaftEngineLedger is not touched."
metrics = "cuts, recoveries_cutover, recoveries_member, scenarios_group, scenarios_checked, failpoint_hits, images_lost_bytes, rename_image_pairs, lie_images, unwind_panics_observed, cuts_over_revocation, snapshots_recorded, snapshots_installed, restarts_between_install_and_resume, injected_io_errors, leader_changes, messages_dropped, promises_checked, promises_vote, tamper_controls, revoke_then_recommit_histories, recoveries_with_acked_revocation, revoked_pairs_denied, subjects_min, events_min, probe_calibrated, probe_dirty_seen, probe_clean_checked, stale_accepts, acked_revocation_missing, recovered_not_prefix, reorder_or_duplicate_index, unclassified_cutover, unjustified_refusals, orphan_hazard, promise_not_durable, member_regressed, reference_divergence, convergence_bound_exceeded, tampered_snapshot_accepted, unsynced_acks, product_panics, product_hangs, authority_mismatches, reference_mismatches, anchored_lie_accepted, recoveries, recovered, refusals, b1_recoveries, b1_stale_accepts, rounds_to_converge_max, rounds_to_converge_total, restarts, messages_delivered, messages_duplicated, messages_reordered, runtimes_restored, follow_on_appends, retried_cutovers, raft_stalled, images_damaged"
baseline = "single-node durable reference: the same schedule without a fault (B0), recovered through the same path and held to the same checks, with the workload itself, fed to the runtime in order, as the single-node reference history; and naive recovery on the controls (the anchor file trusted without the witness, the log alone with its tail trimmed, the unanchored take of a forged snapshot)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: cuts < 10, recoveries_cutover < 200, recoveries_member < 90, scenarios_group < 36, scenarios_checked < 36, failpoint_hits.compaction_before_build < 10, failpoint_hits.ledger_create_after_write_before_sync < 10, failpoint_hits.ledger_create_after_sync_before_dir_sync < 10, failpoint_hits.compaction_after_log_built_before_anchor < 10, failpoint_hits.anchor_after_scratch_write_before_sync < 10, failpoint_hits.anchor_after_scratch_sync_before_rename < 10, failpoint_hits.anchor_after_rename_before_dir_sync < 10, failpoint_hits.anchor_after_dir_sync < 10, failpoint_hits.compaction_after_anchor_before_install < 10, failpoint_hits.ledger_sync_parent < 10, failpoint_hits.raft_append_after_write_before_sync < 10, failpoint_hits.raft_atomic_after_write_before_sync < 10, failpoint_hits.raft_atomic_after_sync_before_rename < 10, failpoint_hits.raft_state_after_rename_before_dir_sync < 10, failpoint_hits.raft_snapshot_after_payload < 10, failpoint_hits.raft_snapshot_after_state < 10, failpoint_hits.raft_snapshot_after_log_rewrite < 10, failpoint_hits.raft_compact_after_sync_before_rename < 10, failpoint_hits.raft_compact_after_rename_before_dir_sync < 10, failpoint_hits.raft_install_after_payload < 10, failpoint_hits.raft_install_after_log_reset < 10, failpoint_hits.raft_install_after_log_sync_before_rename < 10, failpoint_hits.raft_append_before_write < 10, failpoint_hits.raft_state_before_write < 10, images_lost_bytes < 1000, rename_image_pairs < 10, lie_images < 10, unwind_panics_observed < 150, cuts_over_revocation < 6, snapshots_recorded < 100, snapshots_installed < 40, restarts_between_install_and_resume < 15, injected_io_errors < 4, leader_changes < 3, messages_dropped < 20, promises_checked < 400, promises_vote < 100, tamper_controls < 3, revoke_then_recommit_histories < 40, recoveries_with_acked_revocation < 150, revoked_pairs_denied < 200, subjects_min < 3, events_min < 10, probe_calibrated < 1, probe_dirty_seen < 1, probe_clean_checked < 300. Falsified if any of: stale_accepts > 0 (the PtrRuntime over a recovered or reconstructed history (the events above a floor restored from the compacted snapshot, a member's snapshot payload and the events above it) authorizes a (subject, generation) that the oracle's reading of that history does not, or that an acknowledged revocation names); acked_revocation_missing > 0 (a recovered state lacks a revocation that was acknowledged); recovered_not_prefix > 0 (a recovered history is not the acknowledged prefix plus at most the record in flight, exactly (a record lost, changed, reordered or never sent), or a snapshot payload does not decode); reorder_or_duplicate_index > 0 (the commit indices of a recovered history are not 1 to n, each once (the retained records of a compacted log continue directly above its floor, and a member continues the numbering its snapshot established)); unclassified_cutover > 0 (after a crash of the compaction cutover the live floor is not the table's (the old one before the anchor was renamed, the new one from then on), or the anchor does not cover the log's tail exactly, or the floor after a retried cutover or after a reopen is not the planned one); unjustified_refusals > 0 (the product refused a log set or a Raft member that the table says is recoverable (including a power-loss image of a member's log with a torn, zeroed or holed tail, a genuine snapshot refused by its own anchor, a restore from the compacted snapshot, a member that could not be opened again from its directory), or a recovered ledger could not retry the cutover, append the rest of the workload and survive a reopen); orphan_hazard > 0 (reclaiming the orphans of a recovered set removed the live log, changed it, left a log other than the live one, or removed other files than the ones LogPaths::orphans listed); promise_not_durable > 0 (a vote granted or an append acknowledged in a message that a call returned is not in the member's files, read separately at that moment, or those files cannot be read); member_regressed > 0 (a member opened again holds a lower term, commit index or number of applied events than when its last call returned, or presents fewer events); reference_divergence > 0 (after the faults a member that is up and not blocked on a refused snapshot does not hold the workload, the single-node reference history); convergence_bound_exceeded > 0 (the leader's heartbeats did not bring every member to the leader's history within 6 rounds); tampered_snapshot_accepted > 0 (a snapshot whose digest differs from the anchor the host retained was taken, or a member that was refused one holds it as its state after a restart); unsynced_acks > 0 (the durability probe found a page not yet written to disk in a file a product had just called durable (the new log before the anchor may name it, the anchor's scratch file before it is renamed, a member's log, state or snapshot file after a call returned), or the cutover entered the directory synchronization fewer than twice); product_panics > 0 (a product call panicked other than by the harness's injection (a recovery, a replay, a restore, a member's open or call)); product_hangs > 0 (a recovery, an in-process run of appends or a group scenario outlived its watchdog (60 s)); authority_mismatches > 0 (the runtime refuses a history the oracle calls valid, or its answer for a pair (may an action proceed, what is the generation's standing) differs from the oracle's without being a stale accept); reference_mismatches > 0 (a baseline run without a fault fails: a step of it is refused, a failpoint the plan asks for is never reached, a proposal a leader must accept is refused, the group does not go quiet, or its recovery trips another falsifier); anchored_lie_accepted > 0 (the anchored product opened a lie image: the anchor of an epoch older than the witness, or a live log cut before an acknowledged revocation); any one of the 5 listed seeds misses any criterion above (every seed must pass). The baselines' numbers (b1_recoveries, b1_stale_accepts), the refusals, the recovery rounds and every wall-clock time are descriptive and never judged."
