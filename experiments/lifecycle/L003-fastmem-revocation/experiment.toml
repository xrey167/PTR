version = 1
id = "L003"
status = "running"
hypothesis = "Can a revoked input ever influence a fast-memory readout after revocation, replay, restore or crash?"
metrics = "bit-identity failures; resurrected reads; writes replayed per revocation"
baseline = "memory rebuilt from scratch without the revoked writes"
falsification = "Any bit difference from the never-saw-it fold, or any admitted read that depends on a revoked input, is a hard failure."
hardware_profile = "hardware/default.toml"
entrypoint = "cargo run --release --locked -p ptr-bench --features postgres-experiments -- fastmem-revocation <iterations> <seed>"
# The harness reads a loopback PostgreSQL 16+ server with pgvector 0.8+ from
# this environment variable; the connection string is never recorded.
server_environment = "PTR_PG_EXPERIMENT_DSN"
iterations = 30
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
design = "../../../docs/architecture/35-agentic-substrate.md"
