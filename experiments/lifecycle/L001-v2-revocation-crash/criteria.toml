# L001-v2 decision criteria. Frozen with the preregistration (config.toml names this file and its SHA-256);
# no rule changes after a run. They are what the harness itself judges (bins/ptr-bench,
# l001/metrics.rs coverage() and falsifiers()); a harness test pins this file to those lists, in order, and every counter named resolves in the harness's JSON.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .
# A token is an integer literal iff it matches -?[0-9]+ (a decimal point makes it a reference and so a
# parse error: no decimal literal exists).
# Any other token is a reference: a path of object keys from the root of the harness's single JSON result
# object, separated by '.' (no key holds a '.', no array is indexed): "stale_accepts" is a top-level key and
# "failpoint_hits.engine_sync" the member of an object.
# A reference that is missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule).
# A reference compared with an integer literal or another reference must be a JSON integer (not a
# boolean, not a float). Exact comparisons.
# The manifest's "< N" prerequisites are written ">= N" and its "> 0" violations "<= 0".
#
# Every coverage counter is read from an event the run observed (a failpoint that fired, an image that really is
# shorter or holed, a child process that really died of SIGABRT, a message the router really dropped, a leader the
# members really elected); none is read from configuration. Rules that hold by construction of the plan and not by
# measurement, named so a reader does not mistake them for evidence: workloads_file, workloads_ack, workloads_engine
# and scenarios_raft (the number of workloads and scenarios the plan runs), child_aborts_* and unwind_panics_observed
# (each counts a crash the plan asks for and the run saw happen), events_min and subjects_min and
# revoke_then_recommit_histories (properties of the generated workloads, checked against the oracle's own reading of
# each history), and probe_calibrated and probe_dirty_seen (one calibration of the durability probe on the scratch
# directory). The measured ones are the failpoint hits, the recoveries, the images that lost bytes, the rename image
# pairs, the lie images, the Raft counters and probe_clean_checked.
#
# The fsync-lie control (a lie image must fool the naive recovery with a stale revocation, and the anchored product must
# refuse it) is not a rule: a lie that does not fool the naive recovery ends the run with status 2, and aggregate.py reads
# the control's record from the result and calls a seed INVALID when it did not trip. undetected_rollback and
# engine_lie_stale_accepts (RaftEngineLedger has no anchor), the refusals, the baselines' numbers and every wall-clock time
# are descriptive and are in no rule.
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies L001-v2 on that seed.
# Decision: every seed must hold every coverage rule and every falsifier rule; COMPLETED iff so (and the mutation
# evidence counts every mutation of the plan killed), INVALID if a seed is missing, unresolvable, or its record does not
# describe the frozen run, FALSIFIED otherwise.
version = 1
experiment = "L001-v2"
seed_aggregation = "every_seed_must_pass"

coverage = [
  "workloads_file >= 6",
  "workloads_ack >= 6",
  "workloads_engine >= 2",
  "scenarios_raft >= 10",
  "scenarios_checked >= 10",
  "recoveries_file >= 600",
  "recoveries_ack >= 1000",
  "recoveries_engine >= 250",
  "members_replayed >= 70",
  "failpoint_hits.ledger_before_record_write >= 20",
  "failpoint_hits.ledger_after_length_before_payload >= 20",
  "failpoint_hits.ledger_after_payload_before_sync >= 20",
  "failpoint_hits.ledger_after_sync_before_memory >= 20",
  "failpoint_hits.anchor_after_scratch_write_before_sync >= 20",
  "failpoint_hits.anchor_after_scratch_sync_before_rename >= 20",
  "failpoint_hits.anchor_after_rename_before_dir_sync >= 20",
  "failpoint_hits.anchor_after_dir_sync >= 20",
  "failpoint_hits.engine_append >= 20",
  "failpoint_hits.engine_write >= 20",
  "failpoint_hits.engine_sync >= 20",
  "failpoint_hits.ledger_sync_parent >= 20",
  "images_lost_bytes >= 1000",
  "rename_image_pairs >= 50",
  "lie_images >= 100",
  "child_aborts_file >= 24",
  "child_aborts_ack >= 48",
  "child_aborts_engine >= 12",
  "unwind_panics_observed >= 144",
  "leader_changes >= 4",
  "minority_proposals >= 2",
  "deposed_leader_restarts >= 2",
  "messages_dropped >= 20",
  "messages_duplicated >= 20",
  "messages_reordered >= 20",
  "revoke_then_recommit_histories >= 14",
  "recoveries_with_acked_revocation >= 700",
  "revoked_pairs_denied >= 900",
  "crash_points_at_revocation >= 140",
  "subjects_min >= 3",
  "events_min >= 6",
  "probe_calibrated >= 1",
  "probe_dirty_seen >= 1",
  "probe_clean_checked >= 400",
]

falsifiers = [
  "stale_accepts <= 0",
  "acked_revocation_missing <= 0",
  "recovered_not_prefix <= 0",
  "reorder_or_duplicate_index <= 0",
  "unclassified_split <= 0",
  "unjustified_refusals <= 0",
  "raft_revocation_visible_before_commit <= 0",
  "product_panics <= 0",
  "product_hangs <= 0",
  "unsynced_acks <= 0",
  "authority_mismatches <= 0",
  "reference_mismatches <= 0",
  "anchored_lie_accepted <= 0",
  "refusal_share_excess <= 0",
]
