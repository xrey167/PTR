version = 1
id = "F008"
status = "planned"
hypothesis = "The leave-one-generation-out replay backtest of ptr_training.replay is a valid test of whether an off-policy outcome model predicts held-out generations of a self-improvement history, and it keeps two claims apart: pipeline_ran (the backtest completed on a well-formed append-only history) and predictive (at least min_within_bound = 2 generations were predicted out of sample, and at least min_within_fraction = 0.5 of the predictable ones, each with every family within the pinned error bound 0.05). On seeded synthetic histories with a known generating response, (1) a positive control history whose outcome is linear in the decisions with noise well under the bound is judged predictive in at least 95 percent of 200 histories per seed, (2) a negative control history whose outcome is independent of the decisions, and one whose response is an interaction the additive model cannot express, is judged predictive in at most 5 percent of 200 histories per seed, (3) the in-sample-error scorer (the flaw of the Research-repo original, a fit that reproduces its own points) calls at least 50 percent of the negative-control histories predictive, which is what makes control (2) non-vacuous, (4) a degenerate history (at least as many parameters as generations) is flagged degenerate in every case and is never judged predictive on in-sample error, (5) an out-of-order or repeated generation is refused by the pool in every case, (6) a winner that extrapolates beyond the observed decision levels aborts in every case, and a history that is not predictive selects no winner. Nothing here trains a model: the claim is about the backtest as an instrument, and no simulator-training PTR claim rests on it until predictive was true at least once on a real generation history."
metrics = "pipeline_ran, predictive, positive_control_histories, positive_control_predictive_rate, negative_control_histories, negative_control_false_predictive_rate, interaction_control_false_predictive_rate, in_sample_scorer_false_predictive_rate, persistence_baseline_abs_error, model_abs_error, oracle_abs_error, model_error_over_oracle_error, degenerate_histories, degenerate_flagged, degenerate_predictive_on_in_sample_only, out_of_order_attempts, out_of_order_accepted, duplicate_attempts, duplicate_accepted, extrapolating_winner_attempts, extrapolating_winners_selected, non_predictive_winner_attempts, non_predictive_winners_selected, not_identified_counted_as_predicted, noise_ladder_monotonicity_violations, bound_ladder_monotonicity_violations"
baseline = "(a) the in-sample-error scorer, which calls a history predictive when the fitted model reproduces its own generations within the bound (it must call the negative controls predictive, or control (2) is vacuous); (b) the persistence predictor, which predicts a held-out generation by the previous generation's outcome (the model must beat it on the positive control, or it adds nothing); ablations: shuffled insertion order with the chronology check removed, unidentified generations counted as zero error, and the extrapolation abort removed (each must produce the failure it exists to prevent); sensitivity controls: a noise ladder (sigma at 0, 0.25, 0.5, 1 and 2 times the bound) over which the predictive rate must be non-increasing, and a bound ladder (0.5, 1, 2 times the pinned bound) over which it must be non-decreasing; ceiling: the oracle predictor that knows the generating function, whose error is the noise floor and bounds what any history-only model can reach (the model error must be within the pinned factor of the oracle error on the positive control)."
falsification = "INVALID (vacuous, never a pass) if any control did not trip: the in-sample scorer's false predictive rate on the negative control below 0.5, a positive-control rate not reached by the oracle, any attempt counter (out_of_order_attempts, duplicate_attempts, extrapolating_winner_attempts, non_predictive_winner_attempts) below 1, or an ablation that did not produce the failure it exists to show. FALSIFIED if positive_control_predictive_rate is below 0.95, negative_control_false_predictive_rate or interaction_control_false_predictive_rate is above 0.05, model_abs_error is not below persistence_baseline_abs_error on the positive control, model_error_over_oracle_error exceeds the factor pinned before the first run, any of out_of_order_accepted, duplicate_accepted, extrapolating_winners_selected, non_predictive_winners_selected, not_identified_counted_as_predicted or degenerate_predictive_on_in_sample_only is above 0, degenerate_flagged differs from degenerate_histories, a ladder is not monotone, or any one of the 5 listed seeds misses any criterion (every seed must pass). The bound, the factor and the history shapes are pinned before the experiment leaves planned and are never loosened after a pilot. Seeds 17, 29, 43, 71 and 101 are confirmatory and have never been run; pilot and smoke seeds are 1001 and above, explorative, recorded apart and never counted as evidence."
