version = 1
id = "F002"
status = "planned"
hypothesis = "Does a verifier-precedence Dawid-Skene label model produce better calibrated and more accurate labels than majority vote at the same annotation budget?"
metrics = "accuracy on uniform gold; Brier score; ECE; Unknown and Disputed rates; Krippendorff alpha"
baseline = "majority vote; verifier-only labels"
falsification = "Scope: the calibration comparison is against the naive vote-share posterior (n_c + 1) / (n + C) of the majority vote and does not isolate Dawid-Skene or verifier precedence; calibrated vote shares are descriptive. Rejected on a seed if any label or resolved distribution contradicts a verifier veto (veto_contradictions > 0); if the fitted model, the resolution or the metrics differ from an independent oracle (model_oracle_mismatches, resolution_oracle_mismatches or metric_mismatches > 0); if a guard on gold labels or actively sampled evaluation sets fails (gold_guard_violations, active_set_calibration_reported or acquisition_violations > 0); if the label model is not better calibrated than the majority vote on the uniform gold sample of the world with sound verifiers (the lower end of the paired bootstrap interval of the Brier gain, w1_brier_gain_lower_ppm, or of the ECE gain, w1_ece_gain_lower_ppm, below 1 ppm) or produces less accurate labels than the plain majority vote for the items of that world (w1_census_accuracy_ds_permille below w1_census_accuracy_mv_permille); or if the product panics or refuses a valid input (product_panics, unexpected_refusals > 0). A run that does not reach its coverage minima is vacuous and counts as falsified. The contaminated-verifier world, the homogeneous control world and the calibrated-vote arms are descriptive and gate nothing but the veto and oracle checks; losing to a calibrated vote is a recorded negative result, not a falsification."
hardware_profile = "hardware/default.toml"
entrypoint = "cargo run --release --locked -p ptr-bench -- weak-supervision <seed>"
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json", "mutations.json"]
design = "../../../docs/architecture/35-agentic-substrate.md"
