version = 1
id = "F003"
status = "completed"
hypothesis = "Does the calibrated arbiter keep the harm rate of auto-proposed branches at or below alpha on held-out adjudications? The claim is scoped to the mechanism and to a low-noise regime: a simulated adjudicator with a known error rate of 2 per mille stands in for people, because at 20 per mille Learn-then-Test certifies nothing in roughly three calibrations of four (a utility limit of the start rule, reported by an ungated descriptive arm, not a violation). What is tested is that the Learn-then-Test guarantee holds in this scenario (shown empirically, not proven), that no ineligible branch is auto-proposed and that off-policy estimates are sound. Reviews saved are reported descriptively only."
metrics = "coverage of the Learn-then-Test guarantee over Monte-Carlo replicates; per-policy exact held-out test of the adjudicated harm rate of auto-proposals, with the literal upper bound reported; ineligible auto-proposals; escalation share and reviews saved; off-policy estimate error"
baseline = "escalate every branch; fixed uncalibrated threshold"
falsification = "F003 is falsified on a seed if any of the following holds. (1) Any ineligible branch is auto-proposed, or any triage differs from the independent oracle's decision. (2) Coverage: over the Monte-Carlo replicates, the number of certified thresholds whose true adjudicated harm rate exceeds alpha is above the critical value of the exact binomial test of 'at most delta of the replicates' at level 1e-3. (3) Held-out: for any recorded policy, the exact one-sided binomial test of 'the harm rate of the branches the policy would auto-propose is at most alpha' on the held-out adjudications rejects at the Bonferroni share (familywise 0.05 over the policies and seeds); that is, a held-out harm rate whose exact lower bound is above alpha. The literal rule 'the upper confidence bound on held-out adjudications exceeds alpha' is reported for each policy and is not a falsifier, because a correct Learn-then-Test policy fails it by construction. (4) A threshold, held-out set, conformal threshold or Clopper-Pearson bound that differs from the independent oracle's, a non-slice triage that can be adjudicated, an off-policy estimate whose mean error over the logs is outside four standard errors of zero, a target below the logging threshold that is not refused, or a panic of the arbiter."
hardware_profile = "hardware/default.toml"
entrypoint = "cargo run --release --locked -p ptr-bench -- calibrated-arbiter <seed>"
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json", "mutations.json"]
