        Arm::NoL3 => full,'''

[[mutation]]
name = "ctx-pods-ignore-the-broadcast"
description = "In the world that declares a Pod reading the broadcast, no Pod reads it: the workspace secondary hypothesis has no effect to find."
expect = ["control_ctx"]
file = "bins/ptr-bench/src/experiments/f007/world.rs"
find = '''
            second_chance: world.second_chance(),'''
replace = '''
            second_chance: 0,'''

[[mutation]]
name = "probe-delivers-the-broadcast-both-times"
description = "The seeded probe of the broadcast path delivers the broadcast in both of its runs: nothing is withheld and nothing changes, so the mechanism check must fail."
expect = ["control_ctx"]
file = "bins/ptr-bench/src/experiments/f007/arms.rs"
find = '''
        let (mut on, mut off) = (make(true), make(false));
'''
replace = '''
        let (mut on, mut off) = (make(true), make(true));
'''

[[mutation]]
name = "arm-state-leaks-into-the-first-draft"
description = "The first draft is proposed by the Pod the arm's router chose instead of the shared first-draft Pod: the arm's scorer and the router's nonce sequence reach round 0, so the arms no longer start from one candidate."
expect = ["control_first_draft"]
file = "bins/ptr-bench/src/experiments/f007/world.rs"
find = '''
        if call.round == 0 && self.bank.shared_first_draft {
            call.pod = &first_draft;
        }'''
replace = '''
        if call.round == 0 && self.bank.shared_first_draft && false {
            call.pod = &first_draft;
        }'''

[[mutation]]
name = "edge-test-never-fires"
description = "The grid-edge test requires a lower bound above 10^12: it can never flag, so a narrow grid would pass; its sensitivity check against the worst candidate must fail."
expect = ["control_grid_edge"]
file = "bins/ptr-bench/src/experiments/f007/learn.rs"
find = '''
        comparison.difference_lcb > 0.0,
        comparison.difference,'''
replace = '''
        comparison.difference_lcb > 1.0e12,
        comparison.difference,'''

[[mutation]]
name = "edge-test-uses-a-huge-z"
description = "The grid-edge test requires the edge gain to exceed 100 paired standard errors instead of 3 (the library caps its quantile at 6, so the multiplier is applied to the standard error): it is blind to everything but enormous gaps; its sensitivity check against the worst candidate must fail."
expect = ["control_grid_edge"]
file = "bins/ptr-bench/src/experiments/f007/learn.rs"
find = '''
        comparison.difference_lcb > 0.0,'''
replace = '''
        comparison.difference - 100.0 * comparison.difference_se > 0.0,'''
