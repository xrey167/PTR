# Defects the F007 harness must detect; run with `python scripts/mutation_check.py F007` (`--check` verifies the
# anchors only). Each `find` must occur exactly once in its file (checked by `--check`), so the list cannot drift
# from the code silently. `expect` names the counters that show the defect: a run that fails only on others does
# not count as detecting it.
#
# Product mutations plant defects in `ptr-verifier` (the real verifiers), `ptr-router` (classify and the finding
# router) and `ptr-runtime` (the loop and its budget meter). Harness mutations plant defects in F007's own
# bookkeeping (the boundary around the verifier, the lane's outcome mapping, L3 attribution) and in the
# parts of the design that make the controls meaningful (the shuffled map, the null world, the gate, the
# broadcast, the workspace ablation, the request stream, the budget, the roster). Every falsifier counter (13),
# every control counter (10), the coverage shortfall counter and each of the five per-rule coverage counters is expected
# by at least one mutation, so that `killed == total` also shows each of them can fire and which rule fired (a test in
# bins/ptr-bench checks the lists).
#
# The statistical rules of aggregate.py (the margin against each baseline, the null-world equivalence interval,
# the sensitivity control's interval) are not harness counters: they are held by the aggregator's unit tests
# (scripts/tests/test_f007_aggregate.py), which build results that break each rule in turn. The per-seed
# controls above are the harness-side restatement of those intervals at looser, point-estimate thresholds, so
# a mutation that removes what a control stands for kills here too.
#
# The statistical rules of the aggregator are mutation-checked by tests/mutate_aggregator.py (aggregator-mutations.json).
#
# The mutation run is invoked as `ptr-bench vcw-loop <requests> <seed>` at a reduced scale (no evidence;
# the result says "scale":"custom"), on a pilot seed.

package = "ptr-bench"
features = ""
subcommand = "vcw-loop"
cases = 1000
seed = 1011
hard_counters = [
    "false_accepts",
    "unverified_returns",
    "double_verifications",
    "budget_violations",
    "routing_outside_admissible",
    "verdict_mismatches",
    "verdict_overrides",
    "verifier_call_mismatches",
    "calls_after_acceptance",
    "l3_unadmitted",
    "loop_errors",
    "product_panics",
    "exhausted_as_success",
    "control_shuffled",
    "control_null",
    "control_baseline",
    "control_workspace",
    "control_ctx",
    "coverage_unmet",
    "coverage_unmet_kind_share",
    "coverage_unmet_hard_events",
    "coverage_unmet_repairs",
    "coverage_unmet_exhausted",
    "coverage_unmet_births",
    "control_training",
    "control_grid_edge",
    "control_oracle",
    "control_bon",
    "control_l3",
    "control_first_draft",
]

[[mutation]]
name = "verifier-accepts-any-integer"
description = "ArithmeticVerifier passes any candidate whose denominator equals the task's, i.e. any integer: a wrong answer is accepted."
expect = ["false_accepts", "verdict_mismatches"]
file = "crates/ptr-verifier/src/arithmetic.rs"
find = '''
            Ok(claimed) if claimed == expected => report(VerificationStatus::Pass, Vec::new()),
'''
replace = '''
            Ok(claimed) if claimed.den == expected.den => report(VerificationStatus::Pass, Vec::new()),
'''

[[mutation]]
name = "missing-property-reported-as-another-code"
description = "JsonSchemaVerifier names a missing required property json.length: the finding is not the defect that was planted."
expect = ["verdict_mismatches"]
file = "crates/ptr-verifier/src/json_schema.rs"
find = '''
                    out.push(
                        "json.required",
                        pointer,
                        format!("missing required property {name:?}"),'''
replace = '''
                    out.push(
                        "json.length",
                        pointer,
                        format!("missing required property {name:?}"),'''

[[mutation]]
name = "classify-accepts-a-single-finding-fail"
description = "classify returns Accept for a Fail with exactly one finding; the loop's cross-check against Candidate::passes then disagrees."
expect = ["loop_errors", "false_accepts"]
file = "crates/ptr-router/src/findings.rs"
find = '''
        VerificationStatus::Pass => ReportClass::Accept(Accepted(())),
'''
replace = '''
        VerificationStatus::Pass => ReportClass::Accept(Accepted(())),
        VerificationStatus::Fail if report.findings.len() == 1 => ReportClass::Accept(Accepted(())),
'''

[[mutation]]
name = "repair-routed-outside-the-registry"
description = "The finding router draws the Pod for a repair code from the proposers instead of the registry's repair Pods for that code."
expect = ["routing_outside_admissible"]
file = "crates/ptr-router/src/findings.rs"
find = '''
                    let registered = self.registry.repair_pods(&code);
'''
replace = '''
                    let registered = self.registry.proposers();
'''

[[mutation]]
name = "verifier-budget-off-by-one"
description = "The meter allows one verifier call more than the budget, and the stop after a verdict waits for it."
expect = ["budget_violations"]
file = "crates/ptr-runtime/src/vcw/budget.rs"
find = '''
        if self.used.verifier_calls >= self.budget.verifier_calls.get() {
            return Err(ExhaustionReason::VerifierCalls);
        }
        self.used.verifier_calls += 1;'''
replace = '''
        if self.used.verifier_calls > self.budget.verifier_calls.get() {
            return Err(ExhaustionReason::VerifierCalls);
        }
        self.used.verifier_calls += 1;'''

[[mutation.also]]
file = "crates/ptr-runtime/src/vcw/budget.rs"
find = '''
        if self.used.verifier_calls >= self.budget.verifier_calls.get() {
            Some(ExhaustionReason::VerifierCalls)'''
replace = '''
        if self.used.verifier_calls > self.budget.verifier_calls.get() {
            Some(ExhaustionReason::VerifierCalls)'''

[[mutation]]
name = "meter-does-not-charge-the-call"
description = "The meter counts a verifier call as zero: the loop's claimed calls differ from the boundary's."
expect = ["verifier_call_mismatches"]
file = "crates/ptr-runtime/src/vcw/budget.rs"
find = '''
        self.used.verifier_calls += 1;
        Ok(())'''
replace = '''
        self.used.verifier_calls += 0;
        Ok(())'''

[[mutation]]
name = "candidate-verified-twice"
description = "The loop calls the verifier twice on every candidate and keeps the second report."
expect = ["double_verifications"]
file = "crates/ptr-runtime/src/vcw/closed_loop.rs"
find = '''
        let verdict = catch_unwind(AssertUnwindSafe(|| session.verifier.verify(value)));
'''
replace = '''
        let verdict = catch_unwind(AssertUnwindSafe(|| {
            let _ = session.verifier.verify(value);
            session.verifier.verify(value)
        }));
'''

[[mutation]]
name = "accepted-candidate-is-refused"
description = "A Pass from the verifier is not accepted: the author is treated as no longer eligible and the loop draws a fresh proposal."
expect = ["verdict_overrides", "calls_after_acceptance"]
file = "crates/ptr-runtime/src/vcw/closed_loop.rs"
find = '''
                if judged.authors_eligible {
'''
replace = '''
                if judged.authors_eligible && false {
'''

[[mutation]]
name = "loop-panics"
description = "VcwLoop::run panics on every 97th request."
expect = ["product_panics"]
file = "crates/ptr-runtime/src/vcw/closed_loop.rs"
find = '''
        self.counters.requests = self.counters.requests.saturating_add(1);
        let unroutable_before'''
replace = '''
        self.counters.requests = self.counters.requests.saturating_add(1);
        if self.counters.requests % 97 == 0 {
            panic!("injected");
        }
        let unroutable_before'''

[[mutation]]
name = "boundary-drops-accepted-calls"
description = "The harness boundary around the verifier does not log a call that passes: a returned candidate no logged call accepted."
expect = ["unverified_returns"]
file = "bins/ptr-bench/src/experiments/f007/task.rs"
find = '''
        let report = self.report_for(&candidate.render());
        self.events.borrow_mut().push(VerifyEvent {'''
replace = '''
        let report = self.report_for(&candidate.render());
        if report.status == VerificationStatus::Pass {
            return report;
        }
        self.events.borrow_mut().push(VerifyEvent {'''

