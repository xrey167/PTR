expect = ["control_shuffled"]
file = "bins/ptr-bench/src/experiments/f007/world.rs"
find = '''
                    let target = if mode == RegistryMode::Shuffled {
                        role.shifted()
                    } else {
                        role
                    };'''
replace = '''
                    let target = role;'''

[[mutation]]
name = "null-world-is-heterogeneous"
