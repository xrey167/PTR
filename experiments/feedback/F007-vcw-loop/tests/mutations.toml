[100, 200, 400, 800, 1600, 3200, 6400, 12800, 25600]'''

[[mutation]]
name = "gate-is-never-promoted"
description = "The gate (and best-of-N's proposers) is never promoted: the baselines silently fall back to uniform routing."
expect = ["control_training"]
file = "bins/ptr-bench/src/experiments/f007/learn.rs"
find = '''
    let promoted = log_c.len() >= rule.min_records
'''
replace = '''
