version = 1
id = "F004"
status = "planned"
hypothesis = "[GPU; needs OLMoE-class Pods, the L2 router and the verifier fabric; the loop mechanism itself is F001] End to end, does a verifier-closed Pod-MoE (doc 37 section 11: every L2 expert output is a typed proposal accepted only through the verifier fabric with Pass, no hard finding and the required level; verifier findings are broadcast to all Pods and are the primary routing signal; learned critics advisory only; per-request verifier-call and round budgets; Exhausted instead of best-effort) solve more verifiable tasks per verifier call and per unit of compute than (a) a standard learned-gate MoE of the same total and active parameters and (b) a single generator with self-refinement, at matched compute, while keeping false accepts at exactly 0?"
metrics = "verified success rate; verifier calls per solved task; false accepts (hard counter, must be 0); unverified returns (0); budget violations (0); wall-clock latency and tokens per solved task; Exhausted rate; success on out-of-distribution task mixes; paired differences over seeds"
baseline = "standard learned-gate MoE with the same total and active parameters and no verifier loop (accept the first output); BEST-OF-N sampling from the same MoE filtered by the same verifier fabric at the same number of verifier calls and the same FLOPs (so that access to the verifier alone cannot win the claim); single generator with self-refinement under the same verifier-call and token budget; the verifier-closed loop with a generic router (no finding routing); a verifier-conditioned bandit model router in the style of ORACLE (arXiv:2607.22465) over the same Pods, so that routing from verifier verdicts alone cannot win the claim"
falsification = "Falsified if the verifier-closed arm does not beat ALL FIVE baselines (standard MoE, best-of-N with the same verifier at matched verifier calls and FLOPs, self-refinement, the loop with a generic router, and the ORACLE-style bandit router) on verified success at matched compute (FLOPs, verifier calls) by a pinned margin with a one-sided 95% paired bound over at least 5 seeds (the best-of-N comparison is the one that isolates the loop from the verifier), or if false_accepts, unverified_returns or budget_violations is above 0 in any seed (hard counters), or if matched-compute accounting differs beyond the pinned tolerance (invalid). F001 already shows the loop mechanism with a seeded stub (no model claim); this experiment makes the model claim."
hardware_profile = "hardware/rtx3090.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
