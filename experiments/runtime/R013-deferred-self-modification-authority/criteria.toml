# R013 decision criteria. Frozen with the preregistration (config.toml names this file and its SHA-256);
# no rule changes after a run. They are what the harness itself judges (bins/ptr-bench,
# r013/metrics.rs coverage() and falsifiers()); a harness test pins this file to those lists, in order, and every
# counter named resolves in the harness's JSON.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .
# A token is an integer literal iff it matches -?[0-9]+ (a decimal point makes it a reference and so a
# parse error: no decimal literal exists).
# Any other token is a reference: a path of object keys from the root of the harness's single JSON result
# object, separated by '.' (no key holds a '.', no array is indexed): "product_panics" is a top-level key and
# "revoke_while_retired_cases.input" the member of an object.
# A reference that is missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule).
# A reference compared with an integer literal or another reference must be a JSON integer (not a
# boolean, not a float). Exact comparisons.
# The manifest's "< N" prerequisites are written ">= N" and its "> 0" violations "<= 0".
#
# Every coverage counter is read from a cell the run executed (an attempt that reached the runtime boundary and met the
# expected typed refusal or was let through, a positive control the runtime accepted, a cell that probed its descendants);
# none is read from configuration. The thresholds are the plan's structural lower bound for one seed (every cell of the
# plan runs once per seed), so they hold by construction of the plan when the harness completes: they are what keeps a
# harness that skipped a cell from passing, not a measurement of the product. The measured part is the falsifiers.
# The controls are not rules: a positive control the runtime refuses ends the run with status 2.
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies R013 on that seed.
# Decision: every seed must hold every coverage rule and every falsifier rule; COMPLETED iff so (and the mutation
# evidence counts every mutation of the plan killed), INVALID if a seed is missing, unresolvable, or its record does not
# describe the frozen run, FALSIFIED otherwise.
