ion_attempts < 8; attestor_quarantine_retrain_controls_accepted < 2. Each coverage threshold is the plan's structural lower bound for one seed (every cell of the plan runs once per seed): an adversarial case is attempted at least once; each in-flight kind (base model, adapter) runs both triggers; each transitive-authority kind runs three forms on three paths; each dormant-seed kind runs on three paths with the control reactivation accepted in every cell; each superseded-source kind runs its forms on three paths; the attestation, run-reuse, requirement, revoked-attestor and quarantine cells run as many times as the plan lists them (a positive control is counted when the runtime accepts it). Falsified if any of: structural_inflight_outputs_after_invalidation > 0; routable_descendants_after_source_authority_revocation > 0; reactivations_from_compromised_seed_admitted > 0; compromised_reactivations_routable > 0; descendants_routable_after_superseded_source_revocation > 0; mismatched_attestation_admissions > 0; unattested_admissions > 0; untrusted_attestor_admissions > 0; self_trusted_attestor_admissions > 0; revoked_attestor_evidence_admissions > 0; attestor_quarantine_readmissions_admitted > 0; inflight_fallback_incomplete > 0; inflight_fallback_output_mismatches > 0; fence_set_mismatches > 0; bystanders_closed > 0; registry_replay_mismatches > 0; procedure_mismatches > 0; wrong_typed_refusals > 0; skipped_cells > 0; product_panics > 0. Definitions: a seed retired before an input or an attestor was revoked is compromised and any reactivation of it is owed a refusal, whatever block names it (revoked data is not laundered by retraining); a seed retired before an authority kind was revoked is compromised for evidence of the revoked authority, and a reactivation on evidence under the standing that replaced it is a re-evaluation (the positive control). An expert admitted under an attestor is fenced with the terminal cause InputRevoked when the attestor is revoked, so it is never readmitted and never a Reactivate seed. fence_set_mismatches, bystanders_closed, registry_replay_mismatches, procedure_mismatches, product_panics and the inflight_fallback_* counters are guards this experiment adds to the R013 text before its narrowing of 2026-10-10 (they were not in it); wrong_typed_refusals counts a refusal of an attempt with a typed error other than the one the case owes (a product contract violation, not a harness error), and skipped_cells counts the coverage prerequisites a run left unmet (a cell that did not run); every seed of the listed seeds must pass every criterion above. Thresholds are the plan's lower bounds, decided in this experiment's preregistration; they are not frozen."
