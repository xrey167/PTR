[[mutation]]
name = "live-attestor-registration-under-a-forged-gate-grant"
description = "The pre-review product: a live runtime registers an attestor key under any gate fence grant that revalidates, and a caller holding an admission grant assembles one from its binding: its own key becomes trusted and its self-signed attestation is admitted."
expect = ["self_trusted_attestor_admissions"]
file = "crates/ptr-runtime/src/expert/attestation.rs"
find = '''
    /// The attestor keys this runtime trusts.
'''
replace = '''
    pub fn register_expert_attestor(
        &mut self,
        grant: &super::ExpertFenceGrant,
        attestor: &str,
        epoch: Generation,
        key: VerifyingKey,
    ) -> Result<(), RuntimeError> {
        self.revalidate_grant(super::ExpertGrantKind::Gate, grant.binding())?;
        self.attestors
            .register(attestor, epoch, key)
            .map_err(RuntimeError::Expert)
    }

    /// The attestor keys this runtime trusts.
'''

