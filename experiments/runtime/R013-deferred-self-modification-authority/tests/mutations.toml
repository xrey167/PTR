# Defects the R013 harness must detect; run with `python scripts/mutation_check.py R013`
# (`--check` verifies the anchors only). Each `find` must occur exactly once in its file (checked
# by `--check`), so the list cannot drift from the code silently. `expect` names the hard counters
# that show the defect: a run that fails only on others does not count as detecting it.
#
# The product mutations remove one mechanism each from `ptr-runtime`: the inherited-input check of an
# admission, the stale-evidence check of the gate configuration and of the evaluator, the dependency walk
# of the route probe, the epoch condition and the source-edge closure of the fence sets (and a fence set
# that takes every dependent), the expert dependency of the KV liveness oracle, the marker and the digest
# reset of a restarted session, the artifact, proposal and base-model bindings of an attestation at admission, the
# signature check and the registry check of an attestation (a self-invented attestor), the replay-time re-check of a
# recorded attestation, the live registration of an attestor key under a forged gate grant (the pre-review product), the single use of a run id (in any role, at any generation), the requirement of attestation
# and its recording, the liveness check of an attestor, the cause check of a readmission and plant a panic. The
# harness mutations plant defects in the harness itself (a replay that drops the last event, a pin compared with the
# wrong constant, a case family that skips a cell) to show that its bookkeeping is not vacuous. The binding mutations
# that remove only the admission-time check are killed by `wrong_typed_refusals`: the replay-time check still
# refuses the attempt, with a different typed error than the one the case owes, which is a contract violation of the
# product. Every hard counter is expected by at least one mutation, so that `killed == total` also shows each of the
# twenty can fire (a test in bins/ptr-bench checks this list against the harness).
#
# Not listed, on purpose, because the harness cannot or need not see them: a raw ledger writer; the scope of the
# requirement to artifact-producing operations (a positive control that is refused ends the run with status 2, which
# is no kill by definition); the reserved-prefix refusal of an unconsumed `run:` input on the plain path (the crate
# tests in crates/ptr-runtime/tests/expert_attestation.rs hold it).
#
# The mutation run is invoked as `ptr-bench self-modification-authority 1 1001`: the same plan as a seed's, at a seed
# that is not one of the experiment's, flagged `custom` and so no evidence.

package = "ptr-bench"
features = ""
subcommand = "self-modification-authority"
cases = 1
seed = 1001
hard_counters = [
    "structural_inflight_outputs_after_invalidation",
    "routable_descendants_after_source_authority_revocation",
    "reactivations_from_compromised_seed_admitted",
    "compromised_reactivations_routable",
    "descendants_routable_after_superseded_source_revocation",
    "mismatched_attestation_admissions",
    "unattested_admissions",
    "untrusted_attestor_admissions",
    "self_trusted_attestor_admissions",
    "revoked_attestor_evidence_admissions",
    "attestor_quarantine_readmissions_admitted",
    "inflight_fallback_incomplete",
    "inflight_fallback_output_mismatches",
    "fence_set_mismatches",
    "bystanders_closed",
    "registry_replay_mismatches",
    "procedure_mismatches",
    "wrong_typed_refusals",
    "skipped_cells",
    "product_panics",
]

