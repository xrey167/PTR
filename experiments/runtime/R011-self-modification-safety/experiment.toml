hypothesis = "narrowed on 2026-10-08 by owner decision to the core that is built and measured here; the deferred mechanisms moved to the successor R013 (attestors, trusted evaluators and attested manifests, single-use run ids, Birth with a source expert and upcycling, multi-cause readmission with ReadmissionRequest, ExpertQuarantineRetired and QuarantineFailed, hard-deny verifiers and verifier-set epochs, Split per-result gating and provenance references for Freeze, Prune and Retire). Structural proposals from the meta-level policy can only take effect through the gate evaluation embedded in the commit record and a ledger-committed event; no path lets a proposal alter the gate configuration, thresholds or the embedded gate evaluation: these are immutable to proposals, even when a proposal is committed and gate-approved; evaluated on a pinned adversarial proposal suite in which every case is actually attempted, through the public PtrRuntime API on a durable FileLedger. Stated definitions (owner decisions 2026-10-08, limits of the claim): (a) event mapping: ExpertPromoted = Birth, ExpertRetired = the Retire operation, ExpertFenced and ExpertReadmitted = the fence actions Fence and Readmit (no new event names); (b) verifier := the gate evaluation embedded in the commit record (BoundGateReport), hard-deny verifiers are out; (c) direct append := the public PtrRuntime API, with explicitly NO protection against a raw ledger writer (the grant is not recorded in the ledger and the report digest is unkeyed); (d) route := the use-time admission check expert_route_admission, no real MoE router is claimed; (e) input digest: the first committed use (a commit record's dependency block naming identity, generation and digest) fixes the digest in the dependency index, a later use with another digest is stale, and only InputInvalidated(Superseded{new_digest}) moves it forward. Claims: gate-driven structural events (ExpertPromoted, ExpertRetired, Merge, Split, Prune, Freeze, Reactivate) are compare-and-set on the evaluated generation and digest of every operand (all Merge sources, all Prune targets), so a commit against a stale generation or digest is rejected (Birth has no operand: its stale-generation analogue is an occupied result pod or slot and its stale-digest analogue is an artifact digest differing from the result manifest digest); the embedded gate evidence is bound to the exact proposal (proposal_id), to the artifact digest, to the base model and to the eval manifest and gate configuration of its own evaluation, through one shared evidence-admission function used by admission and by ExpertReadmitted (replay can re-check only the artifact and base-model binding, not the eval manifest, because the host grant is not stored); at commit the runtime revalidates the proposer's session (unexpired, unrevoked), the identity policy and the peer, and the issuing grant generation (an in-memory host authority, not replayable), so a race between the early identity check and the commit rejects typed (races are sequenced interleavings in a single-writer runtime, not threads); admission binds ProposerRef and project to the authenticated grant (same-project and cross-project impersonation); a separate ExpertFenced fence (own runtime grant, never issuable by an L3 policy or by a Gate grant, no gate pass required) removes an expert from routing at all times, including after a fault, restart, replay or compaction; a revocation-driven retirement (fence action Retire) moves Fenced(InputRevoked) to Retired(InputRevoked) under the same runtime grant, is not gate-driven and is the only exception to the rule that a retirement without a gate grant fails; a gate-driven Retire of a Fenced operand and a Reactivate from Retired(InputRevoked) are rejected typed; revocation or supersession of a generation-bearing input is one compound ledger event, InputInvalidated (tag 30), carrying the invalidation kind (Revoked | Superseded{old_generation, new_generation, new_digest, replacement_ref}), the immutable generation and binding digest, and a fence-set commitment of count and digest (no per-expert list), so there is no window between revocation and fence: the fence set is derived deterministically from the dependency index as of the event's commit index (training and evaluation inputs, base model, adapter, and the transitive closure over Merge, Split and Reactivate source edges), applied atomically, recomputed on replay with a refusal on any count or digest mismatch; the crash between revoke and fence is modelled as a runtime dropped after the append and reopened with open_durable; a commit is rejected if any recorded input of its dependency block is revoked, superseded or carries a stale digest at the commit anchor (training and evaluation inputs alike), and a post-promotion revocation or supersession fences the dependent experts; expert_route_admission (registry state, no fence, all recorded dependencies live) is the only route predicate and no served or probed route reaches a fenced expert; every in-flight L1 (ExpertLevel::Token) or L2 (ExpertLevel::Segment) call of a fenced expert on the R010 KvSession is cancelled or dropped by completion-time admission so no output escapes, and the replacement path completes with the reference output; a planned succession (a Merge, Split or retired-target Reactivate retiring its own sources) does not fence its own results, while an independent later invalidation of an inherited source still propagates, and the result-identity compare-and-set permits takeover only from an operand of the same operation; an authority epoch for the gate configuration and the evaluator identity (tag 31, ExpertAuthorityChanged: Revoke | TighteningRotation | NonTightening) makes evidence from a superseded epoch fail at commit, fences already-promoted experts of a revoked or tightened epoch with an AuthorityQuarantine cause, leaves them routable under a non-tightening rotation, and allows readmission at the same generation only through the gated ExpertReadmitted under the current epoch; positive controls: a well-formed event with the trusted grant and a current generation is accepted on every path."
