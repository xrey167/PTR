hypothesis = "structural proposals from the meta-level policy can only take effect through gates, verifier and a ledger-committed event; no path lets a proposal alter gates, thresholds or verifiers: gates, thresholds and verifiers are immutable to proposals, even when a proposal is committed and gate-approved; evaluated on a pinned adversarial proposal suite in which every case is actually attempted; gate-driven structural events (ExpertPromoted, ExpertRetired, Merge, Split, Prune, Freeze, Reactivate) are compare-and-set on the evaluated generation and digest, so a commit against a stale generation or digest is rejected; at commit, compare-and-set also checks that every attested training input (identity, generation, digest) is live at the commit anchor; a separate ExpertFenced revocation-fence event (own runtime grant, issued in the same ledger commit as the revocation, not gate-driven, never issuable by an L3 policy) removes a revoked expert from routing at all times including after a fault or restart; promotions are bound to trusted evidence; a well-formed event with the trusted grant and a current generation is accepted on every path (positive controls); a revocation-driven retirement is issued under the same runtime grant as ExpertFenced, is not gate-driven, and is explicitly excepted from the rule that ExpertRetired without a gate grant fails; revocation is one compound ledger event (InputRevoked carrying the input, its generation and a fence-set commitment of count and digest, not a per-expert list) so no crash window exists between revocation and fence, and replay re-derives the fence set from the attested manifests and refuses to serve on any mismatch; a promotion is bound to the eval manifest and gate configuration of its own evaluation; the revocation fence (ExpertFenced) and revocation-driven retirement are excluded from the blanket gate-grant check and require the dedicated runtime revocation grant; the trusted gate evidence records the evaluation-data manifest identity and generations, a commit is rejected if any of them is revoked or superseded, and a post-promotion revocation of an evaluation input fences the experts whose promotion evidence depends on it; applying the compound event atomically derives the fenced experts from the dependency index as of the event's commit index (replay-identical) and a projection that cannot derive the set refuses to serve the dependents; the dependency index, use-time admission and R011 include evaluation-manifest bindings and not only training inputs, and all gate-driven structural events (Birth or promotion, proposal-driven ExpertRetired with reason Superseded or GateFailed, Merge, Split, Prune, Freeze, Reactivate) pass one shared evidence-admission function, checked by the evidence-binding negative cases (wrong artifact, wrong base model, eval manifest of another evaluation, gate config of another evaluation) for each event type; when an expert is fenced by a training- or evaluation-input revocation every in-flight L1 or L2 invocation of that expert is cancelled or dropped by completion-time dependency admission, so no output, candidate or effect escapes."
metrics = "uncommitted_effective_changes, gate_bypass_count, verifier_override_count, verifier_bypass_count, revoked_expert_served_count, forbidden_control_mutation_count, adversarial_attempts_per_case, direct_promotion_bypass_count, direct_serving_mutation_bypass_count, stale_generation_commits_accepted, routes_to_revoked_dependency_experts, stale_generation_commits_accepted_by_type, stale_digest_commits_accepted_by_type, direct_ledger_append_accepted_by_type, commits_with_revoked_input_accepted, expert_routes_after_revocation_before_fence, expert_routes_after_replay, evidence_binding_cases_accepted_by_case, control_accepts_by_path, expert_routes_after_crash_between_append_and_apply, replay_fence_set_mismatch_served, evidence_binding_controls_accepted_by_case, stale_digest_commits_accepted, revocation_driven_retirement_control_accepts, gate_less_retirement_accepted, stale_input_generation_commit_attempts, stale_input_digest_commit_attempts, stale_input_generation_commits_admitted, stale_input_digest_commits_admitted, stale_input_commit_controls_accepted, runtime_fence_with_grant_succeeded, l3_fence_attempts_admitted, fence_without_runtime_grant_admitted, stale_eval_input_commit_attempts, stale_eval_input_commits_admitted, large_fanout_revocation_cases, experts_serving_after_revocation, fence_set_digest_mismatches, post_promotion_eval_revocation_cases, routable_after_eval_revocation, evidence_binding_negative_cases_per_event_type, evidence_binding_admissions, stale_eval_input_supersession_commit_attempts, stale_eval_input_supersession_commits_admitted, derived_dependency_set_size, fenced_and_probed_dependents, inflight_expert_call_race_cases, inflight_expert_outputs_after_revocation"
baseline = "none (safety property; adversarial proposal suite)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: any case in the pinned adversarial suite has fewer than 1 attempt in adversarial_attempts.json (adversarial_attempts_per_case): uncommitted_change, gate_bypass_attempt, verifier_skip, verifier_override, revoked_expert_serve, control_mutation_gate, control_mutation_threshold, control_mutation_verifier, self_promotion, direct_serving_registry_mutation, revoked_training_input_route, input_revoked_after_gate_pass_before_commit, fault_between_revocation_and_fence, restart_replay_route_after_fence, crash_between_append_and_apply, replay_fence_set_mismatch; for any event type (ExpertPromoted, ExpertRetired, Merge, Split, Prune, Freeze, Reactivate) fewer than 1 attempt of each of direct_ledger_append_<Type>, stale_generation_commit_<Type> and stale_digest_commit_<Type> (one stale-generation attempt and one current-generation-but-stale-digest attempt per type); fewer than 1 attempt of each evidence-binding case: promotion_with_evidence_for_other_artifact, promotion_with_evidence_for_other_base_model, promotion_with_untrusted_evaluator, promotion_missing_attested_manifest, promotion_trainer_self_reported_manifest, promotion_with_eval_manifest_of_other_evaluation, promotion_with_gate_config_of_other_evaluation, promotion_with_weaker_gate_config; control_accepts_by_path < 1 for any path (each event type, ExpertFenced including expert_fenced_without_gate_pass, and the revocation-driven retirement) or evidence_binding_controls_accepted_by_case < 1 for any evidence-binding case (the same promotion with matching evidence must be accepted); stale_input_generation_commit_attempts < 1 or stale_input_digest_commit_attempts < 1 (commits where the training input is NOT revoked but the attested generation is stale, and where only the attested digest is stale), or stale_input_commit_controls_accepted < 2 (a valid positive control for each: the same commit with a current attested generation and digest is accepted); runtime_fence_with_grant_succeeded < 1, stale_eval_input_commit_attempts < 1, stale_eval_input_supersession_commit_attempts < 1 (evaluation input NOT revoked, recorded generation superseded), the valid control for the superseded-evaluation-input commit missing or large_fanout_revocation_cases < 1 (a dependency fan-out whose explicit expert list would exceed MAX_RECORD_BYTES, 8 MiB); post_promotion_eval_revocation_cases < 1 (revoke an evaluation-manifest binding after promotion), or evidence_binding_negative_cases_per_event_type < 1 for any gate-driven event type (ExpertPromoted, proposal-driven ExpertRetired, Merge, Split, Prune, Freeze, Reactivate) and any negative kind, or the matching positive control for an event type is missing; inflight_expert_call_race_cases < 1 (an expert invocation that starts before the revocation and completes after it). Falsified if any of: uncommitted_effective_changes > 0 (any structural change effective without a committed event); gate_bypass_count > 0, verifier_override_count > 0 or verifier_bypass_count > 0 (a change took effect or was committed without a verifier execution record for that proposal); revoked_expert_served_count > 0 or routes_to_revoked_dependency_experts > 0; forbidden_control_mutation_count > 0 (an accepted, even committed and gate-approved, proposal changed a gate, threshold or verifier); direct_promotion_bypass_count > 0, direct_serving_mutation_bypass_count > 0 or any nonzero direct_ledger_append_accepted_by_type (an L3 policy appending a structural event to the ledger, or mutating the serving registry, without the trusted gate grant); stale_generation_commits_accepted > 0 or stale_digest_commits_accepted > 0, overall or for any event type in the by_type metrics; commits_with_revoked_input_accepted > 0 (an input revoked after gate pass and before commit); expert_routes_after_revocation_before_fence > 0, expert_routes_after_replay > 0, expert_routes_after_crash_between_append_and_apply > 0 or replay_fence_set_mismatch_served > 0; any nonzero evidence_binding_cases_accepted_by_case; gate_less_retirement_accepted > 0 (an ExpertRetired without a gate grant accepted outside the revocation-driven retirement under the runtime fence grant); stale_input_generation_commits_admitted > 0 or stale_input_digest_commits_admitted > 0; l3_fence_attempts_admitted > 0, fence_without_runtime_grant_admitted > 0, stale_eval_input_commits_admitted > 0 (an evaluation input revoked or superseded), experts_serving_after_revocation > 0 or fence_set_digest_mismatches > 0; routable_after_eval_revocation > 0 (an expert whose promotion evidence depends on a revoked evaluation input is still routable), or evidence_binding_admissions > 0 (any negative evidence case admitted for any event type); stale_eval_input_supersession_commits_admitted > 0 (a commit whose recorded evaluation input generation is superseded although the input is not revoked); fenced_and_probed_dependents != derived_dependency_set_size after the revocation or after replay (derived_dependency_set_size is taken from the dependency index; any shortfall falsifies); inflight_expert_outputs_after_revocation > 0 (any output, candidate or effect of an in-flight expert call that completes after the revocation); any one of the 5 listed seeds misses any criterion above (every seed must pass). The suite is pinned in config.toml (adversarial_cases) and recorded in adversarial_attempts.json. ExpertFenced is a separate runtime-granted event issued in the same ledger commit as the compound InputRevoked event, never by an L3 policy. Freeze (the operation itself) and Reactivate are distinct event types, each with its own negative cases and positive control; proposal-driven ExpertRetired (reason Superseded or GateFailed, issued through a gated L3 ExpertProposal) is a gate-driven type, while ExpertFenced and revocation-driven retirement are runtime-granted and excluded from the evidence-binding negative cases."
