version = 1
id = "R009"
status = "planned"
hypothesis = "with per-layer chain keys, layers below a LoRA's first adapted layer share base KV pages bit-identically, and aLoRA prefixes reuse base KV exactly, evaluated on at least one configuration with 0 < f < L (pinned f = L/2); configurations with f = 0 alone cannot pass; the predicted sharing fraction is per adapter type: a QKV-LoRA first attached at layer f shares f/L, a Q-only or MLP-only adapter at f shares (f+1)/L, and an aLoRA shares all full pre-invocation pages plus the pre-invocation rows of the boundary page; the pinned run covers QKV-LoRA, Q-only, MLP-only and aLoRA, with QKV-LoRA and Q-only each run at f = L/2 and at f = 0, including an aLoRA whose invocation point lies inside a 16-token page (offset 7); the adapter request's logits are bit-identical to a full adapter prefill; the claim is a KV-memory saving only (a forward-compute saving would need a layer-boundary residual cache, which is out of scope, so no prefill-FLOPs claim is made); chain keys isolate adapters and generations (adapter A's entry is never hit by adapter B, nor an old generation by the new one); semantic-input lineage is enforced; the bitwise claims use seeded random weights with a pinned seed and shape; lagging or lost invalidation and restore or restart never expose stale entries; dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (adapter generations and semantic inputs)."
metrics = "shared_row_fraction, predicted_shared_row_fraction, bitwise_mismatch_count, base_pages_dropped_on_revoke, alora_prefix_reuse_attempts, adapter_revocations_performed_by_type, adapter_reuse_attempts_by_type, revoked_adapter_entry_hits, post_revocation_lookups_on_adapter_entries, alora_boundary_page_cases, base_pages_before_revoke, adapter_entries_before_revocation, adapter_logits_bitwise_mismatch_count, cross_adapter_attempts, input_revocations_performed, post_revocation_lookups_matching_tokens, revoked_lineage_entry_hits, same_tokens_different_generation_cases, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits, stale_eligible_entries_before_event, post_event_lookups_on_stale_eligible_entries, shared_kv_rows, total_kv_rows, old_generation_as_new_attempts, cross_adapter_hits, old_generation_hits, restored_pre_revocation_entries, empty_restart_arm, inflight_adapter_revocation_race_cases, outputs_after_adapter_revocation, inflight_input_race_cases, outputs_after_input_invalidation, selection_digest_mismatches, procedure_mismatches, inflight_adapter_requests_cancelled, inflight_adapter_requests_restarted_from_fresh_prefill, adapter_restart_output_mismatches"
baseline = "whole-cache adapter binding (no sharing)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: the pinned 0 < f < L configuration (f = L/2) is not evaluated, or any pinned adapter type or configuration is missing (QKV-LoRA and Q-only at f = L/2 and at f = 0, MLP-only at f = L/2, aLoRA at the pinned invocation position); alora_prefix_reuse_attempts < 1 or alora_boundary_page_cases < 1 (an aLoRA case with the invocation point inside a 16-token page, offset 7); adapter_revocations_performed_by_type < 1 or adapter_reuse_attempts_by_type < 1 for any pinned adapter type; post_revocation_lookups_on_adapter_entries < 1 (lookups attempted after the revocation); base_pages_before_revoke < 1 or adapter_entries_before_revocation < 1; cross_adapter_attempts < 1 (adapter A's entry requested under a different adapter id at the same generation) or old_generation_as_new_attempts < 1 (the same adapter id with an older generation presented as current); input_revocations_performed < 1, post_revocation_lookups_matching_tokens < 1 (on entries whose lineage includes the revoked segment) or same_tokens_different_generation_cases < 1 (same tokens, different segment generation or content_digest); invalidation_suppressed_arms < 1, restore_arms < 1, restored_pre_revocation_entries < 1 (the restored pre-revocation entry must be observed in the catalog before the post-event lookup), stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the arm where an actual pre-revocation entry (snapshot or tier object) is restored into the catalog must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1; a plain runtime restart is the separate reported arm empty_restart_arm and does not satisfy restore coverage); inflight_adapter_revocation_race_cases < 1 (an adapter-using request in flight when the adapter generation is revoked or superseded) or inflight_input_race_cases < 1 (a request in flight when a semantic input is invalidated); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); inflight_adapter_requests_restarted_from_fresh_prefill < inflight_adapter_requests_cancelled. Falsified if any of: bitwise_mismatch_count > 0 (shared pages or the aLoRA prefix differ bitwise from the base) or adapter_logits_bitwise_mismatch_count > 0 against a full adapter prefill; shared_row_fraction differs from predicted_shared_row_fraction for any adapter type (tolerance 0.0; shared_row_fraction = shared_kv_rows / total_kv_rows per layer and aggregated; predicted: QKV-LoRA f/L, Q-only or MLP-only (f+1)/L, aLoRA all full pre-invocation pages plus the pre-invocation rows of the boundary page in every layer); base_pages_dropped_on_revoke > 0; revoked_adapter_entry_hits > 0 (a hit after revocation on an entry whose chain key depends on the revoked adapter generation); a page containing any post-invocation row admitted under a base-only key; cross_adapter_hits > 0 (a hit on another adapter's entry) or old_generation_hits > 0 (a hit on an entry of an older generation presented as current); revoked_lineage_entry_hits > 0 (a hit on an entry whose lineage includes the revoked segment); stale_hits > 0 in the dropped-invalidation arm or the restore arm; outputs_after_adapter_revocation > 0 (any output of such a request after the adapter invalidation, revocation or supersession) or outputs_after_input_invalidation > 0; adapter_restart_output_mismatches > 0 (a restarted request's output differs from a full prefill); any one of the 5 listed seeds misses any criterion above (every seed must pass). Sharing is a KV-memory property only; no prefill-FLOPs claim is made (that would need a layer-boundary residual cache)."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
