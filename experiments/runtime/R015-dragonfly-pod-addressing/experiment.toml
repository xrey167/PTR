version = 1
id = "R015"
status = "planned"
hypothesis = "A per-pod learned address (vector z and bias over a frozen encoder, loaded only when its activation gate passed) routes held-out questions to the right registry pod more reliably than description-vector cosine alone, because it can abstain when the best candidate is not clearly the answer."
metrics = "routing_accuracy,abstain_rate,false_route_rate"
baseline = "cosine_only,constant_score"
falsification = "NO-GO if, across the 5 seeds, the learned router does not have a lower false_route_rate than the cosine-only baseline, or its routing_accuracy falls below the baseline by more than the margin pinned at freeze; the representations then stay deactivated and the default PodRouter stays the only router. A learned router that routes to a pod outside registry.candidates, or loads a representation past an unmet activation gate, fails outright."
hardware_profile = "hardware/default.toml"
entrypoint = "cargo run --release --locked -p ptr-bench -- dragonfly-addressing <seed>"
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
