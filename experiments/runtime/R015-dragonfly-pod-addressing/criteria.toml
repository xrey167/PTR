# R015 decision criteria. Frozen with the preregistration (config.toml names this file; its SHA-256 is
# pinned at the freeze); no rule changes after a run. The rules read the single JSON object that
# `ptr-bench dragonfly-addressing <seed>` prints.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .  A token is an integer literal iff it matches -?[0-9]+; any other token is
# a reference, a path of object keys from the root of the JSON object separated by '.'
# ("arms.learned.routing_accuracy_permille"). A reference that is missing, null or not a JSON integer
# makes the seed INVALID, not failed. Comparisons are exact; every rate is an integer permille rounded
# down, and the two gaps are signed, rounded towards minus infinity.
#
# The aggregator that reads these rules is not written yet; it is part of the freeze (see README.md,
# Status). Until then the file is the specification, and the harness prints every reference below.
#
# What each group means:
# - coverage: prerequisites. A seed that misses one is INVALID (vacuous), not a pass and not a failure.
#   The oracle and constant-score rules are the validity controls: the oracle is the ceiling and must
#   reach it, the constant-score router is the floor and must not beat description cosine, and every
#   representation must have passed its activation gate and been learned for the project, namespace,
#   pod and generation of the world entry that names it (otherwise the learned arm abstains on partial
#   coverage and the comparison is not the one preregistered). Every probe label must name a registered
#   pod (`unregistered_labels`), or the oracle would count a route to an unknown label as correct.
# - falsifiers: the primary criterion, from the plan. On every confirmatory seed the learned router has
#   a routing accuracy at least that of the cosine-only baseline (margin 0) and a false-route rate
#   strictly below it. The strictness is `false_route_gap_permille >= 1`: the gap is the cosine-only
#   false routes minus the learned ones, over all probes, so a gap of 0 permille fails.
# - reported, not judged: the ablations (arms.learned_no_abstain, arms.learned_no_bias), the sensitivity
#   sweep (`sweep`, each entry with its metrics), and the oracle's and constant-score's own rates. They
#   explain the primary result; none of them can rescue or sink it.
#
# A learned router that routes to a pod outside registry.candidates, or loads a representation past an
# unmet activation gate, fails outright: ptr-router's own tests (tests/learned.rs) hold that, and the
# harness would exit 2 on it.

version = 1
experiment = "R015"
seed_aggregation = "every_seed_must_pass"

coverage = [
  "probes == 43",
  "labelled_probes == 36",
  "pods == 6",
  "representations_refused <= 0",
  "unregistered_labels <= 0",
  "arms.oracle.routing_accuracy_permille >= 1000",
  "arms.oracle.false_route_permille <= 0",
  "arms.constant_score.routing_accuracy_permille <= arms.cosine_only.routing_accuracy_permille",
]

falsifiers = [
  "accuracy_gap_permille >= 0",
  "false_route_gap_permille >= 1",
]

# Claims 2 and 3 (reflex). They are separate claims, judged on their own: a seed that is INVALID or
# failing for one of them says nothing about the routing claim above or about the other, and none of
# them can rescue or sink another. The rules read `reflex.*` of the same JSON object (the harness puts
# the learned router behind the runtime's real failover path: a fallback plan naming the lexically
# smallest pod as default, whose generation the lifecycle holds live; every probe is a Pod request).
#
# Both are guarded against the vacuous pass that a counter check gives at zero: "every miss was caught"
# is true when there was no miss, and "the router dispatched" is meaningless when it never did. A seed
# in which the path was not exercised is INVALID, not a pass.
#
# Claim 2, `reflex_failover_coverage` (mechanism): every miss of the learned router (an abstention or a
# pod without a learned address) is caught by the default pod, which serves it through the same
# verifier path. It says the plumbing holds; it says nothing about the default answering correctly (a
# probe that names no pod is "served" by the default too). The faults the runtime must refuse a
# failover for (revoked or superseded default, default outside the registry, effect beyond read, a
# verifier contradiction) are held by `crates/ptr-runtime/tests/reflex.rs`, not by this harness.
[claims.reflex_failover_coverage]
# The two control arms run over the same probes and must behave as designed or the seed is INVALID
# for this claim: the no-plan baseline sees the same misses and catches none of them, and the
# stale-default sensitivity control (the plan names a live generation of the default that the
# registry does not hold) sees the same misses, serves none and refuses each as a stale fallback.
coverage = [
  "reflex.requests == probes",
  "reflex.misses >= 1",
  "reflex.inconsistent <= 0",
  "reflex.baseline_requests == probes",
  "reflex.baseline_misses == reflex.misses",
  "reflex.baseline_failovers <= 0",
  "reflex.stale_requests == probes",
  "reflex.stale_misses == reflex.misses",
  "reflex.stale_failovers <= 0",
  "reflex.stale_refusals == reflex.stale_misses",
]
falsifiers = [
  "reflex.failover_coverage_permille >= 1000",
]

# Claim 3, `reflex_dispatch_hits` (benefit): of the dispatches the learned router makes itself, the
# share that went to the pod the probe names is above the same share for description cosine, which
# dispatches every probe (the baseline is the best non-learned router of the experiment, not the
# constant-score floor and not "send everything to the default"). The count of correct dispatches
# against the default alone (`reflex.default_only_correct`) and the counters of the failover path are
# reported, not judged.
#
# The claim has its ablations and a sensitivity point, run through the same reflex dispatch path over
# the same probes with the same precision metric (`reflex.dispatch_no_bias_*`,
# `reflex.dispatch_no_abstain_*`, `reflex.dispatch_sensitivity_*`: the router without its biases, with
# both thresholds 0, and with the sweep point (600, 200)). Their validity rule is that each ran over
# every probe and printed an integer precision (the reference must be present and an integer, or the
# seed is INVALID for this claim). Their values are reported, not judged: like the routing ablations
# they explain the benefit and cannot rescue or sink it (see PREREGISTRATION.md).
[claims.reflex_dispatch_hits]
coverage = [
  "reflex.requests == probes",
  "reflex.dispatch_hits >= 1",
  "reflex.inconsistent <= 0",
  "reflex.dispatch_no_bias_requests == probes",
  "reflex.dispatch_no_bias_precision_permille >= 0",
  "reflex.dispatch_no_abstain_requests == probes",
  "reflex.dispatch_no_abstain_precision_permille >= 0",
  "reflex.dispatch_sensitivity_requests == probes",
  "reflex.dispatch_sensitivity_precision_permille >= 0",
]
falsifiers = [
  "reflex.dispatch_precision_gap_permille >= 1",
]
