corpus_selection_rule = "deterministic generator, sequence i derived from seed and index i, in index order"
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "test_model_layers", "revoked_expert_layer_j", "weight_seed", "hidden_size", "num_heads", "num_kv_heads", "head_dim", "vocab_size", "corpus_generator_seed"]
