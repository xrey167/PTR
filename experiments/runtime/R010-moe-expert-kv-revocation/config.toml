version = 1
kind = "workspace-area"
name = "R010-moe-expert-kv-revocation"
path = "experiments/runtime/R010-moe-expert-kv-revocation"
tests_dir = "tests"

[pinned_thresholds]
max_stale_pages_served = 0
max_wrongly_dropped_pages = 0
max_bitwise_mismatch_count = 0
deterministic_routing = "dropless, batch-invariant"
# Preregistered choices for this experiment (no code default exists).
min_nondeterministic_reuse_attempts = 1
max_nondeterministic_exact_tags = 0
# Preregistered choices for this experiment (no code default exists).
min_deterministic_revocation_attempts = 1
min_pages_above_j_before_revocation = 1
min_pages_at_or_below_j_before_revocation = 1
min_deterministic_reuse_events = 1
# Preregistered choices for this experiment (no code default exists).
min_post_revocation_reuse_probes = 1
min_retained_pages_reused_after_revocation = 1
min_recomputed_pages_above_j_served = 1
test_model_layers = 4
revoked_expert_layer_j = 1
# Preregistered choices for this experiment (no code default exists).
min_invalidation_suppressed_arms = 1
min_restore_arms = 1
min_post_event_lookups = 1
max_stale_hits = 0
min_input_revocations_performed = 1
min_post_revocation_lookups_matching_tokens = 1
max_revoked_lineage_entry_hits = 0
min_same_tokens_different_generation_cases = 1
max_mismatching_runs_tagged_exact = 0
min_nondeterministic_divergence_observed = 1
