version = 1
id = "R010"
status = "planned"
hypothesis = "revoking expert (j,i) invalidates exactly the KV pages of layers above j and nondeterministic routing is never tagged Exact; with deterministic (dropless, batch-invariant) routing, reused KV and outputs are bit-identical to a full prefill of the same prompt under the same expert generations; a nondeterministic-routing negative-control arm that actually attempts reuse is never tagged Exact; the revocation scenario is deterministic and non-vacuous: pages are already cached on both sides of layer j and an expert revocation is actually performed; invalidation is conservative per layer (every layer above j is invalidated even if a particular page would have been unaffected, never the reverse); lagging or lost invalidation and restore or restart never expose stale pages; semantic-input lineage is enforced; the claim is a KV-memory property only; the bitwise claims use seeded random weights with a pinned seed and shape; a mismatching run is never tagged Exact; dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (expert generations and semantic inputs)."
metrics = "stale_pages_served, wrongly_dropped_pages, nondeterministic_exact_tags, bitwise_mismatch_count, nondeterministic_reuse_attempts, deterministic_revocation_attempts, pages_above_j_before_revocation, pages_at_or_below_j_before_revocation, deterministic_reuse_events, post_revocation_reuse_probes, retained_pages_reused_after_revocation, recomputed_pages_above_j_served, mismatching_runs_tagged_exact, nondeterministic_divergence_observed, input_revocations_performed, post_revocation_lookups_matching_tokens, revoked_lineage_entry_hits, same_tokens_different_generation_cases, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits, pages_above_j_probed_after_revocation, stale_eligible_entries_before_event, post_event_lookups_on_stale_eligible_entries, expert_generation_revocations_performed, pages_above_layer_cached_before_revocation, matching_post_revocation_lookups, stale_expert_generation_hits, restored_pre_revocation_entries, empty_restart_arm, inflight_expert_revocation_race_cases, outputs_after_expert_revocation, inflight_input_race_cases, outputs_after_input_invalidation, selection_digest_mismatches, procedure_mismatches, probed_page_set_digest, cached_page_set_digest_above_j, inflight_race_cases_by_cell, inflight_outputs_after_invalidation, invalidation_matrix_cases, invalidation_matrix_stale_hits"
baseline = "invalidate the whole cache on any expert change"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: deterministic_revocation_attempts < 1, pages_above_j_before_revocation < 1 or pages_at_or_below_j_before_revocation < 1; deterministic_reuse_events < 1 or nondeterministic_reuse_attempts < 1; post_revocation_reuse_probes < 1, retained_pages_reused_after_revocation < 1 or recomputed_pages_above_j_served < 1; probed_page_set_digest != cached_page_set_digest_above_j (every page above j that was cached before the revocation must be probed: identity-set equality, not count equality); nondeterministic_divergence_observed < 1; input_revocations_performed < 1, post_revocation_lookups_matching_tokens < 1 (on entries whose lineage includes the revoked segment) or same_tokens_different_generation_cases < 1 (same tokens, different segment generation or content_digest); invalidation_suppressed_arms < 1, restore_arms < 1, restored_pre_revocation_entries < 1 (the restored pre-revocation entry must be observed in the catalog before the post-event lookup), stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the arm where an actual pre-revocation entry (snapshot or tier object) is restored into the catalog must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1; a plain runtime restart is the separate reported arm empty_restart_arm and does not satisfy restore coverage); expert_generation_revocations_performed < 1 (revocation of the generation of expert (j,i) itself), pages_above_layer_cached_before_revocation < 1 or matching_post_revocation_lookups < 1; inflight_expert_revocation_race_cases < 1 (a request using the expert in flight when the expert generation is revoked or superseded) or inflight_input_race_cases < 1; selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); inflight_expert_revocation_race_cases, outputs_after_expert_revocation, inflight_input_race_cases and outputs_after_input_invalidation < 1 for any member of {expert generation, semantic input} x {revocation, supersession} (recorded and required per member, never as one aggregate); inflight_race_cases_by_cell < 1 for any of the four cells {revocation, supersession} x {expert, semantic input} (each cell recorded and reported separately); invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 32 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate). Falsified if any of: stale_pages_served > 0 (a page above j created before the revocation served after it); wrongly_dropped_pages > 0 (a page at or below j dropped because of the revocation); nondeterministic_exact_tags > 0 or mismatching_runs_tagged_exact > 0; bitwise_mismatch_count > 0 between reused KV or outputs and a full prefill of the same prompt under the same expert generations, for deterministic (dropless, batch-invariant) routing, including the post-revocation probes; revoked_lineage_entry_hits > 0 (a hit on an entry whose lineage includes the revoked segment); stale_hits > 0 in the dropped-invalidation arm or the restore arm; stale_expert_generation_hits > 0 (a post-revocation lookup hitting an entry created under the revoked expert generation); outputs_after_expert_revocation > 0 (any output of such a request after the expert invalidation, revocation or supersession) or outputs_after_input_invalidation > 0; inflight_outputs_after_invalidation > 0 in any of the four cells {revocation, supersession} x {expert, semantic input}; invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); any one of the 5 listed seeds misses any criterion above (every seed must pass). Pages recomputed after the revocation are allowed. The pinned model has 4 layers with j = 1, so layers 2 and 3 are above j; invalidation is conservative per layer (every layer above j is invalidated, pages at or below j are retained)."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
