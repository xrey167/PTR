version = 1
id = "R010"
status = "planned"
hypothesis = "revoking expert (j,i) invalidates exactly the KV pages of layers above j and nondeterministic routing is never tagged Exact; with deterministic (dropless, batch-invariant) routing, reused KV and outputs are bit-identical to a full prefill of the same prompt under the same expert generations; a nondeterministic-routing negative-control arm that actually attempts reuse is never tagged Exact; the revocation scenario is deterministic and non-vacuous: pages are already cached on both sides of layer j and an expert revocation is actually performed; invalidation is conservative per layer (every layer above j is invalidated even if a particular page would have been unaffected, never the reverse); lagging or lost invalidation and restore or restart never expose stale pages; semantic-input lineage is enforced; the claim is a KV-memory property only; a mismatching run is never tagged Exact."
metrics = "stale_pages_served, wrongly_dropped_pages, nondeterministic_exact_tags, bitwise_mismatch_count, nondeterministic_reuse_attempts, deterministic_revocation_attempts, pages_above_j_before_revocation, pages_at_or_below_j_before_revocation, deterministic_reuse_events, post_revocation_reuse_probes, retained_pages_reused_after_revocation, recomputed_pages_above_j_served, mismatching_runs_tagged_exact, nondeterministic_divergence_observed, input_revocations_performed, post_revocation_lookups_matching_tokens, revoked_lineage_entry_hits, same_tokens_different_generation_cases, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits"
baseline = "invalidate the whole cache on any expert change"
falsification = "any page above j that was created before the revocation is served after it (stale_pages_served > 0), or any page at or below j is dropped because of the revocation, or any nondeterministic-routing run is tagged Exact, or, with deterministic (dropless, batch-invariant) routing, any bitwise mismatch (bitwise_mismatch_count > 0) between reused KV/outputs and a full prefill of the same prompt under the same expert generations. Pages recomputed after the revocation are allowed; the nondeterministic-routing negative-control arm must attempt reuse (nondeterministic_reuse_attempts > 0, else the run is vacuous and falsified) and must report nondeterministic_exact_tags == 0; the run is vacuous and falsified if deterministic_revocation_attempts < 1, pages_above_j_before_revocation < 1, pages_at_or_below_j_before_revocation < 1, or deterministic_reuse_events < 1 (no reuse was exercised for the bit-identity check); post-revocation probes are required: post_revocation_reuse_probes >= 1 that reuse retained pages at or below j (retained_pages_reused_after_revocation >= 1) and serve pages above j recomputed after the revocation (recomputed_pages_above_j_served >= 1), each bit-identical to a full prefill, otherwise vacuous and falsified; the pinned model has 4 layers with j = 1, so layers 2 and 3 are above j and layers 0 and 1 are at or below j; also falsified by mismatching_runs_tagged_exact > 0, or nondeterministic_divergence_observed < 1 (the nondeterministic control must actually diverge, else it proves nothing); input_revocations_performed >= 1, post_revocation_lookups_matching_tokens >= 1 on entries whose lineage includes the revoked segment with revoked_lineage_entry_hits == 0, and a case with the same tokens but a different segment generation or content_digest (same_tokens_different_generation_cases >= 1); an arm where the revocation is committed but invalidate_inputs (or the engine flush) is fault-injected to be dropped (invalidation_suppressed_arms >= 1), and an arm where the catalog is restored from a pre-revocation snapshot or tier object or the runtime restarts (restore_arms >= 1), each with post_event_lookups >= 1 and stale_hits == 0; the conservative-per-layer semantics: pages at or below j are retained, every page above j that existed before the revocation is invalidated; every seed must meet every criterion."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
