hypothesis = "successor to R013, split out of it on 2026-10-10 when R013 was narrowed to a slice that can be built and measured now (decided by the coordinating head of work package LR, a scope change recorded in R013's text; R013 itself stays planned and is not frozen). R011 kept the core that was built and measured first; R013 keeps (a) the questions about dormant seeds, transitive authority, superseded sources and in-flight calls that the existing runtime can already answer, and (b) a minimal attestor mechanism (single-use run ids, artifact-digest binding, terminal attestor revocation). This experiment carries, as claims to be built and tested later, the rest of what R013 listed before the narrowing: (1) trusted evaluators and attested manifests: gate evidence is admitted only with an attested consumed-input manifest from a trusted evaluator, and admission rejects a self-reported or missing manifest and an untrusted evaluator; an attestor-removing rotation is terminal for the affected generations; (2) Birth with a source expert (upcycling): a Birth initialized from existing expert weights carries a typed source operand (source pod, generation, artifact digest, observed state and state_version) validated like any operand and encoded in the operation id, the attestation records the initialization source digest, and fresh initialization is attested as no source; the lineage and transitive fence cover it; (3) multi-cause readmission: an expert's fence carries a monotonic set of causes, a ReadmissionRequest minted by the trusted gate host carries a single-use readmission_id over the ordered complete cause set, fresh evidence covers every cause, the compare-and-set requires exact cause-set equality, a terminal cause dominates permanently, a failed readmission is retired through the gated ExpertQuarantineRetired to Retired(QuarantineFailed), which is never a Reactivate seed and rejects InputRevoked and attestor causes; (4) hard-deny verifiers and verifier-set epochs: the verifier set (identity and generation of every required verifier, including hard-deny verifiers) joins the authority epoch, a revocation or tightening rotation of it fences promoted experts, and evidence queued under a superseded verifier set is rejected at commit; (5) Split per-result gating and provenance references: one gate verdict per Split result digest bound to proposal and candidate id, the Split attestation binds the complete ordered result-artifact set, and the non-producing events (Freeze, Prune, Retire, in-place unfreeze) carry a proposal-bound provenance reference checked against the operand's committed artifact digest, with multi-target Prune bound per target; (6) the parts of R013's dropped items that need those mechanisms: in-flight calls racing a source-expert invalidation, and the verifier_set and attestor-removing-rotation kinds of the transitive-authority and revoke-while-retired families. These claims inherit R011's definitions (event mapping, verifier, direct append, route, input digest) and R013's (attestor as an input identity, run id as a single-use input). Each is falsifiable by the metrics below once its mechanism exists. No evidence is claimed for any of them: the experiment is planned, has no harness and no preregistration, and a run today would be falsified by construction."
metrics = "provenance_reference_controls_accepted, provenance_reference_mismatch_attempts, provenance_reference_mismatch_admissions, upcycled_birth_lineage_cases, split_result_substitution_attempts, substituted_split_results_admitted, verifier_rotation_race_cases, verifier_rotation_controls_accepted, stale_verifier_evidence_admissions, ungated_split_result_attempts, split_result_gate_controls_accepted, ungated_split_results_admitted, multi_target_prune_provenance_cases, multi_target_prune_controls_accepted, prune_without_full_provenance_admitted, failed_readmission_retire_cases, wrong_cause_quarantine_retire_attempts, wrong_cause_quarantine_retires_admitted, reactivate_from_quarantine_failed_attempts, reactivations_from_quarantine_failed_admitted, overlapping_authority_fence_cases, readmissions_with_terminal_cause_admitted, upcycled_birth_source_omission_cases, upcycled_birth_source_substitution_cases, upcycled_births_without_bound_source_admitted, multi_cause_readmission_cases, partial_cause_readmissions_admitted"
baseline = "none (safety property; adversarial proposal suite), as R011 and R013"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: the cases promotion_with_untrusted_evaluator, promotion_missing_attested_manifest, promotion_trainer_self_reported_manifest have fewer than 1 attempt (each with a positive control); upcycled_birth_lineage_cases < 1; upcycled_birth_source_omission_cases < 1; upcycled_birth_source_substitution_cases < 1; multi_cause_readmission_cases < 1 (two readmittable causes with evidence for only one, and a cause added after the readmission was minted); overlapping_authority_fence_cases < 1 for either order (a readmittable cause then a terminal cause, and the reverse); failed_readmission_retire_cases < 1; wrong_cause_quarantine_retire_attempts < 1 (InputRevoked and attestor causes); reactivate_from_quarantine_failed_attempts < 1; verifier_rotation_race_cases < 1 (evidence queued under verifier V1 and committed after V1 is revoked or a hard-deny V2 is installed); verifier_rotation_controls_accepted < 1; split_result_substitution_attempts < 1 (a non-primary Split result substituted); ungated_split_result_attempts < 1 (a good primary result plus an unevaluated or gate-failing secondary) or split_result_gate_controls_accepted < 1; provenance_reference_controls_accepted < 1 for any member of {Freeze, Prune, Retire, in-place unfreeze} or provenance_reference_mismatch_attempts < 1; multi_target_prune_provenance_cases < 1 (one target with missing or mismatched provenance among valid ones) or multi_target_prune_controls_accepted < 1; structural in-flight race cases < 1 for a source expert (reported per kind); transitive authority revocation cases < 1 or revoke-while-retired cases < 1 for the verifier_set kind and for an attestor-removing rotation. Falsified if any of: upcycled_births_without_bound_source_admitted > 0; partial_cause_readmissions_admitted > 0; readmissions_with_terminal_cause_admitted > 0; wrong_cause_quarantine_retires_admitted > 0; reactivations_from_quarantine_failed_admitted > 0; stale_verifier_evidence_admissions > 0; substituted_split_results_admitted > 0; ungated_split_results_admitted > 0; provenance_reference_mismatch_admissions > 0; prune_without_full_provenance_admitted > 0; any structural in-flight output after a source-expert invalidation; any routable descendant after the revocation of a verifier_set authority or an attestor-removing rotation; any reactivation from a seed compromised through those kinds; any one of the listed seeds misses any criterion above (every seed must pass). The verifier_set authority kind extends the per-authority-kind coverage and violation metrics of R011 (post_promotion_authority_revocation_cases, tightening_rotation_cases, authority_quarantine_readmission_cases, routable_after_authority_revocation, routable_after_tightening_rotation) from the kinds {gate_config, evaluator} to {gate_config, evaluator, verifier_set}, and ExpertQuarantineRetired joins the event types of the evidence-binding negative cases; these extensions are decided in this experiment's preregistration. Thresholds are copied unchanged from R011's text before the 2026-10-08 narrowing and R013's text before its narrowing of 2026-10-10; they are not frozen."
