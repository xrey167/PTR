qk_norm_main = "disabled"
base_checkpoint = "none (seeded random)"
prompt_tokens = 64
segment_tokens = 16
hops_per_chain = 3
corpus_generator_seed = 20240607
selection_sequences = 48
corpus_selection_digest = "sha256:9f48b499e6ec8735a762d8c746fbf6972d02c86c0b17f351a6680856350e3eef"
stub_producer = "r012-stub-approximate-producer/1"
generation_parameters = "max_new_tokens=8;prompt_tokens=64;greedy;byte-tokenizer"
per_seed_role = "the seed orders the cases and assigns corpus prompts to them; the corpus is fixed by corpus_generator_seed"
preregistration_text = "experiments/runtime/R012-approximate-taint-containment/PREREGISTRATION.md"
preregistration_text_sha256 = "must-be-pinned-before-prepared"
criteria = "experiments/runtime/R012-approximate-taint-containment/criteria.toml"
criteria_sha256 = "must-be-pinned-before-prepared"
