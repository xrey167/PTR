# R005 decision criteria. Frozen with the preregistration (config.toml names this file and its SHA-256);
# no rule changes after a run. They are what the harness itself judges (bins/ptr-bench, r005/metrics.rs
# coverage() and falsifiers()), and a harness test pins that every rule below is one of those, in
# order, and that every counter named resolves in the harness's JSON.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  ==  .
# A token is a numeric literal iff it matches -?[0-9]+(\.[0-9]+)?  (a decimal point makes it a decimal
# literal; no other numeric form exists). Any other token is a reference.
# A reference is a path of object keys from the root of the harness's single JSON result object,
# separated by '.' (no key holds a '.', no array is indexed): "stale_hits" is a top-level key,
# "invalidation_matrix_cases.expert_generation_normal_fence" a member of an object-valued key,
# "members.semantic_revocation.cancelled_forks" and "internal.revoked_pinned_page_bytes_total" deeper ones.
# A reference that is missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule).
# Types: a reference compared with an integer literal or another reference of integers must be a JSON
# integer (not a boolean, not a float); one compared with a decimal literal (only hit_rate) must be a
# JSON number; two references under == may both be JSON strings (digests). Comparisons are exact; no
# tolerance, no rounding.
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies R005 on that seed.
# Not here, because the harness declares them unsupported (null with a reason, PREREGISTRATION.md section 6):
# witness_reuse_static_evidence_passing (the static_evidence below stands for it) and
# base_model_inflight_outputs_after_invalidation.{revocation,supersession}.
# static_evidence: commands that must exit 0 at the frozen commit; the harness cannot run them.
# Decision: every seed must hold every coverage rule and every falsifier rule, and every
# static_evidence command must pass; COMPLETED iff so, INVALID if a seed is missing, unresolvable, or
# its record does not describe the frozen run, FALSIFIED otherwise.

