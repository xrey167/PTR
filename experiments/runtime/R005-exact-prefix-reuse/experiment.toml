id = "R005"
status = "planned"
hypothesis = "a token-keyed, salt-bound radix prefix catalog over 16-token KV pages reuses shared prefixes bit-identically to full prefill, never forks a revoked generation, and achieves a hit rate of at least 40% on a 50%-shared-prefix workload, with at least one revoked-generation fork attempt exercised so the revoked-fork property is non-vacuous; an Approximate run never yields an admitted action or an authoritative SemDB promotion, and an Approximate result persisted as a candidate stays denied in a later otherwise-Exact run until a fresh Exact recomputation; the catalog is bounded (max_trie_nodes and max_kv_page_bytes pinned in config), evicts under a workload of unique prompts exceeding that capacity, and never evicts a page referenced by an active fork; dependency liveness means committed at the current ledger anchor and not revoked, so entries from a discarded overlay are never hit; lagging or lost invalidation and restore or restart never expose stale entries; semantic-input lineage is enforced on the Exact path; a revoked page pinned by an active fork is fenced (the run is cancelled or marked non-authoritative, the page is tombstoned immediately and its bytes are reclaimed when the refcount reaches 0); blocks are never shared across PrincipalId, nor across ProjectId for the same principal; the Approximate producer is a pinned stub backend returning KvReuseMode::Approximate and its taint survives persistence, restart and at least 2 derivation hops; metadata is bounded (max_metadata_bytes); per-layer entries are keyed by (chain(l), semantic_lineage_digest), so one trie node can hold several entries for identical tokens with different lineages and admission accepts only an exact lineage match; a revocation cancels every active fork whose lineage includes the revoked input, which must restart from a fresh prefill, and no token, candidate or result produced after the revocation escapes; a forged admission witness never yields an accepted fork and no effect of a cancelled run is admitted; the bitwise claims use seeded random weights with a pinned seed and shape; allocation is fail-closed under saturation defined as attempted demand (the accepted pinned set stays within max_trie_nodes and max_kv_page_bytes and the excess insertion is refused): when active-fork-referenced pages or nodes leave no evictable capacity a new insert is refused with a typed CapacityExhausted and the request proceeds as an uncached full prefill, so the bounds are never exceeded and pinned pages are never evicted; Raw segments use a content-bound admission rule (kind Raw plus content digest, no identity, generation or liveness check), so two requests sharing an identical raw prefix reuse it, while content that must be revocable is never Raw; supersession is treated like revocation on the reference path: active forks whose admitted pages derive from an edited or superseded semantic generation are cancelled and restarted from a fresh prefill, with completion-time admission; dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (semantic and memory inputs); memory supersession on the reference path is covered in the same way as semantic supersession, and outputs_after_supersession is recorded per dependency kind (semantic, memory); runtime-produced content (any model output, tool output or derived text) can never be Raw: it is a Derived segment carrying its provenance including any Approximate taint, which propagates until exact recomputation; Approximate taint is cleared only by an Exact recomputation of the same derived value from its original untainted inputs with the same operation, and an Exact pass over a tainted Derived segment (an exact echo) does not clear it; the base-model dependency is covered like the semantic, memory, adapter and expert dependencies: an active fork with an in-flight base-model invalidation (revocation or supersession) produces no output and no cache insert; chain(l) covers the full producer of layer-l K/V bytes as stored (the layers below l plus layer l's pre-attention norm, K/V projection weights and biases and every post-projection K/V transformation such as QK-norm weights and eps, stored-post-RoPE rotary parameters and KV quantization parameters, each with its generation); admission witnesses are single-use and revalidated: issuance registers the pending fork in the cancellation registry that dependency invalidation sweeps, and fork_prefix consumes the witness once and revalidates its dependency generations and fence epoch against the live ledger, so a consumed, cancelled or stale witness is rejected typed; Derived segments are generation-bearing dependencies like semantic and memory inputs: the closed list of dependency kinds is semantic, memory, derived, base model, adapter and expert, and any future generation-bearing segment kind joins by definition; the RoPE regime is fixed at admission from prompt plus max_new_tokens, so a decode that crosses a length boundary without changing the effective regime stays Exact with bitwise parity (a required positive control), while a decode whose effective regime actually changes (a forced transition, e.g. a request exceeding its admitted max_new_tokens or a runtime that switches regimes) recomputes the affected cache under the new regime before continuing (Exact only after recomputation, otherwise Approximate); every carrier of derived state in this experiment carries the production mode and, where it holds approximate content, the taint (see derived_state_carriers)."
metrics = "prefill_tokens_saved, wall_time_ms, hit_rate, bitwise_mismatch_count, revoked_fork_count, revoked_fork_attempts, approximate_run_actions_admitted, approximate_action_admission_attempts, approximate_semdb_promotions, approximate_semdb_promotion_attempts, approximate_candidate_path_attempts, approximate_candidate_exact_admissions, peak_trie_nodes, peak_kv_page_bytes, evictions, active_fork_page_evictions, evictions_with_active_fork_pinned, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits, tainted_candidate_reload_attempts, taint_lost, input_revocations_performed, post_revocation_lookups_matching_tokens, revoked_lineage_entry_hits, same_tokens_different_generation_cases, revoked_pinned_page_attempts, revoked_pinned_page_served_after_revocation, revoked_pinned_page_bytes_reclaimed_after_release, cross_principal_attempts, cross_principal_hits, discarded_overlay_entry_attempts, discarded_overlay_entry_hits, fresh_exact_recomputation_controls, candidate_taint_hops, approximate_pod_result_promotion_attempts, approximate_pod_result_promotions_accepted, peak_metadata_bytes, unreachable_revoked_page_bytes_unreclaimed, same_tokens_distinct_lineage_entries, cross_lineage_hits, active_fork_revocation_attempts, cancelled_forks_restarted_from_fresh_prefill, outputs_escaped_after_revocation, reused_prefix_tokens, total_prompt_tokens, cross_project_attempts, cross_project_hits, forged_witness_fork_attempts, forged_witness_forks_accepted, cancelled_run_effect_attempts, cancelled_run_effects_admitted, evictions_nodes_only_run, evictions_bytes_only_run, stale_eligible_entries_before_event, post_event_lookups_on_stale_eligible_entries, cancelled_forks, restored_pre_revocation_entries, empty_restart_arm, raw_prefix_reuse_cases, raw_identical_prefix_hits, supersession_active_fork_race_cases, memory_supersession_active_fork_race_cases, memory_revocation_active_fork_race_cases, selection_digest_mismatches, procedure_mismatches, capacity_refused_requests_completed, capacity_fallback_output_mismatches, capacity_refusal_cache_inserts, supersession_cancelled_forks, supersession_forks_restarted_from_fresh_prefill, cache_inserts_after_supersession, misclassified_revocable_as_raw_attempts, misclassified_raw_admissions, approximate_output_reintroduced_as_raw_attempts, laundered_exact_admissions, outputs_after_supersession_semantic, outputs_after_supersession_memory, cancelled_fork_id_set_digest, restarted_fork_id_set_digest, capacity_refused_request_id_set_digest, capacity_completed_request_id_set_digest, peak_trie_nodes_by_workload, peak_kv_page_bytes_by_workload, peak_metadata_bytes_by_workload, exact_echo_cases, taint_cleared_by_echo, base_model_inflight_race_cases, base_model_inflight_outputs_after_invalidation, base_model_inflight_cache_inserts, invalidation_matrix_cases, invalidation_matrix_stale_hits, superseded_lookup_cases, superseded_stale_hits, saturation_demand_cases, capacity_exhausted_refusals, current_layer_kv_transform_change_cases, stale_exact_hits, stale_witness_replay_cases, witness_reuse_attempts, stale_or_reused_witness_forks_admitted, model_pin_mismatches, fixed_regime_decode_crossing_cases, fixed_regime_crossing_parity_failures, effective_regime_transition_cases, exact_outputs_across_effective_regime_transition_without_recompute"
baseline = "full prefill on the CPU reference decoder"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: revoked_fork_attempts < 1 (attempts must be made after the revocation); approximate_action_admission_attempts < 1, approximate_semdb_promotion_attempts < 1, approximate_candidate_path_attempts < 1 or approximate_pod_result_promotion_attempts < 1 (counted only for attempts made after persistence and before recomputation); evictions_nodes_only_run < 1 or evictions_bytes_only_run < 1 (independent over-capacity workloads of unique prompts for the node bound and for the byte bound); evictions_with_active_fork_pinned < 1; invalidation_suppressed_arms < 1, restore_arms < 1, restored_pre_revocation_entries < 1 (the restored pre-revocation entry must be observed in the catalog before the post-event lookup), stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the arm where an actual pre-revocation entry (snapshot or tier object) is restored into the catalog must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1; a plain runtime restart is the separate reported arm empty_restart_arm and does not satisfy restore coverage); input_revocations_performed < 1, post_revocation_lookups_matching_tokens < 1 (on entries whose lineage includes the revoked segment) or same_tokens_different_generation_cases < 1 (same tokens, different segment generation or content_digest); tainted_candidate_reload_attempts < 1; revoked_pinned_page_attempts < 1; cross_principal_attempts < 1 or cross_project_attempts < 1 (same prefix under a different PrincipalId; same principal and prefix under a different ProjectId); discarded_overlay_entry_attempts < 1; fresh_exact_recomputation_controls < 1 or candidate_taint_hops < 2; same_tokens_distinct_lineage_entries < 2; active_fork_revocation_attempts < 1; forged_witness_fork_attempts < 1 or cancelled_run_effect_attempts < 1; cancelled_forks < 1 (at least one fork must actually be cancelled by the revocation); saturation_demand_cases < 1 (concurrent forks' attempted working set exceeds the capacity) or capacity_exhausted_refusals < 1 (the excess insertion refused with CapacityExhausted), or raw_prefix_reuse_cases < 1 (two requests sharing an identical raw prefix); supersession_active_fork_race_cases < 1 (an active fork whose admitted pages derive from a semantic generation that is superseded or edited while the fork is running); memory_supersession_active_fork_race_cases < 1 (in addition to the semantic case) or memory_revocation_active_fork_race_cases < 1; selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); capacity_refused_requests_completed != capacity_exhausted_refusals (every refused request must complete as an uncached full prefill), or supersession_cancelled_forks < 1, or misclassified_revocable_as_raw_attempts < 1; approximate_output_reintroduced_as_raw_attempts < 1 (an Approximate output reintroduced as Raw over multiple hops); cancelled_forks and supersession_cancelled_forks < 1 for any member of {semantic input, memory input} x {revocation, supersession} (recorded and required per member, never as one aggregate); active-fork race cases (active_fork_revocation_attempts, memory_revocation_active_fork_race_cases, supersession_active_fork_race_cases, memory_supersession_active_fork_race_cases) < 1 for any member of {semantic input, memory input} x {revocation, supersession} (recorded and required per member, never as one aggregate); cancelled_fork_id_set_digest != restarted_fork_id_set_digest (every cancelled fork restarted from a fresh prefill, for revocation and for supersession: exact identity-set equality, not count equality); capacity_refused_request_id_set_digest != capacity_completed_request_id_set_digest (every capacity-refused request completed as an uncached full prefill: exact identity-set equality, not count equality); exact_echo_cases < 1 (an Exact pass over a tainted Derived segment); base_model_inflight_race_cases < 1 for either invalidation type (revocation, supersession), reported per type; invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 52 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate); superseded_lookup_cases < 1 for any member of {semantic, memory} x {normal, lag, restore} (lookups targeting a superseded generation, recorded per kind and path); current_layer_kv_transform_change_cases < 1 (a QK-norm weight or eps change at layer l with the layers below l unchanged), or stale_witness_replay_cases < 1 (an authentic witness held across an invalidation), or witness_reuse_attempts < 1; model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); fixed_regime_decode_crossing_cases < 1 (a prompt below the dynamic-NTK boundary whose decode crosses a length boundary without changing the effective regime: the positive control, which must stay Exact) or effective_regime_transition_cases < 1 (a forced effective-regime transition: the negative case). Falsified if any of: bitwise_mismatch_count > 0 against full prefill; revoked_fork_count > 0; hit_rate < 0.40 on the 50%-shared-prefix workload (hit_rate = reused_prefix_tokens / total_prompt_tokens); approximate_run_actions_admitted > 0, approximate_semdb_promotions > 0, approximate_candidate_exact_admissions > 0 or approximate_pod_result_promotions_accepted > 0; peak_trie_nodes or peak_kv_page_bytes of any workload (main, nodes-only control, bytes-only control) above that workload's limits in the workload_limits table (main 4096 nodes and 64 MiB; nodes-only 4096 nodes and 256 MiB; bytes-only 16384 nodes and 64 MiB) at any time, or active_fork_page_evictions > 0; stale_hits > 0 in the dropped-invalidation arm or the restore arm; revoked_lineage_entry_hits > 0 (a hit on an entry whose lineage includes the revoked segment); taint_lost > 0; revoked_pinned_page_served_after_revocation > 0 or revoked_pinned_page_bytes_reclaimed_after_release below all revoked pinned bytes; cross_principal_hits > 0 or cross_project_hits > 0; discarded_overlay_entry_hits > 0; peak_metadata_bytes of any workload above that workload's metadata limit (its node limit x 1 KiB per node: main 4 MiB, nodes-only 4 MiB, bytes-only 16 MiB) or unreachable_revoked_page_bytes_unreclaimed > 0; cross_lineage_hits > 0 (an entry admitted without an exact lineage match); cancelled_forks_restarted_from_fresh_prefill < cancelled_forks, or outputs_escaped_after_revocation > 0; forged_witness_forks_accepted > 0 or cancelled_run_effects_admitted > 0; raw_identical_prefix_hits < 1 for the identical raw prefix (reuse is required); outputs_after_supersession_semantic > 0 or outputs_after_supersession_memory > 0 (any token, candidate or result produced after the supersession by a fork whose pages derive from the superseded generation, recorded per dependency kind); capacity_fallback_output_mismatches > 0 (the uncached fallback output differs from a full prefill) or capacity_refusal_cache_inserts > 0; supersession_forks_restarted_from_fresh_prefill < supersession_cancelled_forks or cache_inserts_after_supersession > 0; misclassified_raw_admissions > 0 (the segment kind is authoritative from the ingress record: content that has an ingress identity and is presented as Raw must be refused fail-closed); laundered_exact_admissions > 0 (an Approximate-derived content admitted as Exact after being presented as Raw); taint_cleared_by_echo > 0; base_model_inflight_outputs_after_invalidation > 0 or base_model_inflight_cache_inserts > 0 (in either invalidation type); invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); superseded_stale_hits > 0 in any kind x path cell; stale_exact_hits > 0 (an Exact hit on a layer-l entry produced before the current-layer K/V transform change), or stale_or_reused_witness_forks_admitted > 0; fixed_regime_crossing_parity_failures > 0 (the positive control not bit-identical) or exact_outputs_across_effective_regime_transition_without_recompute > 0 (an output served Exact across an effective-regime change without recompute); any one of the 5 listed seeds misses any criterion above (every seed must pass). The workload, shape and seeded weights are pinned in config.toml; one trie node holds 16 tokens x 2 KV heads x 16 head_dim x 4 B x 2 (K and V) x 4 layers = 16384 B, so 4096 nodes equal 64 MiB."
