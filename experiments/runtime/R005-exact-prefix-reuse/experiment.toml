version = 1
id = "R005"
status = "planned"
hypothesis = "a token-keyed, salt-bound radix prefix catalog over 16-token KV pages reuses shared prefixes bit-identically to full prefill, never forks a revoked generation, and achieves a hit rate of at least 40% on a 50%-shared-prefix workload, with at least one revoked-generation fork attempt exercised so the revoked-fork property is non-vacuous; an Approximate run never yields an admitted action or an authoritative SemDB promotion, and an Approximate result persisted as a candidate stays denied in a later otherwise-Exact run until a fresh Exact recomputation; the catalog is bounded (max_trie_nodes and max_kv_page_bytes pinned in config), evicts under a workload of unique prompts exceeding that capacity, and never evicts a page referenced by an active fork; dependency liveness means committed at the current ledger anchor and not revoked, so entries from a discarded overlay are never hit; lagging or lost invalidation and restore or restart never expose stale entries; semantic-input lineage is enforced on the Exact path; a revoked page pinned by an active fork is fenced (the run is cancelled or marked non-authoritative, the page is tombstoned immediately and its bytes are reclaimed when the refcount reaches 0); blocks are never shared across PrincipalId; the Approximate producer is a pinned stub backend returning KvReuseMode::Approximate and its taint survives persistence, restart and at least 2 derivation hops; metadata is bounded (max_metadata_bytes)."
metrics = "prefill_tokens_saved, wall_time_ms, hit_rate, bitwise_mismatch_count, revoked_fork_count, revoked_fork_attempts, approximate_run_actions_admitted, approximate_action_admission_attempts, approximate_semdb_promotions, approximate_semdb_promotion_attempts, approximate_candidate_path_attempts, approximate_candidate_exact_admissions, peak_trie_nodes, peak_kv_page_bytes, evictions, active_fork_page_evictions, evictions_with_active_fork_pinned, invalidation_suppressed_arms, restore_arms, post_event_lookups, stale_hits, tainted_candidate_reload_attempts, taint_lost, input_revocations_performed, post_revocation_lookups_matching_tokens, revoked_lineage_entry_hits, same_tokens_different_generation_cases, revoked_pinned_page_attempts, revoked_pinned_page_served_after_revocation, revoked_pinned_page_bytes_reclaimed_after_release, cross_principal_attempts, cross_principal_hits, discarded_overlay_entry_attempts, discarded_overlay_entry_hits, fresh_exact_recomputation_admitted, candidate_taint_hops, approximate_pod_result_promotion_attempts, approximate_pod_result_promotions_accepted, peak_metadata_bytes, unreachable_revoked_page_bytes_unreclaimed"
baseline = "full prefill on the CPU reference decoder"
falsification = "any bitwise mismatch vs full prefill, any successful fork of a revoked generation, or hit rate below 40% on a 50%-shared-prefix workload, or revoked_fork_attempts == 0 (vacuous run), or revoked_fork_count > 0; also falsified by any action admitted from a run whose reuse mode was Approximate (approximate_run_actions_admitted > 0), any SemDB promotion from an Approximate run (approximate_semdb_promotions > 0), or any admission along the path Approximate result, persisted candidate, later otherwise-Exact run (approximate_candidate_exact_admissions > 0; it must stay denied until a fresh Exact recomputation), and the run is vacuous and falsified if approximate_action_admission_attempts < 1, approximate_semdb_promotion_attempts < 1, or approximate_candidate_path_attempts < 1; also falsified if peak_trie_nodes exceeds max_trie_nodes (4096) or peak_kv_page_bytes exceeds max_kv_page_bytes (64 MiB) at any time, if evictions == 0 under the pinned over-capacity workload of unique prompts (vacuous), or if a page referenced by an active fork is evicted (active_fork_page_evictions > 0) or no eviction was attempted while an active fork pinned a page (evictions_with_active_fork_pinned < 1, vacuous); revoked-generation fork attempts must be performed after the revocation; hit_rate = reused_prefix_tokens / total_prompt_tokens; also falsified by any of: an arm where the revocation is committed but invalidate_inputs (or the engine flush) is fault-injected to be dropped (invalidation_suppressed_arms >= 1), and an arm where the catalog is restored from a pre-revocation snapshot or tier object or the runtime restarts (restore_arms >= 1), each with post_event_lookups >= 1 and stale_hits == 0; input_revocations_performed >= 1, post_revocation_lookups_matching_tokens >= 1 on entries whose lineage includes the revoked segment with revoked_lineage_entry_hits == 0, and a case with the same tokens but a different segment generation or content_digest (same_tokens_different_generation_cases >= 1); tainted_candidate_reload_attempts < 1 or taint_lost > 0 for a persisted Approximate-tainted candidate reloaded after restart; a revoked page pinned by an active fork served after the revocation (revoked_pinned_page_attempts >= 1, revoked_pinned_page_served_after_revocation == 0) or whose bytes are not all reclaimed after the fork releases it (revoked_pinned_page_bytes_reclaimed_after_release == all); cross_principal_attempts < 1 or cross_principal_hits > 0 (the same prefix requested under a different PrincipalId); discarded_overlay_entry_attempts < 1 or discarded_overlay_entry_hits > 0; fresh_exact_recomputation_admitted < 1 (a fresh Exact recomputation must be admitted after the denial), candidate_taint_hops < 2 (taint must be checked on a candidate derived from a candidate); the Approximate attempt counters count only attempts made after persistence and before recomputation; approximate_pod_result_promotion_attempts < 1 or approximate_pod_result_promotions_accepted > 0 on the separate Pod-result path; peak_metadata_bytes > max_metadata_bytes or unreachable_revoked_page_bytes_unreclaimed > 0 (tombstoned bytes must be purged); the workload is pinned (n_requests, prompt_tokens, shared_prefix_tokens, concurrency in config.toml); every seed must meet every criterion."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
