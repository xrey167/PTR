version = 1
id = "R007"
status = "planned"
hypothesis = "evicting a span and re-prefilling everything after it yields a state identical to a fresh prefill without the span and leaves no probeable trace of the span."
metrics = "bitwise_mismatch_count, canary_logit_shift, recompute_tokens, span_insertions, span_evictions, downstream_recomputations, canary_probes"
baseline = "fresh prefill of the prompt without the span"
falsification = "any state difference against a fresh prefill without the span, or a canary logit shift above the noise threshold, where the threshold is pinned before running as the 99th percentile of the canary logit shift over 100 seeded control prompts that never contained the canary; zero difference is accepted only if the pinned canary-bearing span case was exercised with span_insertions, span_evictions, downstream_recomputations and canary_probes each >= 1, otherwise the run is vacuous and falsified."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
