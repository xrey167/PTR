version = 1
id = "R007"
status = "planned"
hypothesis = "evicting a span and re-prefilling everything after it yields a state bit-identical to a fresh prefill without the span and leaves no probeable trace of the span (canary_logit_shift is exactly 0); the experiment is bitwise only and uses seeded random weights with a pinned seed and shape."
metrics = "bitwise_mismatch_count, canary_logit_shift, recompute_tokens, span_insertions, span_evictions, downstream_recomputations, canary_probes, stale_downstream_rows_reused, tokens_after_span, canary_span_tokens, downstream_rows_before_forget, prefix_reuse_tokens, post_forget_probes"
baseline = "fresh prefill of the prompt without the span"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: span_insertions < 1, span_evictions < 1, downstream_recomputations < 1 or canary_probes < 1 on the pinned canary-bearing span case, or canary_span_tokens < 1, downstream_rows_before_forget < 1, prefix_reuse_tokens < 1 or post_forget_probes < 1 (canary_probes must be made after the span eviction and the downstream recomputation). Falsified if any of: bitwise_mismatch_count > 0 (any state difference against a fresh prefill without the span); canary_logit_shift != 0 (the absolute difference of the canary token's logit versus the fresh prefill, max over probes; there is no noise threshold); stale_downstream_rows_reused > 0 or recompute_tokens != tokens_after_span (every token after the span must be recomputed); any one of the 5 listed seeds misses any criterion above (every seed must pass)."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
