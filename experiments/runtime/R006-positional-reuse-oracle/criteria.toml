# R006 decision criteria. DRAFT: proposed with the draft preregistration and frozen with it (config.toml names this file and
# its SHA-256 at the freeze); no rule changes after a run. They are what the harness itself judges (bins/ptr-bench,
# r006/metrics.rs coverage() and falsifiers()); a harness test pins this file to those lists, in order. The harness that fills
# the counters is not built yet; until it is, no counter resolves in any real result.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .
# A token is an integer literal iff it matches -?[0-9]+ (a decimal point makes it a reference and so a
# parse error: no decimal literal exists). Any other token is a reference: a path of object keys from the root of the
# harness's single JSON result object, separated by '.' (no key holds a '.', no array is indexed):
# "secondary_index_lookups" is a top-level key, "reuse_attempts_per_shift.shift_64" is the member "shift_64" of the
# object "reuse_attempts_per_shift".
# A reference that is missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule).
# A reference compared with an integer literal or another reference must be a JSON integer (not a boolean, not a
# float); two references under == may both be JSON strings (digests). Exact comparisons.
# The manifest's "< N" prerequisites are written ">= N", its "> 0" violations "<= 0" and its "!= x" violations "== x".
# A grouped metric has one rule per member, because the grammar has no quantifier: per pinned shift
# (shift_1, shift_7, shift_64, shift_513, shift_4096), per insertion size (tokens_1, tokens_7), per cell of
# invalidation_coverage_matrix (52 cells, named kind_path_type) and per in-flight member (kind_type for the kinds
# semantic_lineage_segment, memory_lineage_segment and base_model).
# Two rules compare two printed values: "fresh_prefills_completed_after_revocation >= upstream_revocation_cases" and the
# identity-set equality of the two case-id digests (exact set equality, not count equality).
# Staleness is structural (owner decision 5): a stale hit is a lookup that returned or admitted a dead run, an escaped
# output is tokens emitted or cache inserts after the event step; in a one-layer model no output comparison can show it.
# reuse_latency_ms is timing only and no rule reads it.
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies R006 on that seed.
# Decision: every seed must hold every coverage rule and every falsifier rule; COMPLETED iff so,
# INVALID if a seed is missing, unresolvable, or its record does not describe the frozen run, FALSIFIED
# otherwise.
