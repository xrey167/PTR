version = 1
id = "R006"
status = "planned"
hypothesis = "with pre-RoPE key storage, reusing a chunk at a shifted position in a one-layer decoder is bit-identical to recomputation; reuse is exercised through the catalog and its secondary index for every pinned shift, and a revoked upstream segment leaves its content unreachable through the secondary index."
metrics = "bitwise_mismatch_count, reuse_latency_ms, reuse_attempts_per_shift, secondary_index_lookups, nonaligned_insertion_cases, upstream_revocation_cases, revoked_upstream_page_reachable_count, fresh_prefill_after_revocation, reused_tokens_per_shift, secondary_index_hits_per_shift, post_revocation_secondary_lookups_matching_content"
baseline = "PreRope full prefill at the new position"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: reuse_attempts_per_shift records fewer than 1 reuse result for any of the 5 pinned shifts, or reused_tokens_per_shift == 0 or secondary_index_hits_per_shift < 1 for any pinned shift; secondary_index_lookups < 1 (reuse must go through the catalog and its position-independent secondary index, not pages handed to the backend); nonaligned_insertion_cases < 1 for the 1-token insertion or for the 7-token insertion; upstream_revocation_cases < 1, or fresh_prefill_after_revocation < 1 (the one-layer oracle has no layers >= 1); post_revocation_secondary_lookups_matching_content < 1. Falsified if any of: bitwise_mismatch_count > 0 at any pinned shift distance (position_shift_tokens = [1, 7, 64, 513, 4096]); revoked_upstream_page_reachable_count > 0 after the upstream revocation, or any post-revocation secondary lookup returning the revoked page; any one of the 5 listed seeds misses any criterion above (every seed must pass). The comparison baseline is a PreRope full prefill at the new position."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json"]
