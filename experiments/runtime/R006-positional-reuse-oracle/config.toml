# Preregistered choices for this experiment (no code default exists).
invalidation_coverage_matrix = { kinds = ["semantic_lineage_segment", "memory_lineage_segment", "derived_lineage_segment", "base_model", "adapter_generation", "expert_generation"], types = ["revocation", "supersession"], paths = ["normal", "lag", "restore", "inflight"], extra_types = { expert_generation = ["fence"] }, cells = ["semantic_lineage_segment_normal_revocation", "semantic_lineage_segment_normal_supersession", "semantic_lineage_segment_lag_revocation", "semantic_lineage_segment_lag_supersession", "semantic_lineage_segment_restore_revocation", "semantic_lineage_segment_restore_supersession", "semantic_lineage_segment_inflight_revocation", "semantic_lineage_segment_inflight_supersession", "memory_lineage_segment_normal_revocation", "memory_lineage_segment_normal_supersession", "memory_lineage_segment_lag_revocation", "memory_lineage_segment_lag_supersession", "memory_lineage_segment_restore_revocation", "memory_lineage_segment_restore_supersession", "memory_lineage_segment_inflight_revocation", "memory_lineage_segment_inflight_supersession", "derived_lineage_segment_normal_revocation", "derived_lineage_segment_normal_supersession", "derived_lineage_segment_lag_revocation", "derived_lineage_segment_lag_supersession", "derived_lineage_segment_restore_revocation", "derived_lineage_segment_restore_supersession", "derived_lineage_segment_inflight_revocation", "derived_lineage_segment_inflight_supersession", "base_model_normal_revocation", "base_model_normal_supersession", "base_model_lag_revocation", "base_model_lag_supersession", "base_model_restore_revocation", "base_model_restore_supersession", "base_model_inflight_revocation", "base_model_inflight_supersession", "adapter_generation_normal_revocation", "adapter_generation_normal_supersession", "adapter_generation_lag_revocation", "adapter_generation_lag_supersession", "adapter_generation_restore_revocation", "adapter_generation_restore_supersession", "adapter_generation_inflight_revocation", "adapter_generation_inflight_supersession", "expert_generation_normal_revocation", "expert_generation_normal_supersession", "expert_generation_normal_fence", "expert_generation_lag_revocation", "expert_generation_lag_supersession", "expert_generation_lag_fence", "expert_generation_restore_revocation", "expert_generation_restore_supersession", "expert_generation_restore_fence", "expert_generation_inflight_revocation", "expert_generation_inflight_supersession", "expert_generation_inflight_fence"] }
