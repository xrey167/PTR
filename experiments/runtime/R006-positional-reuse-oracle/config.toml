version = 1
kind = "workspace-area"
name = "R006-positional-reuse-oracle"
path = "experiments/runtime/R006-positional-reuse-oracle"
tests_dir = "tests"

[pinned_thresholds]
# nonzero shifts in tokens: small, non-power-of-two, page-boundary-crossing (16-token pages), long
position_shift_tokens = [1, 7, 64, 513, 4096]
max_bitwise_mismatch_count_per_shift = 0
# Preregistered choices for this experiment (no code default exists).
min_reuse_attempts_per_shift = 1
# Preregistered choices for this experiment (no code default exists).
min_secondary_index_lookups = 1
nonaligned_insertion_tokens = [1, 7]
min_nonaligned_insertion_cases_per_size = 1
min_upstream_revocation_cases = 1
max_revoked_upstream_page_reachable_count = 0
# Preregistered choices for this experiment (no code default exists).
test_model_layers = 1
min_fresh_prefill_after_revocation = 1
# Preregistered choices for this experiment (no code default exists).
min_reused_tokens_per_shift = 1
min_secondary_index_reuse_cases_per_shift = 1
min_post_revocation_secondary_lookups_matching_content = 1
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
# Preregistered choices for this experiment (no code default exists).
weights = "seeded random (pinned seed and shape)"
weight_seed = 20240607
hidden_size = 64
num_heads = 4
num_kv_heads = 2
head_dim = 16
vocab_size = 256
# Preregistered choices for this experiment (no code default exists).
min_old_upstream_pages_seeded_before_revocation = 1
# Preregistered choices for this experiment (no code default exists).
min_dead_original_upstream_shift_attempts = 1
max_shift_hits_with_dead_original_upstream = 0
# Preregistered choices for this experiment (no code default exists).
min_omitted_upstream_segment_cases = 1
max_omitted_upstream_admissions = 0
omitted_upstream_rule = "every original-prefix segment (identity, generation, digest) present in the requesting prefix as a multiset"
# Preregistered choices for this experiment (no code default exists).
min_upstream_supersession_cases = 1
max_superseded_upstream_page_reachable_count = 0
inflight_race_applicable = true
# Preregistered choices for this experiment (no code default exists).
corpus = "synthetic token sequences from a seeded generator"
corpus_generator_seed = 20240607
corpus_selection_rule = "deterministic generator, sequence i derived from seed and index i, in index order"
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "position_shift_tokens", "nonaligned_insertion_tokens", "test_model_layers", "weight_seed", "hidden_size", "num_heads", "num_kv_heads", "head_dim", "vocab_size", "corpus_generator_seed", "tiny_model_config_digest", "tokenizer_pin", "moe_topology"]
# Preregistered choices for this experiment (no code default exists).
min_source_generation_mismatch_cases = 1
min_source_digest_mismatch_cases = 1
max_source_lineage_mismatch_admissions = 0
# Preregistered choices for this experiment (no code default exists).
fresh_prefill_output_mismatches_max = 0
# Preregistered choices for this experiment (no code default exists).
invalidation_types = ["revocation", "supersession"]
min_post_supersession_secondary_lookups_matching_content = 1
# Preregistered choices for this experiment (no code default exists).
identity_set_checks = [["invalidated_case_id_set_digest", "fresh_prefill_completed_case_id_set_digest"]]
# Preregistered choices for this experiment (no code default exists).
invalidation_coverage_matrix = { kinds = ["semantic_lineage_segment", "memory_lineage_segment", "derived_lineage_segment", "base_model"], types = ["revocation", "supersession"], paths = ["normal", "lag", "restore", "inflight"], cells = ["semantic_lineage_segment_normal_revocation", "semantic_lineage_segment_normal_supersession", "semantic_lineage_segment_lag_revocation", "semantic_lineage_segment_lag_supersession", "semantic_lineage_segment_restore_revocation", "semantic_lineage_segment_restore_supersession", "semantic_lineage_segment_inflight_revocation", "semantic_lineage_segment_inflight_supersession", "memory_lineage_segment_normal_revocation", "memory_lineage_segment_normal_supersession", "memory_lineage_segment_lag_revocation", "memory_lineage_segment_lag_supersession", "memory_lineage_segment_restore_revocation", "memory_lineage_segment_restore_supersession", "memory_lineage_segment_inflight_revocation", "memory_lineage_segment_inflight_supersession", "derived_lineage_segment_normal_revocation", "derived_lineage_segment_normal_supersession", "derived_lineage_segment_lag_revocation", "derived_lineage_segment_lag_supersession", "derived_lineage_segment_restore_revocation", "derived_lineage_segment_restore_supersession", "derived_lineage_segment_inflight_revocation", "derived_lineage_segment_inflight_supersession", "base_model_normal_revocation", "base_model_normal_supersession", "base_model_lag_revocation", "base_model_lag_supersession", "base_model_restore_revocation", "base_model_restore_supersession", "base_model_inflight_revocation", "base_model_inflight_supersession"] }
min_invalidation_matrix_cases_per_cell = 1
max_invalidation_matrix_stale_hits_per_cell = 0
invalidation_matrix_path_meaning = "normal = ordinary lookup after the invalidation; lag = lagging invalidation or index loss; restore = actual restore from snapshot or restart; inflight = in-flight race"
# Preregistered choices for this experiment (no code default exists).
min_shifted_reuse_inflight_race_cases_per_cell = 1
max_shifted_reuse_inflight_outputs = 0
max_shifted_reuse_inflight_cache_inserts = 0
inflight_consumption_interval = "returned or repacked K/V still being consumed after the secondary-index lookup"
inflight_race_reason = "consumption-time shifted-reuse races: returned or repacked K/V still being consumed after the secondary-index lookup (S4)"
restore_applicable = true
# Preregistered choices for this experiment (no code default exists).
min_exact_shifted_parity_cases = 1
max_tainted_exact_results = 0
max_non_bit_exact_exact_results = 0
shifted_taint_scope = "multi-layer approximate M016 only; R006 is a one-layer Exact oracle"
# Preregistered choices for this experiment (no code default exists).
min_raw_ancestor_omission_cases = 1
max_reuse_after_raw_ancestor_removed = 0
