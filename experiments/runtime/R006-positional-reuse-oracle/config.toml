declared_dependency_kinds = ["semantic", "memory", "derived", "base_model", "adapter", "expert"]
# Preregistered choices for this experiment (no code default exists).
cache_namespace_partitioned_by_production_mode = true
cache_namespace_partition = "Exact secondary-index entries only; shifted results are Exact in the one-layer oracle and tagged separately from any approximate pages"
production_modes = ["Exact", "Approximate"]
# Preregistered choices for this experiment (no code default exists).
derived_state_carriers = { secondary_index_entry = ["mode"] }

# ---- additions before the freeze (owner decision 9 of 2026-10-08: R006 is planned, so the config may still be completed) ----
# Choices the harness needs and the manifest leaves open; nothing here weakens or replaces a threshold above.
# Rolling-hash granularity (owner decision 1): the secondary index is built over sub-page spans.
rolling_window_tokens = 8
rolling_hash = "polynomial u64 fingerprint modulo 2^61-1 over stride-1 windows of rolling_window_tokens; a run shorter than the window is keyed once by the hash of its length and tokens; the caller verifies the actual tokens, so a collision cannot cause a hit"
# Reuse unit (owner decision 7): a whole admitted segment located at any offset.
reuse_unit = "a whole admitted prompt segment, located at any offset by the rolling hash"
edit_inside_segment = "an edit inside a segment changes its content digest: zero reuse and a typed source-digest refusal"
# Shift construction (owner decision 9).
shift_construction = "origin run [C, tail]; baseline and shifted run [filler, C, tail] where filler is a Raw segment of exactly s tokens inserted upstream of C (s in position_shift_tokens), so C keeps its own lineage (kind, identity, generation, digest) while the ordered prefix lineage differs"
shift_filler_kind = "Raw"
reused_segment_tokens = 48
tail_tokens = 16
nonaligned_insertion_construction = "origin run [A, C, tail] with A a Raw segment of nonaligned_origin_prefix_tokens tokens; the request inserts a Raw segment of n tokens (n in nonaligned_insertion_tokens) between A and C, so C starts at nonaligned_origin_prefix_tokens + n; neither start is a multiple of the 16-token page"
nonaligned_origin_prefix_tokens = 24
splice_rule = "a spliced span never includes the last prompt token (the stack needs that token's logits); a span with no whole-segment match is recomputed, never partly reused"
# Harness limits (raised in the R006 harness only, as R007 does; the crate default stays 256).
harness_max_prompt_tokens = 4352
harness_max_new_tokens = 8
harness_limits_rule = "max_prompt_tokens must be at least max(position_shift_tokens) + reused_segment_tokens + tail_tokens + harness_max_new_tokens; raised via ReferenceKvLimits in the harness only"
# Opt-in (owner decision 9).
positional_reuse_default = "opt-in per backend and off by default, so the frozen R005 and R007 outputs do not change"
# Structural staleness (owner decision 5): in a one-layer model the stored K/V rows of a token are a pure function of the token, so a stale page is numerically identical to a fresh one and no output comparison can show staleness.
staleness_measurement = "structural"
stale_hit_definition = "a secondary-index lookup that returned or admitted a run with a dead dependency: revoked, superseded (generation replaced or edited), never committed at the ledger anchor, or fenced"
escaped_output_definition = "tokens emitted or cache inserts made after the event step by a session whose dependency was invalidated"
reachability_definition = "revoked_upstream_page_reachable_count and superseded_upstream_page_reachable_count count lookups after the event that returned the page, whether or not the lookup was admitted"
negative_control_postrope = "a PostRope stack: the same shifted reuse must mismatch bitwise, else the run is vacuous"
negative_control_liveness_bypass = "a liveness-bypass fault mode of the secondary index: the reachability and dead-original admission counters must trip, else the run is vacuous"
negative_control_primary_only = "a primary-only run on the shifted content gets 0 reused tokens, showing the secondary index is what provides reuse"
# Multiset scope (owner decision 6).
multiset_scope = "whole_request"
multiset_scope_rule = "a segment of a run's original prefix is present iff the whole request holds at least as many segments with the same (kind, identity, generation, digest); the position in the request does not matter (reordering allowed)"
# Refusals (owner decision 3): one typed error per reason, checked in this order, the first failing one is reported.
refusal_reasons_in_check_order = ["SourceKindMismatch", "SourceIdentityMismatch", "SourceGenerationMismatch", "SourceDigestMismatch", "OriginalUpstreamDead", "BindingDependencyDead", "OriginalUpstreamOmitted", "RawAncestorOmitted"]
raw_ancestor_scope = "direct Raw segments of the requesting prefix (kind Raw, content digest) as a multiset; a Derived segment carries no ancestor list, so ancestors reached only through a derivation hop are not covered"
# Evidence labels per matrix dependency kind (owner decision 8); adapter and expert cells are declared dependencies, not model influence.
evidence_labels = { semantic_lineage_segment = "session_lookup", memory_lineage_segment = "session_lookup", derived_lineage_segment = "session_lookup", base_model = "session_recorded_dependency", adapter_generation = "declared_dependency", expert_generation = "declared_dependency" }
# The label of the in-flight cells, which measure less than the label above says for segment kinds: a semantic, memory or derived segment stops a positional session through the request's own lineage (the secondary-index guards are a subset of it by the omission rule and are not independently exercised); the base model isolates the recorded-dependency guard; the adapter and expert exercise the index's pin protocol without a session. The normal, lag and restore cells keep the label above.
inflight_evidence_labels = { semantic_lineage_segment = "session_lineage_guard", memory_lineage_segment = "session_lineage_guard", derived_lineage_segment = "session_lineage_guard", base_model = "session_recorded_dependency", adapter_generation = "declared_pin_protocol", expert_generation = "declared_pin_protocol" }
declared_dependency_rule = "adapter and expert dependencies are declared by the caller with real liveness oracles (an adapter capsule; real expert records including the fence epoch); the dense one-layer model has no adapter or expert influence"
# In-flight race (S4): the members the manifest requires, and the two variants each runs.
inflight_race_required_kinds = ["semantic_lineage_segment", "memory_lineage_segment", "base_model"]
inflight_variants = ["event_before_splice", "event_after_splice_before_decode"]
# Snapshot (owner decision 8).
snapshot_rows = "KV snapshots carry no K/V rows; restore re-attaches rows by an idempotent re-insert of the same content under a live oracle, with a rows-digest check (a mismatch is a typed error)"
# Pins with no real counterpart.
base_checkpoint = "none: seeded random"
comparison_rule = "bitwise on f32 bit patterns (to_bits), no tolerance"
reuse_latency_scope = "reuse_latency_ms is timing only, never read by a rule; no wall-clock claim"
# Owner decisions of 2026-10-08, verbatim (binding).
owner_decision_2026_10_08_1_granularity = "Granularity: rolling hash over sub-page spans in the secondary index, so non-aligned shifts (1- and 7-token insertions) and all preregistered shifts are reusable; a repack step assembles the reused PreRope rows at the new positions."
owner_decision_2026_10_08_2_matrix = "Matrix: reuse the R005/R010 matrix machinery (layered_kv shared helpers; same cell semantics normal, lag, restore, in-flight); R005's frozen files stay untouched."
owner_decision_2026_10_08_3_refusals = "Refusals: one typed error per refusal reason of the secondary index (e.g. original upstream dead, upstream segment omitted, raw-ancestor multiset differs, own lineage differs), so criteria count per reason and negative cases fail for the named reason."
owner_decision_2026_10_08_4_go = "Go: implement R006 fully after R007 (size L)."
owner_decision_2026_10_08_5_staleness = "(2026-10-08) Staleness is measured structurally: a stale hit = a lookup that returned (or admitted) a dead run; an escaped output = tokens emitted or cache inserts after the event step. Stated in the preregistration. Negative controls: (a) a PostRope stack where the same shifted reuse must mismatch bitwise; (b) a liveness-bypass fault mode under which the reachability / dead-original admission counters must trip; (c) primary-only run gets 0 reused tokens."
owner_decision_2026_10_08_6_multiset = "Multiset presence of original-prefix segments is checked over the whole request (reordering allowed)."
owner_decision_2026_10_08_7_reuse_unit = "Reuse unit = a whole admitted segment, located at any offset by the rolling hash (W pinned in config); an edit inside a segment gives zero reuse and a typed refusal."
owner_decision_2026_10_08_8_declared_and_snapshot = "Adapter and expert cells run as declared dependencies with real liveness oracles (adapter capsule; real expert records incl. fence), labelled evidence = declared_dependency. KV snapshots carry no rows; restore re-attaches rows by idempotent re-insert with a rows-digest check."
owner_decision_2026_10_08_9_config = "(head) config.toml additions before the freeze are allowed (R006 is planned): rolling_window_tokens = 8, the shift construction (Raw filler of s tokens upstream), harness limits, evidence labels. Positional reuse is opt-in per backend and off by default so frozen R005/R007 outputs do not change."

