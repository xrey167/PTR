version = 1
kind = "workspace-area"
name = "R008-lossy-kv-tier"
path = "experiments/runtime/R008-lossy-kv-tier"
tests_dir = "tests"

[pinned_thresholds]

# Preregistered choices for this experiment (no code default exists).
min_top1_agreement = 0.98
min_kv_memory_reduction = 2.0
min_lossy_reuse_events = 1
candidate_kv_keep_fractions = [0.5, 0.25, 0.125]
best_configuration_rule = "highest kv_memory_reduction among configs with top1_agreement >= min_top1_agreement"
kv_memory_reduction_definition = "exact_kv_bytes / lossy_kv_bytes"
top1_agreement_definition = "fraction of positions where lossy argmax == exact argmax"
# Preregistered choices for this experiment (no code default exists).
lossy_kv_bytes_definition = "all tiers plus index and metadata"
min_allow_approximate_false_attempts = 1
max_lossy_hits_with_allow_approximate_false = 0
context_length_tokens = 512
agreement_positions = "last 128 positions of each 512-token prompt"
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
# Preregistered choices for this experiment (no code default exists).
min_lossy_revocation_attempts = 1
min_lossy_restart_attempts = 1
max_lossy_hits_after_revocation = 0
max_lossy_hits_after_restart = 0
agreement_model = "Qwen/Qwen2.5-0.5B"
agreement_model_revision = "060db6499f32faf8b98477b0a26969ef7d8b9987"
agreement_model_layers = 24
agreement_model_vocab_size = 151936
agreement_model_hidden_size = 896
# Preregistered choices for this experiment (no code default exists).
valid_objects_surviving_restart_role = "reported_only"
# Preregistered choices for this experiment (no code default exists).
min_revoked_lossy_objects_present_before_revocation = 1
min_revoked_lossy_objects_present_before_restart = 1
# Preregistered choices for this experiment (no code default exists).
min_restored_revoked_lossy_objects_after_restart = 1
min_post_restart_lookups = 1
min_lossy_supersession_attempts = 1
max_lossy_hits_after_supersession = 0
min_inflight_lossy_reuse_race_cases = 1
max_inflight_lossy_outputs_after_invalidation = 0
# Preregistered choices for this experiment (no code default exists).
corpus = "openai/gsm8k test, concatenated problems cut into 512-token prompts"
corpus_dataset = "openai/gsm8k"
corpus_revision = "740312add88f781978c0658806c59bc2815b9866"
corpus_split = "test"
corpus_selection_rule = "problems in index order concatenated and cut into consecutive 512-token prompts; the first 100 prompts"
prompt_count = 100
corpus_selection_digest_recorded_in_run_json = true
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
procedure_parameters_recorded_per_cell = ["seeds", "context_length_tokens", "prompt_count", "candidate_kv_keep_fractions"]
