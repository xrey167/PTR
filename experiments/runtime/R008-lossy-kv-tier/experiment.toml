version = 1
id = "R008"
status = "planned"
hypothesis = "a ShadowKV/TailorKV-style lossy tier object reduces KV memory by at least 2x at top-1 next-token agreement of at least 98%, and is always tagged Approximate; lossy bytes count all tiers plus index and metadata, a lossy object is never served when allow_approximate is false, and an object whose dependency was invalidated (revoked or superseded) is not served after the invalidation or after a restart; agreement is measured on pinned pretrained Qwen/Qwen2.5-0.5B; dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (the dependencies of lossy objects); with allow_approximate true an actual KvSnapshotLossy hit carries KvReuseTaint and no effect of a lossy result is admitted at the effect boundary; the dependency matrix covers every effective dependency of a lossy object (semantic, memory, base model, adapter, expert); Derived segments are generation-bearing dependencies like semantic and memory inputs: the closed list of dependency kinds is semantic, memory, derived, base model, adapter and expert, and any future generation-bearing segment kind joins by definition; every carrier of derived state in this experiment carries the production mode and, where it holds approximate content, the taint (see derived_state_carriers); the lossy algorithm is pinned per candidate keep fraction (0.5, 0.25, 0.125): retained entries are the top-fraction positions by key L2 norm per layer and head, dropped entries are reconstructed by copying the nearest retained position's K and V, and the index is a sorted int32 position list per layer and head, recorded per candidate row; ties are broken deterministically: equal key norms retain the lower position index first, and an omitted position equidistant to two retained positions copies the lower-index (left) one."
metrics = "kv_memory_reduction, top1_agreement, approximate_tag_violations, lossy_reuse_events, lossy_hits_with_allow_approximate_false, allow_approximate_false_attempts, lossy_revocation_attempts, lossy_hits_after_revocation, lossy_restart_attempts, lossy_hits_after_restart, exact_kv_bytes, lossy_kv_bytes, valid_objects_surviving_restart, revoked_lossy_objects_present_before_revocation, revoked_lossy_objects_present_before_restart, restored_revoked_lossy_objects_after_restart, post_restart_lookups, lossy_supersession_attempts, lossy_hits_after_supersession, inflight_lossy_reuse_race_cases, inflight_lossy_outputs_after_invalidation, selection_digest_mismatches, procedure_mismatches, allow_approximate_false_fallbacks_completed, allow_approximate_false_fallback_output_mismatches, allow_approximate_false_attempt_id_set_digest, allow_approximate_false_fallback_completed_id_set_digest, restored_superseded_lossy_objects_after_restart, invalidation_matrix_cases, invalidation_matrix_stale_hits, lossy_hit_taint_cases, untainted_lossy_results, lossy_effects_admitted, model_pin_mismatches, lossy_algorithm_rows_recorded"
baseline = "exact KvSnapshot tier"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: lossy_reuse_events < 1; allow_approximate_false_attempts < 1; revoked_lossy_objects_present_before_revocation < 1 or revoked_lossy_objects_present_before_restart < 1 (the restart arm must persist an object whose dependency is revoked), lossy_revocation_attempts < 1 or lossy_restart_attempts < 1; results missing for any pinned candidate keep fraction (0.5, 0.25, 0.125) in top1_agreement or kv_memory_reduction; restored_revoked_lossy_objects_after_restart < 1 (the snapshot or tier restore path actually reloads the revoked object) or post_restart_lookups < 1 (a lookup targeting it), or lossy_supersession_attempts < 1, or inflight_lossy_reuse_race_cases < 1 for either invalidation type (revocation, supersession), recorded per type (a lossy reuse in flight when its dependency is invalidated); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); allow_approximate_false_fallbacks_completed < allow_approximate_false_attempts (the refused lossy reuse must complete via the exact path); allow_approximate_false_attempt_id_set_digest != allow_approximate_false_fallback_completed_id_set_digest (every refused lossy reuse completed via the exact path: exact identity-set equality, not count equality); restored_superseded_lossy_objects_after_restart < 1 (a supersession case targeting an actually restored lossy object, both in the normal arm and after a restart); invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 52 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate); lossy_hit_taint_cases < 1 (a real lossy hit with allow_approximate true); model_pin_mismatches > 0 (the base checkpoint (repo and revision), the tokenizer (repo and revision) or the initial MoE topology recorded in run.json differs from the pin in config.toml, or the tiny-model config digest differs); lossy_algorithm_rows_recorded < 3 (the retained-entry selection rule, reconstruction method and index representation must be recorded for each of the 3 candidate rows). Falsified if any of: no complete candidate row reaches top1_agreement >= 0.98 (the best configuration is the one with the highest kv_memory_reduction among complete rows reaching the agreement threshold); the best configuration's kv_memory_reduction < 2.0 (kv_memory_reduction = exact_kv_bytes / lossy_kv_bytes, with lossy_kv_bytes counting all tiers plus index and metadata); approximate_tag_violations > 0 (any lossy reuse not tagged Approximate); lossy_hits_with_allow_approximate_false > 0; lossy_hits_after_revocation > 0 or lossy_hits_after_restart > 0 for an object whose dependency was revoked (objects that are still valid may survive a restart; that is not a criterion); lossy_hits_after_supersession > 0 or inflight_lossy_outputs_after_invalidation > 0; allow_approximate_false_fallback_output_mismatches > 0 (the exact fallback output differs from the exact tier); lossy_hits_after_supersession > 0 in the normal arm or after a restart (post-restart supersession on a restored lossy object included); invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); untainted_lossy_results > 0 (a lossy hit result without KvReuseTaint) or lossy_effects_admitted > 0 (an effect of a tainted lossy result admitted at the effect boundary); any one of the 5 listed seeds misses any criterion above (every seed must pass). top1_agreement is the fraction of the pinned positions whose argmax next token equals the exact tier's, measured on pinned pretrained Qwen/Qwen2.5-0.5B (revision 060db6499f32faf8b98477b0a26969ef7d8b9987, 24 layers, vocabulary 151936, hidden size 896). valid_objects_surviving_restart is reported as information only and is not a criterion."
