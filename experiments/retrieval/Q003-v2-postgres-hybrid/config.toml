version = 1
kind = "workspace-area"
name = "Q003-v2-postgres-hybrid"
path = "experiments/retrieval/Q003-v2-postgres-hybrid"
tests_dir = "tests"

# Frozen before Q003 leaves `planned` (experiments/preregistration.toml,
# scripts/check_research_gates.py). Every value is decided; only the two digests of the
# frozen text and criteria are `must-be-pinned-…` until the freeze commit, which also sets the
# manifest's entrypoint and preregistration digests. The values below repeat
# [pinned_thresholds] (a test compares them); the baselines' directory digests were
# computed with scripts/check_research_gates.py directory_digest.
[preregistration]
seeds = [17, 29, 43, 71, 101]
harness = "postgres-hybrid"
capsules = 2000
queries = 1000
strong_queries = 200
# How far recall@10 of the fused list may fall below rag_reference's (a sanity floor) and below the harness's own exact dense
# search over the live set (the sensitivity control) before Q003 is rejected as the default.
recall_margin_permille = 30
recall_exact_margin_permille = 30
# recall@10 and nDCG@10, as the manifest's metrics name them.
k = 10
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
embedding_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
pool_sha256 = "0a46e80db51a8a74596005a211acab9efad990303fba15fa6ea1f47aae432b05"
vectors_sha256 = "4b5c350fcf2e5d59bd7bc77f7f8a671e1f0106e0630bd9423f7570733576a590"
strong_vectors_sha256 = "b663def2cc044c2ef096fe0eae46d0da210f91ab8d7513472a8ee25e482751c6"
# The digests of the baselines' directories, which freeze every setting and
# the implementation of each with this table.
baseline_rag_reference_sha256 = "a296a5ce889e8b16994217681388c994f34c1c2631af2d25f6e49063a8cf86ef"
baseline_strong_retrieval_sha256 = "38b6cf753a61de053641944dfe019aaeb2cbfc1e9c54639a0fb7eef1849796a1"
workload_digest_seed_17 = "fdfe7b7405bf9bc09b1c53233d10a29bfa3c1ff1b67afb2f6f1e7972ac7d23cb"
workload_digest_seed_29 = "1abf7eaf710cfa64869ba8e93b461ff5fb467a6d6f75e9fabbf1b48b9486920d"
workload_digest_seed_43 = "31c46173e56d6eefb2f4e5336899f34dff452bd9f81f3d704aac623df90769dd"
workload_digest_seed_71 = "d98d3b3c9f7764d121191bea95d520bbf86d94894346cd08855f985d99f343e2"
workload_digest_seed_101 = "918a27a7337e01afb733d1f757222015423418a9e91a5a35dda0f603244c47c9"
preregistration_text = "experiments/retrieval/Q003-v2-postgres-hybrid/PREREGISTRATION.md"
