'''

[[mutation]]
name = "promote-ignores-the-proof-source"
description = "promote_verified_with does not hold the proof against the source the hit was observed with: a proof made for another source promotes the hit."
expect = ["stage_skip_accepted"]
file = "crates/ptr-search/src/lib.rs"
find = '''
        if proof.source() != source {
'''
replace = '''
        if false && proof.source() != source {
'''

[[mutation]]
name = "promote-without-a-held-source"
description = "promote_verified_with promotes a hit that holds no resolved source (observed on the caller's word) with whatever proof it is given."
expect = ["stage_skip_accepted"]
file = "crates/ptr-search/src/lib.rs"
find = '''
        let Some(source) = self.source.as_ref() else {
            return Err(EvidencePromotionError::SourceNotResolved);
        };
'''
replace = '''
        let source = self.source.as_ref().unwrap_or_else(|| proof.source());
'''

[[mutation]]
name = "observe-ignores-the-source-owner"
description = "observe_resolved does not hold the resolved source's owners against the hit's own capsule and generation: a live-labelled hit that cites an exact event of a superseded generation or of a revoked or disputed capsule is observed (P9), and so is an honest hit given another capsule's source (K11)."
expect = ["stale_or_revoked_promoted", "false_known_mechanism", "stage_skip_accepted"]
file = "crates/ptr-search/src/lib.rs"
find = '''
        if !source.is_owned_by(&self.capsule, self.generation) {
'''
replace = '''
        if false && !source.is_owned_by(&self.capsule, self.generation) {
'''

[[mutation]]
name = "owner-is-compared-on-the-capsule-only"
description = "The ownership test compares the capsule and ignores the generation: a live-labelled hit citing the exact event of a superseded generation of its own capsule is observed (P9 superseded)."
expect = ["stale_or_revoked_promoted", "false_known_mechanism"]
file = "crates/ptr-search/src/source.rs"
find = '''
            .any(|(owner, owned)| owner == capsule && *owned == generation)
'''
replace = '''
            .any(|(owner, _)| owner == capsule)
'''

[[mutation]]
name = "owner-is-compared-on-the-generation-only"
description = "The ownership test compares the generation number and ignores the capsule: a live-labelled hit citing the exact event of a revoked or disputed capsule that has the same generation number is observed (P9 quarantined, K11)."
expect = ["stale_or_revoked_promoted", "false_known_mechanism", "stage_skip_accepted"]
file = "crates/ptr-search/src/source.rs"
find = '''
            .any(|(owner, owned)| owner == capsule && *owned == generation)
'''
replace = '''
            .any(|(_, owned)| *owned == generation)
'''

