[[mutation]]
name = "verifier-reads-only-the-first-line"
description = "The verifier parses the first line of the resolved text only, so a span of two statements, or a statement with a newline after it, verifies the first statement's claim (P2 two-line and padded spans)."
expect = ["false_known_mechanism"]
file = "crates/ptr-search/src/source.rs"
find = '''
    let parts: Vec<&str> = text.split(' ').collect();
'''
replace = '''
    let parts: Vec<&str> = text.lines().next().unwrap_or("").split(' ').collect();
'''

[[mutation]]
name = "verifier-trims-the-statement"
description = "The verifier trims the resolved text before parsing it, so a statement with a newline next to it verifies (P2 padded span)."
expect = ["false_known_mechanism"]
file = "crates/ptr-search/src/source.rs"
find = '''
    let parts: Vec<&str> = text.split(' ').collect();
'''
replace = '''
    let parts: Vec<&str> = text.trim().split(' ').collect();
'''

[[mutation]]
name = "verifier-accepts-a-bare-not-value"
description = "The verifier reads `x: p is not` as the value `not`, so a span cut off after `not` verifies the claim with the value not (P5 truncated negation)."
expect = ["false_known_mechanism"]
file = "crates/ptr-search/src/source.rs"
find = '''
        [_, _, "is", "not"] => return Err(ClaimError::MalformedStatement),
'''
replace = '''
        // mutated: a bare `not` is a value
'''

[[mutation]]
name = "verifier-rejects-non-ascii-tokens"
description = "The verifier treats a token with a non-ASCII character as malformed, which refuses every honest hit with a multibyte value (hard honest) and every claim about a Cyrillic twin."
expect = ["hard_honest_refused"]
file = "crates/ptr-search/src/source.rs"
find = '''
    !token.is_empty() && !token.chars().any(char::is_whitespace)
'''
replace = '''
    !token.is_empty() && token.is_ascii() && !token.chars().any(char::is_whitespace)
'''

[[mutation]]
name = "resolver-drops-the-empty-span-check"
description = "The resolver no longer refuses an empty span: an empty quote at an empty span resolves to the empty text, which the verifier refuses as malformed, so the empty span gets another reason than EmptySpan (P2 empty span)."
expect = ["wrong_refusal_reason"]
file = "crates/ptr-search/src/source.rs"
find = '''
        if citation.start >= citation.end {
            return Err(SourceError::EmptySpan {
                start: citation.start,
                end: citation.end,
            });
        }
'''
replace = '''
        let _ = (citation.start, citation.end);
'''

