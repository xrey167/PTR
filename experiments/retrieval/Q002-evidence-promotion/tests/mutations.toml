name = "resolver-binds-the-first-occurrence-of-the-quote"
description = "The resolver accepts the quote only where it first occurs in the event, whatever span is cited: the second of two identical statements no longer resolves at its own offset (hard honest, repeated statement)."
expect = ["hard_honest_refused"]
file = "crates/ptr-search/src/source.rs"
find = '''
        if event.content[citation.start..citation.end] != *citation.quote.as_bytes() {
'''
replace = '''
        if event
            .content
            .windows(citation.quote.len())
            .position(|window| window == citation.quote.as_bytes())
            != Some(citation.start)
        {
'''

