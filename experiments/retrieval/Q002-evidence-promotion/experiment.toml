version = 1
id = "Q002"
status = "planned"
hypothesis = "Does exact-source verification prevent search-hit hallucination? ptr_search's typed promotion path (ExactSourceResolver, then SearchHit::observe_resolved against the lifecycle authority, then verify_claim, then SearchHit::promote_verified_with) promotes a retrieved hit to VerifiedKnown only if its citation is the byte-exact quote at the cited span of an intact raw event that belongs to the capsule generation the hit names (the ownership is the generator's table, a trust root like the raw event source), its claim is what that statement states (one statement of the format `subject: predicate is [not ]value`, byte-exact tokens, no negation, the bare value `not` refused as a truncated negation), and the lifecycle authority (PtrRuntime::generation_validity, with a harness overlay for the one state the runtime cannot answer, Disputed) holds the hit's generation live; so that on seeded synthetic worlds (36 capsules of one to three generations, healthy, revoked or disputed, with answerable, unanswerable and absent questions) and a noisy retriever that returns, besides the honest hit of an answerable question, poison of nine classes (P1 fabricated source id, P2 wrong span, empty span, two-statement span, newline-padded span or doctored quote, P3 tampered digest, P4 lookalike subject, other predicate or subject differing by case, P5 contradicting value, negation or truncated negation, P6 superseded generation, P7 revoked but still live generation, P8 disputed generation, P9 a live label on the exact event of another generation or capsule), and besides the plain honest hit, hard honest hits (a multibyte value, a value containing `not`, a statement an event states twice, a one-line event, a span at the start or at the end of the event), no poison hit is promoted (false Known), no hard honest hit is refused, no adversarial stage skip at the API boundary is accepted, at least 950 per mille of the honest hits are promoted, and the mechanism's task success (correct answer, or correct abstention on an unanswerable question) is at least that of each of the three baselines: direct retrieval-to-answer, the lifecycle filter alone and the boolean API fed true. B0 (the top hit is the answer) and B2 (today's boolean API fed true) are the negative controls and must produce false Known on this corpus; B1 (the lifecycle filter alone) is a contrast that must also produce one. Task success on the answerable questions alone is reported."
metrics = "questions, answerable_questions, unanswerable_questions, hits_by_class, poison_attempts, true_claims, true_known_promoted, recall_permille, recall_violation, hard_honest_presented, hard_honest_refused, false_known_mechanism, false_known_baseline_direct, false_known_gen_filter_only, false_known_bool_trust, stale_or_revoked_promoted, wrong_refusal_reason, product_panics, stage_skip_attempts, stage_skip_by_kind, stage_skip_accepted, stage_skip_unexpected, task_success_mechanism, task_success_baseline, task_success_gen_filter_only, task_success_bool_trust, task_success_violation, answerable_success_permille, answerable_success_baseline_permille, abstentions_correct, oracle_label_mismatches, corpus_selection_digest_mismatches, resolver_calls, lifecycle_queries"
baseline = "direct retrieval-to-answer"
falsification = "The run is vacuous and counts as falsified if any coverage prerequisite is unmet (but see the two harness-integrity guards at the end of this list): poison_attempts.P1 < 20, poison_attempts.P2 < 20, poison_attempts.P3 < 20, poison_attempts.P4 < 20, poison_attempts.P5 < 20, poison_attempts.P6 < 20, poison_attempts.P7 < 20, poison_attempts.P8 < 20, poison_attempts.P9 < 20 (fewer than 20 hits of a poison class were refused with the refusal that class is expected to get at the API boundary); true_claims < 100 (fewer than 100 honest hits were shown to the mechanism); hard_honest_presented < 30 (fewer than 30 hard honest hits were shown to the mechanism); unanswerable_questions < 50; stage_skip_by_kind.K1 < 20, stage_skip_by_kind.K2 < 20, stage_skip_by_kind.K3 < 20, stage_skip_by_kind.K4 < 20, stage_skip_by_kind.K5 < 20, stage_skip_by_kind.K6a < 20, stage_skip_by_kind.K6b < 20, stage_skip_by_kind.K7 < 20, stage_skip_by_kind.K8 < 20, stage_skip_by_kind.K9 < 20, stage_skip_by_kind.K10 < 20, stage_skip_by_kind.K11 < 20 (fewer than 20 adversarial attempts of a kind got the refusal the stage rules prescribe with the hit left unchanged); false_known_baseline_direct < 1, false_known_gen_filter_only < 1, false_known_bool_trust < 1 (a baseline that never hallucinates on this corpus, so the corpus cannot show the hallucination it is made to show); oracle_label_mismatches > 0 (the generator's labels differ from the naive reading of the corpus: a harness defect) or corpus_selection_digest_mismatches > 0 (the generated corpus is not the pinned one); these two are harness-integrity guards: the aggregator judges a seed that trips either INVALID, not falsified, because they say nothing about the hypothesis. Falsified if any of: false_known_mechanism > 0 (any promoted hit of a poison class: any direct false Known promotion is a hard failure); stage_skip_accepted > 0 (an adversarial call that skips a stage, replays a promotion, steps a hit back or promotes with a proof of another source, or observes a hit with the source of another capsule, was accepted); stale_or_revoked_promoted > 0 (a hit of a superseded, revoked or disputed generation, or a live-labelled hit citing an event of one, reached VerifiedKnown); stage_skip_unexpected > 0 (an attempt got another refusal than the stage rules prescribe, changed the hit although refused, or could not be set up from honest hits); wrong_refusal_reason > 0 (a poison hit was refused with another refusal than its class is expected to get); product_panics > 0 (the code under test panicked); hard_honest_refused > 0 (a hard honest hit, which is exact, was refused: zero tolerance); recall_permille < 950 (fewer than 950 per mille of the honest hits, hard ones included, were promoted); task_success_mechanism < task_success_baseline (the mechanism got fewer questions right, by correct answer or correct abstention, than direct retrieval-to-answer); task_success_mechanism < task_success_gen_filter_only, task_success_mechanism < task_success_bool_trust (fewer than the lifecycle filter alone or the boolean API fed true: corollaries of the rules above that also catch a harness or product defect that drops promoted answers); any one of the 5 listed seeds misses any criterion above (every seed must pass). answerable_success_permille, answerable_success_baseline_permille, abstentions_correct, resolver_calls, lifecycle_queries and every wall-clock time are descriptive and never judged."
hardware_profile = "hardware/default.toml"
entrypoint = "cargo run --release --locked -p ptr-bench -- evidence-promotion <seed>"
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json", "mutations.json"]
