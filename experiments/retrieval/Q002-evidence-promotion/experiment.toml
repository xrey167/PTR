version = 1
id = "Q002"
status = "planned"
hypothesis = "Does exact-source verification prevent search-hit hallucination? ptr_search's typed promotion path (ExactSourceResolver, then SearchHit::observe_resolved against the lifecycle authority, then verify_claim, then SearchHit::promote_verified_with) promotes a retrieved hit to VerifiedKnown only if its citation is the byte-exact quote at the cited span of an intact raw event, its claim is what that statement states (one statement of the format `subject: predicate is [not ]value`, byte-exact tokens, no negation), and the lifecycle authority (PtrRuntime::generation_validity, with a harness overlay for the one state the runtime cannot answer, Disputed) holds the hit's generation live; so that on seeded synthetic worlds (36 capsules of one to three generations, healthy, revoked or disputed, with answerable, unanswerable and absent questions) and a noisy retriever that returns, besides the honest hit of an answerable question, poison of eight classes (P1 fabricated source id, P2 wrong span or doctored quote, P3 tampered digest, P4 lookalike subject, P5 contradicting value or negation, P6 superseded generation, P7 revoked but still live generation, P8 disputed generation), no poison hit is promoted (false Known), no adversarial stage skip at the API boundary is accepted, at least 950 per mille of the honest hits are promoted, and the mechanism's task success (correct answer, or correct abstention on an unanswerable question) is at least that of the baseline, direct retrieval-to-answer. B0 (the top hit is the answer) and B2 (today's boolean API fed true) are the negative controls and must produce false Known on this corpus; B1 (the lifecycle filter alone) is a descriptive contrast. Task success on the answerable questions alone is reported."
metrics = "questions, answerable_questions, unanswerable_questions, hits_by_class, poison_attempts, true_claims, true_known_promoted, recall_permille, recall_violation, false_known_mechanism, false_known_baseline_direct, false_known_gen_filter_only, false_known_bool_trust, stale_or_revoked_promoted, wrong_refusal_reason, product_panics, stage_skip_attempts, stage_skip_by_kind, stage_skip_accepted, stage_skip_unexpected, task_success_mechanism, task_success_baseline, task_success_gen_filter_only, task_success_bool_trust, answerable_success_permille, answerable_success_baseline_permille, abstentions_correct, oracle_label_mismatches, corpus_selection_digest_mismatches, resolver_calls, lifecycle_queries"
baseline = "direct retrieval-to-answer"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: poison_attempts.P1 < 20, poison_attempts.P2 < 20, poison_attempts.P3 < 20, poison_attempts.P4 < 20, poison_attempts.P5 < 20, poison_attempts.P6 < 20, poison_attempts.P7 < 20, poison_attempts.P8 < 20 (fewer than 20 hits of a poison class were refused with the refusal that class is expected to get at the API boundary); true_claims < 100 (fewer than 100 honest hits were shown to the mechanism); unanswerable_questions < 50; stage_skip_by_kind.K1 < 20, stage_skip_by_kind.K2 < 20, stage_skip_by_kind.K3 < 20, stage_skip_by_kind.K4 < 20, stage_skip_by_kind.K5 < 20, stage_skip_by_kind.K6 < 20, stage_skip_by_kind.K7 < 20, stage_skip_by_kind.K8 < 20, stage_skip_by_kind.K9 < 20, stage_skip_by_kind.K10 < 20 (fewer than 20 adversarial attempts of a kind got the refusal the stage rules prescribe with the hit left unchanged); false_known_baseline_direct < 1, false_known_gen_filter_only < 1, false_known_bool_trust < 1 (a baseline that never hallucinates on this corpus, so the corpus cannot show the hallucination it is made to show); oracle_label_mismatches > 0 (the generator's labels differ from the naive independent reading of the corpus: a harness defect) or corpus_selection_digest_mismatches > 0 (the generated corpus is not the pinned one). Falsified if any of: false_known_mechanism > 0 (any promoted hit of a poison class: any direct false Known promotion is a hard failure); stage_skip_accepted > 0 (an adversarial call that skips a stage, replays a promotion, steps a hit back or promotes with a proof of another source was accepted); stale_or_revoked_promoted > 0 (a hit of a superseded, revoked or disputed generation reached VerifiedKnown); stage_skip_unexpected > 0 (an attempt got another refusal than the stage rules prescribe, changed the hit although refused, or could not be set up from honest hits); wrong_refusal_reason > 0 (a poison hit was refused with another refusal than its class is expected to get); product_panics > 0 (the code under test panicked); recall_permille < 950 (fewer than 950 per mille of the honest hits were promoted); task_success_mechanism < task_success_baseline (the mechanism got fewer questions right, by correct answer or correct abstention, than direct retrieval-to-answer); any one of the 5 listed seeds misses any criterion above (every seed must pass). task_success_gen_filter_only, task_success_bool_trust, answerable_success_permille, answerable_success_baseline_permille, abstentions_correct, resolver_calls, lifecycle_queries and every wall-clock time are descriptive and never judged."
hardware_profile = "hardware/default.toml"
