hypothesis = "Does ptr-pg's generation-joined retrieval keep its lifecycle guarantees and stay within a pinned recall margin of a conventional hybrid reference? ptr_pg's search joins a full-text list and a halfvec HNSW list to the lifecycle catalog of their snapshot before each limit and fuses them by weighted reciprocal rank fusion keyed by capsule and generation; upsert_document refuses a generation that is not live. It is run on seeded live-lifecycle corpora of 2000 capsules of up to three generations (kept at generation 1, superseded once, superseded twice, or revoked at generation 1, 2 or 3) built through the projector and upsert_document, with frozen MiniLM vectors, 1000 paraphrased queries per seed asked at two checkpoints (after the supersessions; after the revocations), stale rows of superseded and revoked generations planted by raw SQL into the derived table, late writes of non-live generations, and probe queries that exercise the lexical mode. Against the harness's own live table no list (lexical, vector, fused) of any answer holds a non-live generation, no planted row is returned, the projector leaves no superseded or revoked document behind, no late write of a non-live generation is accepted, no search answers differently twice on an unchanged snapshot, the lexical mode returns the live document of at least 45 of 50 live-body probes, and the recall@10 of the fused list is no more than the pinned margin (30 per mille) below both that of rag_reference (BM25-OR + cosine + RRF over the same MiniLM vectors, rebuilt from the live table at each checkpoint), a sanity floor, and that of the harness's own exact dense search over the live set, the sensitivity control. On natural-language queries ptr-pg's lexical list is empty (plainto_tsquery ANDs every term; a finding about ptr-pg recorded as a limitation, not a falsifier), so its fused list is effectively its dense list and the recall leg compares that list with the reference; it does not test the quality of a working lexical half. strong_retrieval (BM25 + bge-m3 dense + RRF + bge-reranker-v2-m3, retrieval only) answers a stratified subset of 200 answerable queries and is reported beside it, never gated. nDCG@10, the recall of the lexical and vector lists alone, of the harness's exact dense search and of BM25 alone, latency and index build time are descriptive."
metrics = "queries, answerable_queries, unanswerable_queries, probe_queries, superseded_targets_queried, revoked_targets_queried, recall10_pg_permille, recall10_reference_permille, recall10_strong_permille, recall10_pg_on_strong_subset_permille, ndcg10_pg_permille, ndcg10_reference_permille, ndcg10_strong_permille, ndcg10_pg_on_strong_subset_permille, recall10_pg_deficit_vs_reference_permille, recall10_pg_deficit_vs_exact_permille, recall10_pg_deficit_vs_strong_permille, recall_violation_vs_reference, recall_violation_vs_exact, recall10_pg_lexical_only_permille, recall10_pg_vector_only_permille, recall10_exact_cosine_permille, recall10_bm25_only_permille, recall_paired_se_vs_reference_permille, strong_discordant_queries, strong_discordance_bound_permille, main_query_lexical_hits, live_probe_lexical_self_hits, lexical_probe_violation, stale_hits, stale_hits_by_list, planted_stale_rows, planted_stale_returned, projector_residual_rows, late_write_attempts, late_write_accepted, late_write_wrong_refusal, product_errors, lifecycle_projection_mismatches, product_panics, nondeterministic_searches, retrieval_hits, control_planted_returned, control_vector_returned, reference_queries, strong_queries, workload_digest_mismatches, latency_ns, index_build_ns"
baseline = "research/baselines/strong_retrieval (BM25 + bge-m3 dense + RRF + bge-reranker-v2-m3, retrieval only) and research/baselines/rag_reference (BM25 + MiniLM cosine + RRF); BM25 alone is reported; strong_rag stays blocked"
falsification = "The run is vacuous and counts as falsified if any coverage prerequisite is unmet (but see the harness-integrity guards at the end of this list and the verdict order in criteria.toml): planted_stale_rows < 200 (fewer than 200 stale rows were planted); revoked_targets_queried < 50 (fewer than 50 queries asked for a revoked capsule); superseded_targets_queried < 400 (fewer than 400 answerable queries asked for a capsule with a superseded generation); answerable_queries < 800 (fewer than 800 answerable queries); retrieval_hits.lexical < 1 (the lexical mode never returned a hit); retrieval_hits.vector < 1 (the vector mode never returned a hit); retrieval_hits.fused < 1 (the fused list never held a hit); late_write_attempts < 50 (fewer than 50 late writes of a non-live generation were attempted); probe_queries < 90 (fewer than 90 probe queries were asked); control_planted_returned < 50 (the no-live-join control returned a planted row fewer than 50 times, so it does not show the defect it exists to show); control_vector_returned < 50 (the no-live-join control's vector query returned the planted row fewer than 50 times); live_probe_lexical_self_hits < 45 (the lexical mode returned the live document for fewer than 45 of the 50 live-body probes: the lexical half, which only the probes exercise, is not working); reference_queries < 1000 (the reference arm did not answer every query); strong_queries < 200 (the strong arm did not answer its 200 queries (a development run without it, or a failure)); recall10_reference_permille < 900 (the reference's own recall@10 is below 900 per mille, so the recall rule against it is not evaluable; the aggregator judges such a seed on every other rule and, if none trips, INVALID); workload_digest_mismatches > 0 (the generated workload is not the pinned one (a harness-integrity guard: the aggregator judges a seed that trips it INVALID, not falsified)). Falsified if any of: stale_hits > 0 (any hit of any list that the harness's live table does not call live: any stale-generation hit is a hard failure); planted_stale_returned > 0 (a planted stale row was returned by any list); projector_residual_rows > 0 (the derived table holds a row that is not live, not planted and not an earlier late write: the projector left a superseded or revoked document behind); late_write_accepted > 0 (upsert_document accepted (or stored) a non-live generation); late_write_wrong_refusal > 0 (a late write of a non-live generation was refused with another error than NotLive); product_errors > 0 (a live write, a search, a projector record or an admissibility question returned an error); lifecycle_projection_mismatches > 0 (the product's is_admissible disagrees with the harness's live table for some capsule generation); product_panics > 0 (the code under test panicked); nondeterministic_searches > 0 (a search answered differently twice on an unchanged snapshot); recall10_pg_deficit_vs_reference_permille > 30 (recall@10 of the fused list is more than the margin below the reference's, a sanity floor against gross failure); recall10_pg_deficit_vs_exact_permille > 30 (recall@10 of the fused list is more than the margin below the harness's own exact dense search over the live set, the sensitivity control); any one of the 5 listed seeds misses any criterion above (every seed must pass). The deficits are max(0, baseline recall@10 - fused recall@10) in per mille over the answerable queries, with the margin 30 pinned in config.toml for each. The reference rule is a sanity floor (it trips only below the reference's recall minus 30 per mille, 912 for a reference at 942, because the BM25-OR hybrid is worse than plain dense retrieval on this templated corpus); the exact-search rule is the sensitivity control for a smaller regression of the dense list. Not tested and not a falsifier: the quality of ptr-pg's lexical half on natural-language queries (its lexical list is empty there, because plainto_tsquery joins every term with AND; main_query_lexical_hits counts it; only the live-body probes exercise the lexical mode). The strong baseline is never gated: it answers a seeded subset of 200 answerable queries stratified by checkpoint and live generation, and its recall@10, nDCG@10, the product's recall@10 and nDCG@10 on the same queries, the deficit against it, the discordant queries and a 95 percent upper bound on their share are descriptive. nDCG@10, the recall of the lexical and vector lists alone, of the harness's exact dense search and of BM25 alone, the paired standard error of the recall difference against the reference, every latency and the index build time are descriptive and never judged."
