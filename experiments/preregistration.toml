# The four owner decisions (calibration_set_rule, adjudicators_see_intent,
# harm_breakdown_namespaces, adjudication_protocol) block until signed.
[experiment.F003.required]
seeds = "int-list"
alpha_permille = "int"
delta_permille = "int"
threshold_rule = "str"
threshold_grid_steps = "int"
min_adjudications_per_policy = "int"
uncalibrated_threshold_permille = "int"
calibration_set_rule = "str"
adjudicators_see_intent = "bool"
harm_breakdown_namespaces = "str"
adjudication_protocol = "file"

[experiment.Q003.required]
seeds = "int-list"
recall_margin_permille = "int"
k = "int"
embedding_model = "str"
embedding_revision = "str"

