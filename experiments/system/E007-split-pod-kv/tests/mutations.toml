    table.tombstones.insert(
        tuple,
        Tombstone::Abandoned {
            retain_until_ms: now_ms.saturating_add(policy.replay_window_ms),
        },
    );
    released
}'''
replace = '''
    table.tombstones.insert(
        tuple,
        Tombstone::Abandoned {
            retain_until_ms: now_ms,
