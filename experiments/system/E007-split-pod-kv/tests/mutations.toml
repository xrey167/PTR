# Defects the E007 harness must detect; run with `python scripts/mutation_check.py E007`
# (`--check` verifies the anchors only). Each `find` must occur exactly once in its file (checked
# by `--check`), so the list cannot drift from the code silently. `expect` names the hard counters
# that show the defect: a run that fails only on others does not count as detecting it. The five
# mutations of the harness's own validity (the model pin, the corpus selection, the receiver window,
# the receiver total cap, the late replay window) say `expect_exit = 2`: the record stops describing
# the frozen run, the harness prints it and exits 2 (validity first: even when the same cause also
# fires a product counter), and the aggregator reads that as INVALID, so they are killed by that
# exit and their counter rather than by status 1.
#
# The mutations plant defects in the product (the chunk assembler of `ptr-podwire`, the activation
# schemas of `ptr-protocol`, the downstream stage cache of `ptr-runtime`, the stage execution of
# `ptr-pods`) and, for the measurements the product cannot be made to violate, in the harness
# itself (a stage that ships a KV page or a cache handle in a valid frame, a control row installed
# as KV, a consistency check that never holds, a late replay outside its window, a changed corpus
# rule, receiver limit and model pin): each makes a cross-check of the harness fire a hard counter,
# so the harness is not vacuous where the product is correct. Every hard counter is expected by at
# least one mutation (a test in bins/ptr-bench checks this list against the harness), and each of
# the six cells of the invalidation matrix has its own hard counter that some mutation expects.
#
# Not listed, on purpose, because the harness cannot see them (stated limits, see PREREGISTRATION.md):
# - removing only `invalidate_stage` (the Revoke message path): the revalidation at use makes it an
#   optimisation, not a guarantee, which is the property under test, so no defect there is visible;
# - the revalidation of the base model, of adapters and of experts in `revalidate_chain`: E007 has
#   no such element in its chain (E008 does), only the stage is exercised here;
# - the deadline-too-far bound and the byte bound of one frame, which no case of E007 probes.
#
# The mutation run is invoked as `ptr-bench split-pod-kv <sequences> 1001`: `sequences` is the number
# of corpus sequences run three ways (the pinned scale is 24), every probe, attack, bound and
# stale-upstream case still runs in full. The record says `"scale":"custom"` and is no evidence; the
# seed is not one of the experiment's.

package = "ptr-bench"
features = ""
subcommand = "split-pod-kv"
cases = 2
seed = 1001
hard_counters = [

    "bitwise_mismatch_count",
    "large_frame_reassembled_bytes_mismatch_count",
    "large_frame_digest_mismatches",
    "wire_kv_handle_count",
    "wire_kv_page_bytes",
    "kv_pages_installed_from_wire",
    "activation_control_kv_installs",
    "chain_mismatch_stores",
    "non_allowlisted_payloads_admitted",
    "smuggling_probes_admitted",
    "attempts_without_typed_rejection",
    "verdict_mismatches",
    "cross_frame_mixing_count",
    "buffered_bytes_after_release",
    "stale_upstream_kv_served",
    "positions_length_mismatches_admitted",
    "mislabelled_frame_digests_admitted",
    "late_chunks_after_abandon_admitted",
    "outputs_after_upstream_invalidation",
    "tombstone_evictions_before_retention",
    "tombstone_bound_violations",
    "cross_operation_splices_admitted",
    "replayed_frames_admitted",
    "valid_frame_bitwise_mismatches",
    "cross_session_replays_admitted",
    "duplicate_activation_deliveries",
    "expired_frames_admitted",
    "abandoned_frame_replays_admitted",
    "stale_placement_frames_admitted",
    "relabeled_chunks_admitted",
    "unbound_stage_frames_admitted",
    "global_cap_breaches",
    "non_exact_frames_admitted",
    "non_finite_frames_admitted",
    "chain_frame_mismatches_delivered",
    "boundary_tick_replays_admitted",
    "cache_slots_held_by_dead_entries",
    "unsigned_chunks_admitted",
    "selection_digest_mismatches",
    "procedure_mismatches",
    "model_pin_mismatches",
    "late_window_delays_out_of_range",
    "stale_hits_in_upstream_stage_generation_normal_revocation",
    "stale_hits_in_upstream_stage_generation_normal_supersession",
    "stale_hits_in_upstream_stage_generation_lag_revocation",
    "stale_hits_in_upstream_stage_generation_lag_supersession",
    "stale_hits_in_upstream_stage_generation_inflight_revocation",
    "stale_hits_in_upstream_stage_generation_inflight_supersession",
    "abandoned_chunks_unreleased",
    "frames_without_consistent_digest",
    "abandoned_id_set_mismatch",
    "valid_id_set_mismatch",
]

[[mutation]]
name = "chunk-digest-unchecked"
description = "The receiver does not compare a chunk digest with the chunk bytes."
expect = ["attempts_without_typed_rejection", "verdict_mismatches"]
file = "crates/ptr-podwire/src/chunk.rs"
find = '''
        if chunk_digest(header, view.bytes) != header.chunk_digest {'''
replace = '''
        if false && chunk_digest(header, view.bytes) != header.chunk_digest {'''

[[mutation]]
name = "signature-unchecked"
description = "The receiver does not verify the signature of the envelope."
expect = ["unsigned_chunks_admitted", "relabeled_chunks_admitted"]
file = "crates/ptr-podwire/src/chunk.rs"
find = '''
            .verify_strict(&envelope_signing_bytes(header), &signature)
            .is_err()
'''
replace = '''
            .verify_strict(&envelope_signing_bytes(header), &signature)
            .is_err()
            && false
'''

[[mutation]]
name = "tombstone-not-consulted"
description = "A tombstoned tuple is not refused: completed and abandoned frames are taken again."
expect = ["replayed_frames_admitted", "late_chunks_after_abandon_admitted", "abandoned_frame_replays_admitted", "cross_session_replays_admitted", "duplicate_activation_deliveries"]
file = "crates/ptr-podwire/src/chunk.rs"
find = '''
        match table.tombstones.get(&tuple) {
            Some(Tombstone::Completed { .. }) => return Err(Rejection::FrameReplayed),
            Some(Tombstone::Abandoned { .. }) => return Err(Rejection::FrameAbandoned),
            None => {}
        }'''
replace = '''
        match table.tombstones.get(&tuple) {
            Some(Tombstone::Completed { .. }) if false => return Err(Rejection::FrameReplayed),
            Some(Tombstone::Abandoned { .. }) if false => return Err(Rejection::FrameAbandoned),
            _ => {}
        }'''

[[mutation]]
name = "completion-leaves-no-tombstone"
description = "A completed frame is forgotten: no completion tombstone is written."
expect = ["replayed_frames_admitted", "cross_session_replays_admitted", "duplicate_activation_deliveries"]
file = "crates/ptr-podwire/src/chunk.rs"
find = '''
                table.tombstones.insert(
                    tuple,
                    Tombstone::Completed {
                        retain_until_ms: finished
                            .deadline_ms
                            .saturating_add(policy.max_clock_skew_ms),
                    },
                );'''
replace = '''
                let _ = Tombstone::Completed {
                    retain_until_ms: finished
                        .deadline_ms
                        .saturating_add(policy.max_clock_skew_ms),
                };'''

[[mutation]]
name = "abandonment-tombstone-retention-zero"
