            let v = activations[row * 64 + 32..row * 64 + 64].to_vec();
            let keys: Vec<TensorRef> = (0..2)
                .map(|layer| TensorRef { layer, shape: vec![1, 32], values: k.clone() })
                .collect();
            let values: Vec<TensorRef> = (0..2)
                .map(|layer| TensorRef { layer, shape: vec![1, 32], values: v.clone() })
                .collect();
            pods.stage_b
                .backend
                .append(&mut pods.stage_b.cache, &keys, &values)
                .map_err(fail("installing"))?;
        }
    }'''

