hypothesis = "Splitting a model's layers across two pods, with the KV of each layer range kept on the pod that hosts it and only activation frames crossing PodWire, changes nothing about the output and opens, for none of the enumerated probe kinds of this in-process harness, a way for KV or for stale KV to cross. Scope (a priori, owner decision of 2026-10-09: E007 is the core, the extensions are E008): the CPU reference path, a tiny seeded 4-layer dense decoder (hidden 64, 4 heads, 2 KV heads, vocabulary 256, weight_seed 20240607) split at the internal layer 2 (0 < split_layer < L), the boundary dtype F32 (the reference path is F32 only), frames crossing the real PodWire request frame codec in process as signed chunks into a receiving assembler, and a downstream stage cache revalidated against a PtrRuntime ledger and a placement controller. (1) Bit-identity: for every corpus sequence the final logits bytes (every prompt row and every decode step) plus the per-layer KV bytes on each pod are bit-identical to the single-pod run, which applies the identical boundary cast (a no-op in F32), both with the stages in process and with every activation frame crossing the wire; a downstream cache hit continues bit-identically with the recomputation; activation_frames_crossed is at least 24 sequences x 8 frames. This checks the plumbing, not the math (the layer code is shared). (2) Transport: a frame larger than one body (16 MiB = 2048 tokens x 2048 width in F32, above MAX_BODY_BYTES = 4 MiB) is refused by PodWire when sent whole and reassembles bit-identically to the bytes sent, digest over the complete payload, when sent as 5 chunks of at most 3.5 MiB out of order inside reorder_window = 4 (a transport-only case; the model-computation case uses the 64-wide model). (3) Admission is an allowlist of activation and policy schemas, decoded and shape-checked (tokens x width x dtype, and the length of positions, for every activation payload, valid tensors included): a KV page mislabelled as an allowlisted type, under a type id that is not allowlisted (also a valid signed chunk under such a type), or inside a correctly typed signed frame (KV-sized, with trailing bytes, a wrong shape or a wrong positions length) is never admitted; no admitted legitimate payload carries a KV page or a cache handle (an independent scan of the capture, probe bytes excluded); an activation-shaped KV payload is a positive control consumed only as activation and never installed (the receiving pod has no KV-install path from PodWire). (4) Chunk protocol: every chunk carries the whole-frame digest, chunk_digest binds frame_digest, parent_operation_id, signed_absolute_deadline and the upstream chain, and an Ed25519 signature of the upstream runtime covers the complete envelope; the reassembly identity is (principal, parent_operation_id, frame_id); each of 19 enumerated adversarial attempt kinds, and the further attempts of the preregistration (unsigned chunk, expired deadline, relabelled envelope), ends in a typed rejection of the variant a hand-written table pins; two frames with one upstream chain reassembled with interleaved chunks do not mix in any of the interleaving cases; an abandoned frame, explicit or by expiry, releases exactly the chunks it held (identity-set equality) and returns the buffered bytes to the baseline before the next frame reassembles; late chunks, replays under fresh request ids, replays after a reconnect and a concurrent assembly of one tuple from two sessions yield no second delivery; the per-principal table is bounded: admitted incomplete frames + retained tombstones (abandoned and completed) never exceed max_frame_tombstones_per_principal = 64, a full table refuses new frames with a typed FrameTableFull, no tombstone is evicted before its retention (abandonment_time + replay_window_ms, completion: deadline + clock skew), and one frame is accepted when the first tombstone expires; replay_window_ms = 10000 >= max_frame_deadline_lifetime_ms 5000 + 2 * max_clock_skew_ms 1000, and a replay delayed within [9000, 10000) ms after an abandonment is refused. All preregistered: reorder_window = 4, frame_deadline_ms = 5000, max_incomplete_frames_per_peer = 8, max_chunks_in_flight = 32. (5) Fence epoch and dependency invalidation (J0: an explicit revocation or a committed supersession of the upstream stage generation): the downstream stage revalidates the upstream stage (identity, generation, manifest digest) and the placement epoch captured at production against the runtime at every use (admission of a frame, lookup, start and release of a use), so a dropped, delayed or in-flight Revoke message does not let a downstream pod serve KV derived from an old upstream chain, release an output after the invalidation, or admit the frame of an old worker after a re-placement without a generation change in any of the six cells; the cells upstream_stage_generation x {revocation, supersession} x {normal, lag, inflight} (6 cells) are each exercised and none has a stale hit; the downstream cache has no persistence operation (the restore path does not apply). Controls (naive configurations that must each trip, or the probe they shadow could not tell the protection from its absence): the real downstream cache with a liveness frozen at storing, which after the ledger revokes the stage and the Revoke message is dropped still serves, while the real liveness refuses; the real assembler without its tombstones (rebuilt on completion), which delivers a replay again; a harness-only reassembler keyed by the upstream chain alone, which mixes interleaved real chunks; a harness-only deny-list admission, which takes a real KV page under another name that the real allowlist refuses; the unchunked 16 MiB frame, which the real PodWire codec refuses. The first two run the product code with the protection removed; the other two are reference models; the evidence that a counter can fire at all is the mutation set (59 planted defects, all of which must be killed)."
