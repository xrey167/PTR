version = 1
id = "E007"
status = "planned"
hypothesis = "splitting a model's layers across two pods, with KV kept on the hosting pod and only activation frames crossing PodWire, is bit-identical to a single-pod run over an internal split with at least one layer on each pod (0 < split_layer < L; pinned split_layer = L/2) that is shown to carry activation-frame traffic; PodWire admission is an allowlist of activation/policy schemas, so no non-allowlisted payload is admitted; concurrent interleaved reassembly of two frames with the same upstream_chain does not mix chunks across frames, an abandoned frame expires and releases its chunks before a successful reassembly, and a frame larger than one body (8 MiB at 2048 tokens x 2048 width in bf16, above MAX_BODY_BYTES = 4 MiB) is bit-identical to the single-pod run, or under the supported-shape-limit alternative fails closed with a typed refusal."
metrics = "bitwise_mismatch_count, wire_kv_handle_count, wire_kv_page_bytes, chain_mismatch_stores, activation_frames_crossed, non_allowlisted_payloads_admitted, mislabelled_kv_payload_attempts, interleaved_frame_pairs, cross_frame_mixing_count, abandoned_frame_cases, abandoned_chunks_released, large_frame_cases, large_frame_bitwise_mismatch_count, typed_shape_refusals"
baseline = "single-pod run"
falsification = "any output difference, any PodWire message carrying a KV handle (wire_kv_handle_count > 0) or KV page bytes (wire_kv_page_bytes > 0), as measured on the captured wire traffic in wire_capture.json, or any stage storing pages under a mismatched upstream chain; the run is invalid and counts as falsified if activation_frames_crossed == 0 or the split is not internal (split_layer <= 0 or >= L), and equivalence and KV isolation are evaluated only after that check passes; also falsified if any non-allowlisted payload is admitted (non_allowlisted_payloads_admitted > 0), or if mislabelled_kv_payload_attempts < 1 (at least one adversarial attempt sending KV bytes under an innocuous type_id is required, else the run is vacuous); also falsified by any cross-frame mixing (cross_frame_mixing_count > 0) in the concurrent interleaved reassembly of two frames with the same upstream_chain (interleaved_frame_pairs >= 1), by an abandoned frame whose chunks are not released or which breaks a following successful reassembly (abandoned_frame_cases >= 1), and by a frame larger than one body (large_frame_cases >= 1; 8 MiB at 2048 x 2048 bf16) that is not bit-identical to the single-pod run, or, under the shape-limit alternative, that does not produce the typed refusal (typed_shape_refusals >= 1); any zero attempt counter is vacuous and falsified."
hardware_profile = "hardware/default.toml"
entrypoint = ""
seeds = [17, 29, 43, 71, 101]
results_dir = "results"
required_artifacts = ["run.json", "metrics.json", "wire_capture.json"]
