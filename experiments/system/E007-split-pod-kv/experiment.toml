version = 1
id = "E007"
status = "planned"
hypothesis = "splitting a model's layers across two pods, with KV kept on the hosting pod and only activation frames crossing PodWire, is bit-identical to a single-pod run over an internal split with at least one layer on each pod (0 < split_layer < L; pinned split_layer = L/2) that is shown to carry activation-frame traffic; PodWire admission is an allowlist of activation/policy schemas, so no non-allowlisted payload is admitted; concurrent interleaved reassembly of two frames with the same upstream_chain does not mix chunks across frames, an abandoned frame expires and releases its chunks before a successful reassembly, and a frame larger than one body (16 MiB at 2048 tokens x 2048 width in F32, above MAX_BODY_BYTES = 4 MiB) reassembles bit-identically to the bytes sent (a transport-only case; the model-computation bitwise case uses the seeded 64-wide split model against single-pod execution); the boundary dtype is F32 (the reference path is F32 only), the single-pod baseline applies the identical boundary cast (a no-op in F32), and 'output' means the final logits bytes plus the per-layer KV bytes on each pod, compared with single-pod; every chunk carries a whole-frame digest and chunk_digest binds it; the receiving pod has no KV-install path from PodWire (an activation frame is only ever fed to compute); pods re-validate against a runtime-issued fence epoch at use, so a dropped or delayed Revoke message never lets a downstream pod serve KV derived from an old upstream chain; the bitwise claims use seeded random weights with a pinned seed and shape, and the large frame is sent as 5 chunks of at most 3.5 MiB with reorder_window = 4, frame_deadline_ms = 5000, max_incomplete_frames_per_peer = 8 and max_chunks_in_flight = 32 (all preregistered); chunked frames are mandatory (there is no shape-limit alternative), so every chunk prerequisite applies unconditionally; each chunk header carries a signed absolute deadline and the parent operation id, and the receiver keeps a bounded per-principal frame-id tombstone after abandonment so late chunks are rejected; dependency invalidation (J0): an explicit revocation or a committed supersession, i.e. a generation replacement or edit, of any generation-bearing dependency; every protective mechanism of this experiment triggers on any invalidation, for the dependency kinds it covers (upstream stage generations); when the per-principal tombstone table is full, new frames are refused with a typed FrameTableFull (rate-limited) until a tombstone expires, and tombstones are never evicted before their retention; admitting an incomplete frame reserves one future tombstone, so admitted_incomplete_frames + retained_tombstones never exceeds max_frame_tombstones_per_principal and a frame for which no reservation is possible is refused with FrameTableFull; chunk_digest covers frame_digest, parent_operation_id and signed_absolute_deadline, the reassembly identity is (session, parent_operation_id, frame_id), and any mismatch across chunks rejects the frame; a successfully reassembled frame leaves a completion tombstone keyed (session, parent_operation_id, frame_id), retained until signed_absolute_deadline plus the clock skew bound, so any replay of its chunks, also under fresh request ids, is rejected with a typed FrameReplayed; the tombstone reserved at admission serves either abandonment or completion, so the bound counts abandoned and completed frames together; the typed-rejection requirement applies only to the enumerated adversarial attempt kinds, while valid frames complete bit-identically; completion and abandonment tombstones are keyed at principal scope (authenticated principal, parent_operation_id, frame_id), not per session, and survive reconnects until signed_absolute_deadline plus the clock skew bound, and the reservation bound is per principal (max_frame_tombstones_per_principal = 64); in-progress frame assembly is reserved at principal scope: the first accepted chunk atomically reserves (authenticated principal, parent_operation_id, frame_id) in the same principal-scoped table as the tombstones, a concurrent assembly of the same tuple from another session is rejected typed or joins the single buffer so exactly one delivery results, and reservations count against max_frame_tombstones_per_principal and expire at the signed deadline plus the clock skew bound into an abandonment tombstone; pipeline-split frames carry authenticated input lineage (identity, generation and digest of every semantic and memory input that contributed to the activation, signed by the upstream runtime with the frame), the downstream KV entry records it, and downstream use-time admission revalidates it against live generations so a dropped Revoke or index lag cannot serve KV derived from an invalidated input; Derived segments are generation-bearing dependencies like semantic and memory inputs: the closed list of dependency kinds is semantic, memory, derived, base model, adapter and expert, and any future generation-bearing segment kind joins by definition; input_lineage also carries the ordered (Raw, content_digest) ancestry of every Raw segment that influenced the activation, the downstream cache key includes the activation-frame digest, and downstream reuse requires the same ordered raw ancestry; upstream_chain carries every chain expert's generation and per-expert fence epoch and downstream admission revalidates both; abandonment tombstones are retained until abandonment_time plus replay_window, with replay_window >= max_frame_deadline_lifetime + 2 * max_clock_skew_ms (replay_window_ms = 10000, max_frame_deadline_lifetime_ms = 5000, max_clock_skew_ms = 1000), and admission rejects any frame whose signed_absolute_deadline has already passed (minus skew) before reserving a tuple."
metrics = "bitwise_mismatch_count, wire_kv_handle_count, wire_kv_page_bytes, chain_mismatch_stores, activation_frames_crossed, non_allowlisted_payloads_admitted, mislabelled_kv_payload_attempts, interleaved_frame_pairs, cross_frame_mixing_count, abandoned_frame_cases, abandoned_chunks_released, large_frame_cases, chain_mismatch_attempts, duplicate_chunk_attempts, out_of_window_attempts, bad_chunk_digest_attempts, mixed_version_frame_attempts, incomplete_frames_over_peer_limit, queue_overflow_attempts, reassembly_attempts_after_abandon, interleaved_chunk_switches, abandoned_chunks_sent, buffered_bytes_after_release, kv_sized_allowlisted_smuggling_attempts, shape_validation_rejections, stale_upstream_kv_served, stale_upstream_attempts, kv_pages_installed_from_wire, splice_attempts, non_allowlisted_type_attempts, valid_frames_sent, frames_with_consistent_whole_frame_digest, buffered_bytes_before_abandon, stale_upstream_entries_before_revocation, revoke_messages_dropped_or_delayed, attempts_without_typed_rejection, positions_length_rejection_attempts, positions_length_mismatches_admitted, activation_control_cases, activation_control_kv_installs, mislabelled_frame_digest_attempts, mislabelled_frame_digests_admitted, large_frame_reassembled_bytes_mismatch_count, large_frame_digest_mismatches, late_chunks_after_abandon_attempts, late_chunks_after_abandon_admitted, inflight_split_request_race_cases, outputs_after_upstream_invalidation, tombstone_saturation_cases, new_frames_refused_typed, tombstone_evictions_before_retention, selection_digest_mismatches, procedure_mismatches, frames_accepted_after_tombstone_expiry, abandoned_frames_in_saturation_case, tombstones_retained_at_saturation, overcapacity_frame_attempts, abandoned_chunk_id_set_digest, released_chunk_id_set_digest, valid_sent_frame_id_set_digest, consistent_digest_frame_id_set_digest, concurrent_abandonment_cases, tombstone_bound_violations, cross_operation_splice_attempts, cross_operation_splices_admitted, full_frame_replay_attempts, replayed_frames_admitted, valid_frame_bitwise_mismatches, invalidation_matrix_cases, invalidation_matrix_stale_hits, digest_inconsistency_attempts, cross_session_replay_attempts, cross_session_replays_admitted, smuggling_probe_attempts, smuggling_probes_admitted, concurrent_cross_session_assembly_cases, duplicate_activation_deliveries, raw_ancestor_omission_cases, reuse_after_raw_ancestor_removed, upstream_expert_fence_cases, downstream_kv_reuse_after_upstream_fence, expired_deadline_frame_attempts, expired_frames_admitted, post_abandonment_replay_cases, abandoned_frame_replays_admitted"
baseline = "single-pod run"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: activation_frames_crossed < 1, or the split is not internal (split_layer <= 0 or split_layer >= L); smuggling_probe_attempts < 1 for any kind (mislabelled KV payload, non-allowlisted type, KV-sized smuggling inside an allowlisted type_id; recorded per kind, probe bytes excluded from the admitted-traffic byte count), mislabelled_kv_payload_attempts < 1, non_allowlisted_type_attempts < 1, activation_control_cases < 1 (the activation-shaped KV payload consumed only as activation is a positive control, not an attack) or kv_sized_allowlisted_smuggling_attempts < 1; any of chain_mismatch_attempts, duplicate_chunk_attempts, out_of_window_attempts, bad_chunk_digest_attempts, mixed_version_frame_attempts, incomplete_frames_over_peer_limit, queue_overflow_attempts or splice_attempts < 1 (splice: individually valid chunks from different frames); shape_validation_rejections < 1 (wrong tensor shape) or positions_length_rejection_attempts < 1 (valid tensor shape, invalid positions length); interleaved_frame_pairs < 1 or interleaved_chunk_switches < 1 (two frames with the same upstream_chain reassembled concurrently with interleaved chunks); abandoned_frame_cases < 1, abandoned_chunks_sent < 1, buffered_bytes_before_abandon not above baseline, or reassembly_attempts_after_abandon < 1; large_frame_cases < 1 (16 MiB at 2048 x 2048 F32, above MAX_BODY_BYTES = 4 MiB); stale_upstream_attempts < 1 (the upstream stage generation revoked or superseded), inflight_split_request_race_cases < 1 (a request in flight when the upstream generation is invalidated), tombstone_saturation_cases < 1 or new_frames_refused_typed < 1, stale_upstream_entries_before_revocation < 1 or revoke_messages_dropped_or_delayed < 1; mislabelled_frame_digest_attempts < 1 (an adversary whose chunks all carry a consistent but wrong frame_digest); late_chunks_after_abandon_attempts < 1 (chunks of an abandoned frame sent after its abandonment); selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); frames_accepted_after_tombstone_expiry < 1 (after the saturating case a new frame must be accepted once a tombstone expires), or tombstones_retained_at_saturation != max_frame_tombstones_per_principal (64) or overcapacity_frame_attempts < 1 (attempts to open or abandon frames beyond capacity, counted separately from abandoned frames); inflight_split_request_race_cases and stale_upstream_attempts < 1 for any member of {revocation, supersession} (recorded and required per member, never as one aggregate); abandoned_chunk_id_set_digest != released_chunk_id_set_digest (every abandoned chunk released: exact identity-set equality, not count equality); valid_sent_frame_id_set_digest != consistent_digest_frame_id_set_digest (every frame carried one consistent whole-frame digest: exact identity-set equality, not count equality); concurrent_abandonment_cases < 1 (several admitted frames abandoned together near the bound), or cross_operation_splice_attempts < 1; full_frame_replay_attempts < 1 (including at least one replay under fresh request ids); invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 33 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate); digest_inconsistency_attempts < 1 (digest-inconsistent adversarial frames: mixed-version frames and splices, which must all be rejected typed); cross_session_replay_attempts < 1 (a reconnect before the deadline followed by a replay of the same chunks); concurrent_cross_session_assembly_cases < 1 (the same (principal, parent_operation_id, frame_id) assembled concurrently from two sessions); raw_ancestor_omission_cases < 1 (an earlier Raw segment removed or changed with the typed inputs, chain and positions equal); upstream_expert_fence_cases < 1 (an upstream-chain expert fenced, then a downstream request that could reuse KV derived through it); expired_deadline_frame_attempts < 1, or post_abandonment_replay_cases < 1 (replay of abandoned chunks under fresh PodWire request ids after abandonment). Falsified if any of: bitwise_mismatch_count > 0 in the model-computation case (seeded 64-wide split model versus single-pod execution; output = final logits bytes plus per-layer KV bytes on each pod, compared with single-pod whose baseline applies the identical boundary cast; F32 boundary) or large_frame_reassembled_bytes_mismatch_count > 0 or large_frame_digest_mismatches > 0 in the transport-only large-frame case (the 2048 tokens x 2048 width frame is transport only: the reassembled bytes must equal the sent bytes and the frame digest is taken over the complete payload); wire_kv_handle_count > 0 or wire_kv_page_bytes > 0 on the captured wire traffic in wire_capture.json (wire_kv_page_bytes counts only admitted legitimate PodWire traffic: the bytes of any admitted payload that does not decode as an allowlisted schema or that matches the digest of a KV page held by either pod; it excludes the activation control and the bytes of every adversarial probe); kv_pages_installed_from_wire > 0 or activation_control_kv_installs > 0 (the activation-shaped KV payload must be consumed as activations and never installed); chain_mismatch_stores > 0 (a stage storing pages under a mismatched upstream chain); non_allowlisted_payloads_admitted > 0; any attempt kind listed in adversarial_attempt_kinds (config.toml) not ending in a typed rejection (attempts_without_typed_rejection > 0; the activation control is excluded because it is consumed, not rejected); cross_frame_mixing_count > 0; abandoned_chunks_released below abandoned_chunks_sent, or buffered_bytes_after_release above the baseline; frames_with_consistent_whole_frame_digest != valid_frames_sent (over valid frames only); stale_upstream_kv_served > 0; positions_length_mismatches_admitted > 0 (a payload with valid tensor shape but invalid positions length admitted); mislabelled_frame_digests_admitted > 0 (the receiver must hash the complete reassembled payload); late_chunks_after_abandon_admitted > 0; outputs_after_upstream_invalidation > 0 (an in-flight request's output after the upstream invalidation) or tombstone_evictions_before_retention > 0; tombstone_bound_violations > 0 (admitted_incomplete_frames + retained_tombstones exceeded max_frame_tombstones_per_principal), or cross_operation_splices_admitted > 0 (chunks of different parent operations admitted into one frame); replayed_frames_admitted > 0 (a completed frame admitted again), or valid_frame_bitwise_mismatches > 0 (a valid frame, i.e. the 16 MiB chunked control, a concurrent valid reassembly or the activation control, not completing bit-identically); invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); cross_session_replays_admitted > 0; smuggling_probes_admitted > 0 (any probe of any kind admitted); duplicate_activation_deliveries > 0; reuse_after_raw_ancestor_removed > 0; downstream_kv_reuse_after_upstream_fence > 0; expired_frames_admitted > 0 or abandoned_frame_replays_admitted > 0; any one of the 5 listed seeds misses any criterion above (every seed must pass). The allowlist validates tensor shape (tokens x width x dtype) and the positions length for every activation payload, including otherwise valid tensors. Pinned in config.toml: boundary dtype F32, hidden_size 64 for the model-computation case (the 2048 x 2048 width belongs only to the transport-only large frame), vocabulary size, 5 chunks of at most 3.5 MiB for the 16 MiB frame, reorder_window, frame_deadline_ms, max_incomplete_frames_per_peer, max_chunks_in_flight; seeded random weights with a pinned seed and shape."
hardware_profile = "hardware/default.toml"
