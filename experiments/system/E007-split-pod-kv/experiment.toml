version = 1
id = "E007"
status = "planned"
hypothesis = "splitting a model's layers across two pods, with KV kept on the hosting pod and only activation frames crossing PodWire, is bit-identical to a single-pod run over an internal split with at least one layer on each pod (0 < split_layer < L; pinned split_layer = L/2) that is shown to carry activation-frame traffic; PodWire admission is an allowlist of activation/policy schemas, so no non-allowlisted payload is admitted; concurrent interleaved reassembly of two frames with the same upstream_chain does not mix chunks across frames, an abandoned frame expires and releases its chunks before a successful reassembly, and a frame larger than one body (16 MiB at 2048 tokens x 2048 width in F32, above MAX_BODY_BYTES = 4 MiB) is bit-identical to the single-pod run, or under the supported-shape-limit alternative fails closed with a typed refusal; the boundary dtype is F32 (the reference path is F32 only), the single-pod baseline applies the identical boundary cast (a no-op in F32), and 'output' means the final logits bytes plus the per-layer KV bytes on each pod, compared with single-pod; every chunk carries a whole-frame digest; pods re-validate against a runtime-issued fence epoch at use, so a dropped or delayed Revoke message never lets a downstream pod serve KV derived from an old upstream chain."
metrics = "bitwise_mismatch_count, wire_kv_handle_count, wire_kv_page_bytes, chain_mismatch_stores, activation_frames_crossed, non_allowlisted_payloads_admitted, mislabelled_kv_payload_attempts, interleaved_frame_pairs, cross_frame_mixing_count, abandoned_frame_cases, abandoned_chunks_released, large_frame_cases, large_frame_bitwise_mismatch_count, typed_shape_refusals, chain_mismatch_attempts, duplicate_chunk_attempts, out_of_window_attempts, bad_chunk_digest_attempts, mixed_version_frame_attempts, incomplete_frames_over_peer_limit, queue_overflow_attempts, reassemblies_after_abandon, interleaved_chunk_switches, abandoned_chunks_sent, abandoned_chunks_released, buffered_bytes_after_release, kv_sized_allowlisted_smuggling_attempts, shape_validation_rejections, stale_upstream_kv_served, stale_upstream_attempts"
baseline = "single-pod run"
falsification = "any output difference, any PodWire message carrying a KV handle (wire_kv_handle_count > 0) or KV page bytes (wire_kv_page_bytes > 0), as measured on the captured wire traffic in wire_capture.json, or any stage storing pages under a mismatched upstream chain; the run is invalid and counts as falsified if activation_frames_crossed == 0 or the split is not internal (split_layer <= 0 or >= L), and equivalence and KV isolation are evaluated only after that check passes; also falsified if any non-allowlisted payload is admitted (non_allowlisted_payloads_admitted > 0), or if mislabelled_kv_payload_attempts < 1 (at least one adversarial attempt sending KV bytes under an innocuous type_id is required, else the run is vacuous); also falsified by any cross-frame mixing (cross_frame_mixing_count > 0) in the concurrent interleaved reassembly of two frames with the same upstream_chain (interleaved_frame_pairs >= 1), by an abandoned frame whose chunks are not released or which breaks a following successful reassembly (abandoned_frame_cases >= 1), and by a frame larger than one body (large_frame_cases >= 1; 16 MiB at 2048 x 2048 F32) that is not bit-identical to the single-pod run, or, under the shape-limit alternative, that does not produce the typed refusal (typed_shape_refusals >= 1); any zero attempt counter is vacuous and falsified; the large frame is F32 (2048 tokens x 2048 width x 4 B = 16 MiB, above MAX_BODY_BYTES = 4 MiB) and 'output' is the final logits bytes plus per-layer KV bytes on each pod compared with single-pod, whose baseline applies the identical boundary cast; each of chain_mismatch_attempts, duplicate_chunk_attempts, out_of_window_attempts, bad_chunk_digest_attempts, mixed_version_frame_attempts (chunks of two frame versions under one frame_id), incomplete_frames_over_peer_limit and queue_overflow_attempts must be >= 1 and each attempt must end in a typed rejection; reassemblies_after_abandon >= 1; interleaved_chunk_switches >= 1; abandoned_chunks_released == abandoned_chunks_sent; buffered_bytes_after_release must return to the baseline; the allowlist validates tensor shape (tokens x width x dtype) and the positions length (shape_validation_rejections >= 1); a KV-sized smuggling attempt inside an allowlisted type_id is rejected (kv_sized_allowlisted_smuggling_attempts >= 1); split-pod revocation arm: revoking an upstream stage generation, dropping or delaying the Revoke message, then sending a request must not serve KV derived from the old upstream chain (stale_upstream_attempts >= 1, stale_upstream_kv_served == 0); every seed must meet every criterion."
