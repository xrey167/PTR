_after_tombstone_expiry < 1; no late-window replay delay in [9000, 10000); stale_upstream_attempts and inflight_split_request_race_cases below 1 for either member of {revocation, supersession} (per member, never one aggregate); invalidation_matrix_cases below 1 in any of the 6 cells (per cell); stale_upstream_entries_before_revocation < 1; revoke_messages_dropped_or_delayed < 2; (a control not tripped makes the seed INVALID, not vacuous: see the validity rules). Falsified (an observed violation by the product) if any of: bitwise_mismatch_count, valid_frame_bitwise_mismatches, large_frame_reassembled_bytes_mismatch_count, large_frame_digest_mismatches, wire_kv_handle_count, wire_kv_page_bytes, kv_pages_installed_from_wire, activation_control_kv_installs, chain_mismatch_stores, non_allowlisted_payloads_admitted, smuggling_probes_admitted, attempts_without_typed_rejection, verdict_mismatches, cross_frame_mixing_count, buffered_bytes_after_release, stale_upstream_kv_served, positions_length_mismatches_admitted, mislabelled_frame_digests_admitted, late_chunks_after_abandon_admitted, outputs_after_upstream_invalidation, tombstone_evictions_before_retention, tombstone_bound_violations, cross_operation_splices_admitted, replayed_frames_admitted, cross_session_replays_admitted, duplicate_activation_deliveries, expired_frames_admitted, abandoned_frame_replays_admitted, stale_placement_frames_admitted, relabeled_chunks_admitted, unsigned_chunks_admitted, unbound_stage_frames_admitted, global_cap_breaches, non_exact_frames_admitted, non_finite_frames_admitted, chain_frame_mismatches_delivered, boundary_tick_replays_admitted, or cache_slots_held_by_dead_entries is above 0, or invalidation_matrix_stale_hits is above 0 in any cell; abandoned_chunks_released is below abandoned_chunks_sent; frames_with_consistent_whole_frame_digest differs from valid_frames_sent; the abandoned and released chunk-id set digests differ; the valid-sent and consistent-digest frame-id set digests differ (exact identity-set equality, not count equality); any one of the 5 listed seeds misses any criterion above (every seed must pass). INVALID, not falsified, if selection_digest_mismatches, procedure_mismatches, model_pin_mismatches or late_window_delays_out_of_range is above 0 (validity: the record does not describe the frozen run; the harness exits 2), if a control did not trip, or on a record, exit status or counter the rules cannot read. Precedence, validity first: INVALID when a validity counter is above 0, whatever else fired (a falsifier in the same record is listed as ignored: the run did not follow the preregistered procedure); then, with validity clean, a falsifier in any readable record falsifies even beside a dead control or a harness gap; then INVALID for the rest; COMPLETED also needs results/mutations.json with every mutation of tests/mutations.toml killed. Pinned in config.toml: boundary dtype F32, hidden_size 64, vocabulary size, 5 chunks of at most 3.5 MiB, reorder_window, frame_deadline_ms, max_incomplete_frames_per_peer, max_chunks_in_flight, the tombstone bound, the replay window and the corpus selection digest."
