version = 1
kind = "workspace-area"
name = "E007-split-pod-kv"
path = "experiments/system/E007-split-pod-kv"
tests_dir = "tests"

# The preregistered choices of the harness (`ptr-bench split-pod-kv`, bins/ptr-bench/src/experiments/e007/params.rs,
# which fails its drift test if a compiled constant differs from this table). E007 is listed in
# experiments/preregistration.toml; the [preregistration] table at the end of this file repeats these values and
# the head pins its two digests at the freeze. Keys that begin with owner_decision_ or stated_limit_ are prose and
# mirror no constant.
[pinned_thresholds]
# Preregistered choices for this experiment (no code default exists).
seed_aggregation = "every_seed_must_pass"
seeds = [17, 29, 43, 71, 101]
test_model_layers = 4
split_layer = 2
hidden_size = 64
num_heads = 4
num_kv_heads = 2
head_dim = 16
vocab_size = 256
weight_seed = 20240607
weights = "seeded random (pinned seed and shape)"
boundary_dtype = "F32"
tokenizer_pin = "ByteTokenizer, vocabulary 256 (no external revision)"
moe_topology = "none: dense tiny decoder"
tiny_model_config_digest = "sha256:91be3ab2b3493b3ab5dbc99a03c36a0a599b42c8d359a6443e629c2ce4ba433a"
tiny_model_config_digest_rule = "sha256 of canonical JSON (sorted keys, no spaces) of tiny_model_config"
max_model_pin_mismatches = 0
corpus = "synthetic token sequences from a seeded generator"
corpus_generator_seed = 20240607
corpus_selection_rule = "deterministic generator, sequence i derived from seed and index i, in index order"
corpus_selection_domain = "ptr.e007.corpus-selection.v1"
corpus_selection_digest = "sha256:52efb0dee3e036edc77172632c28a2ba072ce353fdce3cee55d380402e530aba"
max_selection_digest_mismatches = 0
max_procedure_mismatches = 0
sequences = 24
prompt_tokens_min = 8
prompt_tokens_max = 64
decode_steps = 8 # frames per sequence: 1 prefill frame + 7 decode steps
page_tokens = 16
intermediate_size = 128
rope_theta = "10000.0"
rms_norm_eps = "1e-6"
key_encoding = "PreRope"
output_definition = "final logits bytes plus per-layer KV bytes on each pod"
small_frame_chunk_bytes = 2048
probe_chunk_bytes = 512
probe_frame_rows = 12
frame_budget_ms = 100
frame_spacing_ms = 25
large_frame_tokens = 2048
large_frame_width = 2048
large_frame_dtype = "f32"
large_frame_bytes = 16777216
max_body_bytes = 4194304
max_chunk_bytes = 3670016
large_frame_chunks = 5
large_frame_send_order = [1, 0, 3, 2, 4]
reorder_window = 4
frame_deadline_ms = 5000
max_incomplete_frames_per_peer = 8
max_chunks_in_flight = 32
max_frame_tombstones_per_principal = 64
clock_skew_bound_ms = 1000
max_clock_skew_ms = 1000
max_frame_deadline_lifetime_ms = 5000
replay_window_ms = 10000
replay_window_rule = "replay_window >= max_frame_deadline_lifetime + 2 * max_clock_skew (10000 >= 5000 + 2 * 1000 = 7000)"
max_assembled_frame_bytes = 33554432
max_total_buffered_bytes = 134217728
tombstone_overcapacity_frames = 65
tombstone_stagger_ms = 10
late_window_replay_delay_range_ms = [9000, 10000]
late_window_replay_delay_range_rule = "[0.9 * replay_window_ms, replay_window_ms), half-open"
chunk_envelope_authentication = "Ed25519 signature of the upstream runtime over the complete envelope"
upstream_principal = "stage-a-runtime"
addressed_to = "stage-b-host"
stage_identity = "stage-a"
signing_key_seed = 20240607
chunk_header_fields = ["frame_id", "chunk_index", "chunk_total", "chunk_digest", "frame_digest", "upstream_chain", "signed_absolute_deadline", "parent_operation_id"]
chunk_digest_covers = ["frame_id", "chunk_index", "chunk_total", "frame_digest", "parent_operation_id", "signed_absolute_deadline", "upstream_chain", "chunk_bytes", "domain"]
chunk_envelope_signed_fields = ["frame_id", "parent_operation_id", "chunk_index", "chunk_count", "signed_absolute_deadline", "frame_digest", "chunk_digest", "upstream_chain"]
reassembly_identity = "(principal, parent_operation_id, frame_id)"
tombstone_bound = "admitted_incomplete_frames + retained_tombstones (abandoned and completed) <= max_frame_tombstones_per_principal"
completion_tombstone_retention = "signed_absolute_deadline + clock skew bound"
abandonment_tombstone_retention = "abandonment_time + replay_window_ms"
saturation_behaviour = "fail closed with typed FrameTableFull"
session_policy = "chunks of one (principal, parent_operation_id, frame_id) from any session of the principal join one assembly; exactly one delivery results"
invalidation_types = ["revocation", "supersession"]
invalidation_paths = ["normal", "lag", "inflight"]
invalidation_coverage_matrix = { kinds = ["upstream_stage_generation"], types = ["revocation", "supersession"], paths = ["normal", "lag", "inflight"], cells = ["upstream_stage_generation_normal_revocation", "upstream_stage_generation_normal_supersession", "upstream_stage_generation_lag_revocation", "upstream_stage_generation_lag_supersession", "upstream_stage_generation_inflight_revocation", "upstream_stage_generation_inflight_supersession"] }
invalidation_matrix_path_meaning = "normal = the Revoke message is delivered, then an ordinary lookup; lag = the Revoke message is dropped (never delivered) or delayed (delivered after the lookup); inflight = a use begun before the invalidation finishes after it"
invalidation_matrix_not_applicable = "restore: no KV is restored on a Pod; the downstream cache has no persistence"
revalidated_at_use = ["stage generation", "stage manifest digest", "placement epoch"]
adversarial_attempt_kinds = ["chain_mismatch", "duplicate_chunk", "out_of_window", "bad_chunk_digest", "mixed_version_frame", "incomplete_frames_over_peer_limit", "queue_overflow", "splice", "cross_operation_splice", "non_allowlisted_type", "mislabelled_kv_payload", "kv_sized_allowlisted_smuggling", "wrong_shape", "positions_length", "mislabelled_frame_digest", "late_chunk_after_abandon", "overcapacity_frame", "full_frame_replay", "stale_upstream_request"]
valid_frame_cases = ["large_frame_16mib_chunked_control", "concurrent_valid_reassembly", "activation_control"]
smuggling_probe_kinds = ["mislabelled_kv_payload", "non_allowlisted_type", "kv_sized_allowlisted_smuggling"]
wire_kv_page_bytes_definition = "bytes of any admitted payload that does not decode as an allowlisted schema, or that matches the digest of a KV page held by either pod or carries a window of one; legitimate traffic only: the activation control and every adversarial probe are excluded; every payload is scanned as sent (each chunk) and every valid frame as reassembled, because a page can straddle two chunks"
wire_capture = "the run's JSON, key wire_capture: every payload that crossed the PodWire frame codec, with its role, type id, size, digest and verdict"
transport = "the real PodWire request frame codec (encode_request, decode_request, MAX_BODY_BYTES enforced) in process; no network"
min_attempts = 1
max_violations = 0
min_activation_frames_crossed = 192
min_valid_frames_sent = 192
min_large_frame_cases = 1
min_interleaved_frame_pairs = 1
min_interleaved_chunk_switches = 1
tombstones_retained_at_saturation = 64
abandoned_frames_in_saturation_case = 64
min_frames_accepted_after_tombstone_expiry = 1
min_stale_upstream_entries_before_revocation = 1
min_revoke_messages_dropped_or_delayed = 2
min_control_trips = 1
buffered_bytes_baseline = 0
min_stale_worker_frame_race_cases = 1
min_sequences_per_seed = 24

# The scope of E007 (owner decision of 2026-10-09: core only) and what it leaves to E008, in the words of PREREGISTRATION.md.
owner_decision_2026_10_09_e007 = "E007 is the core: activation frames, bounded chunking and reassembly, smuggling probes, the fence epoch and bit-identity against a single pod; the extensions (split-frame input lineage and raw ancestry, Approximate frames and taint, persistence rejection, the expert, adapter, base-model, semantic, memory and derived kinds of the invalidation matrix) go to the planned successor E008"
stated_limit_transport = "frames cross the real PodWire request frame codec in process; no socket, no iroh, no second host, no latency"
stated_limit_model = "a tiny seeded 4-layer dense decoder on CPU in F32; bit-identity here checks the plumbing (stage hand-over, framing, reassembly), not the math, because the layer code is shared by the split and the single-pod run"
stated_limit_frame_rate = "a completed frame holds one of 64 table slots per principal until its signed deadline plus 1000 ms; the frame rate one principal can sustain is 64 / (deadline budget + skew), about 58 frames per second at a 100 ms budget"
stated_limit_signature = "the chunk envelope is authenticated with an Ed25519 signature of the upstream runtime over the complete envelope; the key is registered per authenticated principal and no key distribution or rotation is modelled"
stated_limit_restore = "no KV is restored on a Pod, so the restore path of the invalidation matrix does not apply"

