# E007 decision criteria. Frozen with the preregistration (config.toml names this file and its SHA-256);
# no rule changes after a run. They are what the harness itself judges (bins/ptr-bench,
# e007/metrics.rs coverage(), falsifiers() and validity()); a harness test pins this file to those lists, in order, and
# every counter named resolves in the harness's JSON.
#
# Rule grammar (one string per rule, exactly three tokens separated by single spaces):
#     <left> <op> <right>
# <op> is one of  >=  <=  == .
# A token is an integer literal iff it matches -?[0-9]+ (a decimal point makes it a reference and so a
# parse error: no decimal literal exists).
# Any other token is a reference: a path of object keys from the root of the harness's single JSON result
# object, separated by '.' (no key holds a '.', no array is indexed): "bitwise_mismatch_count" is a top-level
# key and "smuggling_probe_attempts.non_allowlisted_type" the member of an object. A reference that is
# missing, null, or of the wrong type makes the seed INVALID (it is not a failed rule). A reference compared
# with an integer literal or another reference must be a JSON integer (not a boolean, not a float); a digest
# string is compared only under ==. Exact comparisons.
#
# Every attempt and case counter is read from an event the run observed: a payload that crossed the PodWire
# frame codec and was answered, a frame that was reassembled, a tombstone the receiver reports it holds, a
# ledger commit of a revocation or supersession. None is read from configuration. Rules that hold by
# construction of the plan and not by measurement, named so a reader does not mistake them for evidence:
# procedure.split_layer and procedure.layers_above_split (the pinned split, checked against the stack the
# cases run), activation_frames_crossed and valid_frames_sent at the pinned scale (24 sequences x 8 frames,
# counted from frames that were really shipped), tombstones_retained_at_saturation and
# abandoned_frames_in_saturation_case (the saturation case opens and abandons exactly 64 frames and reads the
# receiver's own count). The measured ones are the verdicts: the typed rejections, the set digests, the
# stale hits per cell and the bytes compared with the bytes sent.
#
# The controls (a naive downstream cache fed a liveness frozen at storing, a reassembler keyed by the upstream
# chain, an admission by deny-list, an unchunked 16 MiB frame, an assembler that forgets a completed frame)
# are coverage rules: each must trip, or the probes it shadows prove nothing. Two of them run the real product
# code with its protection taken away, so they cannot tell that from a product whose protection a defect has
# already removed.
#
# coverage: a rule that does not hold makes the seed vacuous (counts as falsified).
# falsifiers: a rule that does not hold falsifies E007 on that seed. Every one is an observed violation by the
#   product (a protection that did not hold, a typed answer that was not given).
# validity: a rule that does not hold makes the seed INVALID: the record does not describe the frozen run (the
#   model pin, the corpus selection, the procedure or the late replay window differs from the pins). These are
#   the harness's own, never a finding about the product, so they are neither falsifiers nor coverage.
#
# Decision. The outcome set is COMPLETED, FALSIFIED, NOT_SHOWN and INVALID. E007 is deterministic and has no
# sampled margin, so no path ends in NOT_SHOWN; every case of the five seeds ends in exactly one of the other
# three. Precedence, highest first (VALIDITY FIRST):
#   1. INVALID for a seed whose validity rule fails, whatever else fired: the run did not follow the
#      preregistered procedure (a pin, the selection, the procedure or the late window differs), so its product
#      observations say nothing about the product. Its falsifier failures are listed as ignored and neither
#      falsify nor make the seed vacuous. A validity failure whose cause also makes a product counter fire (a
#      receiver built with another reorder window than the pin lets an out-of-window attack through) is
#      therefore INVALID, not FALSIFIED; the record shows both lists.
#   2. With every validity rule holding: FALSIFIED if any falsifier rule fails in any readable record, even a
#      record that is INVALID for another reason (a control that did not trip, a harness gap, a case that could
#      not run in the same run): a product defect is never turned into INVALID by those (the precedent of L003
#      and L004, which put the hard failure before the incomplete coverage). Also FALSIFIED if a valid record
#      fails a coverage rule (a vacuous run); the coverage failures of an INVALID record do not falsify.
#   3. INVALID if a seed is missing, unreadable or foreign (another benchmark, seed or scale), has a control
#      that did not trip, a harness gap, or an exit status the rules do not explain (the harness exits 2 when
#      it cannot run a case: there is no result), or if the mutation evidence is absent or does not count every
#      mutation killed.
#   4. COMPLETED iff every seed meets every coverage and validity rule, no falsifier fails, and the mutation
#      evidence counts every mutation of the plan killed.
# The harness exit status follows the same order: 2 when a validity rule fails (whatever else fired); with the
# validity rules holding, 1 when a falsifier fired from an observed product violation (also when a case could
# not run or a control did not trip in that run), 2 when it cannot run a case or a control did not trip, 1 for a
# vacuous run, 0 otherwise. A product regression that kills a real-code control without firing any falsifier
# therefore surfaces as INVALID (exit 2), never as COMPLETED; a mutation that does so is "crashed", not killed.
