version = 1
kind = "workspace-area"
name = "E006-engine-prefix-reuse"
path = "experiments/system/E006-engine-prefix-reuse"
tests_dir = "tests"

[pinned_thresholds]
min_ttft_gain = 1.5
shared_prefix_fraction = 0.5
max_stale_block_hits_salted = 0
# Preregistered choices for this experiment (no code default exists).
min_generation_transitions = 1
min_unsalted_control_stale_block_hits = 1
stale_probe_requests_after_transition = 8
max_bitwise_mismatch_count = 0
bit_identity_requires_batch_invariant_engine = true
min_semantic_revocations_performed = 1
max_stale_semantic_block_hits = 0
max_unacknowledged_flushes_before_serve = 0
# Preregistered choices for this experiment (no code default exists).
min_cross_principal_reuse_attempts = 1
max_cross_principal_hits = 0
min_cross_regime_probes = 1
max_cross_regime_block_hits = 0
ttft_statistic = "median"
ttft_gain_definition = "ttft_ms_cache_disabled / ttft_ms_salted_cache"
hit_rate_definition = "reused_prefix_tokens / total_prompt_tokens"
