attacker_auc_ci_upper, attacker_samples_per_class, attacker_bootstrap_resamples, unaffected_principal_probes_by_kind, unaffected_principal_hit_rate_change_by_kind, inflight_cancelled_request_id_set_digest, inflight_restarted_request_id_set_digest, dependent_principal_id_set_digest, rotated_principal_id_set_digest, attacker_heldout_predictions_digest, invalidation_matrix_cases, invalidation_matrix_stale_hits, backend_identity_set_digest, enabled_backend_set_digest, safety_counters_by_backend, expert_fence_salt_transition_cases, stale_blocks_served_after_fence, engine_restart_salt_reuse_arms, persistent_cache_reload_arms, runtime_only_restart_arms, reused_salt_epochs"
baseline = "primary comparator: same engine with prefix caching DISABLED (the denominator of the TTFT gain); secondary control: same engine with caching enabled WITHOUT salt (used only for the stale_block_hits check, where stale-block hits are expected and demonstrate that the salt matters)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: model_generation_transitions, adapter_generation_transitions, expert_generation_transitions, tokenizer_generation_transitions, numerics_generation_transitions or kv_key_encoding_generation_transitions < 1, or cross_regime_probes < 1; stale_probes_after_transition_per_dimension < 8 for any salt dimension, or unsalted_control_stale_hit_cases_per_dimension < 1 for any dimension (the unsalted positive control must show the stale hit); semantic_revocations_performed < 1, stale_semantic_probe_requests < 8, unsalted_semantic_control_stale_hit_cases < 1 or requests_attempted_during_flush_window < 1; cross_principal_reuse_attempts < 1, cross_project_attempts < 1 or dependent_principal_rotation_attempts < 1; timing_samples_per_arm < 1000 (measured separately from the hit-rate workload); invalidation_suppressed_arms < 1, engine_restart_salt_reuse_arms < 1 for any backend (restart the engine or runtime and replay requests that could hit pre-revocation blocks, reported per backend), a declared persistent engine cache with persistent_cache_reload_arms < 1 (the persistent_cache_reload arm is required for any backend that declares a persistent engine cache, declared per backend; declared and not run makes the run invalid), stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the engine-restart arm (engine-owned cache: there is no PTR catalog or tier restore) must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1); inflight_revocation_race_attempts < 1 (an engine request admitted before a semantic or memory revocation commit and completing after it); memory_revocation_probe_requests < 1 in any of the normal, lag and restart arms (the metric is reported per arm, keyed by memory_revocation_arms), memory_dependent_entries_cached_before_revocation < 1 or targeted_post_revocation_lookups < 1 in any of those arms (a lookup targeting that cached entry); supersession_probe_requests < 1 in any of the normal, lag and restart arms (reported per arm, keyed by supersession_arms) or superseded_dependent_entries_cached_before_event < 1 in any of those arms; inflight_race_attempts_by_kind < 1 for any dependency kind (semantic input, memory input, adapter generation, expert generation, base-model generation), each triggered by a revocation or a committed supersession and reported per kind; selection_digest_mismatches > 0 (the corpus selection digest recorded in run.json differs from the pinned digest) or procedure_mismatches > 0 (a pinned run-procedure parameter recorded per arm or cell in run.json differs from the pinned value; equality across arms is also compared against the pinned value); inflight_cancelled_requests_restarted_from_fresh_prefill < inflight_cancelled_requests (every cancelled in-flight request must complete as a restart from a fresh prefill under the rotated salt); attacker_samples_per_class < 1000 or attacker_bootstrap_resamples < 10000, or unaffected_principal_probes_by_kind < 1 for any dependency kind (semantic, memory, adapter, expert, base model); transitions per salt dimension < 1 for any member of {base model, adapter, expert} x {revocation, replacement} or {tokenizer, numerics, KvKeyEncoding, RoPE regime} x {replacement} (recorded and required per member, never as one aggregate; the latter four dimensions can only be replaced, not revoked, so a conforming system can reach every required member); inflight_race_attempts_by_kind < 1 for any member of {semantic input, memory input, adapter generation, expert generation, base-model generation} x {revocation, supersession} (recorded and required per member, never as one aggregate); supersession_probe_requests < 1 for any member of {semantic input, memory input} x {normal, lag, restart} (recorded and required per member, never as one aggregate); unaffected_principal_probes_by_kind < 1 for any member of {semantic, memory, adapter, expert, base model} x {revocation, supersession} (recorded and required per member, never as one aggregate); inflight_cancelled_request_id_set_digest != inflight_restarted_request_id_set_digest (every cancelled in-flight request restarted from a fresh prefill: exact identity-set equality, not count equality); dependent_principal_id_set_digest != rotated_principal_id_set_digest (every dependent principal's salt epoch rotated: exact identity-set equality, not count equality); attacker_heldout_predictions_digest is not recorded in run.json, or the attacker protocol parameters recorded differ from the pinned ones (procedure_mismatches); invalidation_matrix_cases < 1 for any cell of invalidation_coverage_matrix (config.toml enumerates all 52 cells: dependency kind x invalidation type x path; each cell recorded and required per cell, never as an aggregate); backend_identity_set_digest != enabled_backend_set_digest (a backend not run makes the run invalid), or the safety counters are not reported per backend (vllm-http and sglang-http); expert_fence_salt_transition_cases < 1 for any backend (vllm-http, sglang-http), reported per backend; runtime_only_restart_arms < 1 for any backend (the PTR runtime restarts, the engine process and cache stay warm, then requests that could hit pre-revocation blocks are replayed; reported per backend). Falsified if any of: ttft_gain < 1.5 at 50% shared prefix (ttft_gain = median ttft_ms with caching disabled / median ttft_ms with the salted cache); stale_block_hits_model, stale_block_hits_adapter, stale_block_hits_expert, stale_block_hits_tokenizer, stale_block_hits_numerics or stale_block_hits_kv_key_encoding > 0 on the salted arm, or cross_regime_block_hits > 0; bitwise_mismatch_count > 0 between cache-enabled engine output and cache-disabled full prefill under the identical binding and numerics (batch-invariant engines); stale_semantic_block_hits > 0, stale_semantic_hits_dependent_principals > 0, dependent_principals_rotated < dependent_principals_total, unacknowledged_flushes_before_serve > 0 or flush_window_requests_served > 0; canary_output_divergence_vs_full_prefill > 0 on the salted arm, or engine_reported_cached_tokens > 0 on any stale probe of the salted arm; cross_principal_hits > 0 or cross_project_hits > 0; cross_principal_tost_equivalent or cross_project_tost_equivalent false (TOST on median TTFT, equivalence bound +-5% of the baseline median, alpha 0.05); principal_b_hit_rate_change_after_a_revocation beyond 0.02 in absolute value for a principal with no dependency on the revoked generation; stale_hits > 0 in the dropped-invalidation arm, the engine_restart_salt_reuse arm or the persistent_cache_reload arm; inflight_outputs_after_revocation > 0 (any token or candidate returned after the revocation from a request whose lineage includes the revoked generation) or inflight_cache_inserts_after_revocation > 0; stale_memory_hits > 0 in the normal, lag or restart arm (or the dependent principal's epoch not rotated: dependent_principals_rotated < dependent_principals_total); stale_superseded_hits > 0 in the normal, lag or restart arm; inflight_restart_output_mismatches > 0 (a restarted request's output differs from the reference full prefill under the new binding); attacker_auc_ci_upper > 0.55 (the 95% bootstrap CI upper bound of the attacker classifier AUC), or unaffected_principal_hit_rate_change_by_kind beyond 0.02 in absolute value for any dependency kind (semantic, memory, adapter, expert, base model); invalidation_matrix_stale_hits > 0 in any cell of invalidation_coverage_matrix (a stale hit, or for in-flight cells an escaped output); stale_blocks_served_after_fence > 0 (on either backend); stale_hits > 0 in the runtime_only_restart arm (either backend), or reused_salt_epochs > 0 (a salt epoch reused); any one of the 5 listed seeds misses any criterion above (every seed must pass). Outcome rules: if batch_invariant_verified is false the run is inconclusive, not a pass; an engine that cannot key blocks per regime, or must run with caching disabled, is reported not-applicable and never passed; for engines without batch-invariant kernels E006 reports Approximate and makes no Exact claim. If no hardware profile supported batch invariance, E006 would be inconclusive by design until one exists (hardware/rtx3090.toml qualifies, see Evidence)."
