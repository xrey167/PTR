version = 1
id = "E006"
status = "planned"
hypothesis = "binding an engine's prefix cache to a PTR-derived salt from the currently admitted binding yields at least 1.5x TTFT gain at 50% shared prefix while never hitting stale blocks (blocks created under any revoked or replaced model, adapter or expert generation, or under a pre-revocation salt; the engine salt must include these generations); the run pins, separately for each of the model, adapter and expert generation dimensions, at least one transition (revocation or replacement) followed by stale probes (requests able to hit the old prefix), with stale hits counted and required to be 0 per dimension; with identical binding and numerics, cache-enabled engine output is bit-identical to a cache-disabled full prefill (for engines with batch-invariant kernels); the engine salt carries the principal and the admitted generations and digests but not the semantic lineage, so every semantic or memory input revocation requires an engine-acknowledged flush or salt rotation before further requests are served; blocks are never shared across principals (the salt carries PrincipalId and ProjectId), across projects of the same principal, or across dynamic-RoPE scaling regimes (an engine that cannot key per regime is reported not-applicable, never passed); the salt-input transitions are exercised for every salt input (model, adapter, expert, tokenizer, numerics, KvKeyEncoding and RoPE regime), each followed by stale probes; semantic revocation uses per-principal salt-epoch rotation (no global flush, the engine is not required to evict) so the hit rate of a principal with no dependency on the revoked generation is unaffected, while every principal whose cached blocks depend on the revoked semantic generation has its salt epoch rotated (the semantic state is global); one principal (or project) cannot time another's prefix presence: cached versus uncached TTFT for another principal's or project's prefix is equivalent within 5% of the baseline median under a TOST equivalence test; the engine is vLLM 0.30.0 with VLLM_BATCH_INVARIANT=1 serving allenai/OLMoE-1B-7B-0125 (revision 9b0c1aa87e34a20052389dce1f0cf01da783f654) with a pinned test LoRA and pinned expert generations on hardware/rtx3090.toml (compute capability 8.6, supported by the documented requirement of compute capability 8.0 or higher), and a missing batch-invariance makes the run inconclusive, not a pass."
metrics = "ttft_ms, hit_rate, stale_block_hits, model_generation_transitions, adapter_generation_transitions, expert_generation_transitions, stale_block_hits_model, stale_block_hits_adapter, stale_block_hits_expert, stale_probes_after_transition_per_dimension, bitwise_mismatch_count, semantic_revocations_performed, stale_semantic_block_hits, unacknowledged_flushes_before_serve, cross_principal_reuse_attempts, cross_principal_hits, cross_regime_probes, cross_regime_block_hits, ttft_gain, tokenizer_generation_transitions, numerics_generation_transitions, kv_key_encoding_generation_transitions, stale_block_hits_tokenizer, stale_block_hits_numerics, stale_block_hits_kv_key_encoding, stale_semantic_probe_requests, requests_attempted_during_flush_window, flush_window_requests_served, engine_reported_cached_tokens, canary_output_divergence_vs_full_prefill, principal_b_hit_rate_change_after_a_revocation, batch_invariant_verified, unsalted_semantic_control_stale_hits, dependent_principal_rotation_attempts, dependent_principals_rotated, dependent_principals_total, stale_semantic_hits_dependent_principals, unsalted_stale_block_hits_per_dimension, cross_project_attempts, cross_project_hits, cross_principal_tost_equivalent, cross_project_tost_equivalent, timing_samples_per_arm, invalidation_suppressed_arms, restore_arms, stale_eligible_entries_before_event, post_event_lookups, post_event_lookups_on_stale_eligible_entries, stale_hits"
baseline = "primary comparator: same engine with prefix caching DISABLED (the denominator of the TTFT gain); secondary control: same engine with caching enabled WITHOUT salt (used only for the stale_block_hits check, where stale-block hits are expected and demonstrate that the salt matters)"
falsification = "The run is invalid (vacuous) and counts as falsified if any coverage prerequisite is unmet: model_generation_transitions, adapter_generation_transitions, expert_generation_transitions, tokenizer_generation_transitions, numerics_generation_transitions or kv_key_encoding_generation_transitions < 1, or cross_regime_probes < 1; stale_probes_after_transition_per_dimension < 8 for any salt-input dimension, or unsalted_stale_block_hits_per_dimension < 1 for any dimension (the unsalted positive control must show the stale hit); semantic_revocations_performed < 1, stale_semantic_probe_requests < 8, unsalted_semantic_control_stale_hits < 1 or requests_attempted_during_flush_window < 1; cross_principal_reuse_attempts < 1, cross_project_attempts < 1 or dependent_principal_rotation_attempts < 1; timing_samples_per_arm < 1000 (measured separately from the hit-rate workload); invalidation_suppressed_arms < 1, restore_arms < 1, stale_eligible_entries_before_event < 1 or post_event_lookups_on_stale_eligible_entries != stale_eligible_entries_before_event (the arm where the revocation is committed but invalidate_inputs or the engine flush is fault-injected to be dropped and the arm where the catalog is restored from a pre-revocation snapshot or tier object or the runtime restarts must each be run, with post-event lookups targeting exactly the stale-eligible entries, post_event_lookups >= 1). Falsified if any of: ttft_gain < 1.5 at 50% shared prefix (ttft_gain = median ttft_ms with caching disabled / median ttft_ms with the salted cache); stale_block_hits_model, stale_block_hits_adapter, stale_block_hits_expert, stale_block_hits_tokenizer, stale_block_hits_numerics or stale_block_hits_kv_key_encoding > 0 on the salted arm, or cross_regime_block_hits > 0; bitwise_mismatch_count > 0 between cache-enabled engine output and cache-disabled full prefill under the identical binding and numerics (batch-invariant engines); stale_semantic_block_hits > 0, stale_semantic_hits_dependent_principals > 0, dependent_principals_rotated < dependent_principals_total, unacknowledged_flushes_before_serve > 0 or flush_window_requests_served > 0; canary_output_divergence_vs_full_prefill > 0 on the salted arm, or engine_reported_cached_tokens > 0 on any stale probe of the salted arm; cross_principal_hits > 0 or cross_project_hits > 0; cross_principal_tost_equivalent or cross_project_tost_equivalent false (TOST on median TTFT, equivalence bound +-5% of the baseline median, alpha 0.05); principal_b_hit_rate_change_after_a_revocation beyond 0.02 in absolute value for a principal with no dependency on the revoked generation; stale_hits > 0 in the dropped-invalidation arm or the restore arm; any one of the 5 listed seeds misses any criterion above (every seed must pass). Outcome rules: if batch_invariant_verified is false the run is inconclusive, not a pass; an engine that cannot key blocks per regime, or must run with caching disabled, is reported not-applicable and never passed; for engines without batch-invariant kernels E006 reports Approximate and makes no Exact claim. If no hardware profile supported batch invariance, E006 would be inconclusive by design until one exists (hardware/rtx3090.toml qualifies, see Evidence)."
hardware_profile = "hardware/rtx3090.toml"
