name: one-shot-burn-lock
on:
  push:
    paths:
      - '.github/workflows/one-shot-burn-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable generate-lockfile --manifest-path model/burn-a0/Cargo.toml
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --manifest-path model/burn-a0/Cargo.toml --locked
      - name: Commit Burn A0 lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/burn-a0/Cargo.lock
          git commit -m "Pin Burn A0 dependency graph"
          git push origin HEAD:main
