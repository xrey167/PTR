name: one-shot-l001-process-crash
on:
  push:
    paths:
      - '.github/workflows/one-shot-l001-process-crash.yml'

permissions:
  contents: write

jobs:
  process-crash:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build lifecycle benchmark
        run: cargo +stable build --release --locked -p ptr-bench
      - name: Run five seeded process-abort probes
        run: |
          mkdir -p /tmp/l001-process
          for seed in 17 29 43 71 101; do
            target/release/ptr-bench ledger-process-crash 50 "$seed" > "/tmp/l001-process/seed-$seed.json"
          done
      - name: Aggregate evidence
        run: python experiments/lifecycle/L001-revocation-crash/process_aggregate.py /tmp/l001-process/*.json
      - name: Commit scoped process-crash evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/lifecycle/L001-revocation-crash/results/process_crash_metrics.json
          git add experiments/lifecycle/L001-revocation-crash/results/process_crash_run.json
          git commit -m "Record L001 real process-crash evidence"
          git push origin HEAD:main
