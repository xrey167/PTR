name: one-shot-repo-sync
on:
  push:
    paths:
      - '.github/workflows/one-shot-repo-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Format Rust and refresh generated docs
        run: |
          cargo +stable fmt --all
          python scripts/update_component_docs.py --write
      - name: Generate Rust lockfile
        run: cargo +stable generate-lockfile
      - name: Generate Python uv lockfile
        run: |
          python -m pip install --disable-pip-version-check uv
          uv lock --project training
      - name: Commit synchronized artifacts
        run: |
          if git diff --quiet && [ -f Cargo.lock ] && [ -f training/uv.lock ]; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync formatting, generated docs and lockfiles"
          git push origin HEAD:main
