name: iroh-current
on:
  push:
    paths:
      - "integrations/network/iroh-current/**"
      - ".github/workflows/iroh-current.yml"
  pull_request:
    paths:
      - "integrations/network/iroh-current/**"
      - ".github/workflows/iroh-current.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.91.0 --profile minimal
      - run: cargo +1.91.0 test --manifest-path integrations/network/iroh-current/Cargo.toml --locked
      - run: cargo +1.91.0 install cargo-audit --locked
      - run: cargo +1.91.0 audit --file integrations/network/iroh-current/Cargo.lock
