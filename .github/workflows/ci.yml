name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - run: cargo +stable doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  rust-stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable check --workspace --all-targets --locked
      - run: cargo +stable test --workspace --locked

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets --locked
      - run: cargo +1.85.0 test --workspace --locked

  python-training:
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e training
      - run: python -m unittest discover -s training/tests
      - run: python training/src/ptr_training/validate_dataset.py datasets/samples/epistemic_calibration.jsonl
      - run: python training/src/ptr_training/validate_dataset.py datasets/samples/ood_pod.jsonl
      - run: python training/src/ptr_training/validate_dataset.py datasets/samples/operator_route.jsonl

  repository-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_component_metadata.py --base HEAD^
      - run: python scripts/update_component_docs.py --check
      - run: python scripts/check_repo.py
      - run: python scripts/run_experiment.py validate
      - run: python scripts/run_component_eval.py validate
      - run: python -m unittest discover -s scripts/tests
      - run: python -m unittest discover -s research/baselines/rag_reference/tests