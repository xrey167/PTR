name: persistence-review-inputs
on:
  push:
    branches: [agent/p0-persistence-integrity-20260919]
    paths: [.github/workflows/persistence-review-inputs.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c904c8eff0f3196c8c3d05448f8648ff61875b7b
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
      - name: Warm only public source dependencies and test baseline
        run: |
          cargo +1.85.0 test --workspace --locked
          mkdir -p /tmp/hash-probe/src
          printf '[package]\nname="hash-probe"\nversion="0.1.0"\nedition="2021"\n[dependencies]\nsha2="=0.11.0"\n' > /tmp/hash-probe/Cargo.toml
          printf 'fn main() {}\n' > /tmp/hash-probe/src/main.rs
          cargo +1.85.0 check --manifest-path /tmp/hash-probe/Cargo.toml
      - name: Export source and portable compiler, never credentials
        run: |
          mkdir -p /tmp/persistence-inputs
          git archive --format=tar.gz HEAD > /tmp/persistence-inputs/source.tar.gz
          git rev-parse HEAD > /tmp/persistence-inputs/source-sha.txt
          sysroot="$(rustc +1.85.0 --print sysroot)"
          (cd "$sysroot" && tar -czf /tmp/persistence-inputs/rust-tools.tar.gz bin/cargo bin/rustc bin/rustfmt bin/cargo-clippy bin/clippy-driver lib/librustc_driver-*.so lib/libLLVM.so* lib/rustlib/x86_64-unknown-linux-gnu/lib)
          tar -C "$HOME/.cargo" -czf /tmp/persistence-inputs/public-registry.tar.gz registry/src registry/cache registry/index
          (cd /tmp/persistence-inputs && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ptr-persistence-review-inputs
          path: /tmp/persistence-inputs/
          compression-level: 0
          retention-days: 2
