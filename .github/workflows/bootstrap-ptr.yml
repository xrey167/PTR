name: bootstrap-ptr-architecture
on:
  push:
    paths:
      - '.github/workflows/bootstrap-ptr.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PTR architecture source archive
        run: |
          curl -fL --retry 5 --retry-all-errors             "https://darius-rey.hoaster.page/ptr-architecture-v1-bootstrap"             -o /tmp/ptr.zip
          unzip -t /tmp/ptr.zip
          mkdir -p /tmp/ptr-import
          unzip -q /tmp/ptr.zip -d /tmp/ptr-import
          test -f /tmp/ptr-import/ptr/Cargo.toml
          test -f /tmp/ptr-import/ptr/README.md
      - name: Replace bootstrap tree with PTR monorepo
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/ptr-import/ptr/. .
          git status --short
      - name: Commit imported architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete PTR architecture v1"
          git push origin HEAD:main
