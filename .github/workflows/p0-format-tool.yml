name: p0-format-tool
on:
  push:
    branches: [agent/p0-execution-authority-20260919]
    paths: [.github/workflows/p0-format-tool.yml]
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Archive formatter and its toolchain-owned shared libraries
        run: |
          mkdir -p /tmp/ptr-format/bin /tmp/ptr-format/lib
          formatter="$(rustup which --toolchain stable rustfmt)"
          cp "$formatter" /tmp/ptr-format/bin/rustfmt
          ldd "$formatter" > /tmp/ptr-format/ldd.txt
          rustfmt +stable --version > /tmp/ptr-format/version.txt
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          root=pathlib.Path(subprocess.check_output(['rustc','+stable','--print','sysroot'],text=True).strip())
          for line in pathlib.Path('/tmp/ptr-format/ldd.txt').read_text().splitlines():
              for word in line.split():
                  path=pathlib.Path(word)
                  if path.is_absolute() and path.is_file() and path.resolve().is_relative_to(root.resolve()):
                      shutil.copy2(path, pathlib.Path('/tmp/ptr-format/lib') / path.name)
          PY
          tar -C /tmp/ptr-format -czf /tmp/ptr-formatter.tar.gz .
          sha256sum /tmp/ptr-formatter.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ptr-p0-formatter
          path: /tmp/ptr-formatter.tar.gz
          retention-days: 2
