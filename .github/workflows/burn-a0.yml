name: burn-a0
on:
  push:
    paths:
      - "model/burn-a0/**"
      # A0 depends on the type kernel by path and its checkpoint tests read the
      # committed codebook artifact, so a change to either can break it. The
      # kernel takes its version, edition and rust-version from the root
      # manifest, and A0's lockfile pins that version, so a root bump breaks
      # A0's --locked build too.
      - "crates/ptr-types/**"
      - "Cargo.toml"
      - "datasets/generated/codebook.json"
      # tests/runtime_fixture.rs loads the checkpoint ptr-runtime's tests bind.
      - "crates/ptr-runtime/tests/fixtures/ptr-a0-v1.ckpt"
      # The bridge depends on ptr-runtime and ptr-semdb by path, and through them
      # on most of crates/. Their dependencies are pinned in this workspace's
      # lockfile, so a dependency change there breaks every --locked step here,
      # A0's own included.
      - "crates/**"
      - "vendor/**"
      - ".github/workflows/burn-a0.yml"
  pull_request:
    paths:
      - "model/burn-a0/**"
      # A0 depends on the type kernel by path and its checkpoint tests read the
      # committed codebook artifact, so a change to either can break it. The
      # kernel takes its version, edition and rust-version from the root
      # manifest, and A0's lockfile pins that version, so a root bump breaks
      # A0's --locked build too.
      - "crates/ptr-types/**"
      - "Cargo.toml"
      - "datasets/generated/codebook.json"
      # tests/runtime_fixture.rs loads the checkpoint ptr-runtime's tests bind.
      - "crates/ptr-runtime/tests/fixtures/ptr-a0-v1.ckpt"
      # The bridge depends on ptr-runtime and ptr-semdb by path, and through them
      # on most of crates/. Their dependencies are pinned in this workspace's
      # lockfile, so a dependency change there breaks every --locked step here,
      # A0's own included.
      - "crates/**"
      - "vendor/**"
      - ".github/workflows/burn-a0.yml"
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo +stable fmt --manifest-path model/burn-a0/Cargo.toml -- --check
      - run: cargo +stable test --manifest-path model/burn-a0/Cargo.toml --locked
      - run: cargo +stable check --manifest-path model/burn-a0/Cargo.toml --examples --locked
      - run: cargo +stable clippy --manifest-path model/burn-a0/Cargo.toml --all-targets --locked -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --manifest-path model/burn-a0/Cargo.toml --locked
      - run: cargo +1.95.0 check --manifest-path model/burn-a0/Cargo.toml --examples --locked
  # The runtime-to-A0 bridge (issue #23's G1 and C9). It needs 1.99 because
  # ptr-runtime does, so it is selected with -p; the jobs above build A0 alone.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99.0 fmt --manifest-path model/burn-a0/Cargo.toml -p ptr-a0-bridge -- --check
      - run: cargo +1.99.0 test --manifest-path model/burn-a0/Cargo.toml -p ptr-a0-bridge --locked
      - run: cargo +1.99.0 check --manifest-path model/burn-a0/Cargo.toml -p ptr-a0-bridge --examples --locked
      - run: cargo +1.99.0 clippy --manifest-path model/burn-a0/Cargo.toml -p ptr-a0-bridge --all-targets --locked -- -D warnings
