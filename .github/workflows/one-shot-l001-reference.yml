name: one-shot-l001-reference
on:
  push:
    paths:
      - '.github/workflows/one-shot-l001-reference.yml'
permissions:
  contents: write
jobs:
  run:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run five seeded reference crash-tail probes
        run: |
          mkdir -p /tmp/l001
          for seed in 17 29 43 71 101; do
            cargo +stable run --release --locked -p ptr-bench -- ledger-recovery 100 "$seed" > "/tmp/l001/seed-$seed.json"
          done
      - name: Aggregate
        run: python experiments/lifecycle/L001-revocation-crash/aggregate.py /tmp/l001/*.json
      - name: Commit reference-scope evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/lifecycle/L001-revocation-crash/results/run.json
          git add experiments/lifecycle/L001-revocation-crash/results/metrics.json
          git commit -m "Record L001 reference crash-tail evidence"
          git push origin HEAD:main
# rerun after lockfile refresh
