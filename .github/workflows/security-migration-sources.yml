name: security-migration-sources
on:
  push:
    branches: [agent/security-p0-preflight-20260919]
    paths: [.github/workflows/security-migration-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - name: Download checksum-verified registry source for migration review
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, io, json, pathlib, tarfile, urllib.request
          out = pathlib.Path('/tmp/ptr-dependency-sources'); out.mkdir()
          pairs = [('iroh','1.2.0'),('raft','0.7.0'),('raft-proto','0.7.0'),('protobuf-build','0.14.1'),('protobuf-build','0.15.1'),('raft-engine','0.4.2'),('prometheus','0.14.0'),('burn-core','0.18.0'),('burn-ndarray','0.18.0'),('burn-core','0.21.0'),('burn','0.21.0'),('quanta','0.12.6'),('bincode-next','2.0.4')]
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'PTR-security-migration-review/0.1'}), timeout=45) as r:
                  return r.read()
          def download(pair):
              name, version = pair
              try:
                  meta = json.loads(fetch(f'https://crates.io/api/v1/crates/{name}/{version}'))['version']
                  data = fetch(f'https://static.crates.io/crates/{name}/{name}-{version}.crate')
                  digest=hashlib.sha256(data).hexdigest()
                  assert digest == meta['checksum'], 'checksum mismatch'
                  with tarfile.open(fileobj=io.BytesIO(data)) as t:t.extractall(out, filter='data')
                  return {'name':name,'version':version,'sha256':digest}
              except Exception as e:
                  return {'name':name,'version':version,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              result=list(pool.map(download,pairs))
          (out/'source-manifest.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ptr-dependency-sources
          path: /tmp/ptr-dependency-sources/
          retention-days: 7
