name: one-shot-doc-sync
on:
  push:
    paths:
      - '.github/workflows/one-shot-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo +stable fmt --all
      - run: python scripts/update_component_docs.py --write
      - name: Commit synchronized docs
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync generated component documentation"
          git push origin HEAD:main
