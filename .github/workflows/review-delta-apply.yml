name: review-delta-apply
on:
  push:
    branches: [agent/security-p0-remediation-20260919]
    paths: [.github/workflows/review-delta-apply.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact-source review delta
        run: |
          mkdir -p /tmp/ptr-reviewed
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root = pathlib.Path.cwd().resolve()
          with urllib.request.urlopen('https://darius-rey.hoaster.page/ptr-security-p0-review-delta-d3e5bafb', timeout=60) as response:
              data = response.read()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == 'd3e5bafb08ac5faa09d483b6904fddeac60f9868704e0e77804751b643ae8295', digest
          delta = json.loads(data)
          assert len(delta) == 58
          for item in delta:
              path = root / item['path']
              assert path.resolve().is_relative_to(root)
              assert '.git' not in pathlib.Path(item['path']).parts
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['before'], item['path']
              lines = old.decode().splitlines(keepends=True) if old is not None else []
              for start, end, replacement in reversed(item['edits']):
                  lines[start:end] = [replacement]
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == item['after'], item['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
          pathlib.Path('/tmp/ptr-reviewed/delta-sha256.txt').write_text(digest + '\n')
          print('Applied 58 files with exact before/after hash verification.')
          PY
      - name: Migrate actual paste consumers and resolve owned workspaces
        run: |
          python scripts/migrate_paste_consumers.py --execute > /tmp/ptr-reviewed/paste-migration.log 2>&1
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = pathlib.Path('/tmp/ptr-reviewed')
          status = {}
          for i, manifest in enumerate(['Cargo.toml', 'model/burn-a0/Cargo.toml', 'fuzz/Cargo.toml', 'templates/rust-crate/Cargo.toml']):
              result = subprocess.run(['cargo', '+stable', 'metadata', '--manifest-path', manifest, '--format-version', '1', '--all-features'], capture_output=True, text=True)
              (out / f'metadata-{i}.json').write_text(result.stdout)
              (out / f'metadata-{i}.log').write_text(result.stderr)
              status[manifest] = result.returncode
          (out / 'resolution.json').write_text(json.dumps(status, indent=2))
          print(status)
          raise SystemExit(any(status.values()))
          PY
          cargo +stable fmt --all
          cargo +stable fmt --manifest-path model/burn-a0/Cargo.toml
          python scripts/update_component_docs.py --write
      - name: Retain source and precise patch
        run: |
          git rm --ignore-unmatch scripts/review_payload/part0.b64 scripts/review_payload/part1.b64
          git add -A
          git add -f fuzz/Cargo.lock templates/rust-crate/Cargo.lock
          git diff --cached --binary > /tmp/ptr-reviewed/reviewed.patch
          git diff --cached --stat > /tmp/ptr-reviewed/diff-stat.txt
          git ls-files -z | tar --null -T - -czf /tmp/ptr-reviewed/source.tar.gz
          git rev-parse HEAD > /tmp/ptr-reviewed/trigger-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptr-reviewed-candidate
          path: /tmp/ptr-reviewed/
          retention-days: 7
  retain-review-branch:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ptr-reviewed-candidate
          path: /tmp/ptr-reviewed
      - name: Commit on unchanged review branch, never main
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/agent/security-p0-remediation-20260919
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$EXPECTED_SHA"
          git apply --index /tmp/ptr-reviewed/reviewed.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          prefixes = ('vendor/', 'crates/', 'model/burn-a0/', 'scripts/', 'docs/', 'training/', '.github/workflows/')
          exact = {'Cargo.toml', 'Cargo.lock', 'deny.toml', 'fuzz/Cargo.lock', 'templates/rust-crate/Cargo.lock'}
          assert paths and all(p in exact or p.startswith(prefixes) for p in paths)
          assert '.github/workflows/review-delta-apply.yml' not in paths
          PY
          git config user.name 'PTR security review'
          git config user.email '104269920+xrey167@users.noreply.github.com'
          git commit -m 'fix: enforce P0 lifecycle boundaries and migrate vulnerable dependencies; verification pending'
          git push origin HEAD:refs/heads/agent/security-p0-remediation-20260919
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [core, raft, raft-engine, network, a0]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ptr-reviewed-candidate
          path: /tmp/ptr-reviewed
      - run: tar -xzf /tmp/ptr-reviewed/source.tar.gz
      - uses: dtolnay/rust-toolchain@stable
      - name: Execute feature-specific tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path('/tmp/ptr-verify'); out.mkdir()
          commands = {
              'core': [['cargo', '+stable', 'test', '--workspace', '--locked'], ['cargo', '+stable', 'test', '-p', 'ptr-ledger', '--features', 'failpoints', '--test', 'failpoints', '--locked']],
              'raft': [['cargo', '+stable', 'test', '-p', 'ptr-ledger', '--features', 'raft-rs-backend', '--test', 'raft_rs', '--locked']],
              'raft-engine': [['cargo', '+stable', 'test', '-p', 'ptr-ledger', '--features', 'raft-engine-backend', '--test', 'raft_engine', '--locked']],
              'network': [['cargo', '+stable', 'test', '-p', 'ptr-net', '--features', 'iroh-backend', '--test', 'iroh', '--locked']],
              'a0': [['cargo', '+stable', 'test', '--manifest-path', 'model/burn-a0/Cargo.toml', '--locked'], ['cargo', '+stable', 'check', '--manifest-path', 'model/burn-a0/Cargo.toml', '--examples', '--locked']],
          }
          status = []
          for i, cmd in enumerate(commands[os.environ['TARGET']]):
              with (out / f'command-{i}.log').open('w') as log:
                  code = subprocess.run(cmd, stdout=log, stderr=subprocess.STDOUT).returncode
              status.append({'command': cmd, 'exit_code': code})
          (out / 'status.json').write_text(json.dumps(status, indent=2))
          print(json.dumps(status, indent=2))
          raise SystemExit(any(x['exit_code'] for x in status))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptr-verify-${{ matrix.target }}
          path: /tmp/ptr-verify/
          retention-days: 7
