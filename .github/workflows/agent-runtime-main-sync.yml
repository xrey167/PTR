name: agent-runtime-main-sync
on:
  push:
    paths:
      - '.github/workflows/agent-runtime-main-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/agent/runtime-durable-ledger-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/runtime-durable-ledger-20260918
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:agent/runtime-durable-ledger-20260918
