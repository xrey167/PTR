name: one-shot-component-doc-sync\n# rerun after generator fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-component-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/update_component_docs.py --write
      - name: Commit generated component documentation
        run: |
          if git diff --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/*/README.md docs/components/STATUS.md
          git commit -m "Sync component implementation status documentation"
          git push origin HEAD:main