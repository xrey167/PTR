[project]
name = "ptr-training"
version = "0.1.0"
requires-python = ">=3.11"
description = "Training and evaluation utilities for PTR"
dependencies = []

# CUDA/GPU-specific and heavy; kept out of the base install so dry-run manifest
# preparation keeps working without a CUDA toolchain. Not wired to any backend
# dispatch yet — training/continued-pretraining/ stays behind the dry-run gate
# until evaluations/components/training-backend/ selects a candidate.
[project.optional-dependencies]
cpt = [
  "axolotl",
  "deepspeed",
  "bitsandbytes",
  "transformers",
]

# Tiny-random / LoRA MoE training backend (`trl-moe`, ptr_training.moe). Lower bounds are
# the versions the backend was verified against; upper bounds stop at the next breaking line
# (trl and peft are 0.x/1.x-minor APIs we read from source, so they stop at the next minor) (see src/ptr_training/moe/README.md);
# transformers>=5 is required because OLMoE experts are fused 3-D parameters there.
# On CPU-only hosts install torch from https://download.pytorch.org/whl/cpu first.
moe = [
  "torch>=2.14.1,<3",
  "transformers>=5.18.0,<6",
  "peft>=0.21.2,<0.22",
  "trl>=1.14.1,<1.15",
  "datasets>=5.0.1,<6",
  "accelerate>=1.15.0,<2",
]

[project.scripts]
ptr-dataset-validate = "ptr_training.validate_dataset:main"
ptr-dataset-manifest = "ptr_training.make_manifest:main"
ptr-train-run = "ptr_training.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# axolotl pins older transformers/trl than the moe extra needs, so the two extras
# cannot be installed together (and uv must resolve them in separate forks).
[tool.uv]
conflicts = [
  [
    { extra = "cpt" },
    { extra = "moe" },
  ],
]
