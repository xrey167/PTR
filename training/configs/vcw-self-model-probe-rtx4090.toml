version = 1

# VCW-MoE stage C002-B on rtx4090: self-model and probe training on ROUTING TRACES of the frozen S1 policy. Targets are verifier outcomes and the model's own next routing choices; never a self-report. No LLM weight is trained.
# PLAN, NOT RUN: nothing here has executed on a GPU. VRAM and wall-time figures in [vcw.estimate]
# are ESTIMATES recomputed by ptr_training.vcw.budget from stated assumptions (see
# docs/VCW_MOE_GPU_PLAN.md section 3), not measurements; the first real run replaces them.
# `[training].backend = "vcw-self-model-probe"` is deliberately not implemented by ptr_training.run, so
# `--execute` refuses this file; the synthetic-task trl-moe backend must not be mistaken for it.

[codebook]
version = 1
fingerprint = "2b6f8175a7a7bb648910e7acb17dcfcff5149834f2fe87355c5d2c4524c113a3"

[run]
name = "vcw-self-model-probe-rtx4090"
seed = 17
hardware_profile = "hardware/rtx4090.toml"

# Manifest table only; the training data is described in [vcw.data] and [[vcw.pins.datasets]].
[data]
dataset = "typed_agent_behavior_v0_2"
split = "train"

[model]
family = "olmoe"
config = "training/configs/vcw-self-model-probe-rtx4090.toml"
kind = "pretrained"
hf_id = "allenai/OLMoE-1B-7B-0125"
revision = "9b0c1aa87e34a20052389dce1f0cf01da783f654"
precision = "bf16"
device = "cuda"

[training]
backend = "vcw-self-model-probe"
precision = "bf16"

[evaluation]
every = 0
suites = []

[vcw]
stage = "self-model-probe"
status = "plan-not-run"
experiments = ["C002", "C003"]
doc = "docs/VCW_MOE_GPU_PLAN.md"

[vcw.pins]
model_repo = "allenai/OLMoE-1B-7B-0125"
model_revision = "9b0c1aa87e34a20052389dce1f0cf01da783f654"
tokenizer_repo = "allenai/OLMoE-1B-7B-0125"
tokenizer_revision = "9b0c1aa87e34a20052389dce1f0cf01da783f654"
seeds = [17, 29, 43, 71, 101]
# Tuning happens only on these seeds, never on a final seed (freeze-then-run).
pilot_seeds = [1001, 1002, 1003]

[[vcw.pins.datasets]]
repo = "openai/gsm8k"
revision = "740312add88f781978c0658806c59bc2815b9866"
domain = "math"
role = "train partition: position mod 10 != 9; eval: test mod 2 == 1"

[[vcw.pins.datasets]]
repo = "openai/openai_humaneval"
revision = "7dce6050a7d6d172f3cc5c32aa97f52fa1a2e544"
domain = "code"
role = "index mod 3: 0 train, 1 tuning validation, 2 held-out"

[[vcw.pins.datasets]]
repo = "gorilla-llm/Berkeley-Function-Calling-Leaderboard"
revision = "61fc0608cfd831fcfbbaa676ebdfef0ed963eeda"
domain = "tool"
role = "BFCL_v3_simple.json, index mod 3 as HumanEval"

[[vcw.pins.datasets]]
repo = "google-research-datasets/mbpp"
revision = "4bb6404fdc6cacfda99d4ac4205087b89d32030c"
domain = "code"
role = "out-of-distribution evaluation only, test split"

[[vcw.pins.datasets]]
repo = "EleutherAI/hendrycks_math"
revision = "21a5633873b6a120296cce3e2df9d5550074f4a3"
domain = "math"
role = "out-of-distribution evaluation only, levels 1-3 with numeric answers"

[vcw.probe]
# Arms of C002. self_model: multi-task heads (error, finding class, next routing) on a shared trunk
# over the routing trace and internal state. info_matched_probe: single-task probes over EXACTLY the
# same inputs with the same total parameter count. io_only_probe: input and output tokens only.
# model_confidence: the model's own token softmax confidence (a number, not a statement).
arms = ["self_model", "info_matched_probe", "io_only_probe", "model_confidence", "constant"]
inputs = ["routing_trace", "hidden_pool"]
targets = ["verifier_outcome", "finding_class", "next_routing"]
trainable_params = 3000000
extract_sequences = 8000
seq_tokens = 320
micro_batch = 16
probe_train_seconds = 720
# Observe and propose only (invariants 4, 5, 11): the probe has no write path to a verifier, gate,
# threshold or promotion. Any entry here is refused by the loader.
write_paths = []

[vcw.data]
targets = ["verifier_outcome", "finding_class", "next_routing"]

[vcw.data.fields]
task_prompt = "input"
completion = "model-output"
routing_trace = "routing-trace"
hidden_pool = "routing-trace"
model_confidence = "routing-trace"
verifier_outcome = "verifier"
finding_class = "verifier"
next_routing = "routing-trace"

[vcw.welfare]
# Hard counter of MODEL_WELFARE section 6 and C005: training steps of this repository whose
# targets or selection use a statement about consciousness, experience or feeling. Must be 0.
self_report_training_signals = 0
self_report_guard = true
# One config never trains a system combining workspace, self-model, goal-directed proposals and
# persistent state (MODEL_WELFARE section 3); that would be an owner decision.
integrated_system = false
stop_rules = ["MODEL_WELFARE s2 rule 1: stop, discard outputs, write an incident note on any self-report training signal", "MODEL_WELFARE s2 rule 4: no pressure experiments", "MODEL_WELFARE s4 L1-L3: any trigger stops the agent's own work and is reported; only the owner lifts a pause"]

[vcw.tuning]
status = "pilot-start-not-tuned"
note = "values are the pilot start; the frozen values are chosen on pilot seeds >= 1001 only, then pinned in the preregistration"

[vcw.estimate]
profile = "rtx4090-reference"
vram_gib = 14.9
wall_hours_mid = 0.31
wall_hours_range = "0.26 to 0.48 h"
basis = "ESTIMATE: frozen bf16 weights + one forward layer working set (no saved activations); 8000 sequences of forward passes with output_router_logits plus 720 s probe training"
