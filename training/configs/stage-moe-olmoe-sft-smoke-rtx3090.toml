version = 1

# NOT RUN anywhere yet. First real-model run on one 24 GB GPU (RTX 3090, hardware/rtx3090.toml),
# SFT only: OLMoE-1B-7B-0125 in bf16 with LoRA, gradient checkpointing, batch 2 x 4 gradient
# accumulation steps (effective batch 8), max_length 256, 50 optimizer steps; RL is skipped
# (`[moe.rl] algorithms = []`). Expected to fit in 24 GB, but that is an estimate, not a
# measurement (`python -m ptr_training.moe.memory --config <this file>`): 12.89 GiB of bf16
# weights (6,919,161,856 parameters), 1.81 GiB of fp32 LoRA weight, gradient and AdamW state
# (rank 16 on q/k/v/o and the fused expert tensors is 121,634,816 trainable parameters; an
# earlier comment here said "a few tens of MB", which was wrong), about 1.5 GiB for the merged
# expert tensor PEFT builds for the layer being recomputed (and its gradient), 0.34 GiB of
# logits and 0.1 GiB of checkpointed activations: about 16.6 GiB allocated at peak, 5.4 GiB
# below a 95% budget of a 24 GiB card after 0.75 GiB of CUDA context. If it does run out of memory,
# lower batch (and raise gradient_accumulation_steps) before anything else. The measured peak
# is recorded in metrics.json under hardware.peak_cuda_memory_allocated_bytes.
# Training data is synthetic verifiable tasks (see stage-moe-olmoe.toml); this is a pipeline
# smoke, not evidence. Next step after it works: stage-moe-olmoe.toml (SFT + GSPO/SAPO).

[codebook]
version = 1
fingerprint = "2b6f8175a7a7bb648910e7acb17dcfcff5149834f2fe87355c5d2c4524c113a3"

[run]
name = "moe-olmoe-sft-smoke-rtx3090"
seed = 17
hardware_profile = "hardware/rtx3090.toml"

# trl-moe does NOT read this table: it trains/evaluates on seeded synthetic verifiable tasks
# (metrics.json: data_source = "synthetic-tasks"). It exists because the run manifest requires it.
[data]
dataset = "typed_agent_behavior_v0_2"
split = "train"

[model]
family = "olmoe"
config = "training/configs/stage-moe-olmoe-sft-smoke-rtx3090.toml"
kind = "pretrained"
hf_id = "allenai/OLMoE-1B-7B-0125"
# Pinned commit of the hub repo (resolved 2026-10-04); the default branch is mutable.
revision = "9b0c1aa87e34a20052389dce1f0cf01da783f654"
precision = "bf16"
device = "cuda"

[training]
backend = "trl-moe"
precision = "bf16"
# Explicit opt-in: the training-backend component decision is still unlocked (pipeline evidence only).
allow_unselected_backend = true

[evaluation]
every = 0
suites = []

[moe.sft]
steps = 50
lr = 0.00002
batch = 2
examples = 1024
# Longer than needed for the synthetic tasks (26); headroom, and the 24 GB estimate uses 256.
max_length = 256
# Activation checkpointing recomputes each layer's forward in the backward pass: more compute,
# much less activation memory. Optimizer step = 4 micro-batches of 2 (effective batch 8).
gradient_checkpointing = true
gradient_accumulation_steps = 4

# `algorithms = []` skips RL entirely (SFT-only run). The remaining keys are required by the
# parser but unused here; values are those of stage-moe-olmoe.toml.
[moe.rl]
algorithms = []
steps = 50
num_generations = 8
# 4 optimizer steps per generation batch so clipping / the SAPO gate can act. mini_steps = 1 is
# on-policy (ratio == 1): the GSPO and SAPO first-step gradients coincide (tested against TRL
# 1.14.1 on the tiny model), but the logged loss values differ by construction and later steps
# are not bit-identical (Adam amplifies fp noise), so it is an approximate control, not an
# exact "GSPO == SAPO" identity.
mini_steps = 4
# 0.0: no reference model copy of the 7B (memory), so KL is NOT logged for this config.
beta = 0.0
epsilon = 0.2
epsilon_high = 0.28
# GSPO paper (arXiv 2507.18071) sequence-level clip range.
gspo_epsilon = 0.0003
gspo_epsilon_high = 0.0004
sapo_temperature_pos = 1.0
sapo_temperature_neg = 1.05
lr = 0.000005
prompts_per_step = 2
max_prompt_length = 32
max_completion_length = 24
temperature = 1.0

# transformers 5.x stores OLMoE experts as fused 3-D parameters
# (mlp.experts.gate_up_proj [E, 2I, H], mlp.experts.down_proj [E, H, I]), not
# nn.Linear, so expert projections are targeted via PEFT target_parameters;
# attention projections are ordinary nn.Linear modules. The router (mlp.gate) is
# deliberately left frozen so routing changes come only from the hidden states.
[moe.lora]
enabled = true
rank = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]
target_parameters = ["mlp.experts.gate_up_proj", "mlp.experts.down_proj"]

# This config exercises NO governance gate: gates run only for the tiny full-fine-tune model, so
# metrics.json reports gates_evaluated = false here. Gates are reporting-only everywhere (no
# forgetting_gate_evaluate, no pass/fail effect).
[moe.output]
dir = "training/runs/moe-olmoe"
probe_tokens = 256
