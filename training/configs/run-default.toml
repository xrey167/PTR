version = 1

# The codebook this run's codes belong to. Both fields are required and checked
# against datasets/generated/codebook.json: the version alone cannot catch tables
# edited in place, and a defaulted assignment is one nobody chose.
[codebook]
version = 1
fingerprint = "2b6f8175a7a7bb648910e7acb17dcfcff5149834f2fe87355c5d2c4524c113a3"

[run]
name = "ptr-training-dry-run"
seed = 17
hardware_profile = "hardware/default.toml"

[data]
dataset = "typed_agent_behavior_v0_2"
split = "train"

[model]
family = "ptr-a0"
config = "model/configs/ptr-a0.toml"

[training]
backend = "dry-run"
precision = "bf16"
batch_size = 1
gradient_accumulation = 1
learning_rate = 0.0001
max_steps = 100
checkpoint_every = 50

[evaluation]
every = 25
suites = ["semantic-typing", "calibration"]
