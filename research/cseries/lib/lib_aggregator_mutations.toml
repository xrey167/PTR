# Defects planted in the shared aggregation library (agg.py, stats.py). Run by run_agg_mutations.py for every stage-A experiment; each must fail the
# experiment's aggregator tests or research/cseries/tests/test_lib.py while both pass unmutated.

[[mutation]]
name = "paired-variance-divides-by-n"
file = "research/cseries/lib/stats.py"
find = "for d in differences), Fraction(0)) / (n - 1)"
replace = "for d in differences), Fraction(0)) / n"

[[mutation]]
name = "paired-half-width-ignores-the-square-root-of-n"
file = "research/cseries/lib/stats.py"
find = "half = t_quantile_value * sd / Decimal(n).sqrt()"
replace = "half = t_quantile_value * sd / Decimal(n)"

[[mutation]]
name = "paired-bounds-are-swapped"
file = "research/cseries/lib/stats.py"
find = '''        "lower_bound_permille": float((mean_d - half) * 1000),
        "upper_bound_permille": float((mean_d + half) * 1000),'''
replace = '''        "lower_bound_permille": float((mean_d + half) * 1000),
        "upper_bound_permille": float((mean_d - half) * 1000),'''

[[mutation]]
name = "median-of-an-even-count-takes-the-upper-middle"
file = "research/cseries/lib/stats.py"
find = "return ordered[mid] if len(ordered) % 2 else (ordered[mid - 1] + ordered[mid]) / 2"
replace = "return ordered[mid]"

[[mutation]]
name = "t-cdf-bisection-stops-early"
file = "research/cseries/lib/stats.py"
find = "    for _ in range(200):\n        mid = (lo + hi) / 2\n        lo, hi = (mid, hi) if t_cdf(mid, df) < p else (lo, mid)"
replace = "    for _ in range(3):\n        mid = (lo + hi) / 2\n        lo, hi = (mid, hi) if t_cdf(mid, df) < p else (lo, mid)"

