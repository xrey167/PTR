[project]
name = "ptr-consciousness"
version = "0.1.0"
description = "Pinned CPU torch environment for the C-series (functional consciousness-indicator) experiments; C001 global workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
