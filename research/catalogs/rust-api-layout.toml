version = 1

[policy]
lib_rs = "thin-facade"
default_visibility = "private"
internal_visibility = "pub(crate)"
public_visibility = "pub"
public_module_rule = "prefer private mod plus explicit pub use; pub mod only when module namespace is intentionally contractual"
parameter_rule = "descriptive names; use typed request/options structs for many or ambiguous parameters; Rust has no labelled call arguments"
collections_rule = "HashMap/HashSet for unordered lookup; BTreeMap/BTreeSet for deterministic ordering; typed values instead of String-to-String domain maps"
generic_rule = "T/E for locally obvious single generics; semantic names such as TInput/TOutput/TBackend when multiple roles exist"
trait_rule = "PTR-owned semantic traits; focused contracts; explicit object-safety/concurrency expectations; provider implementors stay adapters"
bounds_rule = "place bounds on the narrowest item that needs them; prefer where clauses for relational/non-trivial bounds; avoid speculative Clone/Send/Sync/static"
lifetime_rule = "use lifetimes only for real borrow relations; semantic names for non-trivial relations; prefer owned handles across async/process/network/persistence boundaries"
validation_rule = "is/has/can for booleans; check/validate/ensure return typed Result; verify returns domain verification types; failures include named context"
error_rule = "fallible public operations use Result<T,E>; mismatch errors carry expected/actual where meaningful; named field/message/code context; no recoverable production unwrap"
fallibility_rule = "functions that can fail return typed Result; do not encode failure as false/None/default unless absence is the actual semantic result"
test_rule = "unit tests live beside source modules; integration tests exercise public APIs under tests/*.rs; tests/common contains reusable fixtures/helpers without test annotations"
iterator_rule = "prefer IntoIterator for generic batch inputs and impl Iterator for lazy returned views; use standard adapters and short-circuit fallible traversal before materializing"
closure_rule = "use the weakest Fn/FnMut/FnOnce bound that matches capture semantics; closures stay small and must not hide authority-changing side effects"
match_rule = "prefer exhaustive match for closed semantic states; use alternatives/destructuring/ranges before wildcard fallbacks where meaning is known"
match_guard_rule = "use guards only to refine a matched semantic case with a cheap deterministic local predicate; keep a fallback arm and avoid hidden effects in guards"
macro_rule = "prefer functions/traits/generics first; use hygienic macro_rules for compile-time repetition or small typed DSLs; exported macros use $crate and narrow fragment specifiers"
proc_macro_rule = "procedural macros require a dedicated crate, explicit architectural justification and compile-pass/compile-fail coverage before becoming public API"

[[crate]]
id = "ptr-types"
current_shape = "mostly-flat"
modules = ["macros", "semantic", "epistemic", "uncertainty", "reasoning", "lifecycle", "effects", "provenance", "ids", "issues"]
public_groups = ["SemanticRole and future Goal/Constraint/Claim/Evidence wrappers", "EpistemicState/Epistemic<T>", "UncertaintyKind/Probability and future Estimate/Interval/Distribution types", "ReasoningOperator", "Revision/Generation/CommitIndex/Validity", "Effect/VerificationLevel", "provenance/evidence types", "identifier newtypes"]
function_groups = ["validated semantic/probability constructors", "epistemic/uncertainty transitions", "small value accessors"]
notes = ["primary purpose is shared cognitive/model semantic vocabulary", "no backend/model-framework dependencies", "tensor/latent representations remain in ptr-core", "component aggregates remain with owning crates", "keep internal newtype generation macro_rules isolated from public domain semantics"]

