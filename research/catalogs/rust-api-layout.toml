[[crate]]
id = "ptr-net"
current_shape = "mixed"
modules = ["identity", "endpoint", "transport", "peers", "session", "peer", "error", "adapters"]
public_groups = ["NodeIdentity", "endpoint/session types", "Transport", "PeerBook/PeerAddress", "network error"]
function_groups = ["connect/accept", "send/receive", "authenticate", "record/locate a peer's address", "session lifecycle"]
notes = ["Iroh stays feature-gated adapter", "an address is not an identity: PeerBook is keyed by the id the address itself carries, so there is no pair to transpose and a wrong address lands under its own owner", "PeerAddress has no public constructor, so the only address a wire client accepts is one the deployment's book produced", "the book replaces an address where the admission tables refuse a second entry, because a node moves and a decision does not", "discovery is a separate port and deliberately absent: a wrong answer from any future mechanism costs a failed request, because it cannot produce a working connection for an id whose key it does not hold"]

[[crate]]
id = "ptr-cluster"
