version = 1
allowed_status = ["implemented", "prototype", "scaffold", "open", "deferred"]

[[family]]
id = "identity-lifecycle"
owner = "ptr-types"
status = "prototype"
purpose = "Stable identities and lifecycle coordinates that cannot be confused by primitive types."
implemented = ["Revision", "Generation", "CommitIndex", "ProjectId", "CapsuleId", "ArtifactId", "CapabilityId", "TypeId", "PodId", "CandidateId", "RequestId", "NodeId", "EvidenceId", "PrincipalId"]
open = ["SessionId", "ResourceId", "SnapshotId", "EventId", "TraceId", "BackendId", "ModelId", "DatasetId", "RunId", "CheckpointId", "Epoch/Term type"]
invariants = ["Revision and Generation remain distinct concepts", "provider identities never replace PTR semantic identities"]

[[family]]
id = "cognitive-semantic"
owner = "ptr-types"
status = "prototype"
purpose = "Shared semantic roles and cognitive operator identities used by the neural core, model API, router and training."
implemented = ["SemanticRole", "ReasoningOperator"]
open = ["Goal<T>", "Constraint<T>", "Claim<T>", "Evidence<T>", "Relation<S,P,O>", "Resource<T>", "Procedure<T>", "ActionIntent<T>", "SemanticTypeDescriptor", "SlotId", "CognitiveTypeCodebook", "SemanticRoleCode", "ReasoningOperatorCode"]
invariants = ["semantic role is independent of epistemic state", "operator identity is typed rather than provider/string based", "model representation does not create runtime authority"]

[[family]]
id = "epistemic-probabilistic"
owner = "ptr-types"
status = "prototype"
purpose = "Represent uncertainty and evidence strength without using probability as authority."
implemented = ["Probability", "Epistemic<T>", "EpistemicState", "UncertaintyKind", "Validity", "VerificationLevel"]
open = ["Estimate<T>", "Interval<T>", "Distribution<T>", "CalibrationMetadata", "Disagreement", "UnknownReason", "ConfidenceSource", "EpistemicTransition", "EpistemicStateCode", "UncertaintyKindCode"]
invariants = ["unknown is representable", "learned confidence never grants effect permission", "uncertainty representation is independent of semantic role"]

[[family]]
id = "provenance-evidence"
owner = "ptr-types"
status = "scaffold"
purpose = "Trace semantic claims and observations back to immutable evidence and transformations."
implemented = ["ProvenanceRef", "EvidenceId"]
open = ["SourceRef", "SourceSpan", "TransformRef", "EvidenceChain", "ContentHash", "ObservationId", "AttestationRef"]
invariants = ["stronger epistemic state retains provenance", "derived search hits must resolve to authoritative evidence"]

[[family]]
id = "capability-authority"
owner = "ptr-security"
status = "prototype"
purpose = "Separate semantic capability, effect class, permission and authorization evidence."
implemented = ["CapabilityId", "Effect", "ActionAuthorization", "AuthorizationDecision", "AuthorizationDenial", "AuthorizationReceipt"]
open = ["Principal", "Session", "ResourceScope", "CapabilityGrant", "PolicyContext", "VerificationRequirement", "EscalationRequirement"]
invariants = ["effect authority cannot be bypassed by capability configuration", "soft reasoning cannot override hard denial"]

[[family]]
id = "artifact-raw-input"
owner = "ptr-ingress"
