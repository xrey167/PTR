open = ["dependency-aware label model", "annotator reliability model", "label snapshot card schema"]
invariants = ["a verifier veto is never outvoted", "Unknown and Disputed are valid outcomes", "only uniformly sampled gold estimates accuracy"]

[[family]]
id = "adapter-lineage"
