purpose = "Preserve source bytes and normalization metadata while typed interpretations evolve."
implemented = []
open = ["RawInput", "ArtifactEnvelope", "MimeType", "Encoding", "NormalizedText", "SourceRange", "TrustClass", "ParseIssue"]
invariants = ["typed interpretation never erases raw source", "normalization is provenance-linked"]

[[family]]
id = "semantic-state"
