open = ["SemanticKey<T>", "SemanticValue<T>", "GroundKey<T>", "DerivedKey<T>", "QueryKey<T>", "DependencyEdge", "DependencySet", "SnapshotHandle"]
invariants = ["reasoning snapshots are immutable", "stale derived values cannot self-promote"]

[[family]]
id = "memory-knowledge"
owner = "ptr-memory"
status = "open"
purpose = "Lifecycle-managed semantic, episodic, procedural and epistemic memory objects."
implemented = []
open = ["SemanticCapsule", "Episode", "Procedure", "ConstraintMemory", "PreferenceMemory", "MemoryLink", "MemoryValidity", "MemoryPatch"]
invariants = ["memory objects are generation-addressed", "revoked generations cannot resurrect"]

[[family]]
