open = ["MetricCatalogVersion", "Stratum", "SequentialTest"]
invariants = ["intervals are computed once, here", "metrics are defined in PTR terms and compiled per backend", "no metric is evidence about semantic state"]

[[family]]
id = "branch-speculation"
owner = "ptr-branch"
status = "prototype"
purpose = "Speculative agent branches over immutable snapshots, certified against declared dependencies and triaged by a verifier-bounded calibrated policy."
implemented = ["BranchId", "Branch", "SealedBranch", "BranchOp", "ValueDigest", "RangeDigest", "Certification", "MergePlan", "TriagePolicy", "TriageDecision", "TriageOutcome", "AutoThreshold", "CalibrationSample", "LoggedTriage", "OffPolicyEstimate", "BranchError", "ArbiterError"]
open = ["BranchLease", "TypedMergeOperator registry", "PredicateDigest beyond prefixes"]
invariants = ["a branch never writes semantic state", "a plan is committed through verified delta publication (a caller obligation until enforced by type)", "triage never moves a branch past verification"]

[[family]]
id = "fast-weight-memory"
owner = "ptr-fastmem"
status = "prototype"
purpose = "A gated delta-rule associative working memory that is a derived, exactly revocable projection of lifecycle-managed inputs."
implemented = ["FastMemoryConfig", "FastMemory", "FastWeightState", "MemoryWrite", "WriteRequest", "WriteSeq", "SourceRef", "Decay", "Query", "Readout", "WriteReceipt", "RevocationReport", "SeededProjection", "IdentifierCodebook", "FactCode", "DecodePolicy", "Recall", "FastMemoryError"]
open = ["learned key/value projections", "chunked parallel fold", "sharded journal windows"]
invariants = ["every write names its source generation and input digest", "a read is admitted only while every source is admissible", "revocation refolds bit-identically to a memory that never saw the revoked writes"]

[[family]]
