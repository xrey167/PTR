[[family]]
id = "relational-substrate"
owner = "ptr-pg"
status = "prototype"
purpose = "PostgreSQL schemas, migrations, capability probing and adapters for the projection, derived caches and working state."
implemented = ["Identifier", "SchemaSet", "PgConfig", "SchemaClass", "Migration", "MigrationReport", "Capabilities", "LexicalBackend", "LifecycleChange", "PgSubstrate", "ProjectionApply", "ProjectionEventRow", "EmbeddingSpace", "SearchDocument", "HybridQuery", "SearchResults", "FastMemoryRecord", "FastMemoryCheckpoint", "BranchOutcome", "PgError"]
