[package]
name = "ptr-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The Pod data plane (doc 42 stage S1): `serve --channel-fd` (the worker over a SOCK_SEQPACKET
# channel with descriptors) and the host module that supervises workers, admits their handles
# and releases quota charges when a worker is reaped. Linux only; on every other target the
# feature compiles to nothing, so enabling it never breaks a Windows or macOS build.
data-plane = ["dep:ptr-fabric", "ptr-fabric/worker-supervisor", "dep:ptr-runtime", "dep:ed25519-dalek"]
# Lets the worker misbehave on purpose (`--fault bad-signature|silent`) so the supervisor's
# refusals can be tested. Never part of a release build.
fault-injection = ["data-plane", "dep:libc"]

[dependencies]
ptr-types = { workspace = true }
ptr-pods = { workspace = true }
ptr-protocol = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ptr-fabric = { workspace = true, optional = true }
ptr-runtime = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
# Only for the fault-injection modes that hand over a deliberately wrong memfd. Already locked.
libc = { version = "=0.2.189", optional = true }

[[test]]
name = "pod_data_plane"
path = "tests/pod_data_plane.rs"
required-features = ["data-plane", "fault-injection"]
