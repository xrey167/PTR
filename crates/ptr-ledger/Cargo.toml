[package]
name = "ptr-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
failpoints = ["dep:fail", "fail/failpoints"]
raft-engine-backend = ["dep:raft-engine"]
raft-rs-backend = ["dep:raft", "dep:slog"]

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
ptr-types = { workspace = true }
fail = { version = "0.5", optional = true }
raft-engine = { version = "=0.4.2", default-features = false, optional = true }
raft = { version = "=0.7.0", default-features = false, features = ["prost-codec"], optional = true }
slog = { version = "2.7", optional = true }

[[test]]
name = "failpoints"
path = "tests/failpoints.rs"
required-features = ["failpoints"]

[[test]]
name = "raft_engine"
path = "tests/raft_engine.rs"
required-features = ["raft-engine-backend"]

[[test]]
name = "raft_rs"
path = "tests/raft_rs.rs"
required-features = ["raft-rs-backend"]
