version = 1
id = "ptr-memory"
maturity = "prototype"
last_reviewed = "2026-10-14"

implemented = [
  "KnowledgeObject::digest and content_digest hash length-prefixed, count-prefixed fields and a fixed binary validity (presence byte and two u64), so no choice of strings in a retrieval key, relation or provenance note can make two different objects collide; digests differ from those of earlier builds (nothing committed pins them)",
  "KnowledgeStore::register_object and admit_object refuse an object whose validity ends no later than it starts (KnowledgeStoreError::InvalidValidity)",
  "compile_structured_at / compile_selected_at (and MemoryController::compile_at / compile_candidates_at) leave out objects whose validity does not hold at the instant the context is compiled for and count them in CompiledContext::omitted_expired; the old compile_structured / compile_selected are the documented audit path with no time rule",
  "KnowledgeObject.validity (KnowledgeValidity) and is_valid_at; the content digest includes a bounded validity and is unchanged for an unbounded one",
  "MemoryClass taxonomy",
  "SemanticCapsule with lifecycle/provenance/goal/constraint/known/hypothesis/unknown/relation fields",
  "VerifiedProcedure scaffold with replay_verified flag",
  "RawEvent carries a SHA-256 content digest and an optional tool call/result pair; validate_digest and validate_tool_pair return Result<(), RawEventError> and reject tampered content (DigestMismatch) and a result without a call (ToolResultWithoutCall)",
  "KnowledgeStore (in memory) keeps raw events append-only: replaying the identical event is idempotent, reusing an id for different content is rejected as ConflictingRawEvent",
  "KnowledgeObject generations are stored under (logical_id, generation) and are immutable: registering different content under an existing key fails with ConflictingKnowledgeGeneration; lifecycle changes are kept as separate revisioned LifecycleRecords, so content_digest() does not change on a lifecycle transition",
  "KnowledgeStore::admit_object requires every raw source to be present and every dependency to name an existing, non-invalidated exact generation; a generation above 1 must supersede exactly the previous generation",
  "Lifecycle transitions are restricted to Hot -> Warm -> Cold -> Pod -> Archived, with Invalidated reachable from any state; activating a new generation invalidates the previous one; a transition to Invalidated cascades to dependents exactly like invalidate(), and re-activating a generation keeps its recorded lifecycle and is refused, with nothing changed, when the cascade from the superseded generation would reach it",
  "Invalidation propagates transitively to every object that depends on the invalidated exact generation (dependents of other generations are untouched)",
  "RetentionController/decide: pinned objects are always KeepVerbatim, otherwise a result score at or above the threshold keeps the result, else a call score at or above it drops only the result, else drops the call; a model failure or invalid decision falls back to KeepVerbatim; score_candidates rejects duplicate candidates, score-count mismatch and unknown or duplicate scores; RuleRetentionModel is a fixed 0.5/1.0 placeholder, not a trained classifier",
  "Deterministic context compiler (compile_structured/compile_selected): orders candidates by pinned flag, action rank and object key rather than input order, rejects invalidated objects, missing or dropped dependencies, missing verbatim bytes and token-budget overflow, and returns a SHA-256 digest over the compiled entries",
  "Ingestion pipeline traits (SemanticTokenizer, EntityExtractor, NamespaceResolver, KnowledgeObjectBuilder) with deterministic reference implementations: whitespace tokenizer, SHA-256-derived entity ids, first-namespace resolver and a builder producing a generation-1 Hot KnowledgeObject with the event as source and provenance; these are placeholders without semantic extraction",
  "InMemoryKvStateRuntime behind the KvStateRuntime trait: continue_state chains states from a CompiledContext digest, invalidate_dependencies marks matching states and all their descendants Invalidated, an invalidated state cannot be continued and must be recomputed",
  "KV continuation is authorized only by an opaque KvStateHandle bound to its creating runtime (ForeignHandle for another runtime's handle); callers get read-only KvStateMetadata and cannot submit edited session/revision/model/adapter/dependency fields",
  "MemoryJournal: append-only file of framed records (u32 length, in-crate IEEE CRC-32, opaque payload) with a kind-tagged header; open recovers a torn tail (incomplete or CRC-failing final frame is truncated), reports mid-file damage as a typed JournalError::Corrupt without touching the file, bounds record size and total file size (an append or rewrite that would exceed max_file_bytes is refused with FileTooLarge before anything is written), poisons itself after a failed write, and compacts by writing a temporary sibling file and renaming it over the journal",
  "DurableKnowledgeStore wraps KnowledgeStore: each successful mutation is appended to the journal in a hand-written binary encoding and replayed on open, so state_digest() after reopen equals the digest before close (checked over deterministic pseudo-random operation sequences, including across compaction); rejected operations are not journaled; when an append fails the in-memory store is rebuilt from the intact journal so readers never see a change whose call returned an error (I/O failures still poison the wrapper); state_digest length-prefixes every variable field and tags optional tool call/result presence; compaction rewrites the journal as a snapshot including lifecycle records and revision counters",
  "DurableMemoryStore keeps typed MemoryRecord values for the semantic, episodic, procedural and epistemic classes in one journaled store: every mutation is one atomic frame (committed revision horizon, logical clock, full new value of each changed record) written before memory is changed, with per-class capacity and field-size bounds and optional automatic compaction",
  "Record lifecycle is an explicit state machine (Provisional, Authoritative, NeedsRevalidation, Retired, Revoked): only allowed transitions succeed, others return InvalidTransition { id, from, to }, Revoked is terminal, and Authoritative additionally requires a committed observation (Invariant 4) so derived or search support alone can never grant authority (Invariant 5)",
  "Revocation propagation: revoking a record flags every transitive derived_from dependent as NeedsRevalidation with the revoked ancestor recorded, using a breadth-first, cycle-safe traversal bounded by depth and visited count that changes nothing when a bound is hit; the result is persisted through the journal and a flagged record cannot be re-authorised while a revoked ancestor stands",
  "Revoked ancestry is inherited along derivation: insert and add_derivation copy the parent's revoked_ancestors markers into the new record (and, for add_derivation, into every transitive dependent), flag it NeedsRevalidation, and the authority gate (also used by promote) refuses it with RevokedAncestor; the markers are part of the existing record codec, so the journal format is unchanged (tests/memory_lifecycle.rs record_derived_from_a_flagged_record_inherits_the_revoked_ancestry, adding_a_derivation_from_a_flagged_record_flags_the_record_and_its_dependents, promotion_cannot_make_a_record_with_revoked_ancestry_authoritative)",
  "ConsolidationPolicy is a deterministic rule set, not a learned model: an episodic record is promoted to semantic and authoritative after observations from N distinct sources at or below the committed revision, a typed Contradiction rejects promotion regardless of any learned score (Invariant 11), derived/search-only support is rejected (Invariant 5), uncommitted observations defer (Invariant 4); retention forgets stale unpinned episodic records by logical-clock TTL and demotes contradicted authoritative records (a contradiction outranks pinning, pinning only prevents forgetting); promotion into the semantic class is refused with CapacityExceeded at max_records_per_class",
  "SemanticObject (Goal, Constraint, KnownFact, Hypothesis, Unknown, Relation) with lossless conversion to and from the six String buckets of SemanticCapsule (relations use the text form `subject -[predicate]-> object`); the existing capsule types are unchanged and malformed relation strings are a typed error",
  "DurableKnowledgeStore journals KnowledgeObject.validity (presence byte and u64 per bound, after token_cost), so a bounded validity survives reopen and compaction (tests/durable_knowledge.rs bounded_validity_survives_reopen_and_compaction); journals written before this field are not readable, which affects no released data because the journal is new in this change",
  "Automatic compaction in DurableMemoryStore and DurableKnowledgeStore is best effort after the commit: when the journal rewrite fails the already durable mutation still returns success, the failure is exposed through compaction_failures() and last_compaction_error() (cleared by the next successful compaction), and compaction is retried on later commits",
  "DurableMemoryStore::open revalidates the replayed records against the configured MemoryLimits (id, body, support and derivation bounds, per-class capacity) and rejects a journal written under more permissive limits with RecoveredRecordInvalid or RecoveredCapacityExceeded, leaving the journal file untouched",
  "Deterministic Markdown mirrors (render_memory_mirror, render_knowledge_mirror): sorted, stable output with escaped free text; sensitive record bodies are written as [REDACTED] and raw events appear only as size and SHA-256 digest, and session ids are written only as a truncated SHA-256 digest (session:sha256:<16 hex>) because they may carry client tokens; raw event, object and entity ids are still written escaped",
]

missing = [
  "Wiring into a ptr-state repository: the journals are standalone files, not projections of committed ledger events, and nothing proves a record's revision was committed beyond the horizon the caller declares",
  "KnowledgeObject-level consolidation: promotion/demotion policy covers MemoryRecord only; KnowledgeStore objects and the SemanticCapsule/VerifiedProcedure types are not stored in DurableMemoryStore",
  "Contradictions are caller-supplied inputs per decision and are not persisted or tracked as unresolved state in the store",
  "Encryption at rest: sensitive record bodies are redacted in Debug and mirrors but are stored in clear text in the journal",
  "A trained retention model and real semantic tokenization/entity extraction: the reference implementations are deterministic placeholders",
  "Multi-vector/late-interaction representations",
]

