checks = ["repository default config parse/validate test", "typed environment override tests", "CLI precedence and unknown-argument tests", "server bind environment/CLI override test", "daemon_validation_rejects_non_loopback_and_missing_persistence (validate_daemon refuses 0.0.0.0 and a missing data_dir, accepts loopback with an existing directory)", "a_misspelled_key_is_refused_instead_of_silently_ignored and loading_from_a_path_validates_the_result", "tests/cli.rs: a_higher_layer_corrects_a_lower_one_before_the_single_validation", "tests/env.rs: the_environment_can_complete_a_qwen_section_the_file_leaves_empty (from_path refuses the incomplete file, parse_path plus apply_env accepts it once the environment supplies the pins and still refuses a partial overlay)", "workspace fmt/check/test/clippy", "tests/unsupported.rs: field table matches the serialized default config, every refused field accepts its default and refuses a changed value with a field-specific error, plus file, environment and CLI paths and retain_raw_evidence=false; stale_revision_cancellation_can_be_switched_off_by_file_and_environment (semantic.cancel_stale_revisions=false is accepted and the field is Consumed)", "tests/vcw.rs: learning is off by default, shadow parses and validates, an unknown mode and shadow with a zero exploration floor are refused"]