version = 1
id = "ptr-config"
maturity = "prototype"
last_reviewed = "2026-10-04"
implemented = [
  "An optional [wire] section (D4 in issue #23): max_concurrent, per_connection_deadline_ms, services and peers are all required, with no defaults — absent means no wire is served — and deny_unknown_fields refuses a misspelled key. WireConfig::validate refuses a limit outside 1..=4096, a deadline outside 10..=600000 ms, an empty, unknown or repeated service, a peer id not in the transport's canonical 64-lowercase-hex spelling, a direct address that is not IP:PORT and a duplicate peer id, each with its own WireConfigError code that PtrConfig::validate puts at the front of its message",
  "Typed deserialization/defaults for runtime, semantic, action-boundary, observability and research sections",
  "Repository default TOML parsing",
  "Basic configuration validation",
  "Typed environment override layer for runtime/action/semantic/observability/research settings",
  "Typed CLI override parser with config-path selection and file→environment→CLI precedence",
  "Typed server bind configuration with PTR_BIND and --bind overrides",
  "ServerConfig::data_dir (default data) and a new ModelConfig::backend section (default reference-echo), overridable by PTR_DATA_DIR/--data-dir and PTR_MODEL_BACKEND/--backend, with the same file→environment→CLI precedence",
  "PtrConfig::validate_daemon, a stricter check for the standalone daemon boundary on top of validate: only runtime.mode standalone, only a loopback server.bind, an explicit server.data_dir that already exists as a directory, and an explicit model.backend. Nothing in the workspace outside ptr-config calls it yet",
  "Every configuration section refuses unknown keys (deny_unknown_fields), so a misspelled key or section fails the load instead of silently falling back to a default, and PtrConfig::from_path validates the loaded configuration before returning it",
]
missing = [
  "Per-backend typed configuration sections",
  "Secret/reference types instead of plaintext secret values",
  "Config schema generation and migration/version policy",
]
next = [
  "Extend typed config to backend-specific adapter sections without leaking secrets",
  "Generate config schema and example profiles",
  "Wire ptr-config into ptr-runtime and ptrd",
]
experiments = ["E001"]
evaluations = []
decisions = ["ADR-0004-backend-independence.md", "ADR-0014-config-layer.md"]
checks = ["wire tests in tests/config.rs: a_wire_section_with_every_field_decided_validates_and_no_section_serves_nothing, a_wire_section_that_leaves_a_field_undecided_is_refused, a_wire_limit_or_deadline_out_of_range_is_refused_by_name (with each bound accepted as the control), a_wire_service_list_that_is_empty_unknown_or_repeated_is_refused_by_name, a_malformed_or_duplicate_wire_peer_is_refused_by_name (with a second distinct peer accepted), every_wire_refusal_has_its_own_code", "repository default config parse/validate test", "typed environment override tests", "CLI precedence and unknown-argument tests", "server bind environment/CLI override test", "daemon_validation_rejects_non_loopback_and_missing_persistence (validate_daemon refuses 0.0.0.0 and a missing data_dir, accepts loopback with an existing directory)", "a_misspelled_key_is_refused_instead_of_silently_ignored and loading_from_a_path_validates_the_result", "workspace fmt/check/test/clippy"]