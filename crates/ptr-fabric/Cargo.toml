[package]
name = "ptr-fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The HostShm carrier: a dedicated sealed memfd per export. Linux only; on every other target
# the feature compiles to nothing, so enabling it never breaks a Windows or macOS build.
shm-backend = ["dep:rustix"]
# The worker data channel: framed messages with `SCM_RIGHTS` descriptors over a connected
# `SOCK_SEQPACKET` pair (doc 42 stage S1). Linux only, like `shm-backend`.
worker-channel = ["shm-backend", "rustix/net", "rustix/event"]
# Descriptor confinement for a worker: the host probe, the confinement value, the carrier
# policy and the seccomp allowlist (doc 42 stage S1). Linux only.
worker-confine = ["worker-channel", "dep:libc"]
# The worker supervisor: spawn a confined worker process, watch it, reap its whole cgroup and
# drain its channel (doc 42 stage S1). Linux only.
worker-supervisor = ["worker-confine"]
# The CUDA foundations of the CudaIpc, DevicePeer and PinnedHost carriers and the CUDA staging
# backend (doc 42 stages S2 and S3): the driver probe, the VMM staging export and import, and
# the pinned registration of a HostShm region, through `cudarc`. Linux only. Two variants,
# because `cudarc` allows one linking mode per build:
#
# * `cuda-ipc-core` carries the code and `cudarc` with `std` and `driver`, plus
#   `fallback-dynamic-loading` (a no-op as soon as another crate in the build picks a linking
#   mode) and `cuda-version-from-build-system` with `fallback-latest` (candle's own choice; the
#   fallback only matters on a host without `nvcc`). It names no linking mode and no fixed CUDA
#   version, so a build that also enables `candle-cuda` (dynamic linking, version from `nvcc`)
#   unifies with it; on its own it falls back to dynamic loading and the newest bindings.
# * `cuda-ipc` is the toolkit-free variant CI uses: `cuda-ipc-core` plus `dynamic-loading` and
#   the fixed `cuda-12080` bindings. Do not combine it with `candle-cuda`: cudarc's build script
#   panics when `dynamic-loading` and `dynamic-linking` are both on.
#
# With `cuda-ipc` nothing links `libcuda`: a host without a driver gets a typed "no driver"
# result, never a panic and never a link error. Under dynamic linking (core with `candle-cuda`)
# a missing `libcuda` fails when the process loads, before any code runs.
cuda-ipc-core = [
    "shm-backend",
    "dep:cudarc",
    "dep:libc",
    "cudarc/fallback-dynamic-loading",
    "cudarc/cuda-version-from-build-system",
    "cudarc/fallback-latest",
]
cuda-ipc = ["cuda-ipc-core", "cudarc/dynamic-loading", "cudarc/cuda-12080"]

[dependencies]
# The handle, its locators and the digest rule the carriers check against.
ptr-protocol = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the lockfile (through other crates); a direct dependency on the same version adds
# no package. `fs` for memfd_create and the seals, `mm` for mmap and munmap, `param` for the
# page size. Linux only, so `shm-backend` builds nothing and pulls nothing on other targets.
rustix = { version = "=1.1.5", optional = true, default-features = false, features = ["std", "fs", "mm", "param"] }
# Raw `prctl`, `seccomp`, `unshare` and `fork` for the confinement probe and the filter, and the
# syscall numbers of the allowlist. Version already in the lockfile.
libc = { version = "=0.2.189", optional = true }

# The driver binding of `cuda-ipc-core` and `cuda-ipc`. Version pinned; the base features are
# `std` and `driver` (the `cu*` entry points); the linking mode and the bindings version come
# from the feature table above. Version already in the lockfile through candle, so no package
# is added.
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver"] }

[dev-dependencies]
ptr-types = { workspace = true }

[[test]]
name = "bytes_carrier"
path = "tests/bytes_carrier.rs"

[[test]]
name = "host_shm"
path = "tests/host_shm.rs"
required-features = ["shm-backend"]

[[test]]
name = "worker_channel"
path = "tests/worker_channel.rs"
required-features = ["worker-channel"]

[[test]]
name = "worker_confine"
path = "tests/worker_confine.rs"
required-features = ["worker-confine"]

[[test]]
name = "cuda_gating"
path = "tests/cuda_gating.rs"

[[test]]
name = "cuda_ipc"
path = "tests/cuda_ipc.rs"
required-features = ["cuda-ipc-core"]

[[test]]
name = "cuda_ipc_process"
path = "tests/cuda_ipc_process.rs"
required-features = ["cuda-ipc-core", "worker-channel"]

[[test]]
name = "gpu_worker"
path = "tests/gpu_worker.rs"
required-features = ["cuda-ipc-core", "worker-confine"]

[[test]]
name = "staging_pool"
path = "tests/staging_pool.rs"
required-features = ["shm-backend"]

[[test]]
name = "staging_cuda"
path = "tests/staging_cuda.rs"
required-features = ["cuda-ipc-core"]

[[test]]
name = "worker_supervisor"
path = "tests/worker_supervisor.rs"
required-features = ["worker-supervisor"]
