version = 1
id = "ptr-fastmem"
maturity = "prototype"
last_reviewed = "2026-09-26"

implemented = [
  "Multi-head matrix state updated by the gated delta rule in its Kimi Delta Attention form, with scalar, per-channel or no decay, read by o = S^T q",
  "Every write names its semantic input, generation and input digest; a read is admitted only if every source is admissible according to the caller's lifecycle view when the read is made (a revocation committed after that view is not seen, so decoded candidates still pass the lifecycle check at use; ptr-pg source_admission answers a whole source set from one snapshot and names the commit it reflects), and only for a query normalised for the memory's head shape (a Query keeps heads and key_dim; any other shape is a DimensionMismatch)",
  "A memory is bound when it is created or restored to the IdentifierCodebook (seed and code length, which must be the value length) its values are codes of; its readouts carry that codebook, fact_codes derives candidates from it, FactCode is built only by a codebook and keeps it, and decode_readout refuses a fact code from any other codebook (CodebookMismatch) instead of scoring crosstalk of the right length; ptr-pg restore_memory binds a stored memory to the codebook seed its registration records",
  "In-process journal of admitted writes (keys normalised per head) plus checkpoints every C writes; revocation refolds from the last checkpoint before the first revoked write. restore takes the writes as composed (WriteRequest), which the storage keeps: ptr-pg stores each request as f32 bit patterns",
  "Deterministic f32 fold: the refolded state is bit-identical to a memory that never saw the revoked writes",
  "binding_digest_of names the ordered folded writes by sequence, source key, generation and input digest (not by key and value bits); ptr-pg recomputes it from the stored journal prefix, refuses to store a checkpoint that does not match and never returns one that no longer does",
  "Seeded orthogonal key projection (at most MAX_HEADS * MAX_HEAD_DIM rows, the row count computed with checked arithmetic, from an embedding at most MAX_EMBEDDING_DIM = 8,192 wide, refused before allocating; every configuration check_config admits has a key and a value projection from every such width that is at least its head width; each coordinate is summed in f64 and rounded once, and one beyond f32's range is refused as NonFinite rather than returned infinite) and identifier codebook (codes no longer than MAX_HEADS * MAX_HEAD_DIM, the longest value vector); readouts decode to named capsules or to Unknown below a margin; constraint and procedure sources shape the state but are never decode candidates, and a decode policy that would fail open (zero limit, NaN or negative threshold) or a nonfinite score is refused",
  "PTRFW001 state codec with full f32 cells and a SHA-256 trailer",
  "Bounded shapes, journal length, checkpoint interval and sequence numbers (a journal ends below u64::MAX, so its next write can always be numbered) with typed refusals; a shape's lengths saturate at usize::MAX instead of overflowing, so a shape check_config refuses never wraps to a plausible length; public validate_write shares restore admission rules",
  "Value cells are bounded by MAX_VALUE_MAGNITUDE (2^24) at admission, independently of the state, and every key head that is not all zero is normalised to unit length at any scale (divided by its largest magnitude before its norm is taken, so no square underflows or overflows), so every fold of admitted writes stays finite whatever their order or subset and refolds after revocation admit exactly the same writes",
]

