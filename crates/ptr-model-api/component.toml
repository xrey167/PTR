implemented = [
  "Backend-neutral ModelRequest with request/revision/raw text",
  "ModelEvent enum for slot, hypothesis, confidence, typed ReasoningOperator request, typed Pod request, candidate, action, token and completion events",
  "InferenceBackend trait and ModelError",
  "KV-reuse P2a taint types: KvReuseReport::digest and ::taint, KvReuseTaint (Exact default, Approximate { report_digest }, join where Approximate dominates and two Approximate keep the smaller digest), Tainted<T> (exact, from_report, map, combine, value, taint, into_exact refusing Approximate with TokenContractError::ApproximateTaint; no setter or downgrading constructor) and ModelRun::taint / into_tainted_events; enforced at the action boundary by ptr-runtime",
  "Deterministic ReferenceEchoBackend for runtime conformance tests",
  "ModelObservation, ModelResumeRequest and ResumableInferenceBackend continuation contract",
  "ModelRequest and ModelResumeRequest carry a ptr_types::SemanticContext (revision plus the exact snapshot entries) instead of a bare revision; revision() reads it back from the context",
  "ModelEvent::ActionReady carries a full ptr_types::ActionIr (operation, target, capability, effect, input type, generation, revision, payload) instead of an operation string",
  "ReferenceEchoBackend also implements ResumableInferenceBackend (resume yields Finished)",
  "ScenarioBackend: a deterministic demonstrator backend named scenario that echoes the raw text as a Token and emits one Mutation ActionIr (create demo-note, capability demo.local-note.create, type ptr.demo-note.v1) at the request's revision; resume yields Finished. Its own doc comment calls it plumbing evidence for the local HTTP/effect path, not a model-quality baseline",
  "KV-reuse P1 token contract (doc 36): TokenId, Tokenizer trait with TokenizerIdentity, ByteTokenizer (ptr.byte v1, one token per UTF-8 byte), SegmentSource (Raw, Semantic, Memory, Derived), PromptSegment with SHA-256 content_digest and lineage_contribution (Raw carries kind and content digest only), SegmentedModelRequest with tokens() and order-dependent lineage_digest() (covers semantic revision, tokenizer identity and segments), KvReuseMode, KvReusePolicy, KvReuseHint, KvReuseReport (hit_tokens bounded by total, Approximate rejected under ExactOnly), ModelRun and the KvReusingBackend trait; ModelRequest is unchanged. The one non-test implementation is ptr-runtime's CPU ReferenceKvReuseBackend; that Approximate reuse never reaches an effect path is enforced in ptr-runtime (authorize_action and the execution boundary), for runs the host routes through it",
  "PromptSegment::from_text/from_tokens Semantic, Memory and Derived segments are caller-asserted (documented on the constructors): the crate cannot check that the text is the committed value of its source at its generation; a production path builds Semantic segments with ptr-runtime PtrRuntime::semantic_prompt_segment, and lineages fragment per cited generation",
  "AdaptiveBatcher<B: BatchInferenceBackend>: one worker thread, a bounded queue (queue_capacity at most 65536; a full queue answers ModelError::overloaded before anything grows), requests grouped by BatchKey { project, adapter, principal, generation } so different keys (a same-named adapter of another project included) never share a model call, a batch dispatched when it holds max_batch requests, when its oldest request has waited max_wait, or when its tightest deadline is within the margin, the key of the oldest ready request first; a request whose deadline passed or that was cancelled (CancelFlag) is answered without a model call, at the door or in the queue; a BatchGate is asked about the batch's key immediately before every model call (a revoked generation or project is refused at that use, ModelError::revoked), a key that names an adapter is refused when the batcher has no gate (AdaptiveBatcher::new has none, with_parts takes an optional one; there is no admit-all default), and a resume goes through an opaque Continuation: infer_scoped returns the answer with one (not Clone, no public constructor, an unguessable 128-bit id, Debug prints nothing of it), the whole resume context (BatchKey, request id, semantic context, round) lives in a table of at most MAX_OPEN_CONTINUATIONS (4096) with a quota of MAX_CONTINUATIONS_PER_PRINCIPAL (256) per BatchKey.principal keyed by that id (a principal at its quota evicts its own oldest; when the table is full, entries past their deadline or cancelled are swept first and, if it is still full, the new infer_scoped is refused with ModelError::overloaded before the model runs and nothing of another principal is evicted: existing continuations are never lost to others' load, and opens can be refused under load; an evicted continuation fails closed), and resume_continuation(continuation, key, observation) consumes the handle and the entry, refuses a key other than the entry's (and an unknown, evicted or used continuation) with ModelErrorKind::ScopeMismatch, asks the gate about the entry's key and builds the ModelResumeRequest itself from the stored request id, semantic context and round plus the caller's observation, returning the continuation of the next round; The observation is new caller input under the continuation's scope: the gate checks exactly that scope, as for a fresh infer under it, and the batcher cannot see where the caller's bytes came from; what it guarantees is that no stale state is resumed, because request id, semantic context, round and (in the router) placement come only from the table entry, which belongs to exactly one scope; the entry also keeps the admission's deadline and CancelFlag, and every resume path (resume_continuation and the unscoped trait resume) is refused when the batcher is closed (ModelError::closed), past its deadline or cancelled, before and after the gate, without a backend call; plain infer and infer_with open no continuation; the unscoped resume of the trait is served only by a batcher built without a gate and is refused with ModelError::revoked when a gate is configured; a resume has the same panic containment as a batch (a panicking backend fails that call as backend_failure); a gate that panics has not admitted the key (the batch or resume is refused as revoked, counted, and the worker keeps serving); a worker that ends for any reason closes the batcher and answers every queued caller with ModelError::closed, so nobody waits on a queue nothing serves; deadlines and cancellations are checked again after the gate, immediately before the backend call, so a request that went stale while the gate decided never reaches the model; a backend panic or a wrong-length answer fails its batch and the batcher keeps serving; every caller gets exactly one answer, also on drop; counters in BatchStats. infer_with takes the per-request BatchAdmission; the plain infer uses the unscoped key and no deadline. The deterministic queue rule (batch_queue) takes the time as an argument and is unit-tested with a virtual clock",
  "ReplicaRouter over Arc<dyn ResumableInferenceBackend> (1 to 64 replicas) under a ReplicaPolicy { max_failover, resume }: round-robin start, failover to at most max_failover other replicas each tried once, by an allowlist on the typed ModelErrorKind (ModelError::allows_failover: only Overloaded and BackendFailure; a refusal of the request itself, kind Other, a passed deadline, a cancellation, a revoked generation and a closed backend end the request, and the message is never read); resume tries one replica unless ResumeFailover::Interchangeable declares the replicas interchangeable for a resume, and infer_placed returns the answer with a per-invocation Placement (not Clone, no table) that resume_placed consumes and answers with the placement of the replica that served it (every round keeps its affinity), so under Never a resume goes to exactly the replica of its own invocation, once, and two calls under one request id keep separate placements; the plain trait resume carries no placement and takes the rotation's replica; per-replica attempts, failures and failovers; ReplicaRouter(AdaptiveBatcher(backend)) composes; a replica that panics is a failed replica (backend_failure, counted, failed over) and not a failed caller",
  "ModelError is a typed error { kind: ModelErrorKind, message } with constructors and predicates for the contract kinds (overloaded, deadline_exceeded, cancelled, revoked, closed, backend_failure) and ModelError::new(message) for any other failure (kind Other); the old tuple field is gone, so code built ModelError(String) now calls ModelError::new and reads message()",
]

missing = [
  "A real Hugging Face tokenizer behind the Tokenizer trait: ByteTokenizer is the only implementation, and the tokenizers-backed tokenizer of ptr-pods' qwen-cpu feature does not implement it",
  "KV-reuse taint is not carried with cached pages or catalog entries, on ActivationFrame, KV page transport or tier objects (ptr-runtime persists the taint registry as ledger events and contains tainted Pod outputs, see its component record); a Tainted<T> wrapper can be bypassed by cloning the value out of value(), so it is a discipline for derived values, not a sandbox",
  "Any KvReusingBackend outside ptr-runtime's CPU reference: the P2 catalog, admission and Raw-segment checks live in ptr-runtime (PtrRuntime::admit_segments), not in this crate, which only offers the raw_from_* constructor split",
  "Async streaming backend contract",
  "Backend capability negotiation",
  "SGLang, vLLM and Burn-native adapters",
  "Backend checkpoint/state handles beyond observation-based continuation",
  "Structured cancellation and timeout semantics",
  "AdaptiveBatcher is not wired into ptrd or ptr-config ([model.batch] and [model.replicas] do not exist): ptr-server serializes requests behind the runtime lock, so a batcher in front of it would only queue; the lock restructuring (model call outside the lock, commit inside) is not done",
  "ModelRequest carries neither a deadline nor a batch key (adding fields would touch every struct literal, about 70 across 40 files); the scoped path is AdaptiveBatcher::infer_with",
  "No backend implements infer_batch with a batched forward pass, so the default sequential loop gains nothing; the throughput gain of batching is unmeasured, and the experiment that would measure it, E014-adaptive-batching, is planned with no entrypoint (it cannot be frozen until the server calls the model outside its runtime lock)",
  "ReplicaRouter failover does not carry the request deadline, and the replicas must serve one model: a resume that starts at the next replica in rotation, not at the one that served the infer, is correct only for replicas declared interchangeable; and a batcher refuses a resume of a request id it did not serve, so behind a router a resume works only when rotation reaches the batcher that served the infer",
]

