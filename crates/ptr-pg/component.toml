  "The verification report and calibration draw behind a logged triage, so storage could check eligibility and slice membership too; record_triage and work migration 10 check only what the row and its cited policy determine",
  "Fast memories registered only with the principal of the admitted execution session; FastMemoryRecord::principal, like a stored branch's author, is whatever PrincipalId the caller passes",
  "A keyed seal tag binding a stored branch to the content its author sealed: the database refuses changing, removing or appending a stored branch's rows, but a writer with the work schema's privileges can delete a whole branch and write other rows under its id in one transaction, and load_branch returns them like sealed ones",
  "Database checks of the two sealing rules that compare a digest with the digest of absence or of the empty set (no set member present in a base without its key; a Remove only of a key with no inputs); load_branch refuses rows breaking them",
]

