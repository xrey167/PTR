[package]
name = "ptr-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
tier-opendal = ["dep:opendal"]
tier-opendal-fs = ["tier-opendal", "opendal/services-fs"]
tier-opendal-s3 = ["tier-opendal", "opendal/services-s3"]
# Linux only; compiles to nothing on other targets.
tier-pinned = ["dep:rustix", "rustix/mm", "rustix/param"]
tier-direct-io = ["dep:rustix", "rustix/fs"]

[dependencies]
ptr-types = { workspace = true }
aes-gcm-siv = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
opendal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "pinned_tier"
required-features = ["tier-pinned"]

[[test]]
name = "direct_io_tier"
required-features = ["tier-direct-io"]
