[package]
name = "ptr-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
candle-cuda = ["ptr-pods/candle-cuda"]
# Enables the `vcw_qwen` example: real CPU language-model experts behind ptr_pods::TextGenerator.
qwen-cpu = ["ptr-pods/qwen-cpu"]
oidc-http = ["dep:reqwest", "dep:rustls"]

[dependencies]
ptr-types = { workspace = true }
ptr-config = { workspace = true }
ptr-protocol = { workspace = true }
ptr-semdb = { workspace = true }
ptr-core = { workspace = true }
ptr-model-api = { workspace = true }
ptr-exec = { workspace = true }
ptr-pods = { workspace = true }
ptr-router = { workspace = true }
ptr-verifier = { workspace = true }
# The verifier-closed loop reuses the critique and exhaustion types of the generate-verify-repair
# loop and cross-checks its accept decision against Candidate::passes.
ptr-feedback = { workspace = true }
ptr-ledger = { workspace = true }
ptr-lineage = { workspace = true }
ptr-state = { workspace = true }
ptr-events = { workspace = true }
ptr-security = { workspace = true }
ptr-memory = { workspace = true }
ptr-storage = { workspace = true }
# Only the runtime merges an agent branch: merge_branch certifies a sealed
# branch against the runtime's own state and triages it under the grant's
# policy, so both come from the crate that defines them.
ptr-branch = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"], optional = true }

[dev-dependencies]
# Search hits are filtered against this runtime's lifecycle answers; the test
# composes the two public APIs the way a caller does.
ptr-search = { workspace = true }

[[example]]
name = "vcw_qwen"
required-features = ["qwen-cpu"]
