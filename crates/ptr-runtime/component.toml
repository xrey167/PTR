  "Define the PodWire request framing, which is still undefined even though the execution wire is not",
  "Retaining a NeuralAnchor outside the artifact remains a deployment obligation; nothing here stores one",
  "Connect evaluated raft-engine/Turso adapters through typed backend config while preserving FileLedger reference mode",
  "Add opaque backend checkpoint handles and async streaming around the implemented observation resume contract",
  "Wire ptrd request handling beyond bootstrap ingestion",
]
experiments = ["E001", "E003", "E004"]
evaluations = []
decisions = ["ADR-0001-rust-runtime.md", "ADR-0012-hard-effect-boundary.md", "ADR-0013-runtime-orchestrator.md"]
checks = [
  "the committed checkpoint fixture records the slot encoding it was produced under, and verification names both the codebook and the encoding",
"detached work fences the runtime until the adapter answers: the fence names the attempt, no permit can be prepared, no journal anchor or compacted snapshot is produced, and the settlement carries the response digest",
  "an adapter that would not take the work still leaves the window open, because not accepted is not not-applied; a detached attempt survives a restart as a fence that only reconciliation moves, and the adapter's own answer is refused there",
  "the same runtime restored with the attempt it wrote and no settlement is still fenced and cannot reconcile on a ledger with no index left; an attempt record the ledger cannot commit returns Audit, reaches no executor and leaves no attempt unsettled, while the runtime is fenced by its own ambiguous append",
  "an effect whose settlement cannot be committed, on a ledger one index below its ceiling, is returned as SettlementNotRecorded naming the attempt after the executor ran once, and the attempt still fences the runtime: no permit is prepared, no journal anchor is produced and reconciliation is refused in that process; an adapter's answer that cannot be recorded leaves the detached attempt outstanding, and handing it over again is SettlementNotRecorded again rather than a refusal",
  "each dispatch path refuses the other kind of grant with no record written and nothing verified; a settlement for an attempt this runtime did not hand out, and a second settlement of one it did, are refused; so is an adapter answer for an attempt reconciled in the meantime, which is no longer outstanding, with nothing appended and the runtime left unfenced",
  "an at-most-once key hands detached work out once: while the first is outstanding the fence refuses a retry by name, and after settlement a retry is answered from history without calling the adapter; an oversize answer keeps its digest without being retained and the next retry is refused rather than answered with something the effect never produced",
  "withdrawing one peer or replacing the policy in the prepare-to-consume window refuses that permit before the verifier while another session keeps working; a generation superseded or revoked in that window is refused before the verifier; one session's successful effect refuses another's in-flight permit without reaching the executor",
  "a real ptr-burn-a0 checkpoint binds to committed state, is admitted, seals and reopens with its weights unchanged, and is then refused once the generation it was bound under moves and once the semantic input it read is edited", "a checkpoint whose assignment moved, one whose codebook contradicts the declaration, one whose table width is not its family's cardinality and every prefix of one are each refused, with the intact fixture binding as the control", "an admitted peer executes only its granted action and the audited principal is the policy's; a different operation or project is denied before any check that could depend on what the caller claims", "withdrawing a peer refuses a permit issued beforehand, new preparations and re-admission without the TTL moving; replacing the policy kills live sessions and re-admitting does not revive them", "a Pod in another project is unavailable in a refusal equal to the one for a Pod that does not exist, while the same request inside its own project succeeds", "a runtime reopened after an executor error or panic is still fenced by the unsettled attempt it left, refuses to register a session and refuses to commit", "an applied effect commits its attempt before and its settlement after, with the action digest and admitting verification level asserted field by field", "a retry under an at-most-once key returns the first response without dispatching again, before and after a restart, while a different key does dispatch", "reconciliation lifts the fence for both outcomes and lets a key reconciled as unapplied execute again", "a fenced runtime yields no journal anchor and no compacted snapshot; a denied preparation writes no record", "settlements naming no live attempt, a second live attempt under one key, a malformed key, and a retained response that is oversize or contradicts its digest are each refused before append and during replay", "an empty runtime round-trips at the empty floor; a runtime restored at the index ceiling refuses a commit with PTR_LEDGER_INDEX_EXHAUSTED, stores nothing and fences the retry; revocation outranks every other binding mismatch simultaneously", "an admitted state reproduces the identical inference event sequence after a restart, with binding and opaque payload byte-for-byte equal", "revocation, supersession, edited/removed inputs, foreign history with identical counters, unverifiable position, compacted restore, contradicting revision, unknown/changed codebook, unknown target and a fenced runtime each denied", "every single-bit mutation of a sealed state rejected; wrong outer/binding magic, reserved field, length mismatch, byte removal/insertion and undersize rejected after resealing the digest", "an unrelated commit leaves a state admissible, so dependency-precise binding is asserted in both directions", "compacted reconstruction equals a full replay across semantic payloads, dependencies, supersession, constraints, procedures and revocations", "a revocation below the floor still denies after compaction; every single-bit mutation of a compacted snapshot rejected", "resealed noncanonical sections, reserved fields, length and trusted-identity mismatches, and records not above the floor all rejected", "snapshot exact-state/byte-corruption/rollback/revision/legacy/overwrite/authority rejection tests", "scoped execution positive/negative integration tests and non-forgeability/single-use compile-fail doctests", "runtime ingestion/revision/generation/capability/materialization integration tests", "typed authorization decision exposure and RuntimeError compatibility test", "reference model-loop integration test", "bounded verified Pod-observation resume-loop tests", "revocation replay/restart integration test", "durable FileLedger runtime reopen preserves revocation and materialized commit position", "an attributed semantic record is refused by commit and by replay, open_durable, open_durable_at, restore_recovery_snapshot and restore_compacted at its index, the log left byte for byte, while the same record with a legacy origin commits", "workspace fmt/check/test/clippy",
  "tests/at_most_once_keys.rs: another payload and another principal under a spent key are refused with KeyBoundToAnotherAction, reach no executor and write no record, while the request that spent the key is still answered, and a detached dispatch under a spent key hands nothing out; a key reconciled as applied is bound to its attempt's action and one reconciled as not applied binds nothing; the binding holds for payload and principal after a restart and after a compacted round trip, and for the project, from an attempt written into the log directly, after a restart and after a compacted round trip; a detached retry names the attempt that settled its own key when another key settled equal bytes and after compaction, and a ResponseNotRetained refusal names it when the key was attempted twice and after compaction; a retry carrying the current revision and generation is answered after an unrelated delta moved the revision and after the capsule's generation was superseded, live, after a restart and after a compacted round trip, while another payload and another principal are still refused; the admission policy admits a peer under a 64 KiB principal, and a session registered under one spends a key, after which the runtime still exports, restores and answers the retry while another principal is refused; a keyed attempt committed directly under an empty, a 64 KiB, a padded or a control-character principal, and one under an empty or 64 KiB project, opens with replay, open_durable, open_durable_at and restore_recovery_snapshot however its key ended, and once reconciled as applied exports and restores with the key bound to it; a log an earlier build could have written with such a principal or project reopens however the attempt ended, exports unless fenced, refuses alice's request under the key once applied and binds nothing once reconciled as not applied; a key past MAX_KEY_BYTES, and one of the wire's 64 KiB, is refused by prepare_execution_once and at commit, while a history or log holding it opens however it ended, the request that spent it is answered from history (its response once settled, ResponseNotRetained once reconciled as applied) without running, an attempt under it after it was reconciled as not applied is refused at commit with nothing attempted, and export fails once it has settled either way; the longest allowed opens on each path and is spent, exported, restored and answered; a resealed snapshot whose recorded principal's length runs past the section is refused with PTR_COMPACTED_LENGTH and one whose recorded project is not UTF-8 with PTR_COMPACTED_NONCANONICAL_SECTION; a PTRCS002 snapshot and a PTREX001 section are refused by version after resealing (a_spent_key_is_refused_for_another_principal_rather_than_answered_with_its_receipt, a_retry_is_answered_after_the_revision_and_generation_move_and_another_request_is_still_refused, a_principal_of_any_length_spends_a_key_and_a_snapshot_carries_it, a_keyed_attempt_under_any_principal_is_committed_and_a_snapshot_carries_it, a_key_longer_than_a_snapshot_carries_is_refused_before_it_is_spent_and_a_logged_one_is_still_answered, a_keyed_attempt_under_any_project_is_committed_and_a_snapshot_carries_it, a_snapshot_whose_recorded_project_or_principal_is_malformed_is_refused)",
  "tests/verified_delta.rs: a verified delta commits the state its verifier saw; no failing score, shallow level or hard finding gets a delta past verification; a moved revision is refused before verification; revoked, superseded and unknown generations never read as Live; search hits filtered by generation_validity drop a revoked live generation; a certified delta is refused while a generation it relied on is revoked, superseded or unknown, a no-op included, and appends nothing (a_certified_delta_is_refused_while_a_generation_it_relied_on_is_not_live_and_appends_nothing)",
]
