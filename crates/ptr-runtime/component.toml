checks = ["an admitted state reproduces the identical inference event sequence after a restart, with binding and opaque payload byte-for-byte equal", "revocation, supersession, edited/removed inputs, foreign history with identical counters, unverifiable position, compacted restore, contradicting revision, unknown/changed codebook, unknown target and a fenced runtime each denied", "every single-bit mutation of a sealed state rejected; wrong outer/binding magic, reserved field, length mismatch, byte removal/insertion and undersize rejected after resealing the digest", "an unrelated commit leaves a state admissible, so dependency-precise binding is asserted in both directions", "compacted reconstruction equals a full replay across semantic payloads, dependencies, supersession, constraints, procedures and revocations", "a revocation below the floor still denies after compaction; every single-bit mutation of a compacted snapshot rejected", "resealed noncanonical sections, reserved fields, length and trusted-identity mismatches, and records not above the floor all rejected", "snapshot exact-state/byte-corruption/rollback/revision/legacy/overwrite/authority rejection tests", "scoped execution positive/negative integration tests and non-forgeability/single-use compile-fail doctests", "runtime ingestion/revision/generation/capability/materialization integration tests", "typed authorization decision exposure and RuntimeError compatibility test", "reference model-loop integration test", "bounded verified Pod-observation resume-loop tests", "revocation replay/restart integration test", "durable FileLedger runtime reopen preserves revocation and materialized commit position", "workspace fmt/check/test/clippy"]