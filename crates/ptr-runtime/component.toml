version = 1
id = "ptr-runtime"
maturity = "prototype"
last_reviewed = "2026-10-03"
implemented = [
  "admit_pod_output builds a hypothesis's PodOutputAdmitted and PodHypothesisCommitted events up front and checks both with the ledger's check_encodable before committing the first, so an output over the ledger limits is refused whole instead of leaving an admission whose retry reports success for a hypothesis that was never created",
  "The cached JWKS document is dated from when the fetch returned, not when it started, so a fetch slower than the refresh cooldown does not hand back keys that are already stale; the cooldown for new attempts still counts from the start",
  "bind_checkpoint resolves the slot encoding an artifact records and refuses a definition this build has no implementation of, because weights trained on vectors it cannot recompute are weights it cannot feed; the encoding is deliberately not part of a StateDeclaration, which says which committed facts a state came from rather than how an artifact was constructed",

  "AdmissionPolicy maps a transport-authenticated peer to one principal and one grant set; admit_peer takes the peer and nothing else, so no caller-supplied parameter can name either, and a second entry for a peer is refused rather than replacing the first",
  "A session admitted from the policy re-derives its authority at every use, so withdrawing a peer or replacing the policy stops live sessions at once instead of when a TTL runs out; a host-registered session carries no peer and is unaffected",
  "Pod resolution is scoped by project, and a Pod in another project is unavailable in exactly the same words as one that does not exist, so a refusal is not an existence oracle across the boundary",
  "Durable execution audit: an effect commits an EffectAttempted record before it is dispatched and an EffectSettled record after, so the window between them is described by committed history rather than by process memory",
  "The fence is that record: an attempt with no settlement fences execution and commits, is rebuilt on every open, and therefore survives a crash or panic inside the effect window",
  "reconcile_effect commits what an operator established from the receiving system; it never infers an outcome and never retries a possibly-applied effect",
  "A settlement that cannot be committed after the executor or the adapter reported the effect applied is returned as SettlementNotRecorded naming the attempt, never as the Audit error a failed attempt record returns, because the effect applied and a caller told otherwise could apply it again; the attempt stays unsettled and the runtime fenced: settling or reconciling again in that process is refused, a reopen replays what was written, and an attempt still unsettled there keeps the reopened runtime fenced until it is reconciled, which a ledger with no index or record left refuses too",
  "prepare_execution_once adds an at-most-once key: a retry is answered from history without dispatching again, across restarts, while an attempt reconciled as not applied leaves the key free; is_usable_execution_key answers whether a new request under a key can be expected to be prepared and committed, which is prepare_execution_once's rule with one tightening (a longer key that was only reconciled as not applied passes preparation because the runtime holds it, but a new attempt under it is refused at commit) (a well-formed identifier within MAX_KEY_BYTES, or a longer one an earlier build settled with an outcome a retry is answered from; one only reconciled as not applied binds nothing and is refused) without reserving or recording anything, so a caller can refuse a key before doing work that the refusal would otherwise follow",
  "An applied key is bound to the project, principal, revision, generation and action digest its attempt recorded and to that attempt's index, set when the attempt is settled or reconciled: a permit under it is a retry when its project and principal match and its action digest, taken at the recorded revision and generation, matches the recorded one, so a retry carrying the current revision and generation is answered after either has moved, and any other permit is refused with KeyBoundToAnotherAction before anything is recorded, and a detached retry or a ResponseNotRetained refusal names the attempt that settled its own key rather than one inferred from response bytes or from the first attempt record under the key; a key reconciled as not applied binds nothing",
  "A response is retained up to MAX_RETAINED_RESPONSE and its digest unconditionally, so a retry whose response was not kept is refused rather than re-executed or answered with something else",
  "A denied preparation writes no effect record, and a fenced runtime yields no journal anchor, so no compaction floor can discard a record saying an effect may have applied",
  "Rustdoc covers the compacted-snapshot and neural-state APIs plus their canonical framing helpers and admission diagnostics",
  "Detached dispatch for work that does not finish inside the call: the attempt is committed and left unsettled, so the runtime is fenced from the moment the work is handed over until the adapter answers or a person reconciles it, and a refused dispatch writes no record",
  "A grant is synchronous or detached when it is issued, and each path refuses the other kind before the attempt is committed; both share one admission sequence, so there is one place where the order of checks and the attempt record is decided",
  "settle_detached records the adapter's own answer and is available only for an attempt this runtime dispatched; the dispatch kind is deliberately not rebuilt on reopen, so after a restart the fence stands and reconciliation is the way forward",
  "bind_checkpoint binds a real stored model artifact: it reads the shared CheckpointHeader, refuses an assignment this build cannot reproduce and an artifact whose codebook contradicts the declaration, then binds the opaque payload through the same bind_state path every other neural state uses",
  "PTRNEU01 neural/KV/checkpoint admission: opaque state bound to an anchored journal position, per-input semantic value digests, lifecycle generations, provenance and codebook version plus assignment fingerprint",
  "Admission is decided at every use rather than at insertion; a payload is reachable only through an admission decision, and a cache exposes no accessor that bypasses one",
  "Revocation, supersession, edited or removed inputs, foreign history with identical counters, unverifiable positions, changed codebook assignment and a fenced runtime each deny with their own stable code; failure to verify is a denial rather than an error",
  "bind_state derives every field from committed state and validates its own output through the same admission rules a later use applies",
  "PTRCS004 compacted materialized snapshot (lifecycle section PTRLC002); a PTRCS003 snapshot with a PTRLC001 section, written before attributed records, is still read as one whose history holds none, a PTRLC001 section carrying semdb:attested or a branch-merge: key is refused by version, and so is any other pairing of outer and lifecycle versions: committed state at a floor with canonical ascending-key sections, checked framing and an externally retained trusted anchor; a PTRLC002 section whose key under branch-merge: is not exactly a merged_branch_key, or whose value is not exactly an index and a plan digest as a merge projects them, is refused as noncanonical",
  "A settled key is written as 1 to MAX_KEY_BYTES (4096) bytes, as PTREX001 wrote it, so prepare_execution_once refuses a longer key this runtime does not already hold with InvalidKey, and commit, through which admission appends its attempts, refuses a keyed EffectAttempted under one with InvalidEffectKey before append (validate_new_record). The project and principal an applied key carries are written at any length, the empty string included, because no build has bounded them: sessions, peers and committed attempts name them as before, and no string of them makes an export fail (the section as a whole is still bounded; see the missing entry on settled keys in total). Replay applies no length bound, only the identifier check every build has made on a key: replay, and through it restore_recovery_snapshot, read_recovery_snapshot, restore_durable_snapshot and migrate_legacy_log; open_durable and open_durable_at; and the records restore_compacted replays above a floor. A log an earlier build wrote with a longer key therefore opens; preparation lets the key through once it has settled here, so the request that spent it is answered from history (its response or ResponseNotRetained) and another is refused as bound to another action, it is never spent again, and every export fails with PTR_COMPACTED_SECTION_LIMIT once it has settled, as it did on the previous build",
  "install_admission_policy re-derives every policy-admitted session's grants and principal from the new table, so a replacement that narrows a peer narrows its live session instead of leaving the wider set in force until the TTL; a session whose peer is no longer admitted is kept so the refusal can still name PeerNotAdmitted, and the expiry is never extended",
  "A compacted snapshot carries the execution obligations a raised floor would otherwise discard (PTREX002): spent at-most-once keys with their outcomes, each applied one with the attempt that settled it and the project, principal, revision, generation and action digest that attempt recorded (a retained response encoded by byte length, so one up to MAX_RETAINED_RESPONSE round-trips rather than only one under the item bound), and unsettled attempts with the same five, so a restored runtime neither executes a spent key a second time nor answers another action under it. A PTRCS001 snapshot is refused by version rather than read as an empty obligation set, and a PTRCS002 snapshot or PTREX001 section rather than read as keys bound to no action",
  "restore_compacted installs floor state then replays the retained journal through the ordinary lifecycle/semantic validation path, keeping committed indices",
  "CompactedSnapshot::covers reports only the position it holds, so a compaction barrier cannot claim coverage the snapshot lacks",
  "Versioned replay-backed recovery snapshots bind complete journal, semantic revision, commit index and independently trusted SHA-256 anchor",
  "Snapshot validation and semantic/lifecycle replay finish before creating a durable destination; existing destinations are never replaced",
  "Strict anchored reopen and explicit legacy-to-v2 migration preserve history while restoring no process-local authority",
  "Ordered semantic journal publication before acknowledgment or model resume",
  "Semantic payload/dependency/revision reconstruction with schema and transition validation during replay",
  "Every semantic record the runtime writes carries an origin: ingest_text writes a Request record holding exactly the request's raw text and a promoted Pod output a PodOutput record at the level its verifier reported (both ingress, needing no grant); a host write records Host with its principal and attestation; a merge records Merge with the branch, its author, the sealed branch and plan digests, the dependency digest, the rebased keys, the attestation and the authority; commit refuses every semantic record (SemanticRecordOutsideSemanticPath)",
  "Replay, open_durable, open_durable_at, restore_recovery_snapshot and restore_compacted apply the origin rules every writer also checks before it appends: R1 replays a record without an origin only while the materialized semdb:attested marker is absent (LegacySemanticRecord after it, including below a compacted floor); R2 accepts ingress records only in the exact shape ingress writes; R3 accepts a host write or merge only if it writes, removes, derives and evicts no ingress key (an eviction is checked once the delta is prepared: a key only ingress writes that a record without an origin derived from one the change writes), names valid provenance text (a host write's principal; a merge's branch, author, and reviewer or policy version, with a triage score that is a finite f32 in [0, 1]) and carries an attestation whose weakest level meets its requirement, with 1 to 16 verifiers whose names are distinct and valid and at most 32 soft findings that are sorted, distinct recorded codes; R4 accepts a merge only with no dependency entry, no rebased key removed or reserved to ingress, the plan digest merge_plan_digest gives for its branch, base revision, encoded delta, dependency digest and rebased keys, and a branch not merged before (its branch-merge:<len>:<id> key absent from materialized state); replay also refuses a record the ledger cannot frame, which only a history held in memory (replay, restore_compacted above the floor) can carry",
  "SemanticGrant is the host's policy for semantic writes that are not ingress: installed once (a second is refused, SemanticGrantInstalled), with 1 to 16 verifiers whose names are distinct identifiers of at most 64 bytes without '/', host writes off until allow_host_writes, an optional merge policy (with_merge_policy, with a calibration seed that is never recorded, returned or printed) and listed reviewers (with_reviewer), the policy version and every reviewer an identifier of at most 256 bytes, and never journaled, so a runtime rebuilt from its log has none; semantic_grant reports its requirement, verifier names, whether host writes are on, the policy version and the reviewers",
  "Complete typed Pod bytes and source identity are revision-significant",
  "Fallible ingestion, optimistic base revision and canonical no-op handling",

  "Scoped synchronous execution gateway with opaque per-runtime sessions, exact grants, frozen ActionIR permits and registered verifier/executor binding",
  "Consume-time freshness, expiry, ownership and mandatory permission checks; permissions/commit/effect epochs invalidate pending permits",
  "Executor or ledger ambiguity fences subsequent execution and commits; process-local single-use authority is never replayed",
  "Ledger-only lifecycle mutation; invalid/rewinding/tombstoned/cross-project transitions rejected before append and during replay",
  "Central runtime object wiring configuration, SemDB, ledger, materialized state, events and permissions; an in-memory append that runs out of commit indices surfaces as a ledger error rather than a repeated index",
  "Durable standalone runtime constructor opens/replays FileLedger and reconstructs lifecycle/materialized state across restart",
  "Text ingestion into revisioned semantic state",
  "Current-revision, live-generation/revocation and capability/effect checks for ActionIR delegated through typed ptr-security authorization decisions",
  "Committed-event materialization and runtime event emission",
  "Committed-event replay rebuilds lifecycle state and preserves revocation",
  "Reference InferenceBackend request loop runs against a revisioned ModelRequest and emits completion event",
  "Typed model→PodRegistry→Pod→Verifier→SemDB observation loop for Pure/Read cognitive Pods",
  "Bounded multi-step model resume loop after verified Pod observations advances semantic revision before continuation",
  "apply_verified_semantic_delta(expected, delta, principal) is a host write: refused while fenced, with no grant (NoSemanticGrant), when the grant does not allow host writes, for a principal that is not an identifier of at most 256 bytes, against a stale revision, and for an ingress key written, removed or derived (ReservedSemanticNamespace; an ingress key may be a dependency input), or, once the delta is prepared, one it would evict because a record without an origin derived it from a key the write changes (ReservedSemanticNamespace); every grant verifier then judges a SemanticChange (published state before, exact state after, delta, invalidated keys, principal) and it appends only if all pass, the weakest level meets the requirement and no report has a hard finding, refusing otherwise with SemanticVerificationRejected naming hard findings by code, never by message; a finding code that is not an identifier of at most 64 bytes, or more than 32 soft findings, fails closed (InvalidVerificationReport); each verifier's result is emitted as VerifierResult, a verifier whose report fails closed as not passed, and no verifier after it judges",
  "merge_branch(sealed, authority) is the only way an agent branch reaches semantic state: in order it refuses a fenced runtime, no grant (NoSemanticGrant), Triage under a grant with no merge policy (NoMergePolicy) and Reviewed by a reviewer the grant does not list (UnknownReviewer), a branch id or author that is not an identifier of at most 256 bytes (InvalidProvenanceText), a branch already merged (BranchAlreadyMerged naming where), a branch that does not certify against the runtime's own state now, relied generations included (Certification), under Reviewed a plan whose digest is not the one approved (MergePlanChanged), and a plan that writes, removes, derives or would evict an ingress key (ReservedSemanticNamespace); then every grant verifier judges a SemanticChange whose origin is the sealed branch, the plan and its CertificationKind; a merge the verifiers do not admit is held (VerificationRejected) whatever the authority, one the grant's policy does not auto-propose is held (Escalated) with its triage for review by plan digest, one that changes nothing appends nothing and does not mark the branch merged, and a record too large for the ledger to frame is refused (MergeRecordTooLarge); every refusal and hold comes before append and leaves the runtime unfenced; preview_merge certifies and judges without committing, and merged_at reads where a branch was merged",
  "A Pod output is promoted, by run_model_with_pods and run_resumable_with_pods alike, only when its verifier reports Pass with no hard finding (a hard finding refuses it even under Pass); no minimum level is required, and the level reported is recorded",
  "generation_validity combines the tombstone set with generation equality, so a revoked generation that is still the live one reads as Revoked rather than Live; ptr_search::retain_live takes it directly, so search hits are filtered by validity rather than by the live generation",
  "Neural-state input digests are computed from ptr-semdb canonical_input_bytes, byte-identical to the previous encoding (committed fixtures unchanged)",

  "Execution scopes are journaled: create_scope and transition_scope commit a ScopeLifecycle event carrying the scope's lease binding and the revision it was decided at, and refuse before append a stale revision (ScopeRevisionMismatch), a lease that differs from the scope's own, a lease with a fencing token but no state, Pod or generation, and a parent in another session or project; replay rebuilds the ScopeRegistry, an identical committed event applies idempotently and a conflicting one is refused",
  "A reopened or replayed runtime marks every scope that was not terminal as recovery-pending: transition_scope then accepts only Cancelled, Revoked or Released for it, and recover_scope runs cleanup_scope for it; cleanup_scope drives a ScopeCleanupCoordinator through stop_intake, cancel_children, drain_queues, release_pod_lease, release_resource_lease and close_session, cleans each child under its own lease before the parent, and journals Cancelled and Released",
  "recover_uncertain_request fences a live scope after a stateful request whose outcome cannot be established, journals Revoked with the reason request-uncertain:<id> and runs the same cleanup; RuntimeRecoveryAdapter exposes that as ptr_types::StatefulRequestRecovery and refuses a request naming another scope",
  "admit_pod_output admits one typed Pod output before any promotion: it refuses a fenced runtime, a scope that is unavailable, belongs to another session, or whose lease fencing binding differs from the request's placement epoch and fencing token (zero is refused), a manifest whose digest does not match, an output bound to another manifest, generation or artifact, an empty provenance source, a dependency that is zero or not in the manifest, an output that fails PodOutput::validate for the expected type, a revision below the manifest's snapshot revision and a verifier report that is not Pass or has a hard finding; the admission commits a PodOutputAdmitted record before the output reaches semantic state, a repeat of the same request id and Pod is answered from history without a second record, and the same request id with different output bytes is refused",
  "admit_pod_output routes by output kind: Observation, Candidate, ToolResult and EnvironmentObservation are retained as pod-candidate: keys under a SemanticOrigin::PodCandidate record whose replay shape is checked exactly, in a namespace separate from promoted pod-output: keys; Hypothesis commits a PodHypothesisCommitted record and is rebuilt by replay; ActionProposal is decoded from a versioned, size-bounded payload, authorized through authorize_action and returned with its action digest but never executed; StateDelta and VerifiedResult are promoted through the verified Pod-output path. A retry that finds the PodOutputAdmitted record of an earlier attempt answers from it only when the follow-up (the PodHypothesisCommitted record, or the semantic write of the promotion) is in the ledger too; otherwise it does not write the admission record again and carries out the missing step",
  "merge_pod_hypothesis rebuilds a persisted Pod hypothesis as a sealed ptr-branch Branch under the key pod-hypothesis:<branch> and sends it through merge_branch, so it needs a SemanticGrant (NoSemanticGrant without one) and the grant's merge policy like any other branch",
  "promote_verified_pod_output refuses a Pod whose manifest declares an effect other than Pure or Read (PodEffectRequiresActionBoundary) and an output whose type is not one the manifest produces (PodOutputTypeMismatch) before the verifier runs; run_model_with_pods and ContextMemoryController::promote_verified_output both use it",
  "commit_pod_evidence verifies a PodEvidenceBundle and appends its exact canonical bytes as PodEvidenceCommitted, commit_signed_pod_evidence additionally requires an EvidenceVerifier to accept it, and the ledger validation decodes the bytes and refuses an event whose session, trace, manifest, artifact, generation, revision or bundle digest disagrees with them; commit_mesh_event journals a validated MeshTunnelLifecycle fact (the tunnel operation itself is not performed here)",
  "admit_execution_manifest resolves an ExecutionManifest's Knowledge generations (present, not invalidated, sources and dependencies known, supersession chain, content digest) and Artifact, reader and adapter lineage (not revoked, lineage verified, digest) against the supplied stores and its snapshot revision against the runtime's, then commits ExecutionManifestAdmitted; the registry holds the admitted record by digest, replay rebuilds it, and revoke_execution_manifest commits ExecutionManifestRevoked, which a later resolve refuses",
  "admit_execution_manifest_with_authority additionally requires the manifest's principal to be admitted, its policy revision to be the current unrevoked one and its snapshot digest to match; admit_execution_manifest_from_runtime derives the principal from a valid IdentityContext as issuer:subject, requires an activated policy and a manifest snapshot revision equal to the live one, and checks a protected snapshot digest against the live SemDB digest, with a mismatch refused without mutating the authority registry",
  "activate_policy_bundle verifies a SignedPolicyBundle (non-empty key id, 64-byte signature, payload validity, payload digest, validity window, a trusted and unrevoked Ed25519 key) and commits PolicyBundleActivated; a revision must exceed the highest activated one, the same revision with a different digest is refused, revoke_policy_revision commits PolicyBundleRevoked and is idempotent, and replay restores the activation, the revocation and policy_authority_ready",
  "revoke_identity_session commits SessionRevoked before it materializes it, is idempotent, and replay restores the tombstone; admit_identity_context refuses a revoked session",
  "OidcIdentityAdapter authenticates an EdDSA JWT against a JwksStore into an IdentityContext with a canonical digest: it checks the signature, issuer, audience, iat and exp, rejects a replayed jti (recorded only after every claim was accepted, so a refused token does not burn its id, and dropped once the token's exp has passed, so the set stays bounded) and refuses any other algorithm; an unknown kid triggers one JwksRefresher refresh whose issuer and audience must match, rate-limited by a refresh cooldown (default 30 s, failed fetches included) and cached for that window only (shared by reference, not copied per request), with no fallback to a stale key; HttpJwksRefresher takes an injected fetch function, accepts https or loopback URLs and caps the document at 1 MiB; AutheliaForwardAuthAdapter (which is only safe when the host guarantees the headers reach it exclusively from the trusted proxy: they are not signed, and its docs say so) builds the same context from typed forward-auth headers and refuses an expired one, always judged against the server clock and never a time carried in the credential",
  "IdentityAdmissionController admits an AdmissionRequest to an AdmissionGrant only when the identity is valid at now, its session is the request's session, the session is not revoked, the policy decision carries the controller's policy revision, the request's project and capability, and an expiry inside the identity's own",
  "PodPlacementController registers nodes and devices, takes heartbeats (an older one is refused), assigns a Pod to a healthy node and device with enough free VRAM, and bumps a placement epoch on every assignment; a FencedStateLease binds a state to the placement's node, device, epoch, generation and a fresh fencing token, and issuing a second lease for a state, replacing the Pod's placement or marking its node failed makes the earlier lease fail validate_lease with StaleLease; freeze_state revokes the lease and refuses a new one for that state within the same placement epoch; a heartbeat or a re-registration that drops a device or reports it Failed revokes the leases on it (a lease on a device that stays usable is untouched, and no heartbeat brings a lease back), and issue_lease refuses a placement whose node is not Healthy or whose device is missing or Failed",
  "RuntimeKvAuthority::prepare issues a KvUseTicket only for a valid lease, valid KvStateMetadata matching the request's state, model, adapter, context digest and generation (and the Pod generations when it lists any), and one active use per state; complete rechecks the lease, and a placement change between prepare and complete fails it and releases the slot so a new use can be prepared",
  "ManagedKvRegistry binds a ptr-pods KvTensorBackend cache to an opaque ManagedKvHandle and a placement lease: allocate, restore from a KvTensorSnapshot, append, snapshot, invalidate, recompute and release each revalidate the lease (StaleLease after a placement change), a handle from another registry is ForeignHandle, an invalidated handle cannot reach the backend again, and recompute allocates a fresh root cache with a new fencing token",
  "KvMigrationController moves a fenced KV state through Frozen, Snapshotted, Restored and Committed (or Aborted): begin validates and freezes the source lease, snapshot and restore check the snapshot digest, restore requires a target lease for the same state and generation on a different node or device and rebinds the snapshot to the target device, commit requires the restored target's own lease, and out-of-order steps, repeated commit or abort, and a stale source or target lease are refused",
  "InMemoryPodDirectory resolves a PodRevisionAddress to a PodRoute for a registered endpoint, honouring artifact, region, zone, minimum epoch, VRAM, capability, input type and output type constraints and requiring the last two bindings; register refuses an unhealthy or inactive endpoint, an older endpoint epoch and a different endpoint at the same epoch; a route is a candidate, never an authorization grant",
  "NativeSandboxExecutor admits a SandboxProfile (non-empty project and namespace, non-zero timeout) as a lease bound to the project and a SHA-256 profile digest, refuses a lease it did not issue or whose project or digest was altered, and releases idempotently; it echoes the request payload and performs no effect; ExternalSandboxExecutor for WinRsBox and SmolVm returns BackendUnavailable for admit, execute, abort and release rather than falling back to native execution",
  "ContextMemoryController ingests a RawEvent through the deterministic tokenizer, entity extractor, namespace resolver and object builder into a KnowledgeStore, applies the retention controller, compiles context from objects or candidates under a TokenBudget, and promote_verified_output promotes through promote_verified_pod_output before activating a new Knowledge generation that supersedes the base",
  "ProtectedStateCoordinator forwards seal, open, verify and rotate_key to an injected ptr-storage ProtectedStateStore; replaying a ProtectedStateCommitted record of domain 3 registers its digest as a protected snapshot in the manifest authority registry, and register_protected_snapshot_authority does the same for a digest the coordinator verified",
  "run_resumable_with_pods selects a Pod through ptr_router::PodRouter (run_resumable_with_pods_using_router takes the router explicitly); a model event stream that carries an ActionReady ends the run with ResumableRun::action set and no dispatch, and more than one Pod request or action in one round is refused (MultipleControlEvents, MixedControlEvents); ModelRequest now carries a semantic_context, and the revision a backend sees is derived from it",
  "Internal: run_model_once and the Pod loops accept unsized InferenceBackend and Verifier trait objects, and Cargo gains the optional features candle-cuda (ptr-pods/candle-cuda) and oidc-http (reqwest, enabling ReqwestJwksRefresher and ReqwestPolicyBundleLoader, whose HTTPS clients are not exercised by any test)",
  "src/tier.rs TierJournalProjection::apply folds the ledger events TierBackendLifecycle, TierObjectCommitted and TierReplicaLifecycle into a projection of JournaledBackend, TierObjectManifest and JournaledReplica records: it re-derives backend_lifecycle_digest and replica_lifecycle_digest and refuses a mismatch (InvalidEvent), accepts only the backend transitions Configured to HealthChecked to Available to Draining to Detached (Revoked from any earlier state) and the replica transitions Preparing to Available, Draining to Released (Corrupt or Revoked from live states), requires a strictly rising revision, ignores a repeated event digest, refuses a different manifest under a known root digest (ConflictingObject), and refuses a replica for an unknown object or backend, for a backend of another tier, for a Detached or Revoked backend, or a Preparing replica on a backend that is not Available",
  "PtrRuntime keeps that projection (tier_journal()) and applies tier events before append and on replay: commit_tier_backend_lifecycle, commit_tier_object and commit_tier_replica_lifecycle commit the three event kinds, so an invalid transition is refused before append, and a runtime opened with open_durable rebuilds the projection from the FileLedger it replays; the ledger records lifecycle and manifests only, never chunk bytes",
  "PtrRuntime::attach_tier_backend_journaled, register_tier_object_journaled and transfer_tier_replica_journaled order a ledger record around each physical step on a TierResidencyController: Configured, HealthChecked and Available around attach_backend (Revoked is committed if the attach fails); object manifest and a Preparing replica before register_object, Available after it; and for a transfer Preparing before and Available after controller.transfer, or Corrupt after any transfer error (read from the code: the Corrupt record is written for every error kind, including backpressure or a stale write binding, not only for corruption). Registration requires the backend to be Available in the journal projection with the controller's tier",
  "TierResidencyController (src/tier.rs) is a process-memory residency table over ptr-storage TierBackend implementations, built on Arc<Mutex<..>> state with no ledger or file of its own: attach_backend health-checks a backend into Available or Revoked; register_object and transfer publish a replica only after the chunks verify; transfer is single-flight per (object, source, destination), bounded by with_transfer_budget (TransferBackpressure) and refuses a stale ActiveWriteBinding or TierTransferAuthorization (generation, placement epoch, fencing token) with StaleWriteBinding; pin or read_admitted_object takes a TierPin that blocks evict (ReplicaPinned) and releases on drop; begin_detach and finish_detach drain a backend (BackendNotDrained while pins, in-flight transfers or live replicas remain); evict refuses the last replica and keeps a content-addressed chunk another object still references. Nothing in the repository rebuilds a controller from the journal projection after a restart",
  "AdmittedTierObject is the only input restore_from_tier and restore_paged_from_tier accept: read_admitted_object returns the manifest and chunks with a verified pin, validate_admitted_object rejects another controller's pin (ForeignPin), a released pin, an unavailable backend or a replica that is not Available with a matching digest, and the registry then also requires the TierJournalProjection to hold the same manifest, an Available backend and an Available replica of the same generation, else TensorKvError::TierBindingMismatch; a controller that was fed the object without the journal is therefore not accepted",
  "Tier placement policies in src/tier.rs: the TierPlacementPolicy trait with DeterministicLruPolicy (least access, ties by digest), ExplicitTierPolicy, LookaheadPrefetchPolicy (at most max_objects) and BudgetedReplicaPolicy (ReplicaBudgetUnsatisfied when the preferred tiers cannot cover the minimum); they return a TierPlan and no code in this crate calls plan or choose_eviction on a controller, so nothing applies a plan; TierResidencyController::prefetch wraps transfer into PrefetchOutcome::Ready or Skipped",
  "ManagedKvRegistry paged path (src/tensor_kv.rs, for a ptr-pods PagedKvTensorBackend): allocate_paged binds a KvPageBinding (model, adapter, generation, execution manifest, principal, device, dtype, page size) and the lease's placement epoch and fencing token to the cache and refuses a zero execution manifest or a device other than the lease's (DeviceMismatch); seal_online_snapshot, materialize_online_snapshot and prepare_online_snapshot_to_tier take a snapshot while the cache stays appendable and re-check the lease and the epoch and token before publishing (StaleLease or TierBindingMismatch); restore_paged_snapshot and restore_paged_from_tier restore under a newly issued lease and fencing token; publish_prefix and fork_prefix share a prefix; page_metrics reports the backend's page counters",
  "ManagedKvRegistry::snapshot_to_tier and restore_from_tier move a non-paged KV snapshot through the same KvTierBinding and journal-authority checks, and restore now refuses a snapshot whose device is not the new lease's device (DeviceMismatch, lease revoked) and revokes the lease when the backend restore fails; invalidate also revokes the lease and calls the backend's revoke",
]
missing = [
