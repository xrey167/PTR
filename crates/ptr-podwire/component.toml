version = 1
id = "ptr-podwire"
maturity = "prototype"
last_reviewed = "2026-10-15"

implemented = [
  "Addressed PodWire bindings carry the lifecycle namespace: bind_v2_addressed (and every addressed variant) refuses a registry entry that names no namespace (V2BindingUnavailable), and accepts requires the request destination namespace to equal the bound entry namespace, so the same pod id, manifest and generation in another namespace is never invoked",
  "Both receive paths ask the request deadline again with a fresh clock after the manifest and validity checks, right before the Pod runs; a replayed session answer is refused past its request deadline (DeadlineExceeded { sent: false })",
  "A binding taken from the runtime (with_runtime_execution_manifest, bind_v2_runtime_admitted) carries its ManifestValidity and asks it on every request it serves, whether or not the host has a manifest registry attached",
  "PodAddressBinding::forward_to puts the sending Pod on the visited trail and refuses a hop to any visited Pod, so A to B and back to A, or A to B to C to A, is refused",
  "PodHost::with_runtime_manifest_registry and bind_v2_runtime_admitted require a ptr_runtime::ManifestValidity: both receive paths (serve_once_v2, serve_v2_incoming) check it with the host clock after the registry resolved the digest, and a failure refuses the request before the Pod is invoked (PodWireError::ManifestNoLongerValid)",
  "A request whose remaining time equals the configured timeout is deadline-bound: its timeout is DeadlineExceeded { sent: true }, not a transport error",
  "The one-shot PodClient::request_v2 checks an answer with the same validation as PodSession::request_v2 (validate_answer_v2): the echoed address binding, including its deadline, must equal the request's, so a responder cannot strip or extend a deadline",
  "PodWireError::DeadlineExceeded carries sent (false: expired before anything left, safe to retry with a new deadline; true: expired while waiting, the host may have run it); forward_to takes the relay clock and gives a deadline-less parent a V4 child with origin_ts; unix_millis_now reads a clock before the epoch as u64::MAX so every deadline is past",
  "PodAddressBinding::for_link / for_route build a binding from a link or a resolved route without converting the deadline (milliseconds since the epoch throughout the path), PodAddressBinding::forward_to is the relay step (hop budget, visited trail, deadline only shrinks, checked against the parent), unix_millis_now is the one clock",
  "FORMAT_V4: an absolute deadline and origin timestamp in the address binding; V3 and V2 stay readable; expiry refused before execution, the request wait bounded by the deadline (uncertain on timeout), a deadline only shrinks across hops (narrowed_deadline, ensure_deadline_within); PodWireError::DeadlineExceeded",
  "PodHost and PodClient carry one Pod invocation and its answer over ALPN_PODWIRE, composing ptr-pods' registry with ptr-net's transport so neither has to know about the other",
  "A request frame carries no project field: the project a request resolves in comes from the host's access policy keyed by the authenticated peer, because resolution inside a project is the only thing standing between a request and a Pod's data and a requester that named its project would be choosing which project's Pods it reaches",
  "A V1 request frame has no field naming its sender and none naming a session (the V2 frame below carries an identity digest and session id as binding fields, but the sender is still the connection's authenticated peer), so who is asking is the authenticated connection's answer and a session stays a capability the host holds rather than a string a caller presents",
  "A request names the endpoint it is for, so a request composed for one host is refused when relayed to another rather than being indistinguishable from one meant for it",
  "An answer names its own author and is bound to a digest of the exact bytes that arrived; a requester checks the author against the peer the connection authenticated before reading anything else, then the request id, then the digest",
  "One refusal code covers out of scope, not registered and registered in another project, so a cross-project Pod is refused in exactly the same words as one that does not exist and a scope cannot be read as a directory of what the host serves",
  "Admission and scope are decided before the registry is touched, so an unadmitted or out-of-scope requester cannot probe for Pods at all",
  "PodScope matches an exact capability and payload type pair, never a prefix or a wildcard, and it is the same pair PodRegistry::resolve keys on so no scope can be written that resolution would not honour",
  "One peer holds one entry: a second admit is refused rather than replacing the first, and a withdrawal takes effect on the peer's very next request because the scope is read from the table at every request",
  "Only Pure and Read Pods are reachable; an effectful Pod is refused with a code that names the action boundary, because this protocol commits no attempt and can report no uncertainty",
  "PodManifest::protocol_version is checked against the version the requester composed its payload for — the first place anything reads that field, and the only place where the caller and the Pod are not built together",
  "A Pod's output is verified by the host's verifier before it leaves, and a Pod that failed is a different refusal from an output the host will not vouch for; a verification report that carries any hard finding is refused as Unverified even when its status is Pass, on both the V1 and the V2 path",
  "The host holds no runtime and no ledger, so a Pod invoked over this wire cannot write to the host's history: a property of the type rather than a promise about the code",
  "Two outcomes rather than the execution wire's four, and no replay window and no at-most-once key, each absent by derivation rather than omission because nothing reachable here has an effect that could half-apply",
  "A request/answer frame format with distinct magics per direction, its own digest domain, an explicit layout version, bounded length-prefixed fields, an explicit two-way code table for every enumeration, and a distinct diagnostic code per refusal",
  "Every request is answered, including one this build cannot parse — its answer is bound to the bytes that arrived and reports no request id rather than inventing one",
  "An answer this side cannot encode becomes a refusal rather than no reply at all: the frame bound is enforced by trying to encode rather than by pre-checking one field, because a pre-check on the output bytes would miss the output type and every miss leaves a requester waiting on an open connection",
  "No background loop, timer or retry policy: the caller drives serve_once and request",
  "Generation-bound V2 frames (FORMAT_V2, and FORMAT_V3 when an address binding is present): encode_request_v2/decode_request_v2 and encode_answer_v2/decode_answer_v2 add artifact id, manifest hash, generation, revision, identity digest, session id and policy revision to the request, and the answer echoes the generation, revision, identity digest, session id and policy revision, bound to the exact request bytes; optional placement epoch and fencing token travel together or not at all, and V1 stays a separate, unchanged format",
  "V3 frames add a PodAddressBinding (source and destination pod address, semantic revision, trace id, hop limit, visited list of at most 64 distinct addresses, optional protocol and mesh endpoint binding) plus the execution-manifest digest; the binding is validated on encode and on decode, and an address binding without an execution manifest digest is refused",
  "PodHost::bind_v2 and its stateful, addressed and admitted variants build a PodWireV2Binding only from a pod actually registered in the host's registry; PodHost::serve_once_v2 answers a request whose artifact, manifest hash, generation, revision, state binding, admission binding or address binding differs from the binding as Unavailable before the Pod runs",
  "PodAdmissionBinding::from_identity refuses an IdentityContext whose digest does not validate, so the identity digest a V2 request must carry is checked before it enters a binding",
  "A V2 binding can carry an ExecutionManifest (with_execution_manifest, with_resolved_execution_manifest via the ExecutionManifestResolver trait, with_runtime_execution_manifest resolving the exact digest through ptr-runtime); a host given a live manifest registry (with_runtime_manifest_registry) re-resolves the digest at every request, so a manifest revoked after binding is refused before the Pod is invoked",
  "answer_bound runs exactly the Pod the binding captured, looked up by id and compared against the bound manifest, instead of selecting again by capability; it applies the same scope, Pure/Read-only, protocol-version and verifier checks as V1, and an output type the manifest does not declare it produces is refused as Unverified",
  "PodClient::request_v2 checks the V2 answer against the request (responder, request id, digest, generation, revision, state binding) and refuses an answer with the wrong generation or revision",
  "PodClient::connect_session returns a PodSession: one authenticated connection carrying many requests, each on its own stream with the same answer checks, with max_in_flight passed to the transport as the concurrency bound; PodHost::serve_session_v2 serves a caller-chosen, bounded number of V2 streams on one connection (zero is refused)",
  "PodSession records a request id as uncertain after a timeout, transport failure, undecodable answer or failed answer validation and refuses a retry of that id with RequestUncertain; an identical re-send of an answered id is served from a bounded (256 entry) session cache and conflicting bytes under a used id are refused as DuplicateRequest; PodSession::recover_uncertain_request only forwards a UncertainRequest to a caller-supplied StatefulRequestRecovery, it performs no recovery itself",
  "The whole composition is feature-gated, so iroh stays out of every other workspace build exactly as ptr-net keeps its own backend out",
  "A requester dials only what the deployment wrote down: request takes a ptr-net PeerAddress, which has no public constructor, so a bare address does not satisfy the signature and an address handed over by a peer or read out of a payload cannot be dialled",
  "src/chunk.rs, bounded chunking and reassembly of activation frames: chunk_frame cuts a frame into Ed25519-signed chunks (sign_chunk, resign_envelope), FrameAssembler is the receiving side with an injected clock (offer, abandon, expire take the time; nothing reads a clock or sleeps) and a registered verifying key per authenticated principal; it admits only the split-pod allowlist, verifies the signature over the envelope, then the tombstones, the signed deadline (expired, or too far ahead), the chunk digest, and reserves (principal, parent_operation_id, frame_id) in a principal-scoped table on the first accepted chunk; the table bounds incomplete frames plus retained completion and abandonment tombstones by max_frame_tombstones_per_principal and refuses a new frame with a typed FrameTableFull when it is full, never evicting a tombstone before its retention (completion: deadline + skew; abandonment: abandonment time + replay window, with replay_window >= max deadline lifetime + 2 skew checked by AssemblyPolicy::validate); a reorder window, a per-peer bound on incomplete frames and a bound on buffered chunks give typed OutOfWindow, TooManyIncompleteFrames and QueueOverflow; a duplicate chunk, a chunk whose chain, total, frame digest or deadline differs from the first (the frame is abandoned) and a complete payload whose digest is not the one every chunk carried, or that is no valid frame, are typed refusals; chunks of one tuple from any session of the principal join one assembly and exactly one delivery results; an abandoned frame (explicit, mismatching, or past its deadline) releases its chunks, reported by identity; covered by src/chunk.rs tests, tests/chunking.rs and the E007 harness",
  "Review fixes of the assembler: the sender is authenticated before its content is decoded (the principal must be registered and the envelope or policy signature must verify before chunk bytes are copied); register_principal binds a principal to the one stage identity it may speak for (Rejection::StageNotBound); a signed SplitPolicy is verified, held until its deadline plus the skew and bound to its operation (Rejection::PolicyMismatch on a frame of another width or dtype); the chain inside the reassembled frame must be the chain the envelope signed (Rejection::ChainFrameMismatch); max_total_buffered_bytes bounds the bytes buffered over all principals (Rejection::GlobalBufferFull, invariant 8); a tuple is tombstoned or expired at every tick (a frame is expired from deadline plus skew on, a tombstone is kept while retain_until > now), tested at exactly deadline plus skew and at abandonment plus the replay window.",
  "Fix round 2 of the assembler (amended in round 3): registering a principal again with the same key and stage identity (a reconnect) keeps its tombstones, verified policies and incomplete frames, so a delivered frame replayed after re-registration is still refused; a changed key or a changed stage identity drops the verified policies (a policy signed under a compromised old key stops binding and the new key can re-issue it) and releases the frames still being assembled (their chunks are reported once by expire) and tombstones them until their signed deadline plus the skew, so no chunk signed under the new key completes a frame begun under the old one, while the tombstones of delivered frames are kept; the assembler keeps the highest time it was given and treats an earlier time as that time, so a clock that steps back cannot revive a dropped tombstone; AssemblyPolicy::validate requires max_total_buffered_bytes >= max_frame_bytes (PolicyViolation::TotalBelowOneFrame).",
  "Fix round 3 of the assembler: the chunk ids released by an expiry inside offer or abandon, by an identity or key change, or by a frame that failed to decode are kept in one buffer that only expire drains, so each is reported exactly once and none is lost; abandon reports its own chunks by its return value only (a later expire does not list them again); tests: key rotation drops policies and frames, offer and abandon neither lose nor repeat released ids.",
]

missing = [
  "The key-to-connection binding of a principal and the binding of a principal to one stage identity are registered by the deployment; nothing here derives them from a connection. The assembler is not carried by PodHost/PodClient yet.",
  "Authentication: the peer key is the one ptr-net reports the connection authenticated, and this crate takes the host's word that it passed that rather than something else",
  "Signed answers, and therefore any third-party evidence: inside one exchange the connection vouches for an answer's author and outside it nothing does; ADR-0022 decides to sign Pod answers with the same SigningDomain as receipts and split-Pod chunks (D2, spec S2, deferred)",
  "A journaled access policy: the scope table is in memory, so it does not survive a restart and nothing records who was admitted to which project when (re-specified in ADR-0022 as spec S7, PodScopeAdmitted and PodScopeWithdrawn on ledger tags 35 and 36, after S4)",
  "Discovery: which address belongs to an id nobody told you is a mechanism choice with its own trust question; ADR-0022 decides against it (peers are configured through ptr-net's PeerBook)",
  "An accept loop a deployment would run, including backpressure toward a peer that asks faster than the host can answer (ADR-0022, D4: in ptrd under a ServePolicy, spec S3, deferred)",
  "Session reuse by default: PodClient::request and request_v2 still open a connection per request; reuse is opt-in through PodSession, and the in-flight bound's Backpressure error is not exercised by any test in this crate",
  "Streaming, cancellation and partial answers: one request, one bounded answer",
  "Any claim about latency, throughput or behaviour under load; the tests establish protocol and isolation properties on localhost",
  "Chunks cross as ordinary TypedPayloads of the existing request frame, one per request; the assembler is not wired into PodHost/PodClient (E008 carries the chunks over iroh), and the binding of a principal's verifying key to the authenticated connection is the caller's",
  "A signed SplitPolicy is optional per operation and names no recipient: a frame that completes before its policy arrives is bound by nothing, and a frame or policy signed for one stage verifies at any receiver that registered the same upstream key (the chain's stage pins only the producer); a required-policy flag and a signed recipient identity are not built.",
  "There is no per-principal byte cap: one authenticated principal can fill max_total_buffered_bytes with partial frames until their signed deadlines expire them, which starves other principals of buffer space (liveness only, bounded by the deadline lifetime).",
  "A forward clock spike pins the assembler: the clock never goes back (it keeps the highest time seen), so one call with a time far in the future (a bad clock step, a test passing u64::MAX) makes every later chunk read Expired for good. The direction is safe (nothing is wrongly admitted), the cost is liveness only, and a restart of the receiver is the remedy.",
  "A frame in flight is copied several times at completion (chunks, joined bytes, decoded tensor) and only the chunks count against the byte cap.",
  "The release buffer of the assembler (ids of abandoned or expired frames' chunks, about 32 per frame) is drained only by expire(): a receiver that only calls offer() grows it without bound (no production caller exists; the E007 harness calls expire()). The duty to call expire() is part of the contract. The key-rotation policy drop and the release-once behaviour are covered by unit tests, not by planted E007 mutations.",
]

next = [
  "Journal the access policy per ADR-0022 spec S7 (decided with D5: history governs membership, the host still supplies authority), after the admission journal of spec S4",
  "Build the accept loop in ptrd under ptr-net's ServePolicy (ADR-0022, spec S3) once a multi-host deployment exists",
]

