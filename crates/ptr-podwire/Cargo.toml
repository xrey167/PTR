[package]
name = "ptr-podwire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The whole composition is this feature. With it off the crate is the wire format
# and the access decision and nothing else, so iroh stays out of every other
# workspace build exactly as ptr-net keeps its own backend out.
podwire-backend = [
  "dep:tokio",
  "ptr-net/iroh-backend",
]

[dependencies]
ptr-types = { workspace = true }
# A Pod is resolved and invoked through the registry every in-process caller
# uses. A parallel resolution path here would be a second answer to "which Pod
# serves this", and the two would drift.
ptr-pods = { workspace = true }
# The payload a Pod accepts and returns is already a named type. The wire carries
# that type rather than a copy of it.
ptr-protocol = { workspace = true }
# A Pod's output is verified before it leaves the host, by the same trait the
# in-process loop verifies with.
ptr-verifier = { workspace = true }
ptr-runtime = { workspace = true }
# The same pin ptr-ledger and ptr-execwire use. Three pins of a hash would be
# three digests for the bytes they are all taken over.
sha2 = { version = "=0.11.0", default-features = false }
# The base only, for `AuthenticatedPeer` (D1 in issue #23): the access decision
# takes an identity only a transport can construct. The transport itself is the
# `podwire-backend` feature.
ptr-net = { workspace = true }
# Only for a deadline on one exchange. How long to wait for an answer is this
# layer's policy, so the clock belongs here rather than in the transport.
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
ptr-net = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
ptr-config = { workspace = true }
ptr-ledger = { workspace = true }
ptr-runtime = { workspace = true }
ptr-storage = { workspace = true }

[[test]]
name = "wire"
path = "tests/wire.rs"
required-features = ["podwire-backend"]

[[test]]
name = "identity_recovery"
path = "tests/identity_recovery.rs"
required-features = ["podwire-backend"]
