[package]
name = "ptr-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Adds `AuthenticatedPeer::assume_authenticated` for tests without a network.
# `scripts/check_repo.py` refuses any manifest enabling it outside
# `[dev-dependencies]`.
test-support = []
iroh-backend = ["dep:iroh", "dep:tokio"]
wireguard-uapi-backend = ["dep:wireguard-uapi"]
wintun-backend = ["dep:wintun"]

[dependencies]
ptr-types = { workspace = true }
ptr-protocol = { workspace = true }
# Signing and verifying with the endpoint key (D2 in issue #23). The same pin iroh's
# own key type resolves to, so a key and its signatures have one implementation.
ed25519-dalek = { workspace = true }
iroh = { version = "=1.3.0", optional = true, default-features = false, features = ["tls-ring"] }
tokio = { workspace = true, optional = true, features = ["sync"] }
wireguard-uapi = { version = "3.0.1", optional = true, features = ["xplatform"] }
wintun = { version = "0.5.1", optional = true }

# Iroh 0.35 declares Rust 1.81 support, but unconstrained 2026 transitive
# updates have raised MSRV. Pin the release-compatible graph used by the
# upstream 0.35.0 lockfile so PTR's Rust 1.85 feature CI remains meaningful.

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "iroh"
path = "tests/iroh.rs"
required-features = ["iroh-backend"]

[[test]]
name = "peers"
path = "tests/peers.rs"
required-features = ["iroh-backend"]
