[package]
name = "ptr-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
iroh-backend = ["dep:iroh"]

[dependencies]
ptr-types = { workspace = true }
ptr-protocol = { workspace = true }
# Optional transport requires Rust 1.91; the default core retains Rust 1.85.
iroh = { version = "=1.2.0", optional = true, default-features = false, features = ["tls-ring"] }

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "iroh"
path = "tests/iroh.rs"
required-features = ["iroh-backend"]
