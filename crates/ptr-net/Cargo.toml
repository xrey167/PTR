[package]
name = "ptr-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
iroh-backend = ["dep:iroh"]

[dependencies]
ptr-types = { workspace = true }
ptr-protocol = { workspace = true }
iroh = { version = "=1.2.0", optional = true, default-features = false, features = ["tls-ring"] }

# Iroh 0.35 declares Rust 1.81 support, but unconstrained 2026 transitive
# updates have raised MSRV. Pin the release-compatible graph used by the
# upstream 0.35.0 lockfile so PTR's Rust 1.85 feature CI remains meaningful.

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "iroh"
path = "tests/iroh.rs"
required-features = ["iroh-backend"]

[[test]]
name = "peers"
path = "tests/peers.rs"
required-features = ["iroh-backend"]
