[package]
name = "ptr-burn-a0"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# The type kernel carries the shared codebook and ValidityMask. It has no
# dependencies of its own, so sharing it costs this workspace nothing.
ptr-types = { path = "../../crates/ptr-types" }
bytemuck = "1.23.1"
burn = { version = "=0.22.0-pre.3", default-features = false, features = ["std", "flex", "autodiff", "optim"] }

[workspace]
[patch.crates-io]

burn_dispatch_pastey_0_22_0_pre_3 = { package = "burn-dispatch", path = "../../vendor/burn-dispatch-0.22.0-pre.3" }
burn_ndarray_pastey_0_22_0_pre_3 = { package = "burn-ndarray", path = "../../vendor/burn-ndarray-0.22.0-pre.3" }
burn_vision_pastey_0_22_0_pre_3 = { package = "burn-vision", path = "../../vendor/burn-vision-0.22.0-pre.3" }
cubecl_core_pastey_0_11_0_pre_3 = { package = "cubecl-core", path = "../../vendor/cubecl-core-0.11.0-pre.3" }
cubecl_cpp_pastey_0_11_0_pre_3 = { package = "cubecl-cpp", path = "../../vendor/cubecl-cpp-0.11.0-pre.3" }
cubecl_hip_pastey_0_11_0_pre_3 = { package = "cubecl-hip", path = "../../vendor/cubecl-hip-0.11.0-pre.3" }
cubecl_std_pastey_0_11_0_pre_3 = { package = "cubecl-std", path = "../../vendor/cubecl-std-0.11.0-pre.3" }
gemm_pastey_0_19_0 = { package = "gemm", path = "../../vendor/gemm-0.19.0" }
