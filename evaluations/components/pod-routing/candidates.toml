# Per-pod learned vector and bias over a frozen encoder, activation-gated, advisory, with
# abstention (ADR-0021). The unit and artifact tests are mechanics evidence; the routing claim is
# R015's and has no frozen result yet.
[[candidate]]
id = "dragonfly-learned"
source = "internal"
status = "evaluating"
command = "cargo test -p ptr-router --locked --test learned --test dragonfly_artifact"
evidence = [
  "../../../crates/ptr-router/tests/learned.rs",
  "../../../crates/ptr-router/tests/dragonfly_artifact.rs",
]

